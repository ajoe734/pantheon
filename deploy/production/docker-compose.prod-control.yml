# Pantheon Production Blue/Green Compose Overlay (ENV-PROD-CONTROL-IMPL-001).
# Source template only: no cloud resource is created by merging it. Images are the
# immutable digests from the release manifest (backend.images) and are never rebuilt or
# pulled by tag. Stateful services (postgres, nats) and the core owner closure
# (runtime-manager, governance, deployment, lifecycle-projector) exist ONCE; only the
# stateless BFF is duplicated per color. The lifecycle-projector is the singleton worker:
# prod_ops.sh drains it before the BFF upstream switch and re-activates it afterwards, so
# there is never more than one instance and never a blue+green owner overlap.
#
# Secrets (never in this file): PROD_SECRETS_ENV_FILE is a root-owned 0600 env file that
# supplies PANTHEON_BFF_JWT_SECRET, PANTHEON_RUNTIME_JWT_SECRET, PANTHEON_DATABASE_URL and
# the OIDC client secret. PROD_POSTGRES_PASSWORD_FILE is a 0600 file; postgres initialises
# with POSTGRES_PASSWORD_FILE (never trust auth, never an inline password).

name: pantheon-production

x-core-env: &core_env
  PANTHEON_ENV: production
  PANTHEON_RELEASE_ID: ${PANTHEON_RELEASE_ID:?release_id required}
  PANTHEON_BACKEND_COMMIT: ${PANTHEON_BACKEND_COMMIT:-}
  PANTHEON_CONFIG_SCHEMA_VERSION: ${PANTHEON_CONFIG_SCHEMA_VERSION:-}
  PANTHEON_PROVIDER_ENABLED: "false"
  PANTHEON_LIVE_BROKER_ENABLED: "false"
  PANTHEON_REAL_WRITES_ENABLED: "false"
  PANTHEON_DEV_STUB_WRITES_ENABLED: "false"
  PANTHEON_CONTROL_VM_BROKER_CREDENTIALS_PRESENT: "false"
  PANTHEON_EXECUTION_MODE: "paper"
  PANTHEON_MANAGEMENT_NL_ASSISTANT_PROVIDER_ENABLED: "false"
  PANTHEON_MGMT_NL_ASSISTANT_PROVIDER_ENABLED: "false"
  PANTHEON_ASSISTANT_PROVIDER: "disabled"
  PANTHEON_BFF_JWT_ISSUER: ${PROD_JWT_ISSUER:?jwt issuer required}
  PANTHEON_BFF_JWT_AUDIENCE: ${PROD_JWT_AUDIENCE:?jwt audience required}
  PANTHEON_RUNTIME_JWT_ISSUER: ${PROD_JWT_ISSUER:?jwt issuer required}
  PANTHEON_RUNTIME_JWT_AUDIENCE: ${PROD_JWT_AUDIENCE:?jwt audience required}

x-product-owner: &product_owner
  pull_policy: never
  restart: unless-stopped
  profiles: ["core"]
  env_file:
    - ${PROD_SECRETS_ENV_FILE:?production secrets env file required}
  labels: {"org.pantheon.role": "owner"}

x-product-env: &product_env
  <<: *core_env
  PANTHEON_PERSISTENCE_POSTURE: production
  PANTHEON_TENANT_ID: ${PROD_TENANT_ID:?production tenant id required}
  PANTHEON_RUNTIME_MANAGER_URL: http://runtime-manager:8080
  PANTHEON_NATS_URL: nats://nats:4222
  PANTHEON_EXTERNAL_EGRESS: deny

x-secrets: &secrets
  env_file:
    - ${PROD_SECRETS_ENV_FILE:?production secrets env file required}

services:
  postgres:
    image: ${PANTHEON_POSTGRES_IMAGE:?pinned postgres image required}
    pull_policy: never
    restart: unless-stopped
    profiles: ["stateful"]
    environment:
      POSTGRES_USER: ${PROD_POSTGRES_USER:?required}
      POSTGRES_DB: ${PROD_POSTGRES_DB:?required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      # Dedicated persistent data disk mount. Never recreated or overwritten by a release.
      - ${PROD_DATA_MOUNT:?production data disk mount required}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  nats:
    image: ${PANTHEON_NATS_IMAGE:?pinned nats image required}
    pull_policy: never
    restart: unless-stopped
    profiles: ["stateful"]
    command: ["-js", "-sd", "/data"]
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/nats:/data
    ports:
      - "127.0.0.1:4222:4222"

  # Existing Redis signal queue (pinned ref from the root compose). Persistent on the data disk; it is a stateful
  # owner shared by the singleton Paper fleet reconciler and signal producer and is never recreated per release.
  signal-store:
    image: ${PANTHEON_SIGNAL_STORE_IMAGE:-redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf}
    pull_policy: never
    restart: unless-stopped
    profiles: ["stateful"]
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/signal-store:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Core owner closure required by BFF /bff/readyz. Images come from manifest backend.images.
  runtime-manager:
    image: ${PANTHEON_RUNTIME_MANAGER_IMAGE:?immutable runtime-manager digest required}
    pull_policy: never
    restart: unless-stopped
    profiles: ["core"]
    <<: *secrets
    environment:
      <<: *core_env
      PANTHEON_RUNTIME_BINDING_STORE_PATH: /data/runtime/runtime_bindings.json
      PANTHEON_COMMAND_STATE_FILE: /data/runtime/internal_api_commands.json
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/runtime:/data/runtime
    labels: {"org.pantheon.role": "owner"}

  governance:
    image: ${PANTHEON_GOVERNANCE_IMAGE:?immutable governance digest required}
    pull_policy: never
    restart: unless-stopped
    profiles: ["core"]
    <<: *secrets
    environment:
      <<: *core_env
      GOVERNANCE_DATA_DIR: /data/governance
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/governance:/data/governance
    labels: {"org.pantheon.role": "owner"}

  deployment:
    image: ${PANTHEON_DEPLOYMENT_IMAGE:?immutable deployment digest required}
    pull_policy: never
    restart: unless-stopped
    profiles: ["core"]
    <<: *secrets
    environment:
      <<: *core_env
      DEPLOYMENT_DATA_DIR: /data/governance
      PANTHEON_GOVERNANCE_DATA_DIR: /data/governance
      PANTHEON_RUNTIME_BINDING_STORE_PATH: /data/runtime/runtime_bindings.json
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/governance:/data/governance
      - ${PROD_DATA_MOUNT:?production data disk mount required}/runtime:/data/runtime:ro
    labels: {"org.pantheon.role": "owner"}

  # The single singleton worker. Exactly one instance may exist; drained/activated by ops.
  lifecycle-projector:
    image: ${PANTHEON_LIFECYCLE_PROJECTOR_IMAGE:?immutable lifecycle-projector digest required}
    pull_policy: never
    restart: unless-stopped
    profiles: ["singleton"]
    # Existing loop-run-projector-scheduler telemetry image; command selects the lifecycle projector.
    command: ["python", "-m", "services.trade_journey.lifecycle_projector", "run"]
    <<: *secrets
    environment:
      <<: *core_env
      LIFECYCLE_PROJECTOR_WRITER_BACKEND: postgres
      BFF_DATA_DIR: /data/bff
      # Isolated production DSNs (TELEMETRY_DB_DSN, LIFECYCLE_PROJECTOR_PROJECTION_DSN) come from
      # the secrets env file and are validated by bootstrap.sh against PROD_POSTGRES_DB.
      GIT_SHA: ${PANTHEON_BACKEND_COMMIT:?backend commit required}
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/bff:/data/bff
    labels: {"org.pantheon.role": "singleton"}

  # One color of the stateless BFF. Run with: --profile blue | --profile green and
  # explicit ports (blue and green must differ). Owners are reached by compose DNS.
  operator-bff-blue:
    image: ${PANTHEON_OPERATOR_BFF_IMAGE:?immutable digest reference required}
    pull_policy: never
    restart: unless-stopped
    profiles: ["blue"]
    <<: *secrets
    environment: &bff_env
      <<: *core_env
      BFF_COMMIT: ${PANTHEON_BACKEND_COMMIT:?backend commit required}
      BFF_IMAGE_DIGEST: ${PANTHEON_OPERATOR_BFF_DIGEST:?operator_bff digest required}
      # Shared durable state on the retained data disk (both colors mount the same dirs, so a color
      # switch, replacement or rollback neither loses nor splits acknowledged state).
      BFF_DATA_DIR: /data/bff
      PANTHEON_GOVERNANCE_DATA_DIR: /data/governance
      PANTHEON_RUNTIME_BINDING_STORE_PATH: /data/runtime/runtime_bindings.json
      PANTHEON_BFF_TRADE_JOURNEY_READER_BACKEND: postgres
      LIFECYCLE_PROJECTOR_WRITER_BACKEND: postgres
      PANTHEON_BFF_AUTH_MODE: strict
      PANTHEON_BFF_AUTH_STUB: "false"
      PANTHEON_BFF_OIDC_ISSUER: ${PROD_IDP_ISSUER:?idp issuer required}
      PANTHEON_BFF_OIDC_DISCOVERY_URL: ${PROD_IDP_ISSUER:?idp issuer required}/.well-known/openid-configuration
      PANTHEON_BFF_CORS_ORIGINS: ${PROD_BFF_CORS_ORIGINS:?production FE origin required}
      PANTHEON_RUNTIME_MANAGER_URL: http://runtime-manager:8080
      PANTHEON_GOVERNANCE_API_URL: http://governance:8082
      PANTHEON_GOVERNANCE_SERVICE_URL: http://governance:8082
      PANTHEON_GOVERNANCE_APPROVAL_API_URL: http://governance:8082
      PANTHEON_DEPLOYMENT_API_URL: http://deployment:8095
      PANTHEON_DEPLOYMENT_SERVICE_URL: http://deployment:8095
      # Shared durable Agora stores: must match agora-interaction-worker so requests/readbacks do not diverge.
      AGORA_WORKSHOP_STORE_BACKEND: postgres
      AGORA_WORKSHOP_STORE_SCHEMA: agora
      AGORA_DATASET_STORE_BACKEND: postgres
      AGORA_DATASET_STORE_SCHEMA: agora
      AGORA_GOVERNANCE_STORE_BACKEND: postgres
      AGORA_GOVERNANCE_STORE_SCHEMA: agora
      AGORA_RESEARCH_STORE_BACKEND: postgres
      AGORA_RESEARCH_STORE_SCHEMA: agora_research
      # Product owner routes (Management / Agora / Persona / Research / approval).
      PANTHEON_EVOLUTION_API_URL: http://evolution:8093
      PANTHEON_INCIDENTS_API_URL: http://incidents:8090
      PANTHEON_POSTMORTEMS_API_URL: http://postmortems:8091
      PANTHEON_TELEMETRY_API_URL: http://telemetry:8083
      PANTHEON_LINEAGE_READ_URL: http://lineage-read:8094
      PANTHEON_REGISTRY_API_URL: http://registry:8087
      PERSONA_URL: http://persona:8002
      PANTHEON_CONSULTATION_API_URL: http://consultation-svc:8096
      SOURCE_MANAGEMENT_API_URL: http://source-ingest:8097
      PANTHEON_SOURCE_INGEST_API_URL: http://source-ingest:8097
      PANTHEON_TRAINING_SESSION_API_URL: http://training-session-svc:8099
      PANTHEON_POLICY_LEARNING_API_URL: http://policy-learning-svc:8100
      PANTHEON_RESEARCH_ORCHESTRATOR_API_URL: http://research-orchestrator-svc:8101
      PANTHEON_MEMORY_API_URL: http://memory:8086
      PANTHEON_CAPITAL_API_URL: http://capital:8092
      PANTHEON_OPENCLAW_GATEWAY_ADAPTER_URL: http://openclaw-gateway-adapter:8104
      PANTHEON_RECONCILIATION_DRIFT_API_URL: http://reconciliation-drift-svc:8102
      RECONCILIATION_DRIFT_URL: http://reconciliation-drift-svc:8102
      PANTHEON_NATS_URL: nats://nats:4222
    volumes: &bff_volumes
      - ${PROD_DATA_MOUNT:?production data disk mount required}/bff:/data/bff
      - ${PROD_DATA_MOUNT:?production data disk mount required}/governance:/data/governance:ro
      - ${PROD_DATA_MOUNT:?production data disk mount required}/runtime:/data/runtime:ro
    labels: {"org.pantheon.role": "bff", "org.pantheon.color": "blue"}
    ports:
      - "127.0.0.1:${PROD_BLUE_PORT:?blue port required}:8001"

  operator-bff-green:
    image: ${PANTHEON_OPERATOR_BFF_IMAGE:?immutable digest reference required}
    pull_policy: never
    restart: unless-stopped
    profiles: ["green"]
    <<: *secrets
    environment: *bff_env
    volumes: *bff_volumes
    labels: {"org.pantheon.role": "bff", "org.pantheon.color": "green"}
    ports:
      - "127.0.0.1:${PROD_GREEN_PORT:?green port required}:8001"

  # ---- Product owner closure (existing Management/Agora/Persona/Research/approval routes) ----

  lineage-read:
    image: ${PANTHEON_LINEAGE_READ_IMAGE:?immutable lineage-read digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8094"
      LINEAGE_DATA_DIR: /data/lineage
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/lineage-read:/data/lineage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  registry:
    image: ${PANTHEON_REGISTRY_IMAGE:?immutable registry digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8087"
      REGISTRY_STORE_BACKEND: postgres
      REGISTRY_GOVERNANCE_BASE_URL: http://governance:8082
      PANTHEON_REGISTRY_AUTH_MODE: strict
      PANTHEON_REGISTRY_JWT_ISSUER: ${PROD_JWT_ISSUER:?jwt issuer required}
      PANTHEON_REGISTRY_JWT_AUDIENCE: ${PROD_JWT_AUDIENCE:?jwt audience required}
      PANTHEON_REGISTRY_ROLE_CLAIMS: roles,role
      PANTHEON_DEPLOYMENT_API_URL: http://deployment:8095
    depends_on:
      - governance
      - deployment
      - runtime-manager
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  telemetry:
    image: ${PANTHEON_TELEMETRY_IMAGE:?immutable telemetry digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8083"
      TELEMETRY_STORAGE_DIR: /data/telemetry
      PANTHEON_TELEMETRY_AUTH_MODE: strict
      PANTHEON_TELEMETRY_SERVICE_TENANTS: ${PROD_TENANT_ID:?production tenant id required}
      PANTHEON_TELEMETRY_INFRA_PRODUCERS: control-plane-bff
      PANTHEON_TJ_E2E_FIXTURE_INGEST_ENABLED: "false"
      TELEMETRY_STARTUP_TIMEOUT_SECONDS: "240"
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/telemetry:/data/telemetry
    depends_on:
      - runtime-manager
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  incidents:
    image: ${PANTHEON_INCIDENTS_IMAGE:?immutable incidents digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8090"
      INCIDENTS_DATA_DIR: /data/incidents
      PANTHEON_TELEMETRY_URL: http://telemetry:8083
      PANTHEON_TELEMETRY_TIMEOUT_SECONDS: "45"
      POSTMORTEMS_URL: http://postmortems:8091
      INCIDENT_STORE_BACKEND: postgres
      PANTHEON_BFF_AGORA_PERFORMANCE_STORE_PATH: /data/incidents/agora_performance.sqlite3
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/incidents:/data/incidents
    depends_on:
      - runtime-manager
      - telemetry
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postmortems:
    image: ${PANTHEON_POSTMORTEMS_IMAGE:?immutable postmortems digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8091"
      POSTMORTEMS_DATA_DIR: /data/incidents
      INCIDENTS_DATA_DIR: /data/incidents
      PANTHEON_TELEMETRY_URL: http://telemetry:8083
      EVOLUTION_URL: http://evolution:8093
      POSTMORTEM_STORE_BACKEND: postgres
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/incidents:/data/incidents
    depends_on:
      - incidents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  evolution:
    image: ${PANTHEON_EVOLUTION_IMAGE:?immutable evolution digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8093"
      EVOLUTION_DATA_DIR: /data/evolution
      INCIDENT_DATA_DIR: /data/incidents
      EVOLUTION_GOVERNANCE_BASE_URL: http://governance:8082
      EVOLUTION_STORE_BACKEND: postgres
      EVOLUTION_PROGRAM_STORE_BACKEND: postgres
      EVOLUTION_AUTH_MODE: token
      EVOLUTION_AUTH_ALLOWED_TENANTS: ${PROD_TENANT_ID:?production tenant id required}
      EVOLUTION_DEFAULT_TENANT_ID: ${PROD_TENANT_ID:?production tenant id required}
      INCIDENT_STORE_BACKEND: postgres
      POSTMORTEM_STORE_BACKEND: postgres
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/evolution:/data/evolution
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/incidents:/data/incidents
    depends_on:
      - runtime-manager
      - governance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  reconciliation-drift-svc:
    image: ${PANTHEON_RECONCILIATION_DRIFT_SVC_IMAGE:?immutable reconciliation-drift-svc digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8102"
      RECONCILIATION_DRIFT_DATA_DIR: /data/reconciliation-drift
      RECONCILIATION_DRIFT_STORE_BACKEND: postgres
      PANTHEON_TELEMETRY_API_URL: http://telemetry:8083
      PANTHEON_LINEAGE_READ_URL: http://lineage-read:8094
      PANTHEON_EVOLUTION_API_URL: http://evolution:8093
      PANTHEON_INCIDENTS_API_URL: http://incidents:8090
      PANTHEON_INCIDENTS_API_TIMEOUT_SECONDS: "110"
      RECONCILIATION_DRIFT_AUTH_MODE: token
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/reconciliation-drift:/data/reconciliation-drift
    depends_on:
      - telemetry
      - lineage-read
      - evolution
      - incidents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  persona:
    image: ${PANTHEON_PERSONA_IMAGE:?immutable persona digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8002"
      PERSONA_STORE_BACKEND: postgres
      PERSONA_STORE_TABLE: persona.personas
      PERSONA_CAPABILITY_STORE_BACKEND: postgres
      PERSONA_CAPABILITY_STORE_TABLE: persona.capability_snapshots
      PERSONA_AUTH_MODE: strict
      PERSONA_JWT_ISSUER: ${PROD_JWT_ISSUER:?jwt issuer required}
      PERSONA_JWT_AUDIENCE: ${PROD_JWT_AUDIENCE:?jwt audience required}
      PANTHEON_PERSONA_SERVICE_ACTOR_ID: operator-bff
      PERSONA_TRAINING_TARGET_GOVERNANCE_BASE_URL: http://governance:8082
      PANTHEON_TELEMETRY_API_URL: http://telemetry:8083
      PANTHEON_REGISTRY_URL: http://registry:8087
    depends_on:
      - governance
      - telemetry
      - registry
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  consultation-svc:
    image: ${PANTHEON_CONSULTATION_SVC_IMAGE:?immutable consultation-svc digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8096"
      CONSULTATION_DATA_DIR: /data/consultation
      CONSULTATION_STORE_BACKEND: postgres
      CONSULTATION_AUTH_REQUIRED: "true"
      CONSULTATION_HANDOFF_SINK_URL: http://governance:8082/api/governance/consultation-handoffs
      CONSULTATION_WORKFLOW_EXECUTOR_HEALTH_FILE: /data/health/workflow-health.json
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/consultation:/data/consultation
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/health:/data/health
    depends_on:
      - governance

  source-ingest:
    image: ${PANTHEON_SOURCE_INGEST_IMAGE:?immutable source-ingest digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8097"
      PANTHEON_RUNTIME_AUTH_MODE: strict
      SOURCE_INGEST_DATA_DIR: /data/source-ingest
      SOURCE_INGEST_CONNECTOR_STORE_PATH: /data/source-ingest/connector_config.jsonl
      SOURCE_INGEST_EVIDENCE_STORE_PATH: /data/source-ingest/source_evidence.jsonl
      SOURCE_INGEST_CONTROLLER_STATE_PATH: /data/source-ingest/controller_state.json
      SOURCE_INGEST_REQUIREMENT_STATE_PATH: /data/source-ingest/requirement_snapshots.jsonl
      SOURCE_INGEST_CONTROLLER_TOKEN_FILE: /data/source-ingest/controller_token
      SOURCE_INGEST_LATEST_MARKET_SNAPSHOT_PATH: /data/source-ingest/latest_market_snapshots.jsonl
      DISTILLATION_JOB_QUEUE_PATH: /data/source-ingest/distill_job_queue.jsonl
      STRATEGY_SPEC_SEED_STORE_PATH: /data/source-ingest/distill_seeds.jsonl
      STRATEGY_SEED_STORE_PATH: /data/source-ingest/distill_seeds.jsonl
      PANTHEON_SOURCE_SEARCH_POSTURE: production
      SOURCE_INGEST_EVIDENCE_BACKEND: postgres
      SOURCE_MANAGEMENT_STORE_BACKEND: postgres
      SOURCE_MANAGEMENT_COMMANDS_ENABLED: "0"
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/source-ingest:/data/source-ingest
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  training-session-svc:
    image: ${PANTHEON_TRAINING_SESSION_SVC_IMAGE:?immutable training-session-svc digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8099"
      TRAINING_SESSION_DATA_DIR: /data/training-session
      TRAINING_SESSION_EVENT_STORE_BACKEND: postgres
      TRAINING_SESSION_SOURCE_VOLUME_ROOT: /data/source-ingest
      SOURCE_INGEST_API_URL: http://source-ingest:8097
      TRAINING_SESSION_PERSONA_READBACK_URL_TEMPLATE: http://persona:8002/api/personas/{persona_id}/training-target
      TRAINING_SESSION_APPROVAL_READBACK_URL_TEMPLATE: http://governance:8082/api/governance/approvals/{approval_decision_ref}
      TRAINING_SESSION_PERSONA_TARGET_WRITE_URL_TEMPLATE: http://persona:8002/api/personas/{persona_id}/training-target
      TRAINING_SESSION_PERSONA_TARGET_READBACK_URL_TEMPLATE: http://persona:8002/api/personas/{persona_id}/training-target
      TRAINING_SESSION_AUTH_MODE: strict
      TRAINING_SESSION_JWT_ISSUER: ${PROD_JWT_ISSUER:?jwt issuer required}
      TRAINING_SESSION_JWT_AUDIENCE: ${PROD_JWT_AUDIENCE:?jwt audience required}
      PANTHEON_CONSULTATION_API_URL: http://consultation-svc:8096
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/training-session:/data/training-session
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/source-ingest:/data/source-ingest:ro
    depends_on:
      - source-ingest
      - consultation-svc
      - persona
      - governance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  policy-learning-svc:
    image: ${PANTHEON_POLICY_LEARNING_SVC_IMAGE:?immutable policy-learning-svc digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8100"
      POLICY_LEARNING_DATA_DIR: /data/policy-learning
      POLICY_LEARNING_ENABLE_PRODUCTION_ADAPTERS: "false"
      POLICY_LEARNING_STORE_BACKEND: postgres
      POLICY_LEARNING_SERVICE_TENANTS: ${PROD_TENANT_ID:?production tenant id required}
      POLICY_LEARNING_AGORA_TENANT_ID: ${PROD_TENANT_ID:?production tenant id required}
      AGORA_DATASET_STORE_SCHEMA: agora
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/policy-learning:/data/policy-learning
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  research-orchestrator-svc:
    image: ${PANTHEON_RESEARCH_ORCHESTRATOR_SVC_IMAGE:?immutable research-orchestrator-svc digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8101"
      RESEARCH_ORCHESTRATOR_DATA_DIR: /data/research-orchestrator
      RESEARCH_ORCHESTRATOR_MAX_ACTIVE_RUNS: "8"
      RESEARCH_ORCHESTRATOR_ENABLE_PRODUCTION_ADAPTERS: "false"
      RESEARCH_ORCHESTRATOR_EVENT_STORE_BACKEND: postgres
      ALPHA_REPLICATION_DATA_DIR: /data/research-orchestrator/alpha-replication
      PANTHEON_RESEARCH_AUTH_MODE: strict
      PANTHEON_RESEARCH_JWT_ISSUER: ${PROD_JWT_ISSUER:?jwt issuer required}
      PANTHEON_RESEARCH_JWT_AUDIENCE: ${PROD_JWT_AUDIENCE:?jwt audience required}
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/research-orchestrator:/data/research-orchestrator
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  agora-interaction-worker:
    image: ${PANTHEON_AGORA_INTERACTION_WORKER_IMAGE:?immutable agora-interaction-worker digest required}
    <<: *product_owner
    profiles: ["singleton"]
    labels: {"org.pantheon.role": "singleton"}
    command: ["python", "scripts/run_agora_interaction_worker.py"]
    environment:
      <<: *product_env
      BFF_DATA_DIR: /data/bff
      AGORA_WORKSHOP_STORE_BACKEND: postgres
      AGORA_WORKSHOP_STORE_SCHEMA: agora
      AGORA_DATASET_STORE_BACKEND: postgres
      AGORA_DATASET_STORE_SCHEMA: agora
      AGORA_GOVERNANCE_STORE_BACKEND: postgres
      AGORA_GOVERNANCE_STORE_SCHEMA: agora
      AGORA_RESEARCH_STORE_BACKEND: postgres
      AGORA_RESEARCH_STORE_SCHEMA: agora_research
      AGORA_RESEARCH_BACKEND_URL: http://research-orchestrator-svc:8101
      PANTHEON_AGORA_WORKER_ID: agora-interaction-worker
      PERSONA_URL: http://persona:8002
      PANTHEON_PERSONA_SERVICE_ACTOR_ID: operator-bff
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/bff:/data/bff
    depends_on:
      - persona
      - research-orchestrator-svc

  # Existing binding-scoped Paper fleet reconciler and artifact signal producer. They reuse the already published
  # training-session image (manifest keys paper_fleet_reconciler/paper_signal_producer must equal that digest) and
  # are singleton owners: drained/resumed with the lifecycle projector, never duplicated per color. Service tokens,
  # the controller-only reconciler DSN and the producer telemetry DSN come from the secrets env file; subprocess
  # workers never receive the controller DSN. Provider/live/canary/real-write stay off; no broker credentials.
  paper-fleet-reconciler:
    image: ${PANTHEON_PAPER_FLEET_RECONCILER_IMAGE:?immutable paper-fleet-reconciler digest required}
    <<: *product_owner
    profiles: ["singleton"]
    labels: {"org.pantheon.role": "singleton"}
    stop_grace_period: 30s
    stop_signal: SIGINT
    command: ["python", "services/paper_fleet_reconciler/paper_fleet_reconciler.py"]
    environment:
      <<: *product_env
      PORT: "8011"
      PANTHEON_TELEMETRY_URL: http://telemetry:8083
      PANTHEON_SOURCE_INGEST_URL: http://source-ingest:8097
      RECONCILER_POLL_INTERVAL_SECONDS: "15"
      RECONCILER_WORKER_BASE_PORT: "8020"
      RECONCILER_MAX_RESTARTS: "5"
      RECONCILER_RESTART_BACKOFF_SECONDS: "5"
      RECONCILER_DRAIN_TIMEOUT_SECONDS: "10"
      PANTHEON_PERFORMANCE_MARK_MAX_AGE_SECONDS: "172800"
      PANTHEON_PERFORMANCE_STATE_ROOT: /data/runtime/paper-performance
      SIGNAL_STORE_URL: redis://signal-store:6379
      WORKER_SCRIPT_PATH: services/execution/lean_runtime/paper_runtime.py
      PANTHEON_CANARY_EXECUTION_ENABLED: "false"
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/runtime:/data/runtime
    depends_on:
      - runtime-manager
      - telemetry
      - source-ingest
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/readyz', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  paper-signal-producer:
    image: ${PANTHEON_PAPER_SIGNAL_PRODUCER_IMAGE:?immutable paper-signal-producer digest required}
    <<: *product_owner
    profiles: ["singleton"]
    labels: {"org.pantheon.role": "singleton"}
    stop_grace_period: 30s
    command: ["python", "-m", "services.execution.lean_runtime.paper_signal_producer"]
    environment:
      <<: *product_env
      SIGNAL_STORE_URL: redis://signal-store:6379
      PANTHEON_SOURCE_INGEST_URL: http://source-ingest:8097
      PAPER_PRODUCER_INTERVAL_SECONDS: "60"
      # Source-owned persisted artifact/snapshot strategy only; fails closed without an executable artifact/snapshot.
      PAPER_SIGNAL_STRATEGY: artifact
      PAPER_PRODUCER_HEALTH_FILE: /data/health/paper-signal-producer-health.json
      PANTHEON_CANARY_EXECUTION_ENABLED: "false"
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/health:/data/health
    depends_on:
      - runtime-manager
      - source-ingest
    healthcheck:
      test: ["CMD", "python", "-m", "services.execution.lean_runtime.paper_signal_producer", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Existing memory / capital / OpenClaw gateway adapter owners consumed by the BFF persona,
  # capital-read and OpenClaw ops routes. Same immutable images and native Postgres stores; the
  # adapter has no gateway, assistant credentials or broker wiring and every adapter write is off.
  memory:
    image: ${PANTHEON_MEMORY_IMAGE:?immutable memory digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8086"
      PANTHEON_MEMORY_STORE_BACKEND: postgres
      PANTHEON_MEMORY_AUTH_MODE: strict
      PANTHEON_MEMORY_JWT_ISSUER: ${PROD_JWT_ISSUER:?jwt issuer required}
      PANTHEON_MEMORY_JWT_AUDIENCE: ${PROD_JWT_AUDIENCE:?jwt audience required}
      PANTHEON_MEMORY_DATA_DIR: /data/memory
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/memory:/data/memory
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  capital:
    image: ${PANTHEON_CAPITAL_IMAGE:?immutable capital digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8092"
      CAPITAL_DATA_DIR: /data/capital
      CAPITAL_STORE_BACKEND: postgres
      CAPITAL_AUDIT_BACKEND: postgres
      CAPITAL_AUTH_MODE: strict
      CAPITAL_JWT_ISSUER: ${PROD_JWT_ISSUER:?jwt issuer required}
      CAPITAL_JWT_AUDIENCE: ${PROD_JWT_AUDIENCE:?jwt audience required}
      CAPITAL_ROLE_CLAIMS: roles,role
      CAPITAL_GOVERNANCE_BASE_URL: http://governance:8082
      CAPITAL_ALLOWED_READER_SERVICES: control-plane-bff,runtime-manager
      OPENCLAW_CAPITAL_BINDING_ENABLED: "false"
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/capital:/data/capital
    depends_on:
      - governance
      - runtime-manager
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  openclaw-gateway-adapter:
    image: ${PANTHEON_OPENCLAW_GATEWAY_ADAPTER_IMAGE:?immutable openclaw-gateway-adapter digest required}
    <<: *product_owner
    environment:
      <<: *product_env
      PORT: "8104"
      PANTHEON_OPENCLAW_ADAPTER_SERVICE_AUTH_REQUIRED: "true"
      OPENCLAW_PRODUCTION_BROKER_ENABLED: "false"
      OPENCLAW_PAPER_ADAPTER_ENABLED: "false"
      OPENCLAW_LIVE_ADAPTER_ENABLED: "false"
      OPENCLAW_CANARY_ADAPTER_ENABLED: "false"
      OPENCLAW_CAPITAL_BINDING_ENABLED: "false"
      OPENCLAW_RUNTIME_MANAGER_URL: http://runtime-manager:8080
    volumes:
      - ${PROD_DATA_MOUNT:?production data disk mount required}/product/openclaw-gateway-adapter:/root/.openclaw
    depends_on:
      - runtime-manager
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8104/livez', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

secrets:
  postgres_password:
    file: ${PROD_POSTGRES_PASSWORD_FILE:?postgres password file required}

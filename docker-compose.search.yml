version: "3.8"

services:
  search-postgres:
    image: pgvector/pgvector:pg16
    container_name: pantheon-search-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pantheon_search
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pantheon_search"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: "no"

  search-qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: pantheon-search-qdrant-test
    ports:
      - "26333:6333"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: "no"

  search-svc:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    container_name: pantheon-search-svc-test
    environment:
      PORT: "8098"
      PANTHEON_SEARCH_BACKEND: "postgres"
      PANTHEON_SEARCH_POSTGRES_DSN: "postgresql://postgres:postgres@search-postgres:5432/pantheon_search"
      SEARCH_DATA_DIR: "/tmp/pantheon/search"
      SEARCH_EMBEDDING_CACHE_DIR: "/tmp/fastembed_cache"
    ports:
      - "28098:8098"
    depends_on:
      search-postgres:
        condition: service_healthy
    restart: "no"

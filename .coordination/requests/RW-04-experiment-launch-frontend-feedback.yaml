summary: >-
  RW-04 Experiment Launch is wired through the shared rw04ExperimentApi and now
  exposes production launch, history, and detail routes for the Research
  Workbench. The implementation keeps lifecycle, progress, degradation, and
  cancel authority backend-owned, retries durable status polling after an
  initial detail-read failure instead of stalling, separates route-not-live
  from object-missing 404s, and resets history pagination state whenever the
  filter context changes.

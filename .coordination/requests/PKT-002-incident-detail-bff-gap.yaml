feature_id: PKT-002-incident-detail
type: bff-gap
source_repo: pantheon
screen: incident-detail
blocking: true
assessed_at: "2026-04-16T00:00:00Z"
assessed_by: Claude

summary: >-
  Pantheon pre-assessed the BFF implementation for PKT-002-incident-detail and found
  that GET /api/v1/operator/incident-response/{incident_id} returns a shape that diverges
  from the published contract on five structural dimensions. Lovable implementation is
  blocked until the BFF response envelope is aligned.

missing:
  - endpoint: GET /api/v1/operator/incident-response/{incident_id}
    field: data.affected_bindings[]
    reason: >-
      BFF returns data.runtime_binding (single object) instead of data.affected_bindings[]
      (a list). Contract requires an array that may be empty but must not be absent.
      The affected bindings panel cannot render.

  - endpoint: GET /api/v1/operator/incident-response/{incident_id}
    field: data.kill_switch.status
    reason: >-
      BFF returns data.kill_switch.active_freeze_orders and safe_mode_status.
      Contract requires a status field with values armed/triggered/cooling_down.
      The kill switch status panel cannot render any state.

  - endpoint: GET /api/v1/operator/incident-response/{incident_id}
    field: data.kill_switch.last_triggered_at
    reason: >-
      Absent from kill_switch block. Required as a nullable RFC3339 timestamp.

  - endpoint: GET /api/v1/operator/incident-response/{incident_id}
    field: data.kill_switch.last_confirmed_at
    reason: >-
      Absent from kill_switch block. Required as RFC3339. The staleness note on
      the kill switch panel requires this timestamp when the surface is degraded.

  - endpoint: GET /api/v1/operator/incident-response/{incident_id}
    field: data.kill_switch.active_commands[]
    reason: >-
      Absent. BFF returns active_freeze_orders which uses a different model.

  - endpoint: GET /api/v1/operator/incident-response/{incident_id}
    field: allowedActions
    reason: >-
      Entirely absent from the response. All six CTA flags (canPause, canRiskOff,
      canLiquidateAll, canHardRollback, canIssueSafeMode, canOpenActionDrawer) are
      missing. The action entry strip cannot render. The Open Action Drawer CTA
      cannot be enabled or disabled safely.

  - endpoint: GET /api/v1/operator/incident-response/{incident_id}
    field: meta.surfaces.incident
    reason: >-
      Absent. BFF uses non-contract surface keys (runtime_binding, telemetry_summary,
      rollbacks, evolution_decisions). The degradation banner for the incident surface
      cannot fire.

  - endpoint: GET /api/v1/operator/incident-response/{incident_id}
    field: meta.surfaces.affected_bindings
    reason: >-
      Absent. BFF has runtime_binding surface key instead. Per-surface degradation
      status for affected bindings cannot be checked.

  - endpoint: GET /api/v1/operator/incident-response/{incident_id}
    field: meta.surfaces.allowedActions
    reason: >-
      Absent. CTA panel cannot be safely rendered without explicit allowedActions
      surface status.

  - endpoint: GET /api/v1/operator/incident-response/{incident_id}
    field: data.incident.severity
    reason: >-
      Enum mismatch. Data store values are 'high'/'medium'; contract requires
      'sev1'/'sev2'/'sev3'. TypeScript types in FRONTEND_CHANGE_SPEC.md will not match.

  - endpoint: GET /api/v1/operator/incident-response/{incident_id}
    field: data.incident.opened_at
    reason: >-
      Field name mismatch. Data store exposes 'created_at'; contract requires 'opened_at'.

acceptance:
  - BFF aligns data.affected_bindings[] (list shape, may be empty, must not be absent)
  - BFF aligns data.kill_switch to expose status/last_triggered_at/last_confirmed_at/active_commands[]
  - BFF adds allowedActions block with all six CTA flags
  - BFF restructures meta.surfaces to use incident/affected_bindings/kill_switch/allowedActions keys
  - BFF maps severity enum to sev1/sev2/sev3 at the response layer
  - BFF exposes opened_at (from created_at or a new store field)
  - Pantheon publishes updated contract-ready and lovable-ui-task packets after alignment
  - Lovable receives updated packets and resumes the implementation cycle

resolved: true
resolved_at: "2026-04-17T04:00:00Z"
resolved_by: Claude
resolution: >-
  GET /api/v1/operator/incident-response/{incident_id} aligned: data.affected_bindings[]
  returns as a list; data.kill_switch exposes status/last_triggered_at/last_confirmed_at/
  active_commands[]; allowedActions block present with all 6 CTA flags; meta.surfaces uses
  incident/affected_bindings/kill_switch/allowedActions keys; severity mapped to sev1/sev2/sev3;
  opened_at resolved from created_at fallback.
  Contract-ready and Lovable UI task packets published. Lovable prompt updated.
resolution_artifacts:
  - .coordination/responses/PKT-002-incident-detail-contract-ready.yaml
  - .coordination/responses/PKT-002-incident-detail-lovable-ui-task.yaml

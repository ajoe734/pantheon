summary: |
  RW-04 Experiment Launch is implemented against the Pantheon experiment route
  family through rw04ExperimentApi. `/research/experiments/launch` submits the
  published launch body and transitions into a durable status view, the launch
  and detail screens read progress and cancel authority only from
  GET /api/v1/experiments/{experiment_id}, and `/research/experiments` renders
  the backend-owned history ledger with degradation banners and filter-scoped
  pagination state.


  published items/page_info/meta envelope, confirmed
  allowedActions.canForwardToApproval / canRequestChanges / canEscalate
  booleans, and meta.surfaces.review_queue plus meta.surfaces.allowedActions
  degradation semantics. Targeted BFF regression coverage for filtering,
  pagination, and degraded versus unavailable behavior now passes.

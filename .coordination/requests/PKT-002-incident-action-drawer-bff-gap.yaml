resolution: >-
  GET /api/v1/kill-switch/status aligned: returns kill_switch wrapper with
  status/last_triggered_at/last_confirmed_at/active_commands, allowedActions object
  with all 6 boolean flags (canPause/canRiskOff/canLiquidateAll/canHardRollback/
  canIssueSafeMode/secondaryPathAvailable), meta.snapshot_at, meta.surfaces.kill_switch
  and meta.surfaces.allowedActions.
  POST /api/v1/operator/commands aligned: returns flat CommandSubmissionResponse with
  receipt_id, command, accepted_at, routing_path, expected_completion_at, error_message,
  and accepted/queued/failed status enum.
  Contract-ready and Lovable UI task packets published. Lovable prompt updated.

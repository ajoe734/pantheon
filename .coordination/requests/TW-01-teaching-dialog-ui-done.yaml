  that SHA, so the returned request pair is not yet replayable from
  GitHub-visible history.

summary: |
  Teaching Dialog is implemented against the live TW-01 Pantheon route family:
  POST /api/v1/trainer/sessions, GET /api/v1/trainer/sessions,
  GET /api/v1/trainer/sessions/{session_id}, and
  POST /api/v1/trainer/sessions/{session_id}/message. The pending-BFF
  placeholder is removed, the list and detail screens render backend-owned
  trainer-session fields only, pagination uses backend page_token/page_size,
  session creation preserves optional context_refs[], transcript rows come
  only from TeachingEvent objects, and message authority is gated only by
  allowedActions.canSendMessage.


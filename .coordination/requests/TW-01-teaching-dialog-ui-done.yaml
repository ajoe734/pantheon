  the published contract, example payload, current sibling front changes, and
  the current Pantheon BFF app plus the active operator-bff runtime. The UI is
  now contract-aligned in the current workspace: the pending-BFF placeholder is
  removed, the list and detail screens use the live TW-01 route family only,
  the create flow preserves optional context_refs[], transcript rows render
  from backend TeachingEvent objects only, degraded and unavailable behavior
  matches the local BFF response shape, and `links.workbench_detail` currently

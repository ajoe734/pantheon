feature_id: PKT-002-incident-home
type: bff-gap
source_repo: pantheon
screen: incident-home
blocking: true
assessed_at: "2026-04-16T00:00:00Z"
assessed_by: Claude

summary: >-
  Pantheon pre-assessed the BFF implementation for PKT-002-incident-home and found
  that both required endpoints return shapes that diverge from the published contract.
  Lovable implementation is blocked until the BFF response envelopes are aligned.

missing:
  - endpoint: GET /api/v1/incidents
    field: items
    reason: >-
      BFF returns top-level 'data' key; contract requires 'items'. Front-end
      cannot render the incident list without this key.
  - endpoint: GET /api/v1/incidents
    field: page_info.next_page_token
    reason: >-
      Pagination is not implemented. Contract requires page_info with next_page_token.
  - endpoint: GET /api/v1/incidents
    field: meta.snapshot_at
    reason: >-
      BFF returns meta.staleness only; contract requires meta.snapshot_at (ISO8601).
  - endpoint: GET /api/v1/incidents
    field: meta.surfaces.incident_list
    reason: >-
      Per-surface degradation status is absent. The degradation banner and
      unavailable-state rendering depend on this field.
  - endpoint: GET /api/v1/kill-switch/status
    field: kill_switch
    reason: >-
      BFF returns top-level 'data' key with a freeze-orders model; contract requires
      a 'kill_switch' wrapper with status/last_triggered_at/last_confirmed_at/active_commands.
  - endpoint: GET /api/v1/kill-switch/status
    field: meta.surfaces.kill_switch
    reason: >-
      Per-surface kill switch degradation status is absent. The non-dismissable warning
      banner and 'Kill switch status unavailable' state both depend on this field.
  - endpoint: GET /api/v1/kill-switch/status
    field: meta.snapshot_at
    reason: >-
      BFF returns meta.last_checked_at instead of meta.snapshot_at; contract requires
      the canonical snapshot_at key.

acceptance:
  - BFF aligns GET /api/v1/incidents response to contract (items, page_info, meta.surfaces, meta.snapshot_at)
  - BFF aligns GET /api/v1/kill-switch/status response to contract (kill_switch wrapper, meta.surfaces.kill_switch, meta.snapshot_at)
  - BFF status filter on GET /api/v1/incidents accepts comma-separated values
  - Pantheon publishes updated contract-ready and lovable-ui-task packets after alignment
  - Lovable receives updated packets and resumes the implementation cycle

resolved: true
resolved_at: "2026-04-17T04:00:00Z"
resolved_by: Claude
resolution: >-
  BFF envelopes aligned to contract: GET /api/v1/incidents returns items key,
  page_info.next_page_token, meta.snapshot_at, and meta.surfaces.incident_list.
  GET /api/v1/kill-switch/status returns kill_switch wrapper with
  status/last_triggered_at/last_confirmed_at/active_commands, meta.snapshot_at,
  and meta.surfaces.kill_switch. Contract-ready and Lovable UI task packets
  published. Lovable prompt updated to resume implementation cycle.

name: Pantheon Feedback Publisher

# TEMPLATE — copy to .github/workflows/ in the front-ai-trading-system repo.
#
# Publishes closed-loop feedback signals back to the Pantheon repo as part of
# the Pantheon Console coordination protocol.
#
# Emits one of three event_types:
#   pantheon.frontend_feedback  — feedback bundle is ready for Pantheon review
#   pantheon.bff_gap            — UI is blocked on missing BFF/contract truth
#   pantheon.ui_done            — UI implementation is complete and ready for review
#
# Usage:
#   Trigger this workflow from another workflow (workflow_call) or manually
#   (workflow_dispatch). Pass the appropriate inputs for the loop step.
#
# Rules:
#   - frontend_feedback MUST accompany bff_gap and ui_done if they are emitted
#     in the same cycle. Run this workflow once per event type you need to emit.
#   - bff_gap and ui_done are mutually exclusive within the same feature cycle commit.
#   - feedback_bundle_dir must contain all four required artifact files before
#     emitting frontend_feedback.
#
# Required secret: COORDINATION_REPO_TOKEN
#   A PAT or app token with `repo` scope on ajoe734/pantheon.
#
# See coordination-loop-spec.md §Trigger Sources and §Payload Schemas for details.

on:
  workflow_dispatch:
    inputs:
      event_type:
        description: >
          Feedback event to publish. One of:
            pantheon.frontend_feedback
            pantheon.bff_gap
            pantheon.ui_done
        required: true
        type: choice
        options:
          - pantheon.frontend_feedback
          - pantheon.bff_gap
          - pantheon.ui_done
      feature_id:
        description: Canonical feature or packet id (e.g. F-042)
        required: true
        type: string
      payload_path:
        description: >
          Repo-relative path to the YAML payload in this repo
          (e.g. .coordination/requests/F-042-frontend-feedback.yaml)
        required: true
        type: string
      source_commit:
        description: >
          Full commit SHA in this repo that contains the payload at payload_path.
          Leave blank to use HEAD of the default branch.
        required: false
        type: string
      source_ref:
        description: Branch or tag if targeting a named ref (optional)
        required: false
        type: string
      trigger_mode:
        description: "normal or replay"
        required: false
        default: normal
        type: choice
        options:
          - normal
          - replay
      replay_of:
        description: >
          Prior dispatch run id or audit token (required when trigger_mode=replay)
        required: false
        type: string
      requested_by:
        description: Operator or automation identity (optional, for audit)
        required: false
        type: string

  workflow_call:
    inputs:
      event_type:
        required: true
        type: string
      feature_id:
        required: true
        type: string
      payload_path:
        required: true
        type: string
      source_commit:
        required: false
        type: string
      source_ref:
        required: false
        type: string
      trigger_mode:
        required: false
        type: string
        default: normal
      replay_of:
        required: false
        type: string
      requested_by:
        required: false
        type: string
    secrets:
      COORDINATION_REPO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish-feedback:
    name: Validate and publish feedback dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout front repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COORDINATION_REPO_TOKEN }}
          fetch-depth: 0

      - name: Resolve source_commit
        id: resolve-commit
        env:
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if [[ -n "$INPUT_SOURCE_COMMIT" ]]; then
            echo "source_commit=$INPUT_SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          else
            sha=$(git rev-parse HEAD)
            echo "source_commit=$sha" >> "$GITHUB_OUTPUT"
            echo "Resolved source_commit to HEAD: $sha"
          fi

      - name: Validate inputs
        env:
          EVENT_TYPE: ${{ inputs.event_type }}
          FEATURE_ID: ${{ inputs.feature_id }}
          PAYLOAD_PATH: ${{ inputs.payload_path }}
          SOURCE_COMMIT: ${{ steps.resolve-commit.outputs.source_commit }}
          TRIGGER_MODE: ${{ inputs.trigger_mode }}
          REPLAY_OF: ${{ inputs.replay_of }}
        run: |
          missing=()
          [[ -z "$EVENT_TYPE"   ]] && missing+=("event_type")
          [[ -z "$FEATURE_ID"   ]] && missing+=("feature_id")
          [[ -z "$PAYLOAD_PATH" ]] && missing+=("payload_path")

          if [[ "$TRIGGER_MODE" == "replay" && -z "$REPLAY_OF" ]]; then
            missing+=("replay_of (required when trigger_mode=replay)")
          fi

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required inputs: ${missing[*]}"
            exit 1
          fi

          if [[ "$PAYLOAD_PATH" == /* || "$PAYLOAD_PATH" == *..* ]]; then
            echo "::error::payload_path must be repo-relative: $PAYLOAD_PATH"
            exit 1
          fi

          if ! [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_commit must be a full 40-character SHA: $SOURCE_COMMIT"
            exit 1
          fi

          # Validate event_type is one this publisher may emit
          case "$EVENT_TYPE" in
            pantheon.frontend_feedback|pantheon.bff_gap|pantheon.ui_done) ;;
            *)
              echo "::error::event_type '$EVENT_TYPE' is not valid for this publisher"
              exit 1
              ;;
          esac

      - name: Confirm payload exists in this repo
        env:
          PAYLOAD_PATH: ${{ inputs.payload_path }}
        run: |
          if [[ ! -f "$PAYLOAD_PATH" ]]; then
            echo "::error::payload_path '$PAYLOAD_PATH' does not exist in this repo at the checked-out ref"
            exit 1
          fi

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate payload type and feature_id
        env:
          EVENT_TYPE: ${{ inputs.event_type }}
          ENVELOPE_FEATURE_ID: ${{ inputs.feature_id }}
          ENVELOPE_SOURCE_COMMIT: ${{ steps.resolve-commit.outputs.source_commit }}
          PAYLOAD_PATH: ${{ inputs.payload_path }}
          CURRENT_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, yaml

          event_type          = os.environ["EVENT_TYPE"]
          envelope_feature_id = os.environ["ENVELOPE_FEATURE_ID"]
          envelope_source_commit = os.environ["ENVELOPE_SOURCE_COMMIT"]
          payload_path        = os.environ["PAYLOAD_PATH"]
          current_repo        = os.environ["CURRENT_REPO"]

          allowed_types = {
              "pantheon.frontend_feedback": "frontend-feedback",
              "pantheon.bff_gap":           "bff-gap",
              "pantheon.ui_done":           "ui-done",
          }
          expected_type = allowed_types.get(event_type)
          if expected_type is None:
              print(f"::error::Unexpected event_type: {event_type}")
              sys.exit(1)

          with open(payload_path) as f:
              payload = yaml.safe_load(f)

          errors = []

          payload_feature_id = payload.get("feature_id", "")
          if payload_feature_id != envelope_feature_id:
              errors.append(
                  f"feature_id mismatch: input='{envelope_feature_id}' "
                  f"payload='{payload_feature_id}'"
              )

          payload_type = payload.get("type", "")
          if payload_type != expected_type:
              errors.append(
                  f"payload type mismatch: event_type='{event_type}' "
                  f"requires type='{expected_type}' but got '{payload_type}'"
              )

          payload_source_repo = payload.get("source_repo", "")
          if payload_source_repo and payload_source_repo != current_repo:
              errors.append(
                  f"source_repo mismatch: workflow repo='{current_repo}' "
                  f"payload='{payload_source_repo}'"
              )

          payload_source_commit = payload.get("source_commit", "")
          if payload_source_commit and payload_source_commit != envelope_source_commit:
              errors.append(
                  f"source_commit mismatch: workflow='{envelope_source_commit}' "
                  f"payload='{payload_source_commit}'"
              )

          # For frontend-feedback: verify required artifact fields are present
          if payload_type == "frontend-feedback":
              for required in ("feedback_path", "api_gap_requests_path",
                               "ui_decisions_path", "qa_status_path",
                               "feedback_bundle_dir", "source_commit",
                               "changed_files", "pantheon_review_hint"):
                  if not payload.get(required):
                      errors.append(f"frontend-feedback is missing required field: '{required}'")
          elif payload_type == "ui-done" and not payload.get("changed_files"):
              errors.append("ui-done is missing required field: 'changed_files'")

          paths_to_check = []
          if payload_type == "frontend-feedback":
              bundle_dir = payload.get("feedback_bundle_dir", "")
              if bundle_dir:
                  paths_to_check.append(("feedback_bundle_dir", bundle_dir))
              for key in ("feedback_path", "api_gap_requests_path",
                          "ui_decisions_path", "qa_status_path"):
                  value = payload.get(key, "")
                  if value:
                      paths_to_check.append((key, value))
              for rel_path in payload.get("changed_files", []):
                  paths_to_check.append(("changed_files[]", rel_path))
          elif payload_type == "ui-done":
              for rel_path in payload.get("changed_files", []):
                  paths_to_check.append(("changed_files[]", rel_path))

          for field, rel_path in paths_to_check:
              if rel_path.startswith("/") or ".." in rel_path:
                  errors.append(
                      f"payload field '{field}' contains an absolute or traversal path: '{rel_path}'"
                  )

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)

          print(f"Payload validation passed: feature_id={envelope_feature_id}, "
                f"type={payload_type}")
          PYEOF

      - name: Verify feedback bundle artifacts exist for this cycle
        if: ${{ inputs.event_type == 'pantheon.frontend_feedback' || inputs.event_type == 'pantheon.bff_gap' || inputs.event_type == 'pantheon.ui_done' }}
        env:
          EVENT_TYPE: ${{ inputs.event_type }}
          FEATURE_ID: ${{ inputs.feature_id }}
          PAYLOAD_PATH: ${{ inputs.payload_path }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, yaml

          event_type = os.environ["EVENT_TYPE"]
          feature_id = os.environ["FEATURE_ID"]
          payload_path = os.environ["PAYLOAD_PATH"]
          with open(payload_path) as f:
              payload = yaml.safe_load(f)

          if event_type == "pantheon.frontend_feedback":
              bundle_dir = payload.get("feedback_bundle_dir", "")
          else:
              bundle_dir = f"docs/pantheon-feedback/{feature_id}"

          required_artifacts = [
              "LOVABLE_CHANGE_FEEDBACK.md",
              "API_GAP_REQUESTS.json",
              "UI_DECISIONS.md",
              "QA_STATUS.md",
          ]
          missing = []
          for artifact in required_artifacts:
              p = os.path.join(bundle_dir, artifact)
              if not os.path.isfile(p):
                  missing.append(p)

          if missing:
              for m in missing:
                  print(f"::error::Required feedback artifact missing: {m}")
              sys.exit(1)

          print(f"All required feedback artifacts present in {bundle_dir}")
          PYEOF

      - name: Dispatch to Pantheon
        env:
          GH_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          EVENT_TYPE: ${{ inputs.event_type }}
          FEATURE_ID: ${{ inputs.feature_id }}
          PAYLOAD_PATH: ${{ inputs.payload_path }}
          SOURCE_COMMIT: ${{ steps.resolve-commit.outputs.source_commit }}
          SOURCE_REF: ${{ inputs.source_ref }}
          TRIGGER_MODE: ${{ inputs.trigger_mode }}
          REPLAY_OF: ${{ inputs.replay_of }}
          REQUESTED_BY: ${{ inputs.requested_by }}
          RUN_ID: ${{ github.run_id }}
          THIS_REPO: ${{ github.repository }}
        run: |
          PANTHEON_REPO="ajoe734/pantheon"

          echo "Dispatching $EVENT_TYPE to $PANTHEON_REPO"
          echo "  feature_id    = $FEATURE_ID"
          echo "  payload_path  = $PAYLOAD_PATH"
          echo "  source_commit = $SOURCE_COMMIT"
          echo "  trigger_mode  = $TRIGGER_MODE"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$PANTHEON_REPO/dispatches" \
            -f event_type="$EVENT_TYPE" \
            -F client_payload[feature_id]="$FEATURE_ID" \
            -F client_payload[payload_path]="$PAYLOAD_PATH" \
            -F client_payload[source_repo]="$THIS_REPO" \
            -F client_payload[source_commit]="$SOURCE_COMMIT" \
            -F client_payload[source_ref]="${SOURCE_REF:-}" \
            -F client_payload[trigger_mode]="${TRIGGER_MODE:-normal}" \
            -F client_payload[origin_workflow]="pantheon-feedback-publisher/$RUN_ID" \
            -F client_payload[replay_of]="${REPLAY_OF:-}" \
            -F client_payload[requested_by]="${REQUESTED_BY:-}"

          echo "Dispatch sent."

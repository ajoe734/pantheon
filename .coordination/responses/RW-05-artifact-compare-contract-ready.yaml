description: >-
  RW-05 Artifact Compare handoff republished from the route-live Pantheon
  contract. The artifact registry list, artifact detail, and backend-composed
  compare routes are live, and the next front-owned cycle should implement the
  registry, detail, and compare UI against the published field shapes instead of
  treating RW-05 as a missing-BFF module.
artifacts:
  bff_contract: docs/bff/RW-05-artifact-compare.md
  example_payload: docs/examples/RW-05-artifact-compare.json
  lovable_ui_task: .coordination/responses/RW-05-artifact-compare-lovable-ui-task.yaml
  frontend_change_spec: docs/pantheon-handoffs/RW-05-artifact-compare/FRONTEND_CHANGE_SPEC.md
endpoints:
  - GET /api/v1/artifacts
  - GET /api/v1/artifacts/{artifact_id}
  - GET /api/v1/artifacts/compare
target_repo: ajoe734/front-ai-trading-system
handoff_bundle:
  - contract_ready
  - lovable_ui_task
  - example_payload
  - frontend_change_spec
readiness_gate: >-
  All three RW-05 routes are live and returning the published field shape.
  Frontend implementation may proceed against the live artifact registry,
  detail, and compare route family. If any required field diverges from the
  synced contract, emit the canonical RW-05 bff-gap handoff instead of deriving
  diffs or ancestry client-side.
front_actions_required:
  - build the Artifact Registry, Artifact Detail, and Artifact Compare surfaces in front-ai-trading-system
  - use only the existing BFF client
  - do not add raw fetch calls in component files
  - render artifact list, detail, and compare data from Pantheon BFF only
  - do not derive compare output, version ancestry, or provenance pairs client-side
  - gate compare affordances from backend-shaped allowedActions only
  - emit a bff-gap handoff if any required field is absent
  - publish ui-done and frontend-feedback from one Git-visible commit
acceptance_met:
  contract_ready_published: true
  bff_route_live: true
  compare_route_live: true
  lovable_ui_task_published: true
  front_repo_receives_handoff_bundle: true
bff_spec_path: docs/bff/RW-05-artifact-compare.md
frontend_change_spec_path: docs/pantheon-handoffs/RW-05-artifact-compare/FRONTEND_CHANGE_SPEC.md
examples:

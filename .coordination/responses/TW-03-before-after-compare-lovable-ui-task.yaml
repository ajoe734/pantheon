allowed_endpoints:
- GET /api/v1/trainer/sessions/{session_id}/preview
- POST /api/v1/trainer/sessions/{session_id}/preview
constraints:
- use existing bff client only
- do not add raw fetch in components
- do not import demo providers
- if any required field is missing, emit a bff-gap handoff instead of mocking
acceptance:
- render compare header, summary, metric deltas, warning hierarchy, and control diff
  from GET /api/v1/trainer/sessions/{session_id}/preview
- call POST /api/v1/trainer/sessions/{session_id}/preview only for manual refresh
  with refresh_mode = manual
- poll only GET /api/v1/trainer/sessions/{session_id}/preview?eval_id={eval_id} while
  status = pending and polling.enabled = true
- stop polling when status resolves, deadline_at passes, or meta.surfaces.trainer_preview
  becomes degraded or unavailable
- surface refresh CTA only when allowedActions.canRefreshPreview is true
- render preview_unavailable as explicit degraded compare copy, not as loading
- preserve backend ordering for warnings[] and backend-provided warning_count_by_level
  summary
- emit a bff-gap handoff if any required field is absent

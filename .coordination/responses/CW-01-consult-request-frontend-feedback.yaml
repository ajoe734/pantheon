  - criterion: keep degraded and unavailable list behavior truthful
    status: pass
    note: >-
      The empty-state card is suppressed when surfaceState === 'degraded'.
      Verified at d9d64fe: condition guards surfaceState !== 'degraded' in line 621.
  - criterion: display target_type on request list rows
    status: pass
    note: >-
      target_type is rendered as its own labelled column in list rows.
      Verified at d9d64fe in ConsultRequestList.tsx line 111.
  - criterion: resolve linked sessions to the live /sessions/:linked_session_id SPA route when a session is linked
    status: pass
    note: >-
      ConsultRequestDetail uses the in-app /sessions/:linked_session_id route

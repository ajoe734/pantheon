      ConsultRequestList now passes page_size: PAGE_SIZE (20) on every list call
      alongside page_token. Verified at d9d64fe in ConsultRequestList.tsx line 199.
  - criterion: render the cancel CTA only when allowedActions.canCancel is true
    status: pass
    note: >-
      The hard surfaceState !== 'degraded' block is removed. The cancel CTA is
      now gated solely on allowedActions.canCancel, including on degraded

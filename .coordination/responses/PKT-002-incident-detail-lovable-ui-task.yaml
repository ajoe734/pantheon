ui_spec_path: docs/screens/PKT-002-incident-detail.md
frontend_change_spec_path: docs/pantheon-handoffs/PKT-002-incident-detail/FRONTEND_CHANGE_SPEC.md
allowed_endpoints:
  - GET /api/v1/operator/incident-response/{incident_id}
constraints:
  - use existing bff client only
  - do not add raw fetch in components
  - do not import demo providers
  - if any required field is missing, emit a bff-gap handoff instead of mocking
  - all allowedActions fields must come from the BFF response; do not derive locally
  - do not re-fetch individual surfaces when the composed view is available
  - render each degraded surface with explicit named copy matching the BFF surface key
acceptance:
  - build the Incident Detail screen using the composed view only
  - incident summary panel renders all required fields from data.incident
  - affected bindings panel renders data.affected_bindings; shows "No affected bindings recorded" when meta.surfaces.affected_bindings is ok and the list is empty; shows an explicit named degraded panel with available records and meta.degradation.affected_bindings_reason when meta.surfaces.affected_bindings is degraded
  - kill switch status panel handles ok, degraded, and unavailable states explicitly
  - action entry strip derives all CTA visibility from allowedActions only
  - Open Action Drawer CTA is disabled when allowedActions.canOpenActionDrawer is false
  - degradation banner renders when any meta.surfaces entry is not ok
  - render loading, empty, degraded, and error states as explicitly distinct
required_feedback:
  - docs/pantheon-feedback/PKT-002-incident-detail/LOVABLE_CHANGE_FEEDBACK.md
  - docs/pantheon-feedback/PKT-002-incident-detail/API_GAP_REQUESTS.json
  - docs/pantheon-feedback/PKT-002-incident-detail/UI_DECISIONS.md
  - docs/pantheon-feedback/PKT-002-incident-detail/QA_STATUS.md

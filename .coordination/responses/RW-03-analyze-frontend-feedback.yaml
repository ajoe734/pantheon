  UI keeps list queries limited to ticket_id, experiment_id, status,
  date_range, page_token, and page_size through rw03AnalyzeApi.list(); renders
  backend-owned summary rows, metric_group_refs, and pagination without local
  grouping or diff logic; and renders detail summary, metric_groups, and
  comparative_summary directly from rw03AnalyzeApi.detail() while preserving
  backend order and distinguishing 404 OBJECT_NOT_FOUND from route-not-live
  404s. Pantheon reran
  `python3 -m pytest -q services/control-plane/bff/test_rw03_analyze_contract.py`
  (`4 passed`), confirmed live 18001 route publication plus degraded
  list/detail envelopes and 404 OBJECT_NOT_FOUND, reran sibling-front targeted
  eslint, and reran `npm run build` successfully. No new Pantheon API gap
  remains in this loop.


summary: >-
  Pantheon re-reviewed the mirrored RW-04 ui-done/frontend-feedback handoff
  against the published experiment-launch contract, canonical example payload,
  sibling front implementation, local front Git history, the live
  operator-bff runtime, and a workspace-backed unavailable HTTP probe. The
  current RW-04 UI is contract-aligned: launch/list/detail/cancel all route
  through rw04ExperimentApi, detail 404 handling no longer collapses
  OBJECT_NOT_FOUND into route-not-live, the launch status rail keeps retrying
  after an initial detail-read failure, history filter changes reset
  pagination backstack, and targeted eslint, TypeScript, and production build
  verification all pass. Pantheon also revalidated the runtime:
  /openapi.json on 18001 advertises the full RW-04 route family, authenticated
  live probes confirm queued, running, degraded, unavailable, and terminal
  behavior, and a workspace-backed 18012 probe confirms unavailable list and
  detail envelopes. Front publication truth is improved but still incomplete:
  local commit 6e17dd8f233dad31d20b64781f23063e00ddde54 pins the reviewed UI
  implementation, and local commit 147297bf03707bf05d6fe0aab4a30c8d84599c5b
  publishes the canonical request pair with immutable
  source_commit=6e17dd8f233dad31d20b64781f23063e00ddde54, but
  origin/pkt-004-detail-fix still points at
  93a4b58891031442133a6966d0354ae216a80b72, whose tree omits the RW-04 request
  pair, feedback bundle, and experiment pages. The loop cannot close until
  that front publication is pushed or republished to a GitHub-visible commit.

acceptance_verified:
  - criterion: launch requests use POST /api/v1/experiments/launch only
    status: pass
    note: >-
      The current sibling publication routes experiment creation only through
      rw04ExperimentApi.launch() in src/lib/bffClient.ts, which posts to
      /api/v1/experiments/launch with the published launch body.
  - criterion: launch and detail polling remain anchored to GET /api/v1/experiments/{experiment_id} and do not synthesize local lifecycle state
    status: pass
    note: >-
      ExperimentLaunch and ExperimentDetail fetch durable state only through
      rw04ExperimentApi.detail(), and the UI continues polling or refreshing
      that route instead of inferring progress, terminal state, or cancel
      authority from timers or artifact presence.
  - criterion: detail 404 handling distinguishes route-not-live from contract-defined missing experiment ids
    status: pass
    note: >-
      ExperimentRunHelpers classifies route-not-live only when the BFF returns
      HTTP 404 with code NOT_FOUND or ROUTE_NOT_FOUND. Pantheon's live 18001
      probe to /api/v1/experiments/does-not-exist returned 404
      OBJECT_NOT_FOUND, which the current front error rail preserves instead of
      collapsing into a route placeholder.
  - criterion: history pagination resets when ticket_id or status filter context changes
    status: pass
    note: >-
      ExperimentHistory clears pageHistory when either ticket_id or status
      changes, so Previous no longer reuses page tokens from an older filter
      context.
  - criterion: cancel CTA visibility is gated by allowedActions.canCancel plus surface degradation semantics only
    status: pass
    note: >-
      ExperimentRunView anchors cancel rendering to allowedActions.canCancel
      and suppresses the CTA when meta.surfaces.experiment_status is degraded
      or unavailable.
  - criterion: npm run build passes
    status: pass
    note: >-
      `npm run build` completed successfully in the sibling front workspace for
      the reviewed RW-04 slice, with only the existing Browserslist age notice
      and Vite chunk-size warning.
  - criterion: publish the RW-04 request pair, feedback bundle, and reviewed UI files to GitHub-visible front history
    status: fail
    note: >-
      Local commit 6e17dd8f233dad31d20b64781f23063e00ddde54 contains the
      reviewed RW-04 UI files and feedback bundle, and local commit
      147297bf03707bf05d6fe0aab4a30c8d84599c5b contains the canonical request
      pair, but `git ls-remote --heads origin pkt-004-detail-fix` still
      returns 93a4b58891031442133a6966d0354ae216a80b72. `git ls-tree` on that
      remote-visible commit omits the RW-04 request pair, feedback bundle, and
      experiment pages, so the current handoff is not yet replayable through
      GitHub-visible history.
  - criterion: validate queued, running, degraded, unavailable, and terminal RW-04 behavior against truthful HTTP responses
    status: pass
    note: >-
      Pantheon verified the current active runtime on 18001 plus a
      workspace-backed unavailable probe on 18012. The active runtime
      advertises the four RW-04 routes in /openapi.json and returns truthful
      degraded list/detail payloads, queued launch, running/completed/failed/
      canceled terminal behavior, and 404 OBJECT_NOT_FOUND. The unavailable
      probe returns list total 0 with experiment_history unavailable and detail
      payloads with experiment_status unavailable.


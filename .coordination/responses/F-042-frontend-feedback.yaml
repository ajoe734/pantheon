required_front_repo_updates:
  - file: src/pages/promotion/types.ts
    action: >-
      Commit the working-tree contract fixes: SurfaceStatus must stay
      ok|degraded|unavailable, latestRun.progress must be number|null, and the
      review.* decision mirrors must remain optional.
  - file: src/pages/promotion/PromotionReview.tsx
    action: >-
      Commit the working-tree render fixes: treat latestRun.progress=null as a
      valid unavailable state and render decision metadata from
      approval_decision.state/reviewer/decided_at.
  - file: .coordination/requests/F-042-ui-done.yaml
    action: >-
      Republish from the same final front-repo commit that contains the
      PromotionReview.tsx/types.ts fixes. source_commit must equal that exact
      publication commit.
  - file: .coordination/requests/F-042-frontend-feedback.yaml
    action: >-
      Republish from the same final front-repo commit as the ui-done payload,
      and keep the summary truthful about replay cleanliness for the advertised
      source_commit.
  - file: docs/pantheon-feedback/F-042
    action: >-
      Publish the F-042 feedback bundle in the same final commit as the request
      pair and the screen fixes so the documented review state is Git-replayable.

loop_close_condition: >-
  The loop can close once one Git-visible front commit contains the updated
  PromotionReview.tsx + types.ts pair, the canonical F-042 ui-done request, the
  canonical F-042 frontend-feedback request, and docs/pantheon-feedback/F-042/*,
  and both request payloads point source_commit at that same publication commit.

risk_note: >-
  No Pantheon API expansion is required. The remaining blocker is replay
  cleanliness plus publication of the already-prepared Promotion Review contract
  fixes. After that republish, the only residual risk should be runtime-only QA
  against a live Pantheon BFF instance.


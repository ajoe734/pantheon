allowed_endpoints:
  - GET /api/v1/lineage
  - GET /api/v1/lineage/edges/{edge_id}
  - GET /api/v1/lineage/graph
constraints:
  - use existing bff client only
  - do not add raw fetch in components
  - do not import demo providers
  - if any required field is missing, emit a bff-gap handoff instead of mocking
  - do not expose root_type as a filter control (LN-03 root_type is a v1 no-op)
  - depth parameter must be passed as-is; do not clamp client-side
acceptance:
  - build the Lineage list panel (list rows carry artifact_id, edge_count, last_edge_at only; row click loads the graph, not the edge drawer)
  - build the Lineage Graph panel using root_id and depth; graph-edge click opens the edge detail drawer using edge_id from lineage_graph.edges[].id
  - build the Lineage Edge Detail drawer triggered from graph-edge selection (edge_id sourced from LN-03 response, not from list rows)
  - use only the existing BFF client
  - do not add raw fetch calls in component files
  - do not expose root_type filter in the UI
  - render explicit empty state when lineage_graph.edges is empty (display "No lineage recorded for {artifact_id}" — not a blank canvas)
  - display staleness banner when meta.staleness is present
  - render loading, empty, and error states as explicitly distinct
required_feedback:

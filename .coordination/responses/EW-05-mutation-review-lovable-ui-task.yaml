- POST /api/v1/operator/commands (ApproveMutation)
- POST /api/v1/operator/commands (RejectMutation)
constraints:
- use existing bff client only
- do not add raw fetch in components
- do not import demo providers
- if any required field is missing, emit a bff-gap handoff instead of mocking
acceptance:
- fetch decision projection from GET /api/v1/operator/mutation-review/{decision_id}
  only
- render Approve CTA only when allowedActions.canApproveMutation is true and meta.surfaces.mutation_review
  is not unavailable
- render Reject CTA only when allowedActions.canRejectMutation is true and meta.surfaces.mutation_review
  is not unavailable
- submit ApproveMutation or RejectMutation via POST /api/v1/operator/commands
- suppress both CTAs when meta.surfaces.mutation_review is unavailable
- render non-dismissable staleness banner when meta.surfaces.mutation_review is stale
- do not compute authority signals, risk level, or change semantics client-side
- re-fetch read route after command submission to confirm state; do not optimistically
  update decision_state

  request pair against the published Teaching Replay contract, canonical
  example payload, current sibling front implementation, the local Pantheon
  FastAPI app, and the active operator-bff runtime. The returned front slice is
  internally consistent and replay-clean from `origin/pkt-004-detail-fix`:
  source commit `93a4b58891031442133a6966d0354ae216a80b72` contains the TW-04
  UI files, request pair, and feedback bundle; the front router mounts
  `/trainer/replay` and `/trainer/replay/:session_id`; the replay pages route
  all TW-04 traffic through `tw04ReplayApi`; and targeted eslint plus
  `npm run build` passed in the sibling workspace. Pantheon revalidated the
  BFF contract slice with
  `python3 -m pytest services/control-plane/bff/test_tw04_teaching_replay_contract.py -q`
  (`32 passed`), confirmed that both the BFF and front derive
  `expected_candidate_snapshot_at` from the latest backend-provided
  `events[].eval_ref.candidate_snapshot_at`, and corrected the local TW-04
  replay/session browser-link projection so seeded local probes now return
  `/trainer/replay/{session_id}` and `/trainer/sessions/{session_id}` in line
  with the canonical docs and mounted front routes. The loop still cannot close
  because the active runtime at http://127.0.0.1:18001 remains stale and does
  not expose the TW-04 route family over live HTTP, and because live
  `event.evidence_ref.url_pattern` targets still need deployed-route
  validation.


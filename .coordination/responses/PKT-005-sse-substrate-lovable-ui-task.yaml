frontend_change_spec_path: docs/pantheon-handoffs/PKT-005-sse-substrate/FRONTEND_CHANGE_SPEC.md
allowed_endpoints:
- GET /api/v1/runtime/{runtime_id}/events/stream
- GET /api/v1/incidents/stream
- GET /api/v1/kill-switch/updates
constraints:
- use existing bff client only
- do not add raw fetch in components
- do not import demo providers
- if any required field is missing, emit a bff-gap handoff instead of mocking
- do not re-implement from scratch; patch only the five delta items
- publish frontend-feedback and ui-done from a transport-replayable commit that
  actually contains both payload paths; do not point source_commit at an earlier
  code-only commit
acceptance:
- implement a shared SSE client layer with reconnect manager (exponential backoff
  1s-30s, last_event_id tracking)
- implement idempotent event reconciler that skips already-applied events by id
- subscribe to relevant stream(s) on screen mount; unsubscribe on unmount
- do not use SSE as the initial data source; always fetch the composed view first,
  then apply SSE events on top
- filter runtime events by data.runtime_id client-side (server-side filtering not
  yet active)
- show SSE connection state (connected / reconnecting / disconnected) in the screen
  footer
- do not add raw EventSource calls in component files; all stream wiring must go through
  the shared client layer
- if any required event data field is missing, emit a bff-gap handoff
- last_event_id is stored only after the reconciler successfully accepts and applies
  the event (SseClient.markApplied called by the screen, not auto-advanced on receipt)
- each live surface shows "Real-time updates may be delayed" after 60 seconds of no
  SSE events while the connection is in the connected state
- accepted runtime_state_changed events trigger a detail-panel refresh in
  DeploymentReviewConsole and a BFF re-fetch in IncidentDetail
- accepted incident_updated events update the visible incident status badge in both
  IncidentDetail and the PostIncidentReviewConsole detail panel (not informational only)
- reconciler bff-gap results are surfaced in the footer or as an alert; they are not
  silently dropped
- frontend-feedback and ui-done are published in the same final front-repo
  commit that contains both payload paths, and each payload source_commit matches
  that publication commit
- .coordination/requests/PKT-005-sse-substrate-frontend-feedback.yaml is published
  alongside the ui-done handoff

allowed_endpoints:
  - GET /api/v1/kill-switch/status
  - POST /api/v1/operator/commands
constraints:
  - use existing bff client only
  - do not add raw fetch in components
  - do not import demo providers
  - if any required field is missing, emit a bff-gap handoff instead of mocking
  - all allowedActions fields must come from the BFF response; do not derive locally
  - every emergency action requires a non-empty audit_context.reason before submit is enabled
  - render command receipts inline; do not navigate away after a command
acceptance:
  - build the Incident Action Drawer with kill switch status header
  - render emergency action buttons from allowedActions only; disabled buttons must be visually distinct
  - enforce non-empty audit_context.reason before any submit button is enabled
  - render command receipt inline after each successful POST with receipt_id, command, status, routing_path, and expected_completion_at
  - render the secondary control path panel when meta.surfaces.kill_switch is degraded or unavailable
  - secondary path shows last known state, fallback routing copy, and only Pause and RiskOff buttons
  - render "Emergency control surface fully unavailable" banner when both primary and secondary paths are unavailable
  - render loading and error states as explicitly distinct

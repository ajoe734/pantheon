error_codes:
  - code: CONFIRM_TOKEN_REQUIRED
    http: 428
    trigger: X-Confirm-Token header absent on critical route
  - code: APPROVAL_REQUIRED
    http: 409
    trigger: approval gate not satisfied
  - code: TWO_MAN_REQUIRED
    http: 409
    trigger: second-signer precondition not met
  - code: IDEMPOTENCY_CONFLICT
    http: 409
    trigger: same idempotency key, different payload
  - code: SSE_REPLAY_UNAVAILABLE
    http: 409
    trigger: replay requested beyond supported replay window
  - code: INVALID_PARAMS
    http: 400
    trigger: missing or malformed required headers/params
  - code: INVALID_REQUEST
    http: 400
    trigger: body contains idempotencyKey or malformed payload
  - code: AUTHZ_DENIED
    http: 403
    trigger: operator lacks role or capability
  - code: OBJECT_NOT_FOUND
    http: 404
    trigger: target entity not found
  - code: CONCURRENT_MODIFICATION
    http: 409
    trigger: in-flight command for the same entity
  - code: INVALID_STATE
    http: 409
    trigger: entity state does not allow the requested action


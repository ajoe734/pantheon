feature_id: TW-01-teaching-dialog
type: contract-ready
source_repo: ajoe734/pantheon
screen: teaching-dialog
status: published
published_at: "2026-04-19T00:00:00Z"
task: TW-01-FOUNDATION-001
description: >-
  TW-01 Teaching Dialog contract published as part of TW-01-FOUNDATION-001.
  The trainer-session create route (POST /api/v1/trainer/sessions), list route
  (GET /api/v1/trainer/sessions), detail route
  (GET /api/v1/trainer/sessions/{session_id}), coaching message route
  (POST /api/v1/trainer/sessions/{session_id}/message), read-side trainer
  session lifecycle semantics (active, paused, completed, abandoned), dialog
  TeachingEvent schema subset, and frontend handoff bundle are now defined.
  This packet publishes the contract and handoff shape only. The Pantheon BFF
  routes are still pending implementation, so the frontend production UI gate
  remains blocked until Pantheon explicitly confirms those live endpoints.
artifacts:
  bff_contract: docs/bff/TW-01-teaching-dialog.md
  screen_spec: docs/screens/TW-01-teaching-dialog.md
  example_payload: docs/examples/TW-01-teaching-dialog.json
  lovable_ui_task: .coordination/responses/TW-01-teaching-dialog-lovable-ui-task.yaml
  frontend_change_spec: docs/pantheon-handoffs/TW-01-teaching-dialog/FRONTEND_CHANGE_SPEC.md
endpoints:
  - POST /api/v1/trainer/sessions
  - GET /api/v1/trainer/sessions
  - GET /api/v1/trainer/sessions/{session_id}
  - POST /api/v1/trainer/sessions/{session_id}/message
target_repo: ajoe734/front-ai-trading-system
handoff_bundle:
  - contract_ready
  - lovable_ui_task
  - example_payload
readiness_gate: >-
  Frontend must stay on the pending-BFF placeholder until Pantheon confirms all
  four TW-01 routes are live and return the published trainer-session and
  TeachingEvent field shape. This handoff is contract-published only and does
  not clear production UI work yet.
front_actions_required:
  - keep both trainer dialog routes on a pending-BFF placeholder until Pantheon confirms the TW-01 routes live
  - create sessions through POST /api/v1/trainer/sessions only
  - fetch trainer-session list from GET /api/v1/trainer/sessions only
  - fetch trainer-session detail and transcript from GET /api/v1/trainer/sessions/{session_id} only
  - send coaching messages through POST /api/v1/trainer/sessions/{session_id}/message only
  - render transcript rows from backend TeachingEvent objects only; do not create local optimistic transcript state
  - use links.workbench_detail from the BFF for navigation when present
  - gate the message composer by allowedActions.canSendMessage only
  - do not substitute Persona teaching-history responses for Trainer dialog routes
  - show the non-dismissable PKT-005 degradation banner when meta.surfaces.trainer_dialog is degraded or unavailable
  - do not expose pause, complete, or abandon CTAs until a later Trainer packet publishes those write routes
  - emit a bff-gap handoff if any required field is absent
acceptance_met:
  contract_ready_published: true
  bff_create_route_live: false
  bff_list_route_live: false
  bff_detail_route_live: false
  bff_message_route_live: false
  lovable_ui_task_published: true
  front_repo_receives_handoff_bundle: true

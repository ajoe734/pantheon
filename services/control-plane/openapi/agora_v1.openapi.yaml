openapi: "3.1.0"
info:
  title: Pantheon Agora API v1
  version: "1.0.0"
  description: |
    Agora v1 OpenAPI surface covering all §17 routes (SD_2026-06-20.md §5).
    This file is canonical for all 61 routes in the agora-core and agora-extended
    BFF route families. Frozen as of AG-XR-001.

    **Security note:** All paths require operator-level auth (Bearer token).
    No route in this spec may route live broker orders.

  contact:
    name: Pantheon Platform
  x-frozen-by: AG-XR-001
  x-frozen-at: "2026-06-20"
  x-capability-manifest: "services/control-plane/specs/agora/capability_manifest.json"

servers:
  - url: "{bff_base}"
    description: Pantheon BFF (dev/prod)
    variables:
      bff_base:
        default: "https://pantheon-lupin-dev-bff.35.201.239.38.sslip.io"

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "Operator auth token. Dev stub: 'op-dev:admin:mfa'"

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
      description: Session identifier.

    SignalId:
      name: signal_id
      in: path
      required: true
      schema:
        type: string
      description: Signal identifier.

    EntryId:
      name: entry_id
      in: path
      required: true
      schema:
        type: string
      description: Journal entry identifier.

    MemoryId:
      name: memory_id
      in: path
      required: true
      schema:
        type: string
      description: Memory entry identifier.

    InsightId:
      name: insight_id
      in: path
      required: true
      schema:
        type: string
      description: Insight identifier.

    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
      description: Message identifier.

    Action:
      name: action
      in: path
      required: true
      schema:
        type: string
      description: Action name.

    CommitteeSessionId:
      name: committee_session_id
      in: path
      required: true
      schema:
        type: string
      description: Committee session identifier.

    MemoId:
      name: memo_id
      in: path
      required: true
      schema:
        type: string
      description: Committee memo identifier.

    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
      description: Run identifier.

    ChannelId:
      name: channel_id
      in: path
      required: true
      schema:
        type: string
      description: SSE channel identifier.

  schemas:
    BffListEnvelope:
      type: object
      description: Standard BFF list response envelope.
      properties:
        data:
          type: array
          items: {}
        items:
          type: array
          items: {}
        page_info:
          type: object
          properties:
            next_page_token:
              type: string
              nullable: true
            total:
              type: integer
        meta:
          type: object
          properties:
            snapshot_at:
              type: string
              format: date-time
            surfaces:
              type: object
              additionalProperties: true
            total:
              type: integer
      additionalProperties: true

    BffDegradedEnvelope:
      type: object
      description: Degraded / empty response envelope when store is unavailable.
      properties:
        status:
          type: string
          enum: [unavailable]
        source:
          type: string
          enum: [missing]
        data:
          type: array
          items: {}
          default: []
      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - AUTHZ_DENIED
                - OBJECT_NOT_FOUND
                - INVALID_REQUEST
                - INVALID_STATE
                - CONCURRENT_MODIFICATION
                - INVALID_PARAMS
            message:
              type: string
          required: [code, message]

tags:
  - name: agora-identity
    description: "Capability: agora.identity.v1 — User scope and servant profiles"
    x-capability: agora.identity.v1

  - name: agora-session
    description: "Capability: agora.session.v1 — Ask sessions, messages, inbox"
    x-capability: agora.session.v1

  - name: agora-workshop
    description: "Capability: agora.workshop.v1 — Strategy workshop, committee, evaluation"
    x-capability: agora.workshop.v1

  - name: agora-research
    description: "Capability: agora.research.v1 — Research plans and runs"
    x-capability: agora.research.v1

  - name: agora-trading
    description: "Capability: agora.trading.v1 — Signals, feedback, trading events"
    x-capability: agora.trading.v1

  - name: agora-dashboard
    description: "Capability: agora.dashboard.v1 — Daily brief, journal, watchlist, market notes"
    x-capability: agora.dashboard.v1

  - name: agora-personalization
    description: "Capability: agora.personalization.v1 — Memory, insights, personalization"
    x-capability: agora.personalization.v1

paths:

  /bff/agora/postmortems:
    get:
      operationId: listAgoraPostmortems
      summary: Postmortems visible from Agora
      tags: [agora-dashboard]
      parameters:
        - name: page_token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Postmortem list
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BffListEnvelope"
                  - $ref: "#/components/schemas/BffDegradedEnvelope"


  /bff/agora/decision-journal:
    get:
      operationId: getDecisionJournal
      summary: Decision journal
      tags: [agora-dashboard]
      responses:
        "200":
          description: Decision journal
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BffListEnvelope"
                  - $ref: "#/components/schemas/BffDegradedEnvelope"

  /bff/agora/journal:
    get:
      operationId: listJournalEntries
      summary: List journal entries
      tags: [agora-dashboard]
      responses:
        "200":
          description: Journal entry list
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BffListEnvelope"
                  - $ref: "#/components/schemas/BffDegradedEnvelope"

    post:
      operationId: createJournalEntry
      summary: Create journal entry
      tags: [agora-dashboard]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                tags: { type: array, items: { type: string } }
                persona_id: { type: string }
      responses:
        "201":
          description: Journal entry created
          content:
            application/json:
              schema: { type: object }

  /bff/agora/journal/{entry_id}:
    patch:
      operationId: updateJournalEntry
      summary: Update journal entry
      tags: [agora-dashboard]
      parameters:
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
                tags: { type: array, items: { type: string } }
      responses:
        "200":
          description: Journal entry updated
          content:
            application/json:
              schema: { type: object }
        "404": { description: Not found }


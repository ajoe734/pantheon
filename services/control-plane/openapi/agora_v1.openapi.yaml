      tags: [agora-trading]
      parameters:
        - $ref: "#/components/parameters/SignalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback_type]
              properties:
                feedback_type:
                  type: string
                  enum: [agree, disagree, partial, flag]
                rationale: { type: string }
                correction: { type: object }
      responses:
        "200":
          description: Feedback submitted
          content:
            application/json:
              schema: { type: object }


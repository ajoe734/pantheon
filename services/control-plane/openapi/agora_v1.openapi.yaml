      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback_type, subject]
              properties:
                feedback_type:
                  type: string
                  enum: [signal, decision, persona, strategy, market]
                subject: { type: object }
                content: { type: string }
                persona_id: { type: string }
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema: { type: object }


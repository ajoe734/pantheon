    "title": "Agora committee and memory owner views",
    "version": "1.14",
    "description": "AGORA-COMMITTEE-MEMORY-RESTORE-20261112. Thin owner forwarding; paper ceiling; no execution authority. Owner absence fails closed. AGORA-SHADOW-COMPARISON-OWNER-ROUTE-20261127 adds the trader's owner-scoped shadow comparison read."
  },

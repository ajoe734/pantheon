              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      },
      "OwnerView": {
        "type": "object",
        "required": [
          "status",
          "reason",
          "owner",
          "data",
          "fallback_used",
          "environment_ceiling",
          "execution_authority"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok",
              "unavailable"
            ]
          },
          "reason": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "owner": {
            "type": "string",
            "enum": [
              "consultation",
              "memory"
            ]
          },
          "data": {
            "oneOf": [
              {
                "type": "object"
              },
              {
                "type": "array",
                "items": {
                  "type": "object"
                }
              }
            ]
          },
          "fallback_used": {
            "const": false
          },
          "environment_ceiling": {
            "const": "paper"
          },
          "execution_authority": {
            "const": "none"
          }
        },
        "description": "data contains the owner record/list. Memory review data contains entries (typed hits), lesson_candidates and owner authz. No locally generated records."
      }
    },
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    }
  },

        "description": "PAPER-TRADER-BOOK-PROVISION-20261127: Reads the caller's single paper CapitalPool, active paper PersonaCapitalBinding, and active paper RuntimeBinding from the existing Capital and Runtime-Manager owners, including operator-configured starting capital and its source."
      }
    },

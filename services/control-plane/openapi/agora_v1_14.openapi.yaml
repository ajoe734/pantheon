        "x-business-owner": "agora+source-ingest",
        "description": "AGORA-SERVANT-DATA-TOOLS-20261127: agora-interaction-worker runs the turn with the fixed read-only tool set (market_bars, candidate_pool, candidate_ranking, broker_branch_flow, disclosures, news, my_decisions, my_journal, my_shadow, institutional_facts, propose_research), at most 4 tool rounds. Every number in the answer is a cited fact; numbers the model wrote are removed. Uncovered requests list the missing data. No persona or meeting is called."
      }
    },

        "description": "PAPER-TRADER-BOOK-PROVISION-20261127: On first paper use, ensures the caller's servant persona gets exactly one paper CapitalPool, one active paper PersonaCapitalBinding, and one active paper RuntimeBinding through the existing Capital and Runtime-Manager owners. Repeated calls are GET-first and idempotent. Rejects any canary or live stage before any owner write."
      }
    },
    "/bff/agora/trading-intents/{intent_id}/handoffs": {
      "post": {
        "tags": [
          "agora-trading"
        ],
        "summary": "Submit a governed handoff for a trader-confirmed intent (paper stage executes in the trader's paper book)",
        "operationId": "submit_trading_intent_handoff_bff_agora_trading_intents__intent_id__handoffs_post",
        "parameters": [
          {
            "name": "intent_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "If-Match",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Intent ETag or *"
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Write idempotency key"
          },
          {
            "name": "X-Request-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Request id"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/GovernedIntentHandoffV114"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Request-only handoff recorded (status queued). For requested_stage paper the record targets paper_execution and the paper execution lane writes its state back (accepted, rejected with a typed reason, filled, partially_filled). Agora routes no order.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/GovernedIntentHandoffReceipt"
                }
              }
            }
          },
          "401": {
            "description": "Admission denied."
          },
          "403": {
            "description": "Admission denied."
          },
          "404": {
            "description": "Intent not found for the caller."
          },
          "409": {
            "description": "Stage/type/queue mismatch, intent not draft, or the paper request is not executable (paper_intent_not_confirmed, paper_order_missing, paper_action_not_executable, paper_short_not_supported, paper_symbol_missing, paper_symbol_mismatch, paper_quantity_invalid, paper_limit_price_invalid)."
          },
          "422": {
            "description": "Validation Error (including the removed paper_validation_request handoff type and management_governance queue)."
          }
        },
        "x-business-owner": "paper_execution",
        "description": "AGORA-PAPER-INTENT-EXECUTION-20261127: stage table shadow -> shadow_start/shadow_research, paper -> paper_execution_request/paper_execution, canary and live -> promotion_review_request/promotion_review. A paper request carries the confirmed order (symbol, side from action, quantity in shares, optional limit) and the decision lock reference; the paper-signal-producer consumer validates owner, paper binding, risk and idempotency and executes it in the trader's own paper book through DecisionSignalProducer, at most 50 per trader per Taipei day. Canary and live stay request-only behind promotion review. Schema: specs/agora/v15/governed_intent_handoff.schema.json."
      }
    }
  },

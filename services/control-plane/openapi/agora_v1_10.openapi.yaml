openapi: "3.1.0"
info:
  title: Pantheon Agora API v1.10 Workshop Version Extension
  version: "1.10.0"
  description: |
    Additive durable Workshop version contract over the exact v1.9 bundle.
    StrategySpec JSON remains Registry-owned. Workshop persistence stores only
    immutable version identity, Registry reference, parent lineage, content
    digest, creator/time, and selected pointers. Legacy active Registry
    pointers are deterministically backfilled without advancing the ETag.

    Create and select are governed writes with tenant/user isolation,
    Idempotency-Key, authoritative readback, and If-Match CAS. These routes do
    not deploy, submit orders, bind runtime or capital, or promote lifecycle.
  x-extends-contract: "services/control-plane/specs/agora/bundle_index.v1_9.json"
  x-capability-manifest: "services/control-plane/specs/agora/v11/capability_manifest_v1_10.json"
  x-implementation-status: implemented
servers:
  - url: "{bff_base}"
    variables:
      bff_base:
        default: "https://pantheon-lupin-dev-bff.35.201.204.12.sslip.io"
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    WorkshopId:
      name: workshop_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    VersionId:
      name: version_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^W/"workshop:.+:v[0-9]+"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1}
    XRequestId:
      name: X-Request-Id
      in: header
      required: true
      schema: {type: string, minLength: 1}
    XMfaToken:
      name: X-MFA-Token
      in: header
      required: true
      schema: {type: string, minLength: 1}
    XTenantId:
      name: X-Tenant-Id
      in: header
      required: false
      schema: {type: string, minLength: 1}
  schemas:
    WorkshopVersionCreateRequest:
      $ref: "../specs/agora/v9/workshop_live_operations.schema.json#/definitions/WorkshopVersionCreateRequest"
    WorkshopVersionListEnvelope:
      $ref: "../specs/agora/v11/workshop_version_operations.schema.json#/definitions/WorkshopVersionListEnvelope"
    WorkshopVersionCreateEnvelope:
      $ref: "../specs/agora/v11/workshop_version_operations.schema.json#/definitions/WorkshopVersionCreateEnvelope"
    WorkshopVersionSelectEnvelope:
      $ref: "../specs/agora/v11/workshop_version_operations.schema.json#/definitions/WorkshopVersionSelectEnvelope"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object, additionalProperties: true}
      additionalProperties: false
  responses:
    BadRequest:
      description: Required command headers or request payload are invalid
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Unauthorized:
      description: Authentication or MFA proof is missing
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Forbidden:
      description: Role, tenant, user, or Strategy Registry scope is denied
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    NotFound:
      description: Workshop or workshop version is not visible in the actor scope
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Conflict:
      description: Stale ETag, idempotency mismatch, immutable digest mismatch, or projection conflict
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
paths:
  /bff/agora/workshops/{workshop_id}/versions:
    get:
      operationId: listDurableAgoraWorkshopVersions
      summary: List durable version links with authoritative StrategySpec readback
      x-implementation-status: implemented
      parameters:
        - {$ref: "#/components/parameters/WorkshopId"}
        - {$ref: "#/components/parameters/XTenantId"}
      responses:
        "200":
          description: Tenant/user-scoped version projection and current ETag
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkshopVersionListEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "502":
          description: Authoritative Strategy Registry readback is invalid
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "503":
          description: Strategy Registry or durable workshop store is unavailable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    post:
      operationId: createDurableAgoraWorkshopVersion
      summary: Create one immutable Registry version and durable Workshop link
      x-implementation-status: implemented
      parameters:
        - {$ref: "#/components/parameters/WorkshopId"}
        - {$ref: "#/components/parameters/XTenantId"}
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/XRequestId"}
        - {$ref: "#/components/parameters/XMfaToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkshopVersionCreateRequest"}
      responses:
        "201":
          description: Idempotent durable receipt, immutable link, and Registry readback
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkshopVersionCreateEnvelope"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /bff/agora/workshops/{workshop_id}/versions/{version_id}/select:
    post:
      operationId: selectDurableAgoraWorkshopVersion
      summary: Atomically select one workshop-owned immutable version
      x-implementation-status: implemented
      parameters:
        - {$ref: "#/components/parameters/WorkshopId"}
        - {$ref: "#/components/parameters/VersionId"}
        - {$ref: "#/components/parameters/XTenantId"}
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/XRequestId"}
        - {$ref: "#/components/parameters/XMfaToken"}
      responses:
        "200":
          description: Selected pointers, command receipt, and authoritative readback
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkshopVersionSelectEnvelope"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

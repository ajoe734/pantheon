schema_version: 1
purpose: "Human-readable ownership and removal contract for Pantheon components"

domains:
  development_tooling:
    authority: "canonical engineering tasks, dispatch intents, worker leases"
    product_runtime_required: false
    removable_after_product_release: true
    acceptance: "supervisor runtime health and task/lease evidence"
  product_runtime:
    authority: "business behavior, product data, and user-facing readiness"
    product_runtime_required: true
    removable_after_product_release: false
    acceptance: "live service readiness, product scenarios, and exact hosted identities"
  delivery:
    authority: "build, install, hosted identity, and deployment probes"
    product_runtime_required: false
    removable_after_product_release: false
    acceptance: "deployment manifest plus post-deploy probes"

runtime_roots:
  command_runtime:
    path: "<PANTHEON_DEPLOY_ROOT>/command-runtimes/<exact-commit-sha>"
    authority: "immutable supervisor source only"
    must_not_contain: ["runtime state", "queue", "approvals", "canonical projection"]
  coordination_root:
    path: "<PANTHEON_DEPLOY_ROOT>/coordination-root"
    authority: "development-tool canonical projection, leases, queue, approvals, and archive"
    required: ["Git worktree", "ai-status.json", ".orchestrator/"]
  staging_root:
    path: "<PANTHEON_DEPLOY_ROOT>/dev-root"
    authority: "mutable source staging only"
    must_not_be: ["supervisor command root", "coordination root", "product runtime cwd"]
  product_root:
    path: "<DEV_REMOTE_DIR>"
    authority: "product source only"
    must_not_contain: ["supervisor PID", "supervisor state", "task queue", "approval queue"]

components:
  - id: supervisor-and-taskstore
    domain: development_tooling
    paths:
      - .orchestrator/
      - scripts/ai_status.py
      - scripts/human-ops-status.sh
      - scripts/test_human_ops_status.py
      - AGENTS.md
      - scripts/component_boundary.py
      - scripts/test_component_boundary.py
      - scripts/check_config_drift.py
      - scripts/test_check_config_drift.py
      - scripts/promote_supervisor_runtime.py
      - scripts/test_promote_supervisor_runtime.py
      - scripts/test_status_command_runtime_pin.py
      # Retired tooling paths remain classified for deletion/history diffs.
      - scripts/request_execution_grant.py
      - scripts/test_request_execution_grant.py
      - deploy/execution-grant-issuer/
      - docs/operations/execution-grant-issuer.md
      - docs/operations/development-tooling-mfa-retirement.md
      - docs/operations/development-tooling-cleanup-20260911.md
      - docs/04/pantheon_first_release_closure_2026-09-06/EXECUTION_AUTHORIZATION_SA_SD.md
      - scripts/provision_live_supervisor_config.py
      - scripts/supervisor_runtime_health.py
      - scripts/supervisor_watchdog.py
      - scripts/supervisor_watchdog_*
      - scripts/approval_*
      - scripts/migrate_v2_runtime_queue.py
      - scripts/orchestrator_bundle.py
      - scripts/test_orchestrator_bundle.py
      - scripts/test_ai_status.py
      - scripts/dev/
      - scripts/test_supervisor_watchdog_install.py
      - scripts/test_supervisor_launch_ownership.py
      - docs-site/js/dashboard-*.js
      - docs/02-architecture/component-boundary.yaml
      - docs/02-architecture/development-tooling-product-boundary.md
      - docs/orchestrator-portability.md
      - docs/operations/provider-auth-health-contract.md
      - ai-task-archive/
    runtime_required: false
    removal_condition: "all engineering tasks archived and no worker/lease remains"

  - id: git-integration-authority
    domain: development_tooling
    paths:
      - scripts/git/
      - scripts/run-auto-integrator.sh
      - scripts/auto_integrator_install.py
      - scripts/test_run_auto_integrator.py
      - scripts/test_auto_integrator_install.py
      - docs/conventions/GIT_WORKFLOW.md
    runtime_required: false
    removal_condition: "auto-integrator merge lane is retired and no review-approved task remains"
    boundary: "sole merge-execution authority; excluded from every product container and deployment"

  - id: assistant-dev-bridge
    domain: development_tooling
    paths:
      - .orchestrator/development_bridge/
      - scripts/*assistant_dev_task_packet.py
      - docs/operations/management-ai-openclaw-dev-bridge.md
    runtime_required: false
    removal_condition: "no external development-task ingress is required"
    boundary: "local transport only; excluded from every product container and deployment"

  - id: business-bff-and-services
    domain: product_runtime
    paths:
      - services/control-plane/bff/
      - services/openclaw-gateway-adapter/
      - services/consultation/
      - services/evolution/
      - services/policy-learning/
      - services/research/
      - services/source_ingestion/
      - services/trade_journey/
    exclusions:
      - ".orchestrator/"
      - "ai-task-archive/"
    runtime_required: true
    removal_condition: never

  - id: hosted-frontend
    domain: product_runtime
    repository: ajoe734/execute-plans
    branch: dev
    runtime_required: true
    removal_condition: never

  - id: deployment-and-acceptance
    domain: delivery
    paths:
      - .github/workflows/
      - scripts/deploy_nonprod_vm.sh
      - scripts/run-acceptance.sh
      - scripts/test_run_acceptance.py
      - scripts/capture_dev_artifact_baseline.py
      - scripts/test_capture_dev_artifact_baseline.py
      - scripts/dev_release_artifact_driver.py
      - scripts/test_dev_release_artifact_driver.py
      - scripts/dev_release_artifacts.py
      - scripts/test_dev_release_artifacts.py
      - scripts/dev_remote_guarded_exec.py
      - scripts/test_dev_remote_guarded_exec.py
      - scripts/dev_vm_ssh.sh
      - scripts/test_dev_vm_ssh.py
      - scripts/gcp_dev_vm_migrate.sh
      - scripts/migrate_to_benjamin_cutover.sh
      - scripts/test_dev_direct_ssh_workflow_contract.py
      - scripts/test_dev_deploy_worktree_isolation_contract.py
      - scripts/test_probe_agora_hosted_service_journey.py
      - docs/deployment/vm-dev-staging-prod-management-plan.md
      - docs/deployment/nonprod-development-workflow.md
      - docs/frontend/execute-plans-dev-hosting.md
      - docs/remote-dev-gcp-vm.md
      - scripts/wait_for_bff_lifecycle_readiness.py
      - scripts/verify_hosted_scenarios.py
      - scripts/verify_e2e_fe_serving.py
    runtime_required: false
    removal_condition: "only after the product has a replacement delivery system"

cross_domain_contracts:
  - "development_tooling -> product_runtime: no runtime dependency"
  - "assistant-dev-bridge -> supervisor-and-taskstore: local task transport only"
  - "delivery -> product_runtime: exact source identity and live probes"
  - "product_runtime -> development_tooling: forbidden"

removal_order:
  - "archive/close development tasks and verify zero workers, leases, and queue intents"
  - "disable supervisor/watchdog and remove development-tooling paths"
  - "build and deploy product runtime without development-tooling paths"
  - "run product readiness and hosted identity acceptance again"

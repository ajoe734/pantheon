services:
  api-stub:
    image: pantheon-policy-learning-shadow-eval-scheduler:latest
    pull_policy: never
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        class Handler(BaseHTTPRequestHandler):
            def _reply(self, payload):
                body = json.dumps(payload, separators=(",", ":")).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def do_GET(self):
                self._reply({"status": "ok", "fixture": "isolated-restart-proof"})

            def do_POST(self):
                length = int(self.headers.get("Content-Length", "0"))
                self.rfile.read(length)
                self._reply(
                    {
                        "status": "error",
                        "detail": "isolated restart proof: no product write performed",
                    }
                )

            def log_message(self, _format, *_args):
                return

        ThreadingHTTPServer(("0.0.0.0", 18080), Handler).serve_forever()
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/', timeout=2).read()"
      interval: 1s
      timeout: 2s
      retries: 10
    networks:
      - proof

  worker:
    image: pantheon-policy-learning-shadow-eval-scheduler:latest
    pull_policy: never
    command:
      - python
      - services/policy-learning/scheduler_worker.py
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POLICY_LEARNING_API_URL: http://api-stub:18080
      SHADOW_EVAL_SCHEDULER_INTERVAL_SECONDS: "3600"
      SHADOW_EVAL_SCHEDULER_MAX_TICKS: "0"
      SHADOW_EVAL_TYPE: shadow
      POLICY_LEARNING_SERVICE_TOKEN: isolated-fixture-token
      POLICY_LEARNING_AGORA_TENANT_ID: isolated-fixture-tenant
      PANTHEON_PERSISTENCE_POSTURE: dev
    depends_on:
      api-stub:
        condition: service_healthy
    labels:
      pantheon.task_id: L12-MANIFEST-RESTART-PROOF-20260729
      pantheon.source_service: policy-learning-shadow-eval-scheduler
      pantheon.proof_scope: isolated-non-shared
    networks:
      - proof

networks:
  proof:
    internal: true

openapi: "3.1.0"
info:
  title: Pantheon Agora API v1.3 Design Delta
  version: "1.3.0-design"
  description: |
    Additive design delta over agora_v1_2.openapi.yaml.
    The implementation task must merge these routes and schemas into
    services/control-plane/openapi/agora_v1_3.openapi.yaml and produce
    bundle_index.v1_3.json. Existing v1/v1.1/v1.2 files remain immutable.
servers:
  - url: "{bff_base}"
    variables:
      bff_base:
        default: "https://pantheon-lupin-dev-bff.35.201.239.38.sslip.io"
security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  parameters:
    WorkshopId:
      name: workshop_id
      in: path
      required: true
      schema: { type: string }
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema: { type: string }
    PlanId:
      name: plan_id
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string }
    StrategyId:
      name: strategy_id
      in: path
      required: true
      schema: { type: string }
    DecisionEventId:
      name: decision_event_id
      in: path
      required: true
      schema: { type: string }
    IntentId:
      name: intent_id
      in: path
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
    XRequestId:
      name: X-Request-Id
      in: header
      required: true
      schema: { type: string }

  schemas:
    VersionPatchProposal:
      $ref: "../specs/agora/v4/version_patch_proposal.schema.json"
    VersionCompare:
      $ref: "../specs/agora/v4/version_compare.schema.json"
    StrategyReadinessAssessment:
      $ref: "../specs/agora/v4/strategy_readiness.schema.json"
    ResearchPlanExecution:
      $ref: "../specs/agora/v4/research_plan_execution.schema.json"
    ResearchRunProjection:
      $ref: "../specs/agora/v4/research_run_projection.schema.json"
    WorkshopStreamEvent:
      $ref: "../specs/agora/v4/workshop_stream_event.schema.json"
    TradingRoomAggregate:
      $ref: "../specs/agora/v4/trading_room_aggregate.schema.json"
    TradingDecisionEvent:
      $ref: "../specs/agora/v4/trading_decision_event.schema.json"
    GovernedIntentHandoff:
      $ref: "../specs/agora/v4/governed_intent_handoff.schema.json"
    WorkshopCard:
      $ref: "../specs/agora/v4/workshop_card.schema.json"

    CommandResponse:
      type: object
      required: [status, data, meta]
      properties:
        status:
          type: string
          enum: [accepted, queued, completed]
        data: {}
        meta:
          type: object
          additionalProperties: true

    DetailEnvelope:
      type: object
      required: [object_ref, status, allowedActions, meta, links, data]
      properties:
        object_ref:
          type: object
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
        status: { type: string }
        lifecycle_state: { type: string }
        allowedActions:
          type: object
          additionalProperties: { type: boolean }
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true
        data: {}
      additionalProperties: false

    ListEnvelope:
      type: object
      required: [items, page_info, meta]
      properties:
        items:
          type: array
          items: {}
        page_info:
          type: object
          required: [next_page_token, page_size, has_more]
          properties:
            next_page_token:
              type: [string, "null"]
            page_size:
              type: integer
            has_more:
              type: boolean
            total:
              type: integer
        meta:
          type: object
          additionalProperties: true
      additionalProperties: false

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true

paths:
  /bff/agora/workshops/{workshop_id}/patch-proposals:
    get:
      operationId: listWorkshopPatchProposals
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      responses:
        "200":
          description: Patch proposal list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelope" }
    post:
      operationId: createWorkshopPatchProposal
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionPatchProposal" }
      responses:
        "202":
          description: Proposal accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }
        "409":
          description: Concurrent modification or base mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /bff/agora/workshops/{workshop_id}/patch-proposals/{proposal_id}:
    get:
      operationId: getWorkshopPatchProposal
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: Patch proposal detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailEnvelope" }

  /bff/agora/workshops/{workshop_id}/patch-proposals/{proposal_id}/validate:
    post:
      operationId: validateWorkshopPatchProposal
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
        - $ref: "#/components/parameters/ProposalId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "202":
          description: Validation queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }

  /bff/agora/workshops/{workshop_id}/patch-proposals/{proposal_id}/accept:
    post:
      operationId: acceptWorkshopPatchProposal
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
        - $ref: "#/components/parameters/ProposalId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "202":
          description: New Registry draft/version creation queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }

  /bff/agora/workshops/{workshop_id}/patch-proposals/{proposal_id}/reject:
    post:
      operationId: rejectWorkshopPatchProposal
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
        - $ref: "#/components/parameters/ProposalId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Proposal rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }

  /bff/agora/workshops/{workshop_id}/version-comparisons:
    post:
      operationId: compareWorkshopVersions
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_version_id, candidate_version_ids]
              properties:
                base_version_id: { type: string }
                candidate_version_ids:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items: { type: string }
      responses:
        "200":
          description: Version comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionCompare" }

  /bff/agora/workshops/{workshop_id}/readiness:
    get:
      operationId: getWorkshopReadiness
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      responses:
        "200":
          description: Readiness assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyReadinessAssessment" }

  /bff/agora/workshops/{workshop_id}/readiness/reassess:
    post:
      operationId: reassessWorkshopReadiness
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "202":
          description: Reassessment queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }

  /bff/agora/workshops/{workshop_id}/cards:
    get:
      operationId: listWorkshopCards
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      responses:
        "200":
          description: Typed card projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelope" }

  /bff/agora/workshops/{workshop_id}/research-plans:
    get:
      operationId: listWorkshopResearchPlans
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      responses:
        "200":
          description: Research plan list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelope" }
    post:
      operationId: createWorkshopResearchPlan
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResearchPlanExecution" }
      responses:
        "201":
          description: Draft plan created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailEnvelope" }

  /bff/agora/research-plans/{plan_id}:
    get:
      operationId: getAgoraResearchPlan
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: Research plan detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailEnvelope" }

  /bff/agora/research-plans/{plan_id}/approve:
    post:
      operationId: approveAgoraResearchPlan
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Plan approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }

  /bff/agora/research-plans/{plan_id}/cancel:
    post:
      operationId: cancelAgoraResearchPlan
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Plan cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }

  /bff/agora/research-plans/{plan_id}/runs:
    get:
      operationId: listAgoraResearchPlanRuns
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelope" }
    post:
      operationId: dispatchAgoraResearchPlan
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "202":
          description: Run queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }

  /bff/agora/research-runs/{run_id}:
    get:
      operationId: getAgoraResearchRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchRunProjection" }

  /bff/agora/research-runs/{run_id}/cancel:
    post:
      operationId: cancelAgoraResearchRun
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "202":
          description: Cancellation queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }

  /bff/agora/research-runs/{run_id}/artifacts:
    get:
      operationId: listAgoraResearchRunArtifacts
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Artifact/evidence refs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelope" }

  /bff/agora/trading-room:
    get:
      operationId: getAgoraTradingRoom
      responses:
        "200":
          description: User-scoped Trading Room aggregate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradingRoomAggregate" }

  /bff/agora/trading-room/strategies/{strategy_id}:
    get:
      operationId: getAgoraTradingRoomStrategy
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      responses:
        "200":
          description: Strategy Trading Room detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailEnvelope" }

  /bff/agora/trading-room/decision-events:
    get:
      operationId: listAgoraTradingDecisionEvents
      parameters:
        - name: event_kind
          in: query
          schema:
            type: string
            enum: [entry, add, reduce, exit, review]
        - name: state
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Decision-event queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelope" }

  /bff/agora/trading-room/decision-events/{decision_event_id}:
    get:
      operationId: getAgoraTradingDecisionEvent
      parameters:
        - $ref: "#/components/parameters/DecisionEventId"
      responses:
        "200":
          description: Decision-event detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradingDecisionEvent" }

  /bff/agora/trading-room/decision-events/{decision_event_id}/decisions:
    post:
      operationId: decideAgoraTradingEvent
      parameters:
        - $ref: "#/components/parameters/DecisionEventId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject, defer, modify]
                rationale: { type: string }
                modifications:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Decision recorded; may create TradingIntent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }

  /bff/agora/trading-room/stream:
    get:
      operationId: streamAgoraTradingRoom
      responses:
        "200":
          description: Typed user-scoped Trading Room SSE
          content:
            text/event-stream:
              schema:
                type: string

  /bff/agora/trading-intents/{intent_id}:
    get:
      operationId: getAgoraTradingIntent
      parameters:
        - $ref: "#/components/parameters/IntentId"
      responses:
        "200":
          description: Intent detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailEnvelope" }

  /bff/agora/trading-intents/{intent_id}/handoffs:
    post:
      operationId: submitAgoraTradingIntentHandoff
      parameters:
        - $ref: "#/components/parameters/IntentId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernedIntentHandoff" }
      responses:
        "202":
          description: Request-only handoff submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }

  /bff/agora/trading-intents/{intent_id}/withdraw:
    post:
      operationId: withdrawAgoraTradingIntent
      parameters:
        - $ref: "#/components/parameters/IntentId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Intent/handoff withdrawal recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResponse" }

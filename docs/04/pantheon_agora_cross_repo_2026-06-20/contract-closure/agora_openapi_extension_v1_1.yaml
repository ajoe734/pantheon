openapi: 3.1.0
info:
  title: Pantheon Agora Contract Extension v1.1
  version: 1.1.0
  description: >-
    Additive contract extension over the immutable AG-XR-001 Agora v1 bundle.
    Defines servant, workshop and dynamic dashboard routes required by the
    cross-repo Agora SA/SD. This file must be merged into a generated full
    services/control-plane/openapi/agora_v1_1.openapi.yaml before dispatch.
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    WorkshopId:
      name: workshop_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    StrategyId:
      name: strategy_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    RecipeId:
      name: recipe_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    VersionId:
      name: version_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
  schemas:
    ServantEnsureRequest:
      type: object
      properties:
        display_name: {type: string}
        locale: {type: string}
        timezone: {type: string}
      additionalProperties: false
    WorkshopCreateRequest:
      type: object
      required: [initial_message]
      properties:
        title: {type: string}
        initial_message: {type: string, minLength: 1}
        strategy_spec_ref: {type: string}
        metadata: {type: object, additionalProperties: true}
      additionalProperties: false
    WorkshopMessageRequest:
      type: object
      required: [content]
      properties:
        content: {type: string, minLength: 1}
        attachment_refs:
          type: array
          items: {type: string}
      additionalProperties: false
    VersionCreateRequest:
      type: object
      required: [expected_workshop_version, patch]
      properties:
        expected_workshop_version: {type: integer, minimum: 1}
        patch: {type: object, additionalProperties: true}
        reason: {type: string}
      additionalProperties: false
    DashboardProposalRequest:
      type: object
      required: [strategy_version_id, workspace, phase]
      properties:
        strategy_version_id: {type: string, minLength: 1}
        workspace: {enum: [trading_room, strategy_workshop, strategy_performance]}
        phase: {enum: [candidate_review, monitoring, position_monitoring, post_trade_review]}
        instruction: {type: string}
      additionalProperties: false
    DashboardMutationRequest:
      type: object
      required: [expected_version, operations]
      properties:
        expected_version: {type: integer, minimum: 1}
        operations:
          type: array
          minItems: 1
          items:
            type: object
            required: [op]
            properties:
              op: {enum: [move_widget, resize_widget, remove_widget, add_registered_widget, replace_chart_spec, update_widget_query]}
              widget_id: {type: string}
              payload: {type: object, additionalProperties: true}
            additionalProperties: false
        reason: {type: string}
      additionalProperties: false
    DashboardAcceptRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 1}
        note: {type: string}
      additionalProperties: false
    DashboardRollbackRequest:
      type: object
      required: [expected_version, target_version]
      properties:
        expected_version: {type: integer, minimum: 1}
        target_version: {type: integer, minimum: 1}
        reason: {type: string}
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              enum: [AUTHZ_DENIED, OBJECT_NOT_FOUND, INVALID_REQUEST, INVALID_STATE, CONCURRENT_MODIFICATION, INVALID_PARAMS, CAPABILITY_UNAVAILABLE]
            message: {type: string}
            details: {type: object, additionalProperties: true}
          additionalProperties: false
      additionalProperties: false
paths:
  /bff/agora/servant:
    get:
      operationId: getAgoraServant
      tags: [agora-servant]
      responses:
        '200': {description: Current user-private servant profile}
        '404': {description: Servant not provisioned}
  /bff/agora/servant/ensure:
    post:
      operationId: ensureAgoraServant
      tags: [agora-servant]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServantEnsureRequest'}
      responses:
        '200': {description: Existing servant reconciled}
        '201': {description: New servant provisioned}
        '409': {description: Identity or provisioning conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /bff/agora/servant/reconcile:
    post:
      operationId: reconcileAgoraServant
      tags: [agora-servant]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Capability/workspace binding reconciled}

  /bff/agora/workshops:
    get:
      operationId: listAgoraWorkshops
      tags: [agora-workshop]
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: User-scoped workshop list}
    post:
      operationId: createAgoraWorkshop
      tags: [agora-workshop]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkshopCreateRequest'}
      responses:
        '201': {description: Workshop created}
  /bff/agora/workshops/{workshop_id}:
    get:
      operationId: getAgoraWorkshop
      tags: [agora-workshop]
      parameters:
        - $ref: '#/components/parameters/WorkshopId'
      responses:
        '200':
          description: Workshop aggregate
          headers:
            ETag: {schema: {type: string}}
        '404': {description: Not found}
  /bff/agora/workshops/{workshop_id}/messages:
    post:
      operationId: postAgoraWorkshopMessage
      tags: [agora-workshop]
      parameters:
        - $ref: '#/components/parameters/WorkshopId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkshopMessageRequest'}
      responses:
        '202': {description: Message accepted and workflow dispatched}
        '409': {description: Concurrent modification, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /bff/agora/workshops/{workshop_id}/events:
    get:
      operationId: listAgoraWorkshopEvents
      tags: [agora-workshop]
      parameters:
        - $ref: '#/components/parameters/WorkshopId'
        - {name: after_sequence, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: Ordered append-only events}
  /bff/agora/workshops/{workshop_id}/completeness:
    get:
      operationId: getAgoraWorkshopCompleteness
      tags: [agora-workshop]
      parameters:
        - $ref: '#/components/parameters/WorkshopId'
      responses:
        '200': {description: Latest completeness/conflict/next-question snapshot}
  /bff/agora/workshops/{workshop_id}/versions:
    get:
      operationId: listAgoraWorkshopVersions
      tags: [agora-workshop]
      parameters:
        - $ref: '#/components/parameters/WorkshopId'
      responses:
        '200': {description: StrategySpec draft versions}
    post:
      operationId: createAgoraWorkshopVersion
      tags: [agora-workshop]
      parameters:
        - $ref: '#/components/parameters/WorkshopId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VersionCreateRequest'}
      responses:
        '201': {description: Draft version created}
        '409': {description: Concurrent modification, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /bff/agora/workshops/{workshop_id}/versions/{version_id}/select:
    post:
      operationId: selectAgoraWorkshopVersion
      tags: [agora-workshop]
      parameters:
        - $ref: '#/components/parameters/WorkshopId'
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Version selected}
  /bff/agora/workshops/{workshop_id}/stream:
    get:
      operationId: streamAgoraWorkshop
      tags: [agora-workshop]
      parameters:
        - $ref: '#/components/parameters/WorkshopId'
        - {name: Last-Event-ID, in: header, schema: {type: string}}
      responses:
        '200':
          description: SSE workshop events
          content:
            text/event-stream: {schema: {type: string}}

  /bff/agora/strategies/{strategy_id}/dashboard-recipes:
    get:
      operationId: listDashboardRecipes
      tags: [agora-dashboard-v2]
      parameters:
        - $ref: '#/components/parameters/StrategyId'
        - {name: workspace, in: query, schema: {type: string}}
        - {name: phase, in: query, schema: {type: string}}
      responses:
        '200': {description: User-scoped recipe list}
  /bff/agora/strategies/{strategy_id}/dashboard-recipes/proposals:
    post:
      operationId: proposeDashboardRecipe
      tags: [agora-dashboard-v2]
      parameters:
        - $ref: '#/components/parameters/StrategyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DashboardProposalRequest'}
      responses:
        '201': {description: Proposal version created}
  /bff/agora/dashboard-recipes/{recipe_id}:
    get:
      operationId: getDashboardRecipe
      tags: [agora-dashboard-v2]
      parameters:
        - $ref: '#/components/parameters/RecipeId'
      responses:
        '200':
          description: Recipe detail
          headers:
            ETag: {schema: {type: string}}
  /bff/agora/dashboard-recipes/{recipe_id}/accept:
    post:
      operationId: acceptDashboardRecipe
      tags: [agora-dashboard-v2]
      parameters:
        - $ref: '#/components/parameters/RecipeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DashboardAcceptRequest'}
      responses:
        '200': {description: New active immutable version created}
        '409': {description: Concurrent modification, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /bff/agora/dashboard-recipes/{recipe_id}/layout:
    patch:
      operationId: patchDashboardRecipeLayout
      tags: [agora-dashboard-v2]
      parameters:
        - $ref: '#/components/parameters/RecipeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DashboardMutationRequest'}
      responses:
        '200': {description: New recipe version created}
        '409': {description: Concurrent modification, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /bff/agora/dashboard-recipes/{recipe_id}/rollback:
    post:
      operationId: rollbackDashboardRecipe
      tags: [agora-dashboard-v2]
      parameters:
        - $ref: '#/components/parameters/RecipeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DashboardRollbackRequest'}
      responses:
        '200': {description: New version copied from historical target}
  /bff/agora/dashboard-recipes/{recipe_id}/versions:
    get:
      operationId: listDashboardRecipeVersions
      tags: [agora-dashboard-v2]
      parameters:
        - $ref: '#/components/parameters/RecipeId'
      responses:
        '200': {description: Immutable version history}
  /bff/agora/widgets/validate:
    post:
      operationId: validateAgoraWidget
      tags: [agora-dashboard-v2]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './specs/agora/v2/widget_spec_v2.schema.json'}
      responses:
        '200': {description: Validation result}
        '422': {description: Invalid widget spec}

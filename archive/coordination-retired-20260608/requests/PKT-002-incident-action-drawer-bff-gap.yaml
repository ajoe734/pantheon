resolved: true
resolved_at: "2026-04-17T15:24:03Z"
resolved_by: Codex
resolution: >-
  Pantheon aligned POST /api/v1/operator/commands with the published PKT-002
  Runtime-targeted envelope. The BFF now accepts PauseExecution,
  IssueRiskOff, LiquidateAll, HardRollback, and IssueSafeMode without a legacy
  request.action field or UI-side shadow translation. Runtime-target routing is
  resolved after the command is queued so the published schema is accepted even
  when local runtime snapshots are thin; Pantheon-owned execution still uses
  explicit runtime/capital-pool context when it is available and records a
  failed receipt later if the runtime cannot be routed. Contract-ready and
  Lovable UI task packets were refreshed for the resumed front-end cycle.

summary: >-
  Pantheon re-opened the PKT-002 Incident Action Drawer BFF gap after
  validating the current front handoff against the local BFF. The read surface
  GET /api/v1/kill-switch/status still matches the published drawer envelope,
  but the write surface POST /api/v1/operator/commands still rejects the
  published PKT-002 request schema with HTTP 422. The current BFF request model
  remains on the older generic operator-command envelope, so the drawer cannot
  submit PauseExecution / IssueRiskOff / LiquidateAll / HardRollback /
  IssueSafeMode successfully without shadow translation in the UI.

missing:
  - endpoint: POST /api/v1/operator/commands
    field: request.command
    reason: >-
      Local OperatorCommand enum still only accepts ApproveDeployment,
      PauseRuntime, ExecuteRollback, ApproveRollback, RejectRollback,
      ActivateKillSwitch, ApproveEvolutionDecision, and
      ExecuteEvolutionAction. Direct TestClient requests with the published
      PKT-002 command names PauseExecution, IssueRiskOff, and HardRollback each
      return 422 before the command can be queued.
  - endpoint: POST /api/v1/operator/commands
    field: request.target.type
    reason: >-
      Local TargetObject enum still rejects target.type = Runtime and only
      accepts DeploymentPlan, RuntimeBinding, Rollback, KillSwitchOrder,
      EvolutionDecision, CapitalPool, or PersonaCapitalBinding. Direct PKT-002
      requests return 422 on the target type before execution.
  - endpoint: POST /api/v1/operator/commands
    field: request.action
    reason: >-
      The local OperatorCommand model still requires a separate action field,
      but the published PKT-002 contract intentionally omits action and uses a
      command-discriminated payload plus params. Direct PKT-002 requests return
      422 "Field required" for action.
  - endpoint: POST /api/v1/operator/commands
    field: request.params
    reason: >-
      Local validators and executors are still shaped around PauseRuntime /
      ExecuteRollback / ActivateKillSwitch params. Pantheon has not yet added
      request validation or execution paths for reduce_exposure_pct,
      target_artifact_id, safe_mode_level, or the empty LiquidateAll params
      contract used by PKT-002.

acceptance:
  - BFF accepts the published PKT-002 request schema for PauseExecution,
    IssueRiskOff, LiquidateAll, HardRollback, and IssueSafeMode at
    POST /api/v1/operator/commands without requiring UI-only translation.
  - BFF accepts target.type = Runtime for PKT-002 drawer commands, or provides
    an equivalent Pantheon-owned contract update and refreshed packet family.
  - BFF no longer requires a separate request.action field for PKT-002 drawer
    commands when the contract does not publish one.
  - Pantheon validates the repaired write surface locally with direct
    TestClient submissions for at least PauseExecution, IssueRiskOff, and
    HardRollback before republishing the next contract-ready packet.
  - Pantheon publishes updated contract-ready and lovable-ui-task packets after alignment
  - Lovable/front-end receives updated packets and resumes the implementation cycle


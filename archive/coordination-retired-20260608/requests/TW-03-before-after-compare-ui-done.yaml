  dbc4a16dc0e9f0b8d33e1576908341ea056c660d now pass
  `npm ci --legacy-peer-deps && npm run build`, and live OpenAPI plus
  operator-auth GET probes on http://127.0.0.1:18001 still return the
  published TW-03 preview route family with structured stale and
  `preview_unavailable` responses. The prior front publication-truth,
  build-integrity, and compare-validator blockers are resolved. A local
  Pantheon proof fixture still seeds `deadline_at = 2026-04-20T19:50:45Z`, so
  the pending-branch unit proof now resolves to `preview_unavailable` on
  2026-04-21; that is a non-blocking Pantheon test-maintenance caveat rather
  than a front-end gap.

summary: |
  Before/After Compare is implemented against the live TW-03 Pantheon preview route family:
  GET /api/v1/trainer/sessions/{session_id}/preview and
  POST /api/v1/trainer/sessions/{session_id}/preview. Metric deltas, warning hierarchy,
  control diff, refresh authority, polling semantics, preview_unavailable branch, and
  all four surface degradation states are driven exclusively by the backend preview response.
  No client-side preview math, warning inference, control-diff reconstruction, or polling
  heuristics were introduced.


implementation_notes:
  - Created src/pages/trainer/ParameterControlsTypes.ts with TrainerControl, accepted/rejected response shapes, and meta types.
  - Added trainerControlsBffApi namespace in src/lib/bffClient.ts with getControls/patchControls.
  - Replaced TrainerControls blocked-shell binding with the new ParameterControls page in App.tsx.
  - Patch button gated by allowedActions.canPatchControls AND status === 'active'.
  - Surface state ok/partial/degraded/unavailable handled via banners and panel suppression.
  - |-
      Patch flow:
      - dirtyKeys computed by shallow comparison vs current_value
      - submit posts only the dirty patches
      - accepted -> render diff.updated_controls table + warnings
      - rejected -> render error_code, message, field_errors verbatim
      - after either response, controls/draft re-seeded from current_controls
  - |-
      Input rendering uses control_type + allowed_range.kind:
      - boolean -> Switch
      - enum -> Select
      - number/integer -> numeric Input with step from allowed_range.step (no clamping)
      - other -> text Input
  - No client-side validation that preempts the backend; backend field_errors are the validation source of truth.

ux_decisions:
  - Range hint text under each control comes from allowed_range; we do NOT enforce it client-side.
  - '"Reset" reverts draft to BFF current_value.'
  - Refresh button re-fetches the controls payload.


blocking: false

summary: |
  Artifact Compare is implemented against the live RW-05 Pantheon route family
  through the shared artifactApi client. The registry forwards the canonical
  filter params, renders backend-owned artifact rows, and gates selection only
  from list-level allowedActions.canCompare; the detail route renders
  version_chain, provenance, metrics, parameters, and resolved lineage links
  directly from the BFF; and the compare route submits only selected
  artifact_ids and renders backend-composed field_pairs, change_summary, and
  provenance_pairs without browser-side diff logic. Pantheon's 2026-04-24
  contract refresh resolved the only blocking selector-authority gap, so this
  reviewed UI snapshot can now return as a truthful completion packet.


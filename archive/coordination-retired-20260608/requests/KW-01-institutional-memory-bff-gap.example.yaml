summary: Institutional Memory UI is blocked on missing or incorrect Pantheon BFF fields.

missing:
  - endpoint: GET /api/v1/knowledge/memory
    field: entries[].route_href
    reason: Memory row navigation must use the BFF-provided route_href and cannot be constructed client-side from raw entry_id values.
  - endpoint: GET /api/v1/knowledge/memory/{entry_id}
    field: meta.surfaces.source_context
    reason: The source event panel needs the published source_context degradation signal and cannot infer source health locally.

acceptance:
  - Pantheon publishes a refreshed KW-01 contract-ready packet
  - Lovable receives the next response packet through GitHub sync

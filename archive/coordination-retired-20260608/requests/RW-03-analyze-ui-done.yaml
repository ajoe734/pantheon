summary: |
  Research Analyze is implemented against the live RW-03 Pantheon routes
  through rw03AnalyzeApi. The list route sends only the published query params,
  renders backend-owned summary rows and metric_group_refs, preserves backend
  pagination through page_token, and uses links.workbench_detail plus
  links.linked_ticket_detail for drilldown. The detail route renders summary,
  metric_groups, and comparative_summary exactly as returned, preserves the
  backend metric-group order, separates OBJECT_NOT_FOUND from route-not-live
  behavior, and never computes local metric grouping or diff logic in the
  browser.


feature_id: KW-01-institutional-memory
type: contract-ready
source_repo: ajoe734/pantheon
screen: institutional-memory
status: published
published_at: "2026-04-19T00:00:00Z"
task: KW-01-FOUNDATION-001
description: >-
  KW-01 Institutional Memory browse contract was published as part of
  KW-01-FOUNDATION-001 and is now revalidated against the live Pantheon BFF.
  The list route (GET /api/v1/knowledge/memory), detail route
  (GET /api/v1/knowledge/memory/{entry_id}), BFF-owned browse projection,
  lifecycle state machine (active → archived → superseded), identity semantics
  (entry_id as downstream anchor), filter vocab (knowledge_type, scope,
  scope_filter, tags), meta.surfaces staleness signals (memory_list,
  entry_detail, source_context), and frontend handoff bundle remain aligned
  with the current implementation. Pantheon has verified both read routes live
  in the current BFF workspace, so the frontend production UI lane may resume
  against this handoff bundle.
artifacts:
  bff_contract: docs/bff/KW-01-institutional-memory.md
  screen_spec: docs/screens/KW-01-institutional-memory.md
  example_payload: docs/examples/KW-01-institutional-memory.json
  lovable_ui_task: .coordination/responses/KW-01-institutional-memory-lovable-ui-task.yaml
  frontend_change_spec: docs/pantheon-handoffs/KW-01-institutional-memory/FRONTEND_CHANGE_SPEC.md
endpoints:
  - GET /api/v1/knowledge/memory
  - GET /api/v1/knowledge/memory/{entry_id}
target_repo: ajoe734/front-ai-trading-system
handoff_bundle:
  - contract_ready
  - lovable_ui_task
  - example_payload
readiness_gate: >-
  Frontend may proceed with production UI against the live BFF routes:
  (1) GET /api/v1/knowledge/memory returns the published list field shape, and
  (2) GET /api/v1/knowledge/memory/{entry_id} returns the published detail
  shape. If a live runtime payload diverges from this synced contract during
  implementation, stop and emit the canonical KW-01 bff-gap handoff instead of
  mocking or inventing fields.
front_actions_required:
  - fetch memory list from GET /api/v1/knowledge/memory with filter query params only
  - fetch memory detail from GET /api/v1/knowledge/memory/{entry_id} only
  - use route_href from BFF list rows for navigation; do not construct URLs from raw entry_id
  - use source_event.href from BFF detail for source links; do not construct URLs from type and id
  - show non-dismissable PKT-005 degradation banner when meta.surfaces.memory_list is degraded or unavailable
  - show non-dismissable PKT-005 degradation banner when meta.surfaces.entry_detail is degraded or unavailable
  - show degradation indicator on source event panel when meta.surfaces.source_context is degraded or unavailable
  - display superseded entries with a visual indicator; do not hide them
  - do not filter, sort, rank, or invent filter vocab client-side
  - do not expose any create, archive, supersede, or update actions
acceptance_met:
  contract_ready_published: true
  bff_route_list_live: true
  bff_route_detail_live: true
  lovable_ui_task_published: true
  front_repo_receives_handoff_bundle: true

summary: >-
  Pantheon re-reviewed the returned RW-01 ui-done and frontend-feedback bundle
  against the published Research Ticket contract, canonical example payload,
  the sibling front implementation, and the live operator-bff runtime. The
  current remote head 93a4b58891031442133a6966d0354ae216a80b72 on
  origin/pkt-004-detail-fix is replayable and contains the canonical RW-01
  request pair plus feedback bundle. The reviewed UI still routes through
  rw01TicketApi only, renders lifecycle history from lifecycle_history[],
  keeps close and archive on explicit allowedActions-owned CTAs, uses
  backend-provided persona identities for owner selection, and preserves
  linked experiments and artifacts as read-only refs. Pantheon refreshed the
  stale RW-01 contract-test expectation caused by the seeded KW-02-linked
  closed ticket, then reran
  `python3 -m pytest services/control-plane/bff/test_rw01_research_ticket_contract.py -q`
  (`6 passed`). The active runtime at http://127.0.0.1:18001 now exposes
  POST/GET on `/api/v1/research/tickets` and GET/PATCH on
  `/api/v1/research/tickets/{ticket_id}`, authenticated live HTTP list/detail
  probes return 200 with truthful degraded envelopes, and a workspace-backed
  HTTP probe with `BFF_READ_SURFACE_STATE=unavailable` returns truthful
  unavailable list/detail envelopes for the same routes. No RW-01 contract gap
  remains.


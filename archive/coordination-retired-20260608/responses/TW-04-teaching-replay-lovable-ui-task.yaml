- POST /api/v1/trainer/sessions/{session_id}/commit
- POST /api/v1/trainer/sessions/{session_id}/discard
constraints:
- use existing bff client only
- do not add raw fetch in components
- do not import demo providers
- if any required field is missing, emit a bff-gap handoff instead of mocking
acceptance:
- list replayable sessions from GET /api/v1/trainer/replay with persona_id (required),
  status, pagination params
- render replay detail from GET /api/v1/trainer/replay/{session_id}
- render ordered TeachingEvent[] timeline from the detail response events[] array
- submit commit through POST /api/v1/trainer/sessions/{session_id}/commit via the
  existing BFF client action layer only
- submit discard through POST /api/v1/trainer/sessions/{session_id}/discard via the
  existing BFF client action layer only
- surface commit/discard CTAs only when allowedActions.canCommit / allowedActions.canDiscard
  is true
- resolve evidence links from BFF-provided `event.evidence_ref` objects — do not construct
  them client-side
- render replay_resolution.state correctly (pending_decision / committed / discarded
  / not_applicable)
- emit a bff-gap handoff if any required field is absent

description: >-
  TW-03 Before/After Compare contract and BFF preview route family are live.
  The preview read route (GET /api/v1/trainer/sessions/{session_id}/preview),
  manual refresh route (POST /api/v1/trainer/sessions/{session_id}/preview),
  backend-authored warning hierarchy, preview_unavailable degraded branch,
  polling contract, and frontend handoff bundle are aligned with the current
  Pantheon implementation. Lovable UI work may start. Depends on TW-01 for
  trainer-session identity and lifecycle semantics, and on the shared
  backend-owned control diff semantics published for TW-02.
artifacts:
  bff_contract: docs/bff/TW-03-before-after-compare.md
  screen_spec: docs/screens/TW-03-before-after-compare.md
  example_payload: docs/examples/TW-03-before-after-compare.json
  lovable_ui_task: .coordination/responses/TW-03-before-after-compare-lovable-ui-task.yaml
  frontend_change_spec: docs/pantheon-handoffs/TW-03-before-after-compare/FRONTEND_CHANGE_SPEC.md
endpoints:
  - GET /api/v1/trainer/sessions/{session_id}/preview
  - POST /api/v1/trainer/sessions/{session_id}/preview
target_repo: ajoe734/front-ai-trading-system
handoff_bundle:
  - contract_ready
  - lovable_ui_task
dependencies:
  - TW-01-FOUNDATION-001
  - TW-02-CONTROLS-001
readiness_gate: >-
  BFF preview read/refresh routes confirmed live at 2026-04-21T06:22:46Z. The
  live payload returns the published compare field shape, warning hierarchy,
  preview_unavailable degraded branch, polling contract, and
  meta.surfaces.trainer_preview signal. Frontend may begin production
  implementation. Refresh CTA visibility must follow
  allowedActions.canRefreshPreview, and polling must use only GET preview with
  eval_id while status remains pending.
front_actions_required:
  - render compare header, summary, metric deltas, warning hierarchy, and control diff from GET /api/v1/trainer/sessions/{session_id}/preview
  - call POST /api/v1/trainer/sessions/{session_id}/preview only for manual refresh with refresh_mode = manual
  - poll only GET /api/v1/trainer/sessions/{session_id}/preview?eval_id={eval_id} while status = pending and polling.enabled = true
  - stop polling when status resolves, deadline_at passes, or meta.surfaces.trainer_preview becomes degraded or unavailable
  - surface refresh CTA only when allowedActions.canRefreshPreview is true
  - render preview_unavailable as explicit degraded compare copy, not as loading
  - preserve backend ordering for warnings[] and backend-provided warning_count_by_level summary
  - emit a bff-gap handoff if any required field is absent
acceptance_met:
  contract_ready_published: true
  bff_preview_get_route_live: true

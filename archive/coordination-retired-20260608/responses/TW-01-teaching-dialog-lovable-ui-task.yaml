feature_id: TW-01-teaching-dialog
type: lovable-ui-task
project: ajoe734/front-ai-trading-system
status: ready
pantheon_pr: null
base_url: null
workbench: trainer-workbench
screen: teaching-dialog
screen_id: screen-teaching-dialog
ui_spec_path: docs/screens/TW-01-teaching-dialog.md
frontend_change_spec_path: docs/pantheon-handoffs/TW-01-teaching-dialog/FRONTEND_CHANGE_SPEC.md
allowed_endpoints:
- POST /api/v1/trainer/sessions
- GET /api/v1/trainer/sessions
- GET /api/v1/trainer/sessions/{session_id}
- POST /api/v1/trainer/sessions/{session_id}/message
constraints:
- use existing bff client only
- do not add raw fetch in components
- do not import demo providers
- if any required field is missing, emit a bff-gap handoff instead of mocking
acceptance:
- remove the pending-BFF placeholder from /trainer/sessions and /trainer/sessions/:session_id
  now that Pantheon has confirmed the TW-01 routes live
- create sessions through POST /api/v1/trainer/sessions only
- fetch trainer-session list from GET /api/v1/trainer/sessions only
- fetch trainer-session detail and transcript from GET /api/v1/trainer/sessions/{session_id}
  only
- send coaching messages through POST /api/v1/trainer/sessions/{session_id}/message
  only
- preserve the full published create shape, including optional context_refs[] when
  the operator supplies them
- render transcript rows from backend TeachingEvent objects only; do not create local
  optimistic transcript state
- use links.workbench_detail from the BFF for navigation when present
- gate the message composer by allowedActions.canSendMessage only
- do not substitute Persona teaching-history responses for Trainer dialog routes
- show the non-dismissable PKT-005 degradation banner when meta.surfaces.trainer_dialog
  is degraded or unavailable
- do not expose pause, complete, or abandon CTAs until a later Trainer packet publishes
  those write routes
- publish ui-done and frontend-feedback from one Git-visible commit that contains
  the TW-01 request pair, feedback bundle, and final UI files
- emit a bff-gap handoff if any required field is absent
required_feedback:
- docs/pantheon-feedback/TW-01-teaching-dialog/LOVABLE_CHANGE_FEEDBACK.md

  policy-learning-svc:
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: services/policy-learning/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8100"
      POLICY_LEARNING_DATA_DIR: /data/policy-learning
      POLICY_LEARNING_ENABLE_PRODUCTION_ADAPTERS: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_PERSISTENCE_POSTURE: ${PANTHEON_PERSISTENCE_POSTURE:-dev}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_S3_ACCESS_KEY: ${PANTHEON_S3_ACCESS_KEY:-pantheon}
      PANTHEON_S3_SECRET_KEY: ${PANTHEON_S3_SECRET_KEY:-pantheonminio}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
      POLICY_LEARNING_STORE_BACKEND: ${POLICY_LEARNING_STORE_BACKEND:-json}
      POLICY_LEARNING_STORE_DSN: ${POLICY_LEARNING_STORE_DSN:-}
      # Imitation-loop inbound authority (L12-IMIT-001).  The direct
      # shadow-eval / worker routes are authenticated and tenant-bound, so the
      # API and the scheduler sidecar below must share one credential and one
      # tenant scope or every tick is a 401.  The default is a well-known
      # local-cluster value that `inbound_authority.py` refuses once
      # PANTHEON_PERSISTENCE_POSTURE is staging or prod; a real deployment
      # supplies its own POLICY_LEARNING_SERVICE_TOKEN.
      POLICY_LEARNING_SERVICE_TOKEN: ${POLICY_LEARNING_SERVICE_TOKEN:-pantheon-local-policy-learning-service}
      POLICY_LEARNING_SERVICE_TENANTS: ${POLICY_LEARNING_SERVICE_TENANTS:-${POLICY_LEARNING_AGORA_TENANT_ID:-pantheon-local}}
      POLICY_LEARNING_AGORA_TENANT_ID: ${POLICY_LEARNING_AGORA_TENANT_ID:-pantheon-local}
      POLICY_LEARNING_AGORA_USER_ID: ${POLICY_LEARNING_AGORA_USER_ID:-}
      # Agora DatasetVersion authority (owned by L12-AGORA-001).  Unset means
      # "follow DATABASE_URL"; set these to read through a dedicated Agora
      # read role instead of the shared application identity.
      AGORA_DATASET_STORE_BACKEND: ${AGORA_DATASET_STORE_BACKEND:-}
      AGORA_DATASET_STORE_DSN: ${AGORA_DATASET_STORE_DSN:-}
      AGORA_DATASET_STORE_SCHEMA: ${AGORA_DATASET_STORE_SCHEMA:-agora}
    volumes:
      - policy-learning-data:/data/policy-learning
    ports:
      - "${POLICY_LEARNING_PORT:-18100}:8100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; port=os.environ.get('PORT','8100'); urllib.request.urlopen(f'http://127.0.0.1:{port}/readyz', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  policy-learning-shadow-eval-scheduler:
    # Default-on. This is the human-imitation shadow-evaluation loop worker;
    # leaving it behind an opt-in profile meant the loop never ticked on a
    # normal deploy. It performs no external egress: it authenticates to the
    # in-stack policy-learning API with the same service token and tenant
    # scope as that API authorizes.
    build:
      context: .
      dockerfile: services/policy-learning/Dockerfile
    command: ["python", "services/policy-learning/scheduler_worker.py"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POLICY_LEARNING_API_URL: http://policy-learning-svc:8100
      AGORA_BFF_URL: http://operator-bff:8001
      RESEARCH_SERVICE_URL: http://research-orchestrator-svc:8101
      SHADOW_EVAL_SCHEDULER_INTERVAL_SECONDS: ${SHADOW_EVAL_SCHEDULER_INTERVAL_SECONDS:-3600}
      SHADOW_EVAL_SCHEDULER_MAX_TICKS: ${SHADOW_EVAL_SCHEDULER_MAX_TICKS:-0}
      SHADOW_EVAL_TYPE: ${SHADOW_EVAL_TYPE:-shadow}
      SHADOW_EVAL_MAX_DATASETS: ${SHADOW_EVAL_MAX_DATASETS:-}
      SHADOW_EVAL_SCHEDULER_HEALTH_FILE: ${SHADOW_EVAL_SCHEDULER_HEALTH_FILE:-/tmp/policy-learning-shadow-eval-scheduler-health.json}
      # Same credential and same tenant scope as policy-learning-svc above.
      # The scheduler presents this token as `Authorization: Bearer` and the
      # tenant as `X-Tenant-Id`; both must resolve to the same values the API
      # authorizes, so they are interpolated from the same variables.
      PANTHEON_PERSISTENCE_POSTURE: ${PANTHEON_PERSISTENCE_POSTURE:-dev}
      POLICY_LEARNING_SERVICE_TOKEN: ${POLICY_LEARNING_SERVICE_TOKEN:-pantheon-local-policy-learning-service}
      # This second credential is intentionally distinct: it can drain the
      # operator-BFF handoff store but cannot call policy-learning APIs.
      AGORA_HANDOFF_SERVICE_TOKEN: ${AGORA_HANDOFF_SERVICE_TOKEN:-pantheon-local-agora-handoff-service-token}
      POLICY_LEARNING_AGORA_TENANT_ID: ${POLICY_LEARNING_AGORA_TENANT_ID:-pantheon-local}
      POLICY_LEARNING_AGORA_USER_ID: ${POLICY_LEARNING_AGORA_USER_ID:-}
    depends_on:
      policy-learning-svc:
        condition: service_healthy
      operator-bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "services/policy-learning/scheduler_worker.py", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 180s

  research-orchestrator-svc:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pantheon}
      PANTHEON_APP_DB_USER: ${PANTHEON_APP_DB_USER:-pantheon_app}
      PANTHEON_APP_DB_PASSWORD: ${PANTHEON_APP_DB_PASSWORD:-pantheon_app}
      PANTHEON_APP_DB_NAME: ${PANTHEON_APP_DB_NAME:-pantheon}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pantheon}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pantheon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pantheonminio}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pantheon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pantheonminio}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-pantheon-artifacts}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
        mc mb --ignore-existing \"local/$$MINIO_DEFAULT_BUCKETS\" &&
        echo 'Bucket ready: '\"$$MINIO_DEFAULT_BUCKETS\"
      "
    restart: on-failure

  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--http_port", "8222", "--store_dir", "/data/jetstream"]
    volumes:
      - nats-data:/data/jetstream
    ports:
      - "${NATS_PORT:-14222}:4222"
      - "${NATS_MONITOR_PORT:-18222}:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  signal-store:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  search-svc:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    environment:
      PORT: "8098"
      SEARCH_DATA_DIR: /data/search
      SEARCH_INDEX_STORE_PATH: /data/search/search-index.jsonl
    volumes:
      - search-data:/data/search
    ports:
      - "${SEARCH_PORT:-18098}:8098"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; port=os.environ.get('PORT','8098'); urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s


  policy-learning-svc:
    build:
      context: .
      dockerfile: services/policy-learning/Dockerfile
    environment:
      PORT: "8100"
      POLICY_LEARNING_DATA_DIR: /data/policy-learning
      POLICY_LEARNING_ENABLE_PRODUCTION_ADAPTERS: "false"
    volumes:
      - policy-learning-data:/data/policy-learning
    ports:
      - "${POLICY_LEARNING_PORT:-18100}:8100"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; port=os.environ.get('PORT','8100'); urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  openclaw-gateway:
    profiles: ["openclaw"]
    image: ghcr.io/openclaw/openclaw:2026.4.7
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-pantheon-local-token}
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--allow-unconfigured",
        "--port",
        "18789",
        "--auth",
        "token",
        "--token",
        "${OPENCLAW_GATEWAY_TOKEN:-pantheon-local-token}",
      ]
    volumes:
      - openclaw-data:/home/node/.openclaw
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  runtime-manager:
    build:
      context: .
      dockerfile: services/runtime-manager/Dockerfile
    environment:
      PORT: "8081"
      PANTHEON_RUNTIME_BINDING_STORE_PATH: /data/runtime/runtime_bindings.json
      PANTHEON_COMMAND_STATE_FILE: /data/runtime/internal_api_commands.json
      PANTHEON_RUNTIME_CONSULTATION_DATA_DIR: /data/runtime/consultation
      # ApproveDeployment routes to the deployment service plan-status API.
      # Governance ApprovalDecision lookups use a separate approval-service URL
      # for audit cross-references; the runtime-manager itself does not write
      # to the governance service from this path.
      PANTHEON_DEPLOYMENT_API_URL: http://deployment:8095
      PANTHEON_GOVERNANCE_APPROVAL_API_URL: http://governance:8082
    volumes:
      - runtime-data:/data/runtime
    # Note: deployment/governance are not declared as `depends_on` because
    # runtime-manager's primary contract (runtime CRUD, kill-switch) does not
    # require them at boot. ApproveDeployment requests fail cleanly with
    # DEPLOYMENT_API_UNAVAILABLE if the deployment service is unreachable.
    ports:
      - "18081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  governance:
    build:
      context: .
      dockerfile: services/governance/Dockerfile
    environment:
      PORT: "8082"
      GOVERNANCE_DATA_DIR: /data/governance
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
    volumes:
      - governance-data:/data/governance
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "18082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  telemetry:
    build:
      context: .
      dockerfile: services/telemetry/Dockerfile
    environment:
      PORT: "8083"
      TELEMETRY_STORAGE_DIR: /data/telemetry
      TELEMETRY_DB_DSN: ${TELEMETRY_DB_DSN:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_RUNTIME_MANAGER_URL: http://runtime-manager:8081
      PANTHEON_RUNTIME_MANAGER_TOKEN: runtime-control-internal
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
    volumes:
      - telemetry-data:/data/telemetry
    depends_on:
      runtime-manager:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "18083:8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  incidents:
    build:
      context: .
      dockerfile: services/incidents/Dockerfile
    environment:
      PORT: "8090"
      INCIDENTS_DATA_DIR: /data/incidents
      PANTHEON_RUNTIME_MANAGER_URL: http://runtime-manager:8081
      PANTHEON_RUNTIME_MANAGER_TOKEN: runtime-control-internal
      PANTHEON_TELEMETRY_URL: http://telemetry:8083
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
    volumes:
      - incident-data:/data/incidents
    depends_on:
      runtime-manager:
        condition: service_healthy
      telemetry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "18090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  postmortems:
    build:
      context: .
      dockerfile: services/postmortems/Dockerfile
    environment:
      PORT: "8091"
      POSTMORTEMS_DATA_DIR: /data/incidents
      INCIDENTS_DATA_DIR: /data/incidents
      PANTHEON_RUNTIME_MANAGER_URL: http://runtime-manager:8081
      PANTHEON_RUNTIME_MANAGER_TOKEN: runtime-control-internal
      PANTHEON_TELEMETRY_URL: http://telemetry:8083
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
    volumes:
      - incident-data:/data/incidents
    depends_on:
      incidents:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "18091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  operator-bff:
    build:
      context: .
      dockerfile: services/control-plane/bff/Dockerfile
    environment:
      BFF_DATA_DIR: /data/bff
      BFF_READ_SURFACE_STATE: fresh
      PANTHEON_BFF_ALLOW_LOCAL_SNAPSHOT_FALLBACK: "false"
      PANTHEON_BFF_SERVICE_TIMEOUT_SECONDS: "2.0"
      PANTHEON_INTERNAL_API_URL: http://runtime-manager:8081
      PANTHEON_RUNTIME_MANAGER_URL: http://runtime-manager:8081
      PANTHEON_RUNTIME_MANAGER_TOKEN: runtime-control-internal
      PANTHEON_GOVERNANCE_APPROVAL_API_URL: http://governance:8082
      PANTHEON_DEPLOYMENT_API_URL: http://deployment:8095
      PANTHEON_CAPITAL_API_URL: http://capital:8092
      PANTHEON_EVOLUTION_API_URL: http://evolution:8093
      PANTHEON_INCIDENTS_API_URL: http://incidents:8090
      PANTHEON_POSTMORTEMS_API_URL: http://postmortems:8091
      PANTHEON_TELEMETRY_API_URL: http://telemetry:8083
      PANTHEON_LINEAGE_READ_URL: http://lineage-read:8094
      PANTHEON_SEARCH_API_URL: http://search-svc:8098
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
    volumes:
      - bff-data:/data/bff
      - governance-data:/data/governance:ro
      - runtime-data:/data/runtime:ro
      - incident-data:/data/incidents:ro
    depends_on:
      search-svc:
        condition: service_healthy
      governance:
        condition: service_healthy
      runtime-manager:
        condition: service_healthy
      deployment:
        condition: service_healthy
      capital:
        condition: service_healthy
      evolution:
        condition: service_healthy
      incidents:
        condition: service_healthy
      postmortems:
        condition: service_healthy
      telemetry:
        condition: service_healthy
      lineage-read:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "18001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  persona:
    build:
      context: .
      dockerfile: services/control-plane/persona/Dockerfile
    environment:
      PORT: "8002"
      PANTHEON_BFF_URL: http://operator-bff:8001
      PANTHEON_REGISTRY_URL: http://registry:8087
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
    depends_on:
      operator-bff:
        condition: service_healthy
      registry:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "18002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  router:
    build:
      context: services/control-plane/router
      dockerfile: Dockerfile
    environment:
      PORT: "8001"
      PERSONA_URL: http://persona:8002
    depends_on:
      persona:
        condition: service_healthy
      operator-bff:
        condition: service_healthy
      governance:
        condition: service_healthy
    ports:
      - "18003:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  evaluation:
    build:
      context: .
      dockerfile: services/evaluation/Dockerfile
    environment:
      PORT: "8084"
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "18084:8084"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  feedback:
    build:
      context: .
      dockerfile: services/control-plane/feedback/Dockerfile
    environment:
      PORT: "8085"
      TRADER_FEEDBACK_STORE_PATH: /data/feedback/trader_feedback_events.jsonl
    volumes:
      - feedback-data:/data/feedback
    ports:
      - "18085:8085"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  memory:
    build:
      context: .
      dockerfile: services/memory/Dockerfile
    environment:
      PORT: "8086"
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "18086:8086"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  registry:
    build:
      context: .
      dockerfile: services/registry/Dockerfile
    environment:
      PORT: "8087"
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_S3_ACCESS_KEY: ${PANTHEON_S3_ACCESS_KEY:-pantheon}
      PANTHEON_S3_SECRET_KEY: ${PANTHEON_S3_SECRET_KEY:-pantheonminio}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "18087:8087"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  optimizer-svc:
    build:
      context: .
      dockerfile: services/optimizer-svc/Dockerfile
    environment:
      PORT: "8088"
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "18088:8088"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  promotion:
    build:
      context: .
      dockerfile: services/promotion/Dockerfile
    environment:
      PORT: "8089"
      PROMOTION_DATA_DIR: /data/promotion
    volumes:
      - promotion-data:/data/promotion
    ports:
      - "18089:8089"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  capital:
    build:
      context: .
      dockerfile: services/capital/Dockerfile
    environment:
      PORT: "8092"
      CAPITAL_DATA_DIR: /data/capital
    volumes:
      - capital-data:/data/capital
    ports:
      - "18092:8092"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  deployment:
    build:
      context: .
      dockerfile: services/deployment/Dockerfile
    environment:
      PORT: "8095"
      DEPLOYMENT_DATA_DIR: /data/governance
      PANTHEON_GOVERNANCE_DATA_DIR: /data/governance
    volumes:
      - governance-data:/data/governance
    depends_on:
      governance:
        condition: service_healthy
    ports:
      - "18095:8095"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  evolution:
    build:
      context: .
      dockerfile: services/evolution/Dockerfile
    environment:
      PORT: "8093"
      EVOLUTION_DATA_DIR: /data/evolution
      INCIDENT_DATA_DIR: /data/incidents
    volumes:
      - evolution-data:/data/evolution
      - incident-data:/data/incidents
    depends_on:
      runtime-manager:
        condition: service_healthy
      governance:
        condition: service_healthy
    ports:
      - "18093:8093"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  lineage-read:
    build:
      context: .
      dockerfile: services/lineage-read/Dockerfile
    environment:
      PORT: "8094"
      LINEAGE_DATA_DIR: /data/lineage
    volumes:
      - lineage-data:/data/lineage
    ports:
      - "18094:8094"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  smoke-stack:
    profiles: ["smoke"]
    build:
      context: .

      PANTHEON_LIVE_BROKER_ENABLED: "false"
    command: ["python", "scripts/smoke_openclaw_activation_ready_e2e.py"]
    restart: "no"

  # ===========================================================================
  # Source/search bounded CI smoke — disabled by default.
  #
  # Run:
  #   docker compose --profile source-search-bounded run --rm --use-aliases source-search-bounded-smoke
  #
  # The smoke verifies configured static_records and guarded external_feed
  # connectors, DLQ/frontier/audit replay, incremental search refresh, and no
  # unrestricted crawler mode.
  # ===========================================================================

  source-search-bounded-smoke:
    profiles: ["source-search-bounded"]
    build:
      context: .
      dockerfile: Dockerfile.smoke
    environment:
      SOURCE_INGEST_URL: http://source-ingest:8097
      SEARCH_URL: http://search-svc:8098
      SOURCE_INGEST_EXTERNAL_FEED_HOST: source-search-bounded-smoke
    depends_on:
      source-ingest:
        condition: service_healthy
      search-svc:
        condition: service_healthy
    command: ["python", "scripts/smoke_source_search_bounded.py"]
    restart: "no"

  # ===========================================================================
  # Dormant OSS deferred-prep smoke profiles — activation-gated; not started by default
  #
  # Run a single service:
  #   docker compose --profile dormant-smoke up --wait mlflow-dormant-smoke
  #   docker compose --profile dormant-smoke run --rm finrl-dormant-smoke
  #   docker compose --profile dormant-smoke run --rm rllib-dormant-smoke
  #   docker compose --profile dormant-smoke run --rm ray-tune-dormant-smoke
  #   docker compose --profile dormant-smoke run --rm qlib-dormant-smoke
  #   docker compose --profile dormant-smoke run --rm trl-dormant-smoke
  #   docker compose --profile dormant-smoke run --rm experiments-dormant-smoke
  #
  # No ports, secrets, or live broker routes are exposed in this profile.
  # Each service exits after the smoke run completes.
  # ===========================================================================

  mlflow-dormant-smoke:
    profiles: ["dormant-smoke"]
    build:
      context: services/research/mlflow
      dockerfile: Dockerfile
    environment:
      MLFLOW_HOST: 127.0.0.1
      MLFLOW_PORT: "5000"
      MLFLOW_SERVER_ALLOWED_HOSTS: localhost:*,127.0.0.1:*
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*
      MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE: "false"
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:5000/health', headers={'Host':'localhost'}), timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: "no"

  finrl-dormant-smoke:
    profiles: ["dormant-smoke"]
    build:
      context: services/research/finrl
      dockerfile: Dockerfile
      args:
        PANTHEON_INSTALL_UPSTREAM_DEPS: "false"
    environment:
      PANTHEON_DEFERRED_PREP_GATE: "1"
      FINRL_BACKEND: "stub"
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    command: ["python", "smoke_test.py", "--enable-deferred-prep", "--backend", "stub"]
    restart: "no"

  rllib-dormant-smoke:
    profiles: ["dormant-smoke"]
    build:
      context: .
      dockerfile: services/research/rllib/Dockerfile
      args:
        PANTHEON_INSTALL_UPSTREAM_DEPS: "false"
    environment:
      PANTHEON_DEFERRED_PREP_GATE: "1"
      PANTHEON_RLLIB_PREP_ENABLED: "1"
      PANTHEON_RLLIB_BACKEND: "stub"
      RLLIB_BACKEND: "stub"
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    command: ["python", "smoke_test.py", "--enable-deferred-prep", "--deferred-backend", "stub"]
    restart: "no"

  ray-tune-dormant-smoke:
    profiles: ["dormant-smoke"]
    build:
      context: .
      dockerfile: services/research/rllib/Dockerfile
      args:
        PANTHEON_INSTALL_UPSTREAM_DEPS: "false"
    environment:
      PANTHEON_DEFERRED_PREP_GATE: "1"
      PANTHEON_RAYTUNE_PREP_ENABLED: "1"
      PANTHEON_RAYTUNE_BACKEND: "stub"
      RAY_TUNE_BACKEND: "stub"
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    command: ["python", "ray_tune_smoke_test.py", "--enable-deferred-prep", "--backend", "stub"]
    restart: "no"

  qlib-dormant-smoke:
    profiles: ["dormant-smoke"]
    build:
      context: .
      dockerfile: services/research/qlib/Dockerfile
      args:
        PANTHEON_INSTALL_UPSTREAM_DEPS: "false"
    environment:
      PANTHEON_DEFERRED_PREP_GATE: "1"
      QLIB_BACKEND: "stub"
    command: ["python", "smoke_test.py", "--backend", "stub"]
    restart: "no"

  trl-dormant-smoke:
    profiles: ["dormant-smoke"]
    build:
      context: .
      dockerfile: services/learning/trl/Dockerfile
    environment:
      PANTHEON_DEFERRED_PREP_GATE: "1"
      TRL_BACKEND: "stub"
    command: ["python", "services/learning/trl/smoke_test.py", "--backend", "stub"]
    restart: "no"

  experiments-dormant-smoke:
    profiles: ["dormant-smoke"]
    build:
      context: .
      dockerfile: services/registry/experiments/Dockerfile
    environment:
      PANTHEON_DEFERRED_PREP_GATE: "1"
      EXPERIMENT_BACKEND: "memory"
    command: ["python", "smoke_test.py", "--backend", "memory"]
    restart: "no"


        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; port=os.environ.get('PORT','8101'); urllib.request.urlopen(f'http://127.0.0.1:{port}/readyz', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  openclaw-data-init:
    profiles: ["openclaw"]
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /home/node/.openclaw && chown -R 1000:1000 /home/node/.openclaw"]
    volumes:
      - openclaw-data:/home/node/.openclaw

  openclaw-gateway:
    profiles: ["openclaw"]
    # Pantheon-derived image: governed upstream OpenClaw 2026.7.1 plus Claude
    # Code and Gemini CLIs, so the shared model pool can serve Anthropic and
    # Google CLI-backed routes. Upstream pin governed (see
    # OSS_INTEGRATION_CHECKLIST.md / integrations/openclaw/governance.md).
    build:
      context: .
      dockerfile: integrations/openclaw/gateway/Dockerfile
      args:
        ANTHROPIC_CLAUDE_CODE_NPM_VERSION: "2.1.216"
        GOOGLE_GEMINI_CLI_NPM_VERSION: "0.51.0"
    image: pantheon-openclaw-gateway:2026.7.1
    restart: unless-stopped
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-pantheon-local-token}
      # Persist Claude CLI login on the openclaw-data volume so the one-time
      # `claude auth login` survives container recreate (subscription OAuth, no key).
      CLAUDE_CONFIG_DIR: ${OPENCLAW_CLAUDE_CONFIG_DIR:-/home/node/.openclaw/claude-cli}
      PANTHEON_ASSISTANT_CODEX_HOST_HOME: ${PANTHEON_ASSISTANT_CODEX_HOST_HOME:-/srv/pantheon-assistant/.codex}
      PANTHEON_ASSISTANT_CODEX_CONTAINER_HOME: ${PANTHEON_ASSISTANT_CODEX_CONTAINER_HOME:-/home/pantheon-assistant/.codex}
      PANTHEON_ASSISTANT_CLAUDE_HOST_CONFIG_DIR: ${PANTHEON_ASSISTANT_CLAUDE_HOST_CONFIG_DIR:-/srv/pantheon-assistant/.claude}
      PANTHEON_ASSISTANT_CLAUDE_CONTAINER_CONFIG_DIR: ${PANTHEON_ASSISTANT_CLAUDE_CONTAINER_CONFIG_DIR:-/home/pantheon-assistant/.claude}
      PANTHEON_ASSISTANT_CREDENTIAL_MOUNT_MODE: ${PANTHEON_ASSISTANT_CREDENTIAL_MOUNT_MODE:-rw}
    depends_on:
      openclaw-data-init:
        condition: service_completed_successfully
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--allow-unconfigured",
        "--port",
        "18789",
        "--auth",
        "token",
        "--token",
        "${OPENCLAW_GATEWAY_TOKEN:-pantheon-local-token}",
      ]
    volumes:
      - openclaw-data:/home/node/.openclaw
      - ${PANTHEON_ASSISTANT_CODEX_HOST_HOME:-/srv/pantheon-assistant/.codex}:${PANTHEON_ASSISTANT_CODEX_CONTAINER_HOME:-/home/pantheon-assistant/.codex}:${PANTHEON_ASSISTANT_CREDENTIAL_MOUNT_MODE:-rw}
      - ${PANTHEON_ASSISTANT_CLAUDE_HOST_CONFIG_DIR:-/srv/pantheon-assistant/.claude}:${PANTHEON_ASSISTANT_CLAUDE_CONTAINER_CONFIG_DIR:-/home/pantheon-assistant/.claude}:${PANTHEON_ASSISTANT_CREDENTIAL_MOUNT_MODE:-rw}
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 5 http://127.0.0.1:18789/readyz >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  openclaw-gateway-adapter:
    build:
      context: .
      dockerfile: services/openclaw-gateway-adapter/Dockerfile
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    environment:
      PORT: "8104"
      OPENCLAW_GATEWAY_URL: http://openclaw-gateway:18789
      # Token + agent for the `openclaw` assistant provider's WS-RPC agent turn
      # (assistant_openclaw_provider shells out to `openclaw agent --url ... --token ...`).
      # Must match the gateway service's OPENCLAW_GATEWAY_TOKEN. Without this the
      # provider degrades with OPENCLAW_GATEWAY_TOKEN_not_set even when the CLI is baked.
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-pantheon-local-token}
      OPENCLAW_AGENT_ID: ${OPENCLAW_AGENT_ID:-main}
      # Agent ensure/reconcile runs in this authenticated adapter container but
      # must mutate the exact gateway-owned state and workspace volume.
      PANTHEON_OPENCLAW_GATEWAY_STATE_DIR: /home/node/.openclaw
      PANTHEON_OPENCLAW_AGENT_IDEMPOTENCY_DB: /root/.openclaw/pantheon-agent-ensure.sqlite3
      # Per-turn budget for `openclaw agent` (used as the CLI --timeout AND the
      # subprocess timeout). A real agent turn (gpt-5.5 + medium thinking + the
      # full management context pack) runs ~60-90s+, so the default 90 was too
      # tight. Must stay BELOW the BFF's PANTHEON_ASSISTANT_PROVIDER_TIMEOUT_SECONDS
      # (180) so the adapter returns its own result before the BFF gives up.
      OPENCLAW_ASSISTANT_TIMEOUT_SECONDS: ${OPENCLAW_ASSISTANT_TIMEOUT_SECONDS:-170}
      # The `openclaw agent` client refuses plaintext ws:// to a non-loopback
      # address (the gateway resolves to a docker-bridge IP). The adapter↔gateway
      # hop stays inside the single-host docker network (never routed off-box), so
      # the upstream-sanctioned break-glass for trusted private networks applies.
      # Revisit if the gateway is ever exposed off-host (then use wss://).
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-1}
      OPENCLAW_UPSTREAM_TIMEOUT: ${OPENCLAW_UPSTREAM_TIMEOUT:-3}
      OPENCLAW_UPSTREAM_RETRIES: ${OPENCLAW_UPSTREAM_RETRIES:-1}
      OPENCLAW_PRODUCTION_BROKER_ENABLED: "false"
      OPENCLAW_PAPER_ADAPTER_ENABLED: "false"
      OPENCLAW_LIVE_ADAPTER_ENABLED: "false"
      OPENCLAW_CANARY_ADAPTER_ENABLED: "false"
      OPENCLAW_CAPITAL_BINDING_ENABLED: "false"
      OPENCLAW_ALLOWED_TOOLS: ${OPENCLAW_ALLOWED_TOOLS:-assistant.command,assistant.provider.reauth,assistant.provider.register,assistant.openclaw.ask,assistant.control_mode.status,assistant.transcript.resync}
      OPENCLAW_BROKER_SIDECAR_URL: http://broker:8102
      OPENCLAW_RUNTIME_MANAGER_URL: http://runtime-manager:8081
      PANTHEON_RUNTIME_MANAGER_TOKEN: runtime-control-internal
      PANTHEON_ASSISTANT_CODEX_WORKSPACE: ${PANTHEON_ASSISTANT_CODEX_WORKSPACE:-/workspace}
      PANTHEON_ASSISTANT_CODEX_HOST_HOME: ${PANTHEON_ASSISTANT_CODEX_HOST_HOME:-/srv/pantheon-assistant/.codex}
      PANTHEON_ASSISTANT_CODEX_CONTAINER_HOME: ${PANTHEON_ASSISTANT_CODEX_CONTAINER_HOME:-/home/pantheon-assistant/.codex}
      PANTHEON_ASSISTANT_CLAUDE_HOST_CONFIG_DIR: ${PANTHEON_ASSISTANT_CLAUDE_HOST_CONFIG_DIR:-/srv/pantheon-assistant/.claude}
      PANTHEON_ASSISTANT_CLAUDE_CONTAINER_CONFIG_DIR: ${PANTHEON_ASSISTANT_CLAUDE_CONTAINER_CONFIG_DIR:-/home/pantheon-assistant/.claude}
      PANTHEON_ASSISTANT_CREDENTIAL_MOUNT_MODE: ${PANTHEON_ASSISTANT_CREDENTIAL_MOUNT_MODE:-rw}
      # BFF-to-adapter assistant routes are an authenticated service boundary.
      # The token has no compose default and must be provisioned by the deploy
      # environment; strict auth is the dev-stack default.
      PANTHEON_OPENCLAW_ADAPTER_SERVICE_TOKEN: ${PANTHEON_OPENCLAW_ADAPTER_SERVICE_TOKEN:-}
      PANTHEON_OPENCLAW_ADAPTER_SERVICE_AUTH_REQUIRED: ${PANTHEON_OPENCLAW_ADAPTER_SERVICE_AUTH_REQUIRED:-true}
      CONSULTATION_PROVIDER_TOKEN: ${CONSULTATION_PROVIDER_TOKEN:-pantheon-local-consultation-provider}
      CONSULTATION_PROVIDER_ALLOWED_SERVICE_ACTOR: consultation-workflow-executor
    volumes:
      - ${PANTHEON_ASSISTANT_CODEX_HOST_HOME:-/srv/pantheon-assistant/.codex}:${PANTHEON_ASSISTANT_CODEX_CONTAINER_HOME:-/home/pantheon-assistant/.codex}:${PANTHEON_ASSISTANT_CREDENTIAL_MOUNT_MODE:-rw}
      - ${PANTHEON_ASSISTANT_CLAUDE_HOST_CONFIG_DIR:-/srv/pantheon-assistant/.claude}:${PANTHEON_ASSISTANT_CLAUDE_CONTAINER_CONFIG_DIR:-/home/pantheon-assistant/.claude}:${PANTHEON_ASSISTANT_CREDENTIAL_MOUNT_MODE:-rw}
      # Persist the adapter's OpenClaw device identity + pairing approval so the
      # one-time `openclaw devices approve` survives container recreate (the CLI
      # connects to the gateway as a paired device; a fresh state dir re-pairs).
      # See docs/runbooks/openclaw-adapter-device-pairing.md.
      - openclaw-adapter-data:/root/.openclaw
      # Shared only for the governed internal agent ensure surface. The adapter
      # validates an exact /workspaces/<persona-id> target before every write.
      - openclaw-data:/home/node/.openclaw:rw
    depends_on:
      # Hosted/root deployments enable the openclaw profile and must not admit
      # agent writes until the shared volume owner and gateway are ready. These
      # stay optional so a profile-less local stack can expose honest degraded
      # adapter health without Compose rejecting the graph.
      openclaw-data-init:
        condition: service_completed_successfully
        required: false
      openclaw-gateway:
        condition: service_healthy
        required: false
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_ADAPTER_PORT:-18104}:8104"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; port=os.environ.get('PORT','8104'); urllib.request.urlopen(f'http://127.0.0.1:{port}/livez', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s


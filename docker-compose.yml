      retries: 10
      start_period: 5s

  loop-run-projector-scheduler:
    # Preserve the legacy service key so deploys replace the snapshot cron
    # instead of leaving a second writer.  The implementation is now the
    # canonical committed-telemetry lifecycle projector.
    build:
      context: .
      dockerfile: services/telemetry/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: ["python", "-m", "services.trade_journey.lifecycle_projector", "run"]
    # Emergency containment for the legacy full-history projector. It can
    # otherwise consume the host while loading/copying unbounded state.
    # Fail stopped at the cgroup boundary until the incremental replacement
    # is delivered; the last atomic projection remains readable by the BFF.
    restart: "${LIFECYCLE_PROJECTOR_RESTART_POLICY:-no}"
    mem_limit: ${LIFECYCLE_PROJECTOR_MEMORY_LIMIT:-16g}
    stop_grace_period: 30s
    environment:
      TELEMETRY_DB_DSN: ${TELEMETRY_DB_DSN:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      LIFECYCLE_PROJECTION_ROOT: /data/bff/lifecycle-projection
      LIFECYCLE_PROJECTOR_STATE_PATH: /data/bff/lifecycle-projection/controller_state.json
      LIFECYCLE_PROJECTOR_HEALTH_STATE_PATH: /data/bff/lifecycle-projection/health_state.json
      LIFECYCLE_PROJECTOR_POLL_SECONDS: ${LIFECYCLE_PROJECTOR_POLL_SECONDS:-1}
      LIFECYCLE_PROJECTOR_BATCH_SIZE: ${LIFECYCLE_PROJECTOR_BATCH_SIZE:-500}
      LIFECYCLE_PROJECTOR_MAX_TICKS: ${LIFECYCLE_PROJECTOR_MAX_TICKS:-0}
      LIFECYCLE_PROJECTOR_GENERATION_RETENTION: ${LIFECYCLE_PROJECTOR_GENERATION_RETENTION:-4}
      LIFECYCLE_PROJECTOR_STAGING_MAX_AGE_SECONDS: ${LIFECYCLE_PROJECTOR_STAGING_MAX_AGE_SECONDS:-3600}
      LIFECYCLE_PROJECTOR_HEALTH_MAX_AGE_SECONDS: ${LIFECYCLE_PROJECTOR_HEALTH_MAX_AGE_SECONDS:-120}
      LIFECYCLE_PROJECTOR_HEALTH_MAX_BACKLOG: ${LIFECYCLE_PROJECTOR_HEALTH_MAX_BACKLOG:-5000}
      LIFECYCLE_PROJECTOR_HEALTH_MIN_FREE_BYTES: ${LIFECYCLE_PROJECTOR_HEALTH_MIN_FREE_BYTES:-134217728}
      LIFECYCLE_PROJECTOR_HEALTH_MIN_FREE_PERCENT: ${LIFECYCLE_PROJECTOR_HEALTH_MIN_FREE_PERCENT:-5}
      PANTHEON_TJ_E2E_FIXTURE_INGEST_ENABLED: ${PANTHEON_TJ_E2E_FIXTURE_INGEST_ENABLED:-false}
      GIT_SHA: ${GIT_SHA:-unknown}
    volumes:
      - bff-data:/data/bff
    depends_on:
      postgres:
        condition: service_healthy
      telemetry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "services.trade_journey.lifecycle_projector", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 600s


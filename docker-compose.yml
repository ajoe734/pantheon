  runtime-manager:
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: services/runtime-manager/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    environment:
      PORT: "8081"
      PANTHEON_RUNTIME_BINDING_STORE_PATH: /data/runtime/runtime_bindings.json
      PANTHEON_COMMAND_STATE_FILE: /data/runtime/internal_api_commands.json
      PANTHEON_CONSULTATION_API_URL: http://consultation-svc:8096
      # ApproveDeployment routes to the deployment service plan-status API.
      # Governance ApprovalDecision lookups use a separate approval-service URL
      # for audit cross-references; the runtime-manager itself does not write
      # to the governance service from this path.
      PANTHEON_DEPLOYMENT_API_URL: http://deployment:8095
      PANTHEON_GOVERNANCE_APPROVAL_API_URL: http://governance:8082
      PANTHEON_REGISTRY_API_URL: http://registry:8087
      PANTHEON_CAPITAL_API_URL: http://capital:8092
      # Normal service tokens remain compatible in permissive mode, while the
      # stage-promotion route independently requires a verified JWT MFA claim.
      PANTHEON_RUNTIME_AUTH_MODE: ${PANTHEON_RUNTIME_AUTH_MODE:-permissive}
      PANTHEON_RUNTIME_JWT_SECRET: ${PANTHEON_BFF_JWT_SECRET:-}
      PANTHEON_RUNTIME_JWT_ISSUER: ${PANTHEON_BFF_JWT_ISSUER:-}
      PANTHEON_RUNTIME_JWT_AUDIENCE: ${PANTHEON_BFF_JWT_AUDIENCE:-}
      PANTHEON_RUNTIME_ROLE_CLAIMS: ${PANTHEON_BFF_ROLE_CLAIMS:-roles,role}
      PANTHEON_RUNTIME_MFA_CLAIMS: ${PANTHEON_BFF_MFA_CLAIMS:-amr,acr,mfa,mfa_verified,firebase.sign_in_second_factor}
      PANTHEON_RUNTIME_MFA_VALUES: ${PANTHEON_BFF_MFA_VALUES:-true,1,yes,mfa,otp,totp,webauthn}
      PANTHEON_CANARY_EXECUTION_ENABLED: ${PANTHEON_CANARY_EXECUTION_ENABLED:-false}
      PANTHEON_LIVE_BROKER_ENABLED: ${PANTHEON_LIVE_BROKER_ENABLED:-false}
    volumes:
      - runtime-data:/data/runtime
    depends_on:
      consultation-svc:
        condition: service_healthy
    # Note: deployment/governance are not declared as `depends_on` because
    # runtime-manager's primary contract (runtime CRUD, kill-switch) does not
    # require them at boot. ApproveDeployment requests fail cleanly with
    # DEPLOYMENT_API_UNAVAILABLE if the deployment service is unreachable.
    ports:
      - "18081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s


      timeout: 5s
      retries: 10
      start_period: 5s

  lineage-read:
    build:
      context: .
      dockerfile: services/lineage-read/Dockerfile
    environment:
      PORT: "8094"
      LINEAGE_DATA_DIR: /data/lineage
    volumes:
      - lineage-data:/data/lineage
    ports:
      - "18094:8094"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  smoke-stack:
    profiles: ["smoke"]
    build:
      context: .
      dockerfile: Dockerfile.smoke
    environment:
      GOVERNANCE_URL: http://governance:8082
      RUNTIME_MANAGER_URL: http://runtime-manager:8081
      TELEMETRY_URL: http://telemetry:8083
      INCIDENTS_URL: http://incidents:8090
      POSTMORTEMS_URL: http://postmortems:8091
      BFF_URL: http://operator-bff:8001
    depends_on:
      governance:
        condition: service_healthy
      runtime-manager:
        condition: service_healthy
      telemetry:
        condition: service_healthy
      incidents:
        condition: service_healthy
      postmortems:
        condition: service_healthy
      operator-bff:
        condition: service_healthy

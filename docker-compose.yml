        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "18001:8001"
    healthcheck:
      # Compose only owns process liveness. Exact deployment/projector
      # readiness is revision-bound and bounded by deploy_nonprod_vm.sh after
      # the stack is running, so a recovering projector must not make Compose
      # abort the deployment before that gate can observe convergence.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/livez', timeout=5).read()"]

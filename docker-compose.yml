# Pantheon default compose contract:
# - dev single-VM baseline for local and non-prod VM development
# - co-locates control-plane, runtime-manager, telemetry, research, and BFF
# - staging-live uses docker-compose.control.yml + docker-compose.exec.yml
x-pantheon-compose-contract:
  topology: dev-single-vm-baseline
  execution_boundary: co-located-dev-only

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pantheon}
      PANTHEON_APP_DB_USER: ${PANTHEON_APP_DB_USER:-pantheon_app}
      PANTHEON_APP_DB_PASSWORD: ${PANTHEON_APP_DB_PASSWORD:-pantheon_app}
      PANTHEON_APP_DB_NAME: ${PANTHEON_APP_DB_NAME:-pantheon}
      PANTHEON_MANAGEMENT_AI_DB_USER: ${PANTHEON_MANAGEMENT_AI_DB_USER:-pantheon_management_ai}
      PANTHEON_MANAGEMENT_AI_DB_PASSWORD: ${PANTHEON_MANAGEMENT_AI_DB_PASSWORD:-pantheon_management_ai_dev}
      PANTHEON_MANAGEMENT_AI_DB_NAME: ${PANTHEON_MANAGEMENT_AI_DB_NAME:-pantheon}
      MANAGEMENT_AI_STORE_SCHEMA: ${MANAGEMENT_AI_STORE_SCHEMA:-management_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pantheon}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pantheon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pantheonminio}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pantheon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pantheonminio}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-pantheon-artifacts}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
        mc mb --ignore-existing \"local/$$MINIO_DEFAULT_BUCKETS\" &&
        echo 'Bucket ready: '\"$$MINIO_DEFAULT_BUCKETS\"
      "
    restart: on-failure

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["--jetstream", "--http_port", "8222", "--store_dir", "/data/jetstream"]
    volumes:
      - nats-data:/data/jetstream
    ports:
      - "${NATS_PORT:-14222}:4222"
      - "${NATS_MONITOR_PORT:-18222}:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  signal-store:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  consultation-svc:
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: services/consultation/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8096"
      CONSULTATION_DATA_DIR: /data/consultation
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_PERSISTENCE_POSTURE: ${PANTHEON_PERSISTENCE_POSTURE:-dev}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_S3_ACCESS_KEY: ${PANTHEON_S3_ACCESS_KEY:-pantheon}
      PANTHEON_S3_SECRET_KEY: ${PANTHEON_S3_SECRET_KEY:-pantheonminio}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
      # Dev rollback defaults to JSONL; staging/prod select postgres via env.
      CONSULTATION_STORE_BACKEND: ${CONSULTATION_STORE_BACKEND:-jsonl}
      CONSULTATION_STORE_DSN: ${CONSULTATION_STORE_DSN:-}
      # L12-MANIFEST-001 dev manifest admission: consultation has a source
      # supported bearer-token boundary. Keep it enabled by default in the
      # local/dev stack with a non-production placeholder token; hosted
      # environments override CONSULTATION_SERVICE_TOKEN from their secret
      # store.
      CONSULTATION_AUTH_REQUIRED: ${CONSULTATION_AUTH_REQUIRED:-true}
      CONSULTATION_SERVICE_TOKEN: ${CONSULTATION_SERVICE_TOKEN:-pantheon-local-consultation-service}
      CONSULTATION_API_TOKEN: ${CONSULTATION_SERVICE_TOKEN:-pantheon-local-consultation-service}
      PANTHEON_TENANT_ID: ${PANTHEON_TENANT_ID:-${PANTHEON_BFF_TENANT_ID:-default}}
      CONSULTATION_PROVIDER_URL: http://openclaw-gateway-adapter:8104/api/openclaw-adapter/consultation/contributions
      CONSULTATION_PROVIDER_TOKEN: ${CONSULTATION_PROVIDER_TOKEN:-pantheon-local-consultation-provider}
      CONSULTATION_PROVIDER_SERVICE_ACTOR: consultation-workflow-executor
      # Dedicated machine boundary: this token is not a BFF/Governance user
      # JWT and grants only durable advisory-handoff intake.
      CONSULTATION_HANDOFF_SINK_URL: http://governance:8082/api/governance/consultation-handoffs
      CONSULTATION_HANDOFF_TOKEN: ${CONSULTATION_HANDOFF_TOKEN:-pantheon-local-consultation-handoff-token}
      CONSULTATION_WORKFLOW_EXECUTOR_HEALTH_FILE: /data/consultation/workflow-health.json
      CONSULTATION_WORKFLOW_EXECUTOR_INTERVAL_SECONDS: ${CONSULTATION_WORKFLOW_EXECUTOR_INTERVAL_SECONDS:-15}
    volumes:
      - consultation-data:/data/consultation
    ports:
      - "${CONSULTATION_PORT:-18096}:8096"
    depends_on:
      postgres:
        condition: service_healthy
      openclaw-gateway-adapter:
        condition: service_healthy
      governance:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json,os,sys,time,urllib.request; port=os.environ.get('PORT','8096'); urllib.request.urlopen(f'http://127.0.0.1:{port}/readyz',timeout=5).read(); p=os.environ['CONSULTATION_WORKFLOW_EXECUTOR_HEALTH_FILE']; h=json.load(open(p,encoding='utf-8')); f=h.get('functional_health') or {}; age=time.time()-os.path.getmtime(p); sys.exit(0 if f.get('ready') is True and int(f.get('blocked_count') or 0)==0 and int(f.get('dead_letter_count') or 0)==0 and age<=90 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  source-ingest:
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: services/source_ingestion/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8097"
      SOURCE_INGEST_DATA_DIR: /data/source-ingest
      SOURCE_INGEST_CONNECTOR_STORE_PATH: /data/source-ingest/connector_config.jsonl
      SOURCE_INGEST_EVIDENCE_STORE_PATH: /data/source-ingest/source_evidence.jsonl
      SOURCE_INGEST_CONTROLLER_STATE_PATH: /data/source-ingest/controller_state.json
      SOURCE_INGEST_REQUIREMENT_STATE_PATH: /data/source-ingest/requirement_snapshots.jsonl
      SOURCE_INGEST_CONTROLLER_TOKEN_FILE: /data/source-ingest/controller_token
      SOURCE_INGEST_MAX_RECORDS: ${SOURCE_INGEST_MAX_RECORDS:-100}
      SOURCE_INGEST_SCHEDULER_MAX_CONCURRENCY: ${SOURCE_INGEST_SCHEDULER_MAX_CONCURRENCY:-2}
      SOURCE_INGEST_FRONTIER_MAX_ATTEMPTS: ${SOURCE_INGEST_FRONTIER_MAX_ATTEMPTS:-2}
      SOURCE_INGEST_FRONTIER_BACKOFF_SECONDS: ${SOURCE_INGEST_FRONTIER_BACKOFF_SECONDS:-60}
      SOURCE_INGEST_FRONTIER_RUNNING_TIMEOUT_SECONDS: ${SOURCE_INGEST_FRONTIER_RUNNING_TIMEOUT_SECONDS:-300}
      SOURCE_INGEST_DEFAULT_STALE_THRESHOLD_SECONDS: ${SOURCE_INGEST_DEFAULT_STALE_THRESHOLD_SECONDS:-86400}
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      # Third-party fetches are denied in every environment unless an operator
      # starts the bounded refresh profile with an exact reviewed host list.
      PANTHEON_EXTERNAL_EGRESS: ${PANTHEON_EXTERNAL_EGRESS:-deny}
      PANTHEON_EXTERNAL_EGRESS_ALLOWED_HOSTS: ${PANTHEON_EXTERNAL_EGRESS_ALLOWED_HOSTS:-}
      PANTHEON_SOURCE_SEARCH_POSTURE: ${PANTHEON_SOURCE_SEARCH_POSTURE:-dev}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_S3_ACCESS_KEY: ${PANTHEON_S3_ACCESS_KEY:-pantheon}
      PANTHEON_S3_SECRET_KEY: ${PANTHEON_S3_SECRET_KEY:-pantheonminio}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
      # Product-level default is transactional Postgres; JSONL remains an explicit local rollback mode.
      SOURCE_INGEST_EVIDENCE_BACKEND: ${SOURCE_INGEST_EVIDENCE_BACKEND:-postgres}
      SOURCE_INGEST_EVIDENCE_DSN: ${SOURCE_INGEST_EVIDENCE_DSN:-}
      # Notify search service after completed ingest runs (event-driven refresh/materialization truth).
      SEARCH_INGEST_NOTIFY_URL: ${SEARCH_INGEST_NOTIFY_URL:-http://search-svc:8098}
    volumes:
      - source-ingest-data:/data/source-ingest
    ports:
      - "${SOURCE_INGEST_PORT:-18097}:8097"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; port=os.environ.get('PORT','8097'); urllib.request.urlopen(f'http://127.0.0.1:{port}/readyz', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  source-ingest-controller-migrate:
    build:
      context: .
      dockerfile: services/source_ingestion/Dockerfile
    command: ["bash", "scripts/db_migrate.sh"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
    depends_on:
      postgres:
        condition: service_healthy

  # Keep the legacy service key so non-prod upgrades replace the prior
  # scheduler container instead of leaving a second ticking orphan behind.
  source-ingest-scheduler:
    build:
      context: .
      dockerfile: services/source_ingestion/Dockerfile
    command: ["python", "-m", "services.source_ingestion.controller_worker"]
    restart: "${SOURCE_INGEST_CONTROLLER_RESTART_POLICY:-unless-stopped}"
    stop_grace_period: 30s
    # This same controller is the sole durable owner. Operators retain an
    # explicit bounded smoke with `docker compose run --rm -e
    # SOURCE_INGEST_CONTROLLER_MAX_TICKS=1 source-ingest-scheduler`; there is
    # no second scheduler service or profile-only production owner.
    environment:
      SOURCE_INGEST_API_URL: http://source-ingest:8097
      SOURCE_INGEST_DESIRED_STATE_PATH: /workspace/services/source_ingestion/default_desired_state.json
      SOURCE_INGEST_CONTROLLER_INTERVAL_SECONDS: ${SOURCE_INGEST_CONTROLLER_INTERVAL_SECONDS:-60}
      SOURCE_INGEST_CONTROLLER_TIMEOUT_SECONDS: ${SOURCE_INGEST_CONTROLLER_TIMEOUT_SECONDS:-30}
      SOURCE_INGEST_CONTROLLER_MODE: ${SOURCE_INGEST_CONTROLLER_MODE:-reconcile_only}
      SOURCE_INGEST_CONTROLLER_MAX_TICKS: ${SOURCE_INGEST_CONTROLLER_MAX_TICKS:-0}
      SOURCE_INGEST_CONTROLLER_FORCE_CONNECTOR_IDS: ${SOURCE_INGEST_CONTROLLER_FORCE_CONNECTOR_IDS:-}
      SOURCE_INGEST_CONTROLLER_EXCLUSIVE_CONNECTOR_IDS: ${SOURCE_INGEST_CONTROLLER_EXCLUSIVE_CONNECTOR_IDS:-}
      SOURCE_INGEST_CONTROLLER_STATE_PATH: /data/source-ingest/controller_state.json
      SOURCE_INGEST_CONTROLLER_ALIVE_PATH: /data/source-ingest/controller_alive
      SOURCE_INGEST_CONTROLLER_TOKEN_FILE: /data/source-ingest/controller_token
      SOURCE_INGEST_CONTROLLER_TRUTH_LEVEL: ${SOURCE_INGEST_CONTROLLER_TRUTH_LEVEL:-scheduled_tick}
      SOURCE_INGEST_SCHEDULER_MAX_CONCURRENCY: ${SOURCE_INGEST_SCHEDULER_MAX_CONCURRENCY:-1}
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_LOOP_ID: source-ingestion
      PANTHEON_CONTROLLER_NAME: source-ingestion-controller
      PANTHEON_TENANT_ID: ${PANTHEON_TENANT_ID:-${PANTHEON_BFF_TENANT_ID:-default}}
      PANTHEON_ENV: ${PANTHEON_ENV:-dev}
      GIT_SHA: ${GIT_SHA:-local-dev}
      IMAGE_DIGEST: ${IMAGE_DIGEST:-}
      BUILD_TIME: ${BUILD_TIME:-}
    volumes:
      - source-ingest-data:/data/source-ingest
    depends_on:
      source-ingest:
        condition: service_healthy
      source-ingest-controller-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -m services.source_ingestion.controller_healthcheck",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  source-ingest-agora-projector:
    build:
      context: .
      dockerfile: services/source_ingestion/Dockerfile
    command: ["python", "scripts/project_market_data_to_bff_agora_surfaces.py"]
    restart: "no"
    profiles: ["source-ingest-scheduler"]
    environment:
      SOURCE_INGEST_URL: http://source-ingest:8097
      OUT_DIR: /data/bff
      AGORA_MARKET_STALE_THRESHOLD_SECONDS: ${AGORA_MARKET_STALE_THRESHOLD_SECONDS:-86400}
    volumes:
      - bff-data:/data/bff
    depends_on:
      source-ingest:
        condition: service_healthy
      source-ingest-scheduler:
        condition: service_completed_successfully

  # strategy-distillation-worker and alpha-replication-worker (below) do not
  # get a PANTHEON_BFF_HEALTH_TARGETS_JSON entry. Both are the file-backed
  # "scheduler-style background worker" shape documented in
  # services/worker_health.py: no PORT, no `ports:` mapping, no HTTP listener
  # at all -- their own healthcheck is a Docker CMD-SHELL freshness check on a
  # local alive/state-mtime file, not an HTTP probe. A typed BFF target only
  # fits an HTTP owner-API (compare paper-fleet-reconciler further below,
  # which has PORT 8011 and a real /readyz). Adding one here would require
  # standing up a new HTTP server inside each controller first -- evaluated
  # for L12-CURRENT-BFF-HEALTH-GAP-20260817 and found out of that task's
  # scope (no new monitoring framework, no downstream_health_monitor.py
  # behavior change). Every other same-shape worker in this compose file
  # (evolution-dispatch-worker, paper-signal-producer, reconciliation-drift's
  # scheduler/consumer, policy-learning's scheduler, etc.) is likewise absent
  # from the typed registry for the same reason -- this is the established
  # pattern, not a gap.
  strategy-distillation-worker:
    build:
      context: .
      dockerfile: services/source_ingestion/Dockerfile
    command: ["python", "-m", "services.source_ingestion.distillation_controller"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SOURCE_INGEST_CONTROLLER_INTERVAL_SECONDS: ${SOURCE_INGEST_CONTROLLER_INTERVAL_SECONDS:-60}
      # The source-ingest scheduler deliberately sets its shared max-ticks
      # input to 1 for bounded provider pulls. Distillation is an always-on
      # controller, so it must not inherit that one-shot value or Docker will
      # restart the successful process forever under `unless-stopped`.
      SOURCE_INGEST_CONTROLLER_MAX_TICKS: ${STRATEGY_DISTILLATION_CONTROLLER_MAX_TICKS:-0}
      DISTILLATION_CONTROLLER_STATE_PATH: /data/source-ingest/distill_controller_state.json
      DISTILLATION_CONTROLLER_ALIVE_PATH: /data/source-ingest/distill_controller_alive
      DISTILLATION_CONTROLLER_HEALTH_MAX_AGE_SECONDS: ${DISTILLATION_CONTROLLER_HEALTH_MAX_AGE_SECONDS:-300}
      DISTILLATION_JOB_QUEUE_PATH: /data/source-ingest/distill_job_queue.jsonl
      STRATEGY_SPEC_SEED_STORE_PATH: /data/source-ingest/distill_seeds.jsonl
      SOURCE_INGEST_EVIDENCE_STORE_PATH: /data/source-ingest/source_evidence.jsonl
      PANTHEON_REGISTRY_URL: http://registry:8087
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_LOOP_ID: strategy_distillation
      PANTHEON_CONTROLLER_NAME: strategy-distillation-controller
      PANTHEON_TENANT_ID: ${PANTHEON_TENANT_ID:-${PANTHEON_BFF_TENANT_ID:-default}}
      PANTHEON_ENV: ${PANTHEON_ENV:-dev}
      GIT_SHA: ${GIT_SHA:-local-dev}
    volumes:
      - source-ingest-data:/data/source-ingest
    depends_on:
      source-ingest:
        condition: service_healthy
      registry:
        condition: service_healthy
    # The controller rewrites its alive file in the `finally` of every
    # reconcile tick, so file freshness is a true liveness heartbeat and does
    # not flip unhealthy on a single upstream business failure.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import os,sys,time;p=sys.argv[1];sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<=float(sys.argv[2]) else 1)' /data/source-ingest/distill_controller_alive ${DISTILLATION_CONTROLLER_HEALTH_MAX_AGE_SECONDS:-300}",
        ]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 180s

  alpha-replication-worker:
    build:
      context: .
      dockerfile: services/research/Dockerfile
    command: ["python", "-m", "services.research.alpha_replication.replication_controller"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      ALPHA_REPLICATION_CONTROLLER_INTERVAL_SECONDS: ${ALPHA_REPLICATION_CONTROLLER_INTERVAL_SECONDS:-60}
      ALPHA_REPLICATION_CONTROLLER_MAX_TICKS: ${ALPHA_REPLICATION_CONTROLLER_MAX_TICKS:-0}
      ALPHA_REPLICATION_DATA_DIR: /data/research-orchestrator/alpha-replication
      ALPHA_REPLICATION_CONTROLLER_STATE_PATH: /data/research-orchestrator/alpha-replication/controller_state.json
      STRATEGY_SPEC_SEED_STORE_PATH: /data/source-ingest/distill_seeds.jsonl
      PANTHEON_REGISTRY_URL: http://registry:8087
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_LOOP_ID: alpha_replication
      PANTHEON_CONTROLLER_NAME: alpha-replication-controller
      PANTHEON_TENANT_ID: ${PANTHEON_TENANT_ID:-${PANTHEON_BFF_TENANT_ID:-default}}
      PANTHEON_ENV: ${PANTHEON_ENV:-dev}
      GIT_SHA: ${GIT_SHA:-local-dev}
      PANTHEON_ALPHA_REVALIDATION_DISPATCH_MODE: ${PANTHEON_ALPHA_REVALIDATION_DISPATCH_MODE:-handoff_only}
    volumes:
      - research-orchestrator-data:/data/research-orchestrator
      - source-ingest-data:/data/source-ingest
    depends_on:
      research-orchestrator-svc:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import os,sys,time;p=os.getenv(\"ALPHA_REPLICATION_CONTROLLER_STATE_PATH\",\"/data/research-orchestrator/alpha-replication/controller_state.json\");interval=float(os.getenv(\"ALPHA_REPLICATION_CONTROLLER_INTERVAL_SECONDS\",\"60\"));window=max(2*interval,interval+180);sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<=window else 1)'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  search-svc:
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: services/search/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8098"
      SEARCH_DATA_DIR: /data/search
      SEARCH_INDEX_STORE_PATH: /data/search/search-index.jsonl
      SEARCH_MATERIALIZE_STORE_PATH: /data/search/search-materialize.jsonl
      SEARCH_PIPELINE_STORE_PATH: /data/search/search-pipeline.jsonl
      SEARCH_EVIDENCE_STORE_PATH: /data/source-ingest/source_evidence.jsonl
      SEARCH_FRESHNESS_SLA_SECONDS: ${SEARCH_FRESHNESS_SLA_SECONDS:-3600}
      SEARCH_PIPELINE_RETENTION_RUNS: ${SEARCH_PIPELINE_RETENTION_RUNS:-500}
      SEARCH_DURABLE_INDEX_ONLY: ${SEARCH_DURABLE_INDEX_ONLY:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_SOURCE_SEARCH_POSTURE: ${PANTHEON_SOURCE_SEARCH_POSTURE:-dev}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_S3_ACCESS_KEY: ${PANTHEON_S3_ACCESS_KEY:-pantheon}
      PANTHEON_S3_SECRET_KEY: ${PANTHEON_S3_SECRET_KEY:-pantheonminio}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
      # Read the source owner's transactional evidence table by default.
      SEARCH_INDEX_STORE_BACKEND: ${SEARCH_INDEX_STORE_BACKEND:-jsonl}
      SEARCH_INDEX_STORE_DSN: ${SEARCH_INDEX_STORE_DSN:-}
      SEARCH_EVIDENCE_BACKEND: ${SEARCH_EVIDENCE_BACKEND:-postgres}
      SEARCH_EVIDENCE_DSN: ${SEARCH_EVIDENCE_DSN:-}
    volumes:
      - search-data:/data/search
      - source-ingest-data:/data/source-ingest:ro
    ports:
      - "${SEARCH_PORT:-18098}:8098"
    depends_on:
      postgres:
        condition: service_healthy
      # source-ingest owns and bootstraps source_ingest.source_evidence;
      # search must not open its read-only view before the owner is ready.
      source-ingest:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; port=os.environ.get('PORT','8098'); urllib.request.urlopen(f'http://127.0.0.1:{port}/readyz', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  search-index-scheduler:

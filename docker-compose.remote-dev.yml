services:
  signal-store:
    image: redis:alpine
    ports:
      - "127.0.0.1:6379:6379"

  control-plane-persona:
    build:
      context: ./services/control-plane/persona
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - REDIS_URL=redis://signal-store:6379
    depends_on:
      - signal-store

  control-plane-router:
    build:
      context: ./services/control-plane/router
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - PERSONA_URL=http://control-plane-persona:8002
    depends_on:
      - control-plane-persona
      - signal-store

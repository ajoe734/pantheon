# Dedicated staging VM-1 control-plane stack.
#
# Usage:
#   docker compose --env-file env/prod-control.env.example -f docker-compose.control.yml up -d
#
# This slice hosts the VM-1 control/BFF, telemetry, governance, and deployment
# surfaces, and talks to VM-2 runtime-manager through
# PANTHEON_RUNTIME_MANAGER_URL. It intentionally excludes runtime-manager,
# execution sidecars, broker sidecars, broker/exchange secrets, and router.
# Use docker-compose.staging-full.yml alongside this file when staging needs
# the full VM-1 non-execution backend surface.

name: pantheon-control

x-pantheon-compose-contract:
  topology: staging-vm1-control-plane
  external_runtime_manager_url_env: PANTHEON_RUNTIME_MANAGER_URL
  secret_boundary: no-broker-or-exchange-secrets
  bff_ha_lb_topology: deferred
  operator_bff_instances: 1
  bff_load_balancer: none

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pantheon}
      PANTHEON_APP_DB_USER: ${PANTHEON_APP_DB_USER:-pantheon_app}
      PANTHEON_APP_DB_PASSWORD: ${PANTHEON_APP_DB_PASSWORD:-pantheon_app}
      PANTHEON_APP_DB_NAME: ${PANTHEON_APP_DB_NAME:-pantheon}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    ports:
      - "${POSTGRES_PORT:-35432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pantheon}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pantheon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pantheonminio}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-39000}:9000"
      - "${MINIO_CONSOLE_PORT:-39001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["--jetstream", "--http_port", "8222", "--store_dir", "/data/jetstream"]
    volumes:
      - nats-data:/data/jetstream
    ports:
      - "${NATS_PORT:-34222}:4222"
      - "${NATS_MONITOR_PORT:-38222}:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-pantheon} $${MINIO_ROOT_PASSWORD:-pantheonminio} &&
      mc mb --ignore-existing local/$${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
      "
    restart: "no"

  governance:
    build:
      context: .
      dockerfile: services/governance/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8082"
      GOVERNANCE_DATA_DIR: /data/governance
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_PERSISTENCE_POSTURE: ${PANTHEON_PERSISTENCE_POSTURE:-production}
      # Hard-enforce Postgres in staging/prod; override to dev only for local dev rollback.
      GOVERNANCE_STORE_BACKEND: ${GOVERNANCE_STORE_BACKEND:-postgres}
      GOVERNANCE_STORE_DSN: ${GOVERNANCE_STORE_DSN:-}
      GOVERNANCE_AUDIT_BACKEND: ${GOVERNANCE_AUDIT_BACKEND:-postgres}
      GOVERNANCE_AUDIT_DSN: ${GOVERNANCE_AUDIT_DSN:-}
      PANTHEON_GOVERNANCE_AUTH_MODE: ${PANTHEON_GOVERNANCE_AUTH_MODE:-strict}
      PANTHEON_GOVERNANCE_JWT_SECRET: ${PANTHEON_BFF_JWT_SECRET:-}
      PANTHEON_GOVERNANCE_JWT_ISSUER: ${PANTHEON_BFF_JWT_ISSUER:-}
      PANTHEON_GOVERNANCE_JWT_AUDIENCE: ${PANTHEON_BFF_JWT_AUDIENCE:-}
      PANTHEON_GOVERNANCE_ROLE_CLAIMS: ${PANTHEON_BFF_ROLE_CLAIMS:-roles,role}
      PANTHEON_GOVERNANCE_MFA_CLAIMS: ${PANTHEON_BFF_MFA_CLAIMS:-amr,acr,mfa,mfa_verified}
      PANTHEON_GOVERNANCE_MFA_VALUES: ${PANTHEON_BFF_MFA_VALUES:-true,1,yes,mfa,otp,totp,webauthn}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_S3_ACCESS_KEY: ${PANTHEON_S3_ACCESS_KEY:-pantheon}
      PANTHEON_S3_SECRET_KEY: ${PANTHEON_S3_SECRET_KEY:-pantheonminio}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
    volumes:
      - governance-data:/data/governance
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${GOVERNANCE_PORT:-38082}:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  deployment:
    build:
      context: .
      dockerfile: services/deployment/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8095"
      DEPLOYMENT_DATA_DIR: /data/governance
      PANTHEON_GOVERNANCE_DATA_DIR: /data/governance
    volumes:
      - governance-data:/data/governance
    depends_on:
      governance:
        condition: service_healthy
    ports:
      - "${DEPLOYMENT_PORT:-38095}:8095"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  telemetry:
    build:
      context: .
      dockerfile: services/telemetry/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8083"
      TELEMETRY_STORAGE_DIR: /data/telemetry
      TELEMETRY_DB_DSN: ${TELEMETRY_DB_DSN:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_RUNTIME_MANAGER_URL: ${PANTHEON_RUNTIME_MANAGER_URL:-}
      PANTHEON_RUNTIME_MANAGER_TOKEN: ${PANTHEON_RUNTIME_MANAGER_TOKEN:-}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
      LINEAGE_READ_CORPUS_PATH: /workspace/services/registry/lineage/lin001a_benchmark_corpus.json
    volumes:
      - telemetry-data:/data/telemetry
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${TELEMETRY_PORT:-38083}:8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  incidents:
    build:
      context: .
      dockerfile: services/incidents/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8090"
      INCIDENTS_DATA_DIR: /data/incidents
      PANTHEON_TELEMETRY_URL: http://telemetry:8083
      PANTHEON_RUNTIME_MANAGER_URL: ${PANTHEON_RUNTIME_MANAGER_URL:-}
      PANTHEON_RUNTIME_MANAGER_TOKEN: ${PANTHEON_RUNTIME_MANAGER_TOKEN:-}
      POSTMORTEMS_URL: http://postmortems:8091
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_PERSISTENCE_POSTURE: ${PANTHEON_PERSISTENCE_POSTURE:-production}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_S3_ACCESS_KEY: ${PANTHEON_S3_ACCESS_KEY:-pantheon}
      PANTHEON_S3_SECRET_KEY: ${PANTHEON_S3_SECRET_KEY:-pantheonminio}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
      # Hard-enforce Postgres in staging/prod; override to dev only for local dev rollback.
      INCIDENT_STORE_BACKEND: ${INCIDENT_STORE_BACKEND:-postgres}
      INCIDENT_STORE_DSN: ${INCIDENT_STORE_DSN:-}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
    volumes:
      - incident-data:/data/incidents
    depends_on:
      telemetry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${INCIDENTS_PORT:-38090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  postmortems:
    build:
      context: .
      dockerfile: services/postmortems/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8091"
      POSTMORTEMS_DATA_DIR: /data/incidents
      INCIDENTS_DATA_DIR: /data/incidents
      PANTHEON_TELEMETRY_URL: http://telemetry:8083
      PANTHEON_RUNTIME_MANAGER_URL: ${PANTHEON_RUNTIME_MANAGER_URL:-}
      PANTHEON_RUNTIME_MANAGER_TOKEN: ${PANTHEON_RUNTIME_MANAGER_TOKEN:-}
      EVOLUTION_URL: http://evolution:8093
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_PERSISTENCE_POSTURE: ${PANTHEON_PERSISTENCE_POSTURE:-production}
      # Hard-enforce Postgres in staging/prod; override to dev only for local dev rollback.
      POSTMORTEM_STORE_BACKEND: ${POSTMORTEM_STORE_BACKEND:-postgres}
      POSTMORTEM_STORE_DSN: ${POSTMORTEM_STORE_DSN:-}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_S3_ACCESS_KEY: ${PANTHEON_S3_ACCESS_KEY:-pantheon}
      PANTHEON_S3_SECRET_KEY: ${PANTHEON_S3_SECRET_KEY:-pantheonminio}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
    volumes:
      - incident-data:/data/incidents
    depends_on:
      incidents:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${POSTMORTEMS_PORT:-38091}:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  operator-bff:
    # Current staging baseline intentionally runs one operator-bff instance on
    # VM1. BFF replicas and a BFF load balancer remain deferred by
    # BFF_HA_AND_CONTROL_PLANE_RESILIENCE.md.
    build:
      context: .
      dockerfile: services/control-plane/bff/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    environment:
      BRIDGE_SIGNING_PRIVATE_KEY: ${BRIDGE_SIGNING_PRIVATE_KEY:-}
      BRIDGE_SIGNING_KEY_ID: ${BRIDGE_SIGNING_KEY_ID:-}
      BRIDGE_SIGNING_PUBLIC_KEYS_JSON: ${BRIDGE_SIGNING_PUBLIC_KEYS_JSON:-}
      PANTHEON_DEVELOPMENT_TOOLING_ROUTES_ENABLED: ${PANTHEON_DEVELOPMENT_TOOLING_ROUTES_ENABLED:-false}
      BFF_DATA_DIR: /data/bff
      AGORA_WORKSHOP_STORE_BACKEND: ${AGORA_WORKSHOP_STORE_BACKEND:-postgres}
      AGORA_WORKSHOP_STORE_DSN: ${AGORA_WORKSHOP_STORE_DSN:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      AGORA_WORKSHOP_STORE_SCHEMA: ${AGORA_WORKSHOP_STORE_SCHEMA:-agora}
      AGORA_DASHBOARD_STORE_BACKEND: ${AGORA_DASHBOARD_STORE_BACKEND:-postgres}
      AGORA_DASHBOARD_STORE_DSN: ${AGORA_DASHBOARD_STORE_DSN:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      AGORA_DASHBOARD_STORE_SCHEMA: ${AGORA_DASHBOARD_STORE_SCHEMA:-agora}
      AGORA_RESEARCH_STORE_BACKEND: ${AGORA_RESEARCH_STORE_BACKEND:-postgres}
      AGORA_RESEARCH_STORE_DSN: ${AGORA_RESEARCH_STORE_DSN:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      AGORA_RESEARCH_STORE_SCHEMA: ${AGORA_RESEARCH_STORE_SCHEMA:-agora_research}
      AGORA_TRADING_ROOM_STORE_BACKEND: ${AGORA_TRADING_ROOM_STORE_BACKEND:-postgres}
      AGORA_TRADING_ROOM_STORE_DSN: ${AGORA_TRADING_ROOM_STORE_DSN:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      AGORA_TRADING_ROOM_STORE_SCHEMA: ${AGORA_TRADING_ROOM_STORE_SCHEMA:-agora}
      PANTHEON_STATUS_ROOT: ${PANTHEON_STATUS_ROOT_CONTAINER:-/workspace/status-root}
      BFF_READ_SURFACE_STATE: ${BFF_READ_SURFACE_STATE:-fresh}
      PANTHEON_BFF_ALLOW_LOCAL_SNAPSHOT_FALLBACK: "false"
      PANTHEON_BFF_CAPABILITY_SNAPSHOT_STORE: /data/bff/capability_snapshots.json
      PANTHEON_BFF_KILL_SWITCH_STORE: /data/bff/kill_switch.json
      PANTHEON_BFF_PERSONA_SESSION_STORE: /data/bff/persona_sessions.json
      PANTHEON_BFF_PAPER_LIVE_DRIFT_STORE: /data/bff/paper_live_drift_reports.json
      PANTHEON_BFF_V5_INTERVENTION_STORE: /data/bff/v5_interventions.json
      PANTHEON_ASSISTANT_KERNEL_ENABLED: ${PANTHEON_ASSISTANT_KERNEL_ENABLED:-false}
      PANTHEON_ASSISTANT_CONTROL_MODE_STORE_PATH: ${PANTHEON_ASSISTANT_CONTROL_MODE_STORE_PATH:-/data/bff/assistant-control-mode.json}
      PANTHEON_ASSISTANT_CONTROL_IDLE_TTL_SECONDS: ${PANTHEON_ASSISTANT_CONTROL_IDLE_TTL_SECONDS:-300}
      PANTHEON_BFF_CORS_ORIGINS: ${PANTHEON_BFF_CORS_ORIGINS:-https://pantheon-lupin-staging-fe.104.155.223.192.sslip.io,https://pantheon-ai-system-front-staging-live.lovable.app}
      PANTHEON_ENV: ${PANTHEON_ENV:-staging-live}
      PANTHEON_LIVE_BROKER_ENABLED: ${PANTHEON_LIVE_BROKER_ENABLED:-true}
      PANTHEON_BFF_AUTH_STUB: ${PANTHEON_BFF_AUTH_STUB:-false}
      PANTHEON_BFF_AUTH_MODE: ${PANTHEON_BFF_AUTH_MODE:-strict}
      PANTHEON_BFF_STUB_CAPABILITIES: ${PANTHEON_BFF_STUB_CAPABILITIES:-}
      PANTHEON_BFF_JWT_SECRET: ${PANTHEON_BFF_JWT_SECRET:-}
      PANTHEON_BFF_JWT_ISSUER: ${PANTHEON_BFF_JWT_ISSUER:-}
      PANTHEON_BFF_JWT_AUDIENCE: ${PANTHEON_BFF_JWT_AUDIENCE:-}
      PANTHEON_BFF_JWKS_URI: ${PANTHEON_BFF_JWKS_URI:-}
      PANTHEON_BFF_OIDC_DISCOVERY_URL: ${PANTHEON_BFF_OIDC_DISCOVERY_URL:-}
      PANTHEON_BFF_OIDC_ISSUER: ${PANTHEON_BFF_OIDC_ISSUER:-}
      PANTHEON_BFF_OIDC_AUDIENCE: ${PANTHEON_BFF_OIDC_AUDIENCE:-}
      PANTHEON_BFF_ROLE_CLAIMS: ${PANTHEON_BFF_ROLE_CLAIMS:-roles,role}
      PANTHEON_BFF_ROLE_MAP: ${PANTHEON_BFF_ROLE_MAP:-}
      PANTHEON_BFF_ROLE_MAP_MODE: ${PANTHEON_BFF_ROLE_MAP_MODE:-passthrough}
      PANTHEON_BFF_DEFAULT_ROLE: ${PANTHEON_BFF_DEFAULT_ROLE:-operator}
      PANTHEON_BFF_MFA_REQUIRED: ${PANTHEON_BFF_MFA_REQUIRED:-false}
      PANTHEON_BFF_MFA_CLAIMS: ${PANTHEON_BFF_MFA_CLAIMS:-amr,acr,mfa,mfa_verified}
      PANTHEON_BFF_MFA_VALUES: ${PANTHEON_BFF_MFA_VALUES:-true,1,yes,mfa,otp,totp,webauthn}
      PANTHEON_INTERNAL_API_URL: ${PANTHEON_INTERNAL_API_URL:-}
      PANTHEON_RUNTIME_MANAGER_URL: ${PANTHEON_RUNTIME_MANAGER_URL:-}
      PANTHEON_RUNTIME_MANAGER_TOKEN: ${PANTHEON_RUNTIME_MANAGER_TOKEN:-}
      # Production persona provisioning must use the authoritative adapter RPC
      # boundary.  An empty URL would make the cron registrar fall back to its
      # non-authoritative dry-run runtime, so fail compose rendering instead.
      PANTHEON_OPENCLAW_GATEWAY_ADAPTER_URL: ${PANTHEON_OPENCLAW_GATEWAY_ADAPTER_URL:?set a nonblank reachable OpenClaw gateway adapter URL}
      PANTHEON_OPENCLAW_ADAPTER_SERVICE_TOKEN: ${PANTHEON_OPENCLAW_ADAPTER_SERVICE_TOKEN:?set the reviewed OpenClaw adapter service token}
      PANTHEON_PAPER_FLEET_RECONCILER_URL: ${PANTHEON_PAPER_FLEET_RECONCILER_URL:-}
      PANTHEON_GOVERNANCE_APPROVAL_API_URL: http://governance:8082
      PANTHEON_DEPLOYMENT_API_URL: http://deployment:8095
      PANTHEON_CAPITAL_API_URL: http://capital:8092
      PANTHEON_EVOLUTION_API_URL: http://evolution:8093
      PANTHEON_INCIDENTS_API_URL: http://incidents:8090
      PANTHEON_POSTMORTEMS_API_URL: http://postmortems:8091
      PANTHEON_TELEMETRY_API_URL: http://telemetry:8083
      PANTHEON_LINEAGE_READ_URL: http://lineage-read:8094
      PANTHEON_MEMORY_API_URL: http://memory:8086
      PANTHEON_REGISTRY_URL: http://registry:8087
      PANTHEON_REGISTRY_API_URL: ${PANTHEON_REGISTRY_API_URL:-http://registry:8087}
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_PERSONA_PROVISIONING_STORE_BACKEND: ${PANTHEON_PERSONA_PROVISIONING_STORE_BACKEND:-postgres}
      PANTHEON_PERSONA_PROVISIONING_STORE_DSN: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_PERSONA_PROVISIONING_STORE_SCHEMA: ${PANTHEON_PERSONA_PROVISIONING_STORE_SCHEMA:-bff}
      MANAGEMENT_AI_STORE_BACKEND: ${MANAGEMENT_AI_STORE_BACKEND:-postgres}
      PANTHEON_TRADE_JOURNEY_ACTION_LEDGER_BACKEND: ${PANTHEON_TRADE_JOURNEY_ACTION_LEDGER_BACKEND:-postgres}
      PANTHEON_TRADE_JOURNEY_ACTION_LEDGER_DSN: ${PANTHEON_TRADE_JOURNEY_ACTION_LEDGER_DSN:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_TRADE_JOURNEY_CLOCK_DRIFT_SECONDS: ${PANTHEON_TRADE_JOURNEY_CLOCK_DRIFT_SECONDS:-5}
      MANAGEMENT_AI_STORE_SCHEMA: ${MANAGEMENT_AI_STORE_SCHEMA:-management_ai}
      MANAGEMENT_AI_STORE_DSN: ${MANAGEMENT_AI_STORE_DSN:-}
      MANAGEMENT_AI_DATABASE_URL: ${MANAGEMENT_AI_DATABASE_URL:-postgresql://pantheon_management_ai:pantheon_management_ai_dev@postgres:5432/pantheon}
      PANTHEON_MGMT_AI_ATTACH_BUCKET: ${PANTHEON_MGMT_AI_ATTACH_BUCKET:-}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
    volumes: !override
      - bff-data:/data/bff
      - ${PANTHEON_STATUS_ROOT_HOST:-.}:${PANTHEON_STATUS_ROOT_CONTAINER:-/workspace/status-root}:ro
    depends_on:
      telemetry:
        condition: service_healthy
      governance:
        condition: service_healthy
      deployment:
        condition: service_healthy
      capital:
        condition: service_healthy
      incidents:
        condition: service_healthy
      postmortems:
        condition: service_healthy
      registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${BFF_PORT:-38001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  persona:
    build:
      context: .
      dockerfile: services/control-plane/persona/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8002"
      LLM_BACKEND: ${LLM_BACKEND:-anthropic}
      PANTHEON_BFF_URL: http://operator-bff:8001
      PANTHEON_REGISTRY_URL: http://registry:8087
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
    depends_on:
      operator-bff:
        condition: service_healthy
      registry:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${PERSONA_PORT:-38002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  evaluation:
    build:
      context: .
      dockerfile: services/evaluation/Dockerfile

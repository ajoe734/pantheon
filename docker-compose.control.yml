# Dedicated VM-1 control-plane stack for DEPLOY-007.
#
# Usage:
#   docker compose --env-file env/prod-control.env.example -f docker-compose.control.yml up -d
#
# This slice intentionally excludes `runtime-manager`, `governance`, and `router`.
# Services that can tolerate a missing runtime command backend are configured to
# boot in degraded/read-only mode instead of requiring those services locally.

name: pantheon-control

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pantheon}
      PANTHEON_APP_DB_USER: ${PANTHEON_APP_DB_USER:-pantheon_app}
      PANTHEON_APP_DB_PASSWORD: ${PANTHEON_APP_DB_PASSWORD:-pantheon_app}
      PANTHEON_APP_DB_NAME: ${PANTHEON_APP_DB_NAME:-pantheon}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    ports:
      - "${POSTGRES_PORT:-35432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pantheon}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pantheon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pantheonminio}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-39000}:9000"
      - "${MINIO_CONSOLE_PORT:-39001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--http_port", "8222", "--store_dir", "/data/jetstream"]
    volumes:
      - nats-data:/data/jetstream
    ports:
      - "${NATS_PORT:-34222}:4222"
      - "${NATS_MONITOR_PORT:-38222}:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  telemetry:
    build:
      context: .
      dockerfile: services/telemetry/Dockerfile
    environment:
      PORT: "8083"
      TELEMETRY_STORAGE_DIR: /data/telemetry
      TELEMETRY_DB_DSN: ${TELEMETRY_DB_DSN:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_RUNTIME_MANAGER_URL: ${PANTHEON_RUNTIME_MANAGER_URL:-}
      PANTHEON_RUNTIME_MANAGER_TOKEN: ${PANTHEON_RUNTIME_MANAGER_TOKEN:-}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
      LINEAGE_READ_CORPUS_PATH: /workspace/services/registry/lineage/lin001a_benchmark_corpus.json
    volumes:
      - telemetry-data:/data/telemetry
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${TELEMETRY_PORT:-38083}:8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  incidents:
    build:
      context: .
      dockerfile: services/incidents/Dockerfile
    environment:
      PORT: "8090"
      INCIDENTS_DATA_DIR: /data/incidents
      PANTHEON_TELEMETRY_URL: http://telemetry:8083
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
    volumes:
      - incident-data:/data/incidents
    depends_on:
      telemetry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${INCIDENTS_PORT:-38090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  postmortems:
    build:
      context: .
      dockerfile: services/postmortems/Dockerfile
    environment:
      PORT: "8091"
      POSTMORTEMS_DATA_DIR: /data/incidents
      INCIDENTS_DATA_DIR: /data/incidents
      PANTHEON_TELEMETRY_URL: http://telemetry:8083
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
    volumes:
      - incident-data:/data/incidents
    depends_on:
      incidents:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${POSTMORTEMS_PORT:-38091}:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  operator-bff:
    build:
      context: .
      dockerfile: services/control-plane/bff/Dockerfile
    environment:
      BFF_DATA_DIR: /data/bff
      BFF_READ_SURFACE_STATE: ${BFF_READ_SURFACE_STATE:-degraded}
      PANTHEON_GOVERNANCE_DATA_DIR: /data/governance
      PANTHEON_RUNTIME_DATA_DIR: /data/runtime
      INCIDENTS_DATA_DIR: /data/incidents
      POSTMORTEMS_DATA_DIR: /data/incidents
      PANTHEON_INTERNAL_API_URL: ${PANTHEON_INTERNAL_API_URL:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
    volumes:
      - bff-data:/data/bff
      - governance-data:/data/governance:ro
      - runtime-data:/data/runtime:ro
      - incident-data:/data/incidents:ro
    depends_on:
      telemetry:
        condition: service_healthy
      incidents:
        condition: service_healthy
      postmortems:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${BFF_PORT:-38001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  persona:
    build:
      context: services/control-plane/persona
      dockerfile: Dockerfile
    environment:
      PORT: "8002"
      LLM_BACKEND: ${LLM_BACKEND:-anthropic}
      PANTHEON_BFF_URL: http://operator-bff:8001
      PANTHEON_REGISTRY_URL: http://registry:8087
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
    depends_on:
      operator-bff:
        condition: service_healthy
      registry:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${PERSONA_PORT:-38002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  evaluation:
    build:
      context: .
      dockerfile: services/evaluation/Dockerfile
    environment:
      PORT: "8084"
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${EVALUATION_PORT:-38084}:8084"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  feedback:
    build:
      context: .
      dockerfile: services/feedback/Dockerfile
    environment:
      PORT: "8085"
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${FEEDBACK_PORT:-38085}:8085"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  memory:
    build:
      context: .
      dockerfile: services/memory/Dockerfile
    environment:
      PORT: "8086"
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${MEMORY_PORT:-38086}:8086"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  registry:
    build:
      context: .
      dockerfile: services/registry/Dockerfile
    environment:
      PORT: "8087"
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_S3_ACCESS_KEY: ${PANTHEON_S3_ACCESS_KEY:-pantheon}
      PANTHEON_S3_SECRET_KEY: ${PANTHEON_S3_SECRET_KEY:-pantheonminio}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${REGISTRY_PORT:-38087}:8087"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  optimizer-svc:
    build:
      context: .
      dockerfile: services/optimizer-svc/Dockerfile
    environment:
      PORT: "8088"
      DATABASE_URL: ${DATABASE_URL:-postgresql://pantheon_app:pantheon_app@postgres:5432/pantheon}
      PANTHEON_NATS_URL: ${PANTHEON_NATS_URL:-nats://nats:4222}
      PANTHEON_S3_ENDPOINT: ${PANTHEON_S3_ENDPOINT:-http://minio:9000}
      PANTHEON_ARTIFACT_BUCKET: ${PANTHEON_ARTIFACT_BUCKET:-pantheon-artifacts}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${OPTIMIZER_PORT:-38088}:8088"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  promotion:
    build:
      context: .
      dockerfile: services/promotion/Dockerfile
    environment:
      PORT: "8089"
      PROMOTION_DATA_DIR: /data/promotion
    volumes:
      - promotion-data:/data/promotion
    ports:
      - "${PROMOTION_PORT:-38089}:8089"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  capital:
    build:
      context: .
      dockerfile: services/capital/Dockerfile
    environment:
      PORT: "8092"
      CAPITAL_DATA_DIR: /data/capital
    volumes:
      - capital-data:/data/capital
    ports:
      - "${CAPITAL_PORT:-38092}:8092"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  evolution:
    build:
      context: .
      dockerfile: services/evolution/Dockerfile
    environment:
      PORT: "8093"
      EVOLUTION_DATA_DIR: /data/evolution
      INCIDENT_DATA_DIR: /data/incidents
    volumes:
      - evolution-data:/data/evolution
      - incident-data:/data/incidents
    depends_on:
      incidents:
        condition: service_healthy
    ports:
      - "${EVOLUTION_PORT:-38093}:8093"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  lineage-read:
    build:
      context: .
      dockerfile: services/lineage-read/Dockerfile
    environment:
      PORT: "8094"
      LINEAGE_DATA_DIR: /data/lineage
    volumes:
      - lineage-data:/data/lineage
    ports:
      - "${LINEAGE_PORT:-38094}:8094"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/__health__', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  bff-data:
  capital-data:
  evolution-data:
  governance-data:
  incident-data:
  lineage-data:
  minio-data:
  nats-data:
  postgres-data:
  promotion-data:
  runtime-data:
  telemetry-data:

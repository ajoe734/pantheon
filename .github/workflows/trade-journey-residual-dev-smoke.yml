name: Trade Journey Residual Dev Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify durable ledger restart and clock drift
        env:
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-lupin-dev' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          PROJECT_ID: ${{ vars.GCP_DEPLOY_PROJECT_ID || 'pantheon-benjamin-20260528' }}
        run: |
          gcloud compute ssh "${REMOTE_USER}@${DEV_VM}" \
            --zone "${DEV_ZONE}" --project "${PROJECT_ID}" --ssh-flag=-T \
            --command "PANTHEON_DEV_REPO=/home/lupin/code/pantheon bash -s" \
            < scripts/verify_trade_journey_residual_dev.sh

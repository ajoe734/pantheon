name: TJ-E2E-012 Hosted Acceptance

on:
  workflow_dispatch:
    inputs:
      bff_base_url:
        description: "Pantheon dev BFF base URL"
        required: true
        default: "https://pantheon-lupin-dev-bff.35.201.204.12.sslip.io"
        type: string
      fe_deployment_url:
        description: "Pantheon dev frontend deployment manifest URL"
        required: true
        default: "https://pantheon-lupin-dev-fe.35.201.204.12.sslip.io/deployment.json"
        type: string
      expected_bff_sha:
        description: "Exact deployed Pantheon BFF commit SHA"
        required: true
        type: string
      expected_fe_sha:
        description: "Exact deployed execute-plans commit SHA"
        required: true
        type: string
      tenant_id:
        description: "Acceptance tenant"
        required: true
        default: "tenant-dev"
        type: string
      forbidden_tenant_id:
        description: "Different tenant used only for negative RBAC probes"
        required: true
        default: "tenant-forbidden-proof"
        type: string
      replay_as_of:
        description: "Scenario 12 timezone-aware replay timestamp"
        required: true
        default: "2026-07-12T12:01:30Z"
        type: string
      ambiguity_identifier:
        description: "Scenario 9 identifier intentionally shared by two journeys"
        required: true
        default: "ambiguous-scenario-9"
        type: string

permissions:
  contents: read

concurrency:
  group: tj-e2e-012-hosted-acceptance-dev
  cancel-in-progress: false

jobs:
  hosted-acceptance:
    name: Twelve-scenario hosted evidence
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    env:
      BFF_BASE: ${{ inputs.bff_base_url }}
      TJ_E2E_FE_DEPLOYMENT_URL: ${{ inputs.fe_deployment_url }}
      TJ_E2E_ALLOWED_BFF_ORIGIN: ${{ vars.DEV_BFF_URL || 'https://pantheon-lupin-dev-bff.35.201.204.12.sslip.io' }}
      TJ_E2E_ALLOWED_FE_ORIGIN: ${{ vars.DEV_FE_URL || 'https://pantheon-lupin-dev-fe.35.201.204.12.sslip.io' }}
      TJ_E2E_EXPECTED_BFF_SHA: ${{ inputs.expected_bff_sha }}
      TJ_E2E_EXPECTED_FE_SHA: ${{ inputs.expected_fe_sha }}
      TJ_E2E_TENANT_ID: ${{ inputs.tenant_id }}
      TJ_E2E_FORBIDDEN_TENANT_ID: ${{ inputs.forbidden_tenant_id }}
      TJ_E2E_REPLAY_AS_OF: ${{ inputs.replay_as_of }}
      TJ_E2E_AMBIGUITY_IDENTIFIER: ${{ inputs.ambiguity_identifier }}
      TJ_E2E_OPERATOR_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_ID || 'pantheon-dev-operator-a-v1' }}
      TJ_E2E_OPERATOR_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_SECRET }}
      TJ_E2E_VIEWER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_ID || 'pantheon-dev-viewer-v1' }}
      TJ_E2E_VIEWER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_SECRET }}
      TJ_E2E_EVIDENCE_DIR: .artifacts/TJ-E2E-012/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout dispatched revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify exact hosted pair and all twelve source scenarios
        run: python3 scripts/verify_hosted_scenarios.py

      - name: Upload immutable redacted acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tj-e2e-012-hosted-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/TJ-E2E-012/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30

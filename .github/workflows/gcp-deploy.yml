name: Build and Deploy LEAN to GCP

on:
  push:
    branches: [ main ]

jobs:
  setup-build-publish:
    name: Setup, Build, and Publish
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for GCP
      run: gcloud auth configure-docker asia-east1-docker.pkg.dev

    - name: Build Docker Image
      run: |
        docker build -t asia-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/openclaw/lean-engine:${{ github.sha }} .

    - name: Push Docker Image
      run: |
        docker push asia-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/openclaw/lean-engine:${{ github.sha }}

    # 這裡可以加入部署到 GKE 的指令

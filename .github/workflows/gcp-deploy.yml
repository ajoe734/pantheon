name: Publish images to Artifact Registry

# Triggers after every push to the default branch.
# Prerequisite: the Stage 0 CI workflow (stage-0-ci.yml) must also be green;
# enforce this via a branch-protection rule that requires stage-0-ci to pass
# before any push reaches the default branch.
on:
  push:
    branches:
      - backend-dev-publish-20260429
      - master
      - main
  workflow_dispatch:
    inputs:
      services:
        description: >
          Comma-separated service IDs to build, or "all" for a full rebuild.
          Leave blank to auto-detect changed services.
        required: false
        default: ""
      env_tag:
        description: "Environment pointer tag (e.g. dev-candidate, paper-candidate)"
        required: false
        default: "dev-candidate"

permissions:
  contents: read
  id-token: write   # required for OIDC token exchange with GCP Workload Identity

concurrency:
  group: gcp-deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight publish

jobs:
  publish:
    name: Build and publish to Artifact Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for changed-path detection
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Identity: OIDC → GCP Workload Identity Federation ──────────────────
      # GitHub exchanges an OIDC token for a short-lived GCP access token.
      # No long-lived service-account key is stored in GitHub.
      #
      # Required GCP-side setup (one-time, documented in Section 19 of
      # Pantheon_GCP_GitHub_Docker_正式部署與環境設計_v2.md):
      #   - Workload Identity Pool:  pantheon-github-pool
      #   - Pool Provider:           pantheon-github-provider
      #     attribute mapping:
      #       google.subject       = assertion.sub
      #       attribute.repository = assertion.repository
      #     attribute condition:
      #       attribute.repository == "ajoe734/pantheon"
      #   - Service account:         pantheon-cloud-build@<PROJECT_ID>.iam.gserviceaccount.com
      #     roles: roles/cloudbuild.builds.editor, roles/storage.objectAdmin (for build source),
      #            roles/serviceusage.serviceUsageConsumer
      #   - IAM binding (WIF → SA):
      #     serviceAccount:pantheon-cloud-build@...  with  roles/iam.workloadIdentityUser
      #     principal: principalSet://iam.googleapis.com/projects/<NUMBER>/locations/global/
      #                workloadIdentityPools/pantheon-github-pool/attribute.repository/ajoe734/pantheon
      #
      # Store these as repository variables (not secrets, since they are not secret):
      #   GCP_PROJECT_ID            GCP project ID (e.g. pantheon-shared)
      #   GCP_PROJECT_NUMBER        GCP project number (numeric)
      #   GCP_WIF_PROVIDER          full provider resource name
      #   GCP_SERVICE_ACCOUNT       service account email
      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Detect changed services ─────────────────────────────────────────────
      # Use the Stage 0 matrix to determine which build targets changed.
      # This respects the global-changed fast-path (full rebuild when matrix
      # files or this workflow itself changes).
      - name: Detect changed build targets
        id: detect
        env:
          STAGE0_BASE_SHA: ${{ github.event.before }}
          STAGE0_HEAD_SHA: ${{ github.sha }}
        run: |
          # If the caller supplied an explicit service list, skip detection.
          MANUAL_SERVICES="${{ github.event.inputs.services }}"
          if [ -n "${MANUAL_SERVICES}" ]; then
            echo "services=${MANUAL_SERVICES}" >> "$GITHUB_OUTPUT"
            echo "[info] manual override: building ${MANUAL_SERVICES}"
            exit 0
          fi

          # Run the Stage 0 detector and parse its JSON report.
          REPORT="$(python3 scripts/ci_stage0.py detect-changes)"

          # build_ids is a JSON array like ["router","governance-api","bff",...].
          # Convert to comma-separated for the Cloud Build substitution.
          GLOBAL_CHANGED="$(printf '%s' "${REPORT}" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["global_changed"]).lower())')"
          GLOBAL_IMAGE_CHANGED="$(printf '%s' "${REPORT}" | python3 -c 'import json,sys; files=json.load(sys.stdin)["changed_files"]; image_global_files={"cloudbuild.yaml","docker-compose.yml","docker-compose.remote-dev.yml"}; print(str(any(path in image_global_files for path in files)).lower())')"
          if [ "${GLOBAL_CHANGED}" = "true" ] && [ "${GLOBAL_IMAGE_CHANGED}" = "true" ]; then
            SERVICES="all"
          elif [ "${GLOBAL_CHANGED}" = "true" ]; then
            SERVICES=""
          else
            SERVICES="$(printf '%s' "${REPORT}" | python3 -c 'import json,sys; print(",".join(json.load(sys.stdin)["build_ids"]))')"
          fi

          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"

          if [ -z "${SERVICES}" ]; then
            echo "[info] no build targets changed — skipping Cloud Build submission"
          elif [ "${SERVICES}" = "all" ]; then
            echo "[info] image-impacting global change detected — building all services"
          else
            echo "[info] services to build: ${SERVICES}"
          fi

      # ── Submit build to Cloud Build ─────────────────────────────────────────
      # The build runs entirely in GCP; GitHub Actions only submits the job and
      # waits for the result.  All image construction and Artifact Registry
      # publishing happens inside Cloud Build, never on the GitHub runner.
      - name: Submit Cloud Build job
        if: steps.detect.outputs.services != ''
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCS_SOURCE_STAGING_DIR: ${{ vars.GCP_BUILD_STAGING_BUCKET || 'gs://pantheon-493602-pantheon-builds/source' }}
          ENV_TAG: ${{ github.event.inputs.env_tag || 'dev-candidate' }}
          SERVICES: ${{ steps.detect.outputs.services }}
        run: |
          gcloud builds submit \
            --project="${GCP_PROJECT_ID}" \
            --config=cloudbuild.yaml \
            --gcs-source-staging-dir="${GCS_SOURCE_STAGING_DIR}" \
            --substitutions="_ENV_TAG=${ENV_TAG},_SERVICES=${SERVICES}" \
            --timeout=3600s \
            .

      - name: Skip notice
        if: steps.detect.outputs.services == ''
        run: echo "No Dockerfile-bearing targets changed on this push — Cloud Build submission skipped."

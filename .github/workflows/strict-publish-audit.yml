name: Strict Publish Audit

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Lovable deployment URL to audit, for example https://.../management"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: strict-publish-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lovable strict-publish audit
    runs-on: ubuntu-latest
    env:
      LOVABLE_DEPLOYMENT_URL: ${{ inputs.deployment_url }}
      LOVABLE_AUDIT_OUTPUT_DIR: ${{ runner.temp }}/strict-publish-audit
      VITE_BFF_MODE: live
      VITE_BFF_FALLBACK: strict
      VITE_BFF_REAL_WRITES: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate audit wrapper
        run: |
          bash -n scripts/lovable/ci_strict_publish_audit.sh
          python3 -m py_compile scripts/audit_lovable_strict_publish.py

      - name: Run strict-publish audit
        run: bash scripts/lovable/ci_strict_publish_audit.sh

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-publish-audit
          path: ${{ env.LOVABLE_AUDIT_OUTPUT_DIR }}/
          if-no-files-found: warn

      - name: Summarize audit
        if: always()
        run: |
          {
            echo "## Strict publish audit"
            echo "- Deployment URL: \`${LOVABLE_DEPLOYMENT_URL}\`"
            echo "- Required env: \`VITE_BFF_MODE=live\`, \`VITE_BFF_FALLBACK=strict\`, \`VITE_BFF_REAL_WRITES=false\`"
            echo
            if [[ -f "${LOVABLE_AUDIT_OUTPUT_DIR}/strict-publish-audit.md" ]]; then
              cat "${LOVABLE_AUDIT_OUTPUT_DIR}/strict-publish-audit.md"
            else
              echo "Audit report was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

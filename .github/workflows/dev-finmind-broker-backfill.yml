name: Dev FinMind Two-Year Broker Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Optional window start date (YYYY-MM-DD); defaults to two years before end_date'
        required: false
        default: ''
        type: string
      end_date:
        description: 'Optional window end date (YYYY-MM-DD); defaults to latest published broker session'
        required: false
        default: ''
        type: string
      max_requests:
        description: 'Maximum uncompleted sessions fetched in this dispatch (1..600; default 180)'
        required: false
        default: '180'
        type: string
      max_wall_seconds:
        description: 'Maximum wall-clock seconds for this dispatch (60..2100; default 2100 = 35m)'
        required: false
        default: '2100'
        type: string
      min_interval_seconds:
        description: 'Minimum interval in seconds between FinMind requests (>=1.0; default 1.5 => <=2400/h)'
        required: false
        default: '1.5'
        type: string
      verify_only:
        description: 'Run only the read-only 480-session two-year coverage check (0 requests, 0 writes)'
        required: false
        default: false
        type: boolean

concurrency:
  group: dev-finmind-broker-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: FinMind Two-Year Broker Backfill
    runs-on: ubuntu-latest
    # Stated dev environment lease hold limit per dispatch: at most 45 minutes.
    timeout-minutes: 45
    environment: dev
    env:
      CONTROLLER: ${{ github.workspace }}/.lease-controller
      DEV_DEPLOY_SSH_HOST: ${{ vars.DEV_DEPLOY_SSH_HOST }}
      DEV_DEPLOY_SSH_USER: ${{ vars.NONPROD_REMOTE_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ajoe734/pantheon
          ref: a4b0cdca261b714c386341534b07fc43badd1a7e
          path: .lease-controller
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned direct SSH transport
        env:
          DEV_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEV_DEPLOY_SSH_PRIVATE_KEY }}
          DEV_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEV_DEPLOY_SSH_KNOWN_HOSTS }}
        run: scripts/dev_vm_ssh.sh prepare "${RUNNER_TEMP}/pantheon-dev-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null

      - name: Acquire shared dev environment lease
        id: lease
        env:
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$(git -C "${CONTROLLER}" rev-parse HEAD)" == "a4b0cdca261b714c386341534b07fc43badd1a7e" ]]
          printf '%s  %s\n' \
            d0d9cc63a21bb1fbf4f5e2dc14c60a2418a598cfe608e7d0df0189818e3d74ac "${CONTROLLER}/scripts/dev_environment_lease.py" \
            6c82021b93621f16776d5d67a9e20cb9d690f7ebfa257ebf8c329f7d158fb2c2 "${CONTROLLER}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict
          lease_dir="$(mktemp -d "${RUNNER_TEMP}/pantheon-dev-lease-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          python3 "${CONTROLLER}/scripts/dev_environment_lease.py" acquire \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --mode deployment \
            --owner "pantheon:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --ttl-seconds 300 \
            --wait-seconds 0 \
            --poll-seconds 5 \
            --state-file "${lease_dir}/state.json" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "ld=${lease_dir}" >> "${GITHUB_OUTPUT}"

      - name: Start identity-bound lease heartbeat
        id: heartbeat
        env:
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          LD: ${{ steps.lease.outputs.ld }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          exec {token_fd}<<<"${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          env -i \
            PATH="${PATH}" HOME="${HOME}" LANG=C.UTF-8 \
            PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 PYTHONSTARTUP= PYTHONINSPECT= \
            python3 "${CONTROLLER}/scripts/dev_environment_lease.py" heartbeat-loop \
              --repository ajoe734/execute-plans \
              --branch environment-coordination \
              --path .pantheon/environment-leases/pantheon-dev-environment.json \
              --resource pantheon-dev-environment \
              --state-file "${LD}/state.json" \
              --ttl-seconds 300 \
              --interval-seconds 60 \
              --failure-json-out "${LD}/heartbeat-failure.json" \
              --shutdown-json-out "${LD}/heartbeat-stop.json" \
              --identity-json-out "${LD}/heartbeat-identity.json" \
              --token-stdin \
              <&"${token_fd}" >"${LD}/heartbeat.log" 2>&1 &
          heartbeat_pid=$!
          disown "${heartbeat_pid}" 2>/dev/null || true
          exec {token_fd}<&-
          printf '%s\n' "${heartbeat_pid}" > "${LD}/heartbeat.pid"
          for _ in $(seq 1 100); do
            [[ -s "${LD}/heartbeat-identity.json" ]] && break
            kill -0 "${heartbeat_pid}" 2>/dev/null || { cat "${LD}/heartbeat.log" >&2; exit 75; }
            sleep 0.1
          done
          python3 "${CONTROLLER}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
            --identity-file "${LD}/heartbeat-identity.json" \
            --pid "${heartbeat_pid}" \
            --expected-cli "${CONTROLLER}/scripts/dev_environment_lease.py" \
            --state-file "${LD}/state.json" >/dev/null
          python3 "${CONTROLLER}/scripts/dev_environment_lease.py" verify \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --state-file "${LD}/state.json" \
            --max-heartbeat-age-seconds 120 \
            --initial-visibility-wait-seconds 15 \
            --initial-visibility-poll-seconds 1 >/dev/null

      - name: Execute bounded FinMind two-year broker backfill
        id: broker_backfill
        continue-on-error: true
        timeout-minutes: 38
        env:
          PANTHEON_DEPLOY_WORKTREE_ROOT: ${{ vars.DEV_DEPLOY_WORKTREE_ROOT }}
          TARGET_ENV: dev
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.ld }}/state.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.ld }}/heartbeat.pid
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-identity.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-failure.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.ld }}/heartbeat.log
          PANTHEON_EXTERNAL_EGRESS_ALLOWED_HOSTS: api.finmindtrade.com,storage.googleapis.com
          SOURCE_INGEST_BOUNDED_CONNECTOR_ID: tw-finmind-broker-daily-report
          SOURCE_INGEST_BOUNDED_DATASET: tw_broker_top
          PANTHEON_COLLECTOR_HOST: ${{ vars.PANTHEON_COLLECTOR_HOST }}
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
          REFRESH_OUTPUT_PATH: ${{ runner.temp }}/finmind-broker-backfill-outcome.json
          BACKFILL_START_DATE: ${{ inputs.start_date || '' }}
          BACKFILL_END_DATE: ${{ inputs.end_date || '' }}
          BACKFILL_MAX_REQUESTS: ${{ inputs.max_requests || '180' }}
          BACKFILL_MAX_WALL_SECONDS: ${{ inputs.max_wall_seconds || '2100' }}
          BACKFILL_MIN_INTERVAL_SECONDS: ${{ inputs.min_interval_seconds || '1.5' }}
          BACKFILL_VERIFY_ONLY: ${{ inputs.verify_only || false }}
        run: |
          python3 - <<'VALIDATE_INPUTS_PY'
          import datetime, os, sys
          for key in ("BACKFILL_START_DATE", "BACKFILL_END_DATE"):
              val = os.environ.get(key, "").strip()
              if val:
                  datetime.date.fromisoformat(val)
          max_req = int(os.environ.get("BACKFILL_MAX_REQUESTS") or "180")
          if not (1 <= max_req <= 600):
              raise SystemExit(f"max_requests must be between 1 and 600 (got {max_req})")
          max_wall = float(os.environ.get("BACKFILL_MAX_WALL_SECONDS") or "2100")
          if not (60.0 <= max_wall <= 2100.0):
              raise SystemExit(f"max_wall_seconds must be between 60 and 2100 so lease hold stays <= 45m (got {max_wall})")
          min_int = float(os.environ.get("BACKFILL_MIN_INTERVAL_SECONDS") or "1.5")
          if min_int < 1.0 or (3600.0 / min_int) > 6000.0:
              raise SystemExit(f"min_interval_seconds must be >= 1.0 (<=3600 req/h vs 6000/h cap; got {min_int})")
          VALIDATE_INPUTS_PY
          if [[ "${BACKFILL_VERIFY_ONLY}" != "true" && -z "${FINMIND_API_TOKEN}" ]]; then
            printf '%s\n' '{"connector_id":"tw-finmind-broker-daily-report","dataset":"tw_broker_top","mode":"two_year_backfill","reason":"missing_credential","requests_made":0,"status":"credential_unavailable"}' > "${REFRESH_OUTPUT_PATH}"
            echo "FinMind two-year broker backfill refused: missing_credential"
            exit 0
          fi
          rc_file="${RUNNER_TEMP}/broker-backfill-step-rc.txt"
          rm -f "${rc_file}"
          export RC_FILE="${rc_file}"
          # The guarded command always exits 0 so a dataset/provider failure does not quarantine the
          # lease heartbeat before the lease release step; the summary step enforces the outcome.
          .lease-controller/scripts/run_with_dev_environment_lease.sh \
            bash -c '
              bf_args=(--refresh-only --connector-id tw-finmind-broker-daily-report --allowed-hosts api.finmindtrade.com,storage.googleapis.com --dataset tw_broker_top --output "${REFRESH_OUTPUT_PATH}")
              if [[ "${BACKFILL_VERIFY_ONLY}" == "true" ]]; then
                bf_args+=(--broker-backfill-verify)
              else
                bf_args+=(--bounded-runtime-run --run-hosts api.finmindtrade.com,storage.googleapis.com --run-finmind --broker-backfill --backfill-max-requests "${BACKFILL_MAX_REQUESTS}" --backfill-max-wall-seconds "${BACKFILL_MAX_WALL_SECONDS}" --backfill-min-interval-seconds "${BACKFILL_MIN_INTERVAL_SECONDS}")
                [[ -n "${BACKFILL_START_DATE}" ]] && bf_args+=(--backfill-start "${BACKFILL_START_DATE}")
                [[ -n "${BACKFILL_END_DATE}" ]] && bf_args+=(--backfill-end "${BACKFILL_END_DATE}")
              fi
              rc=0
              ./scripts/deploy_nonprod_vm.sh "${bf_args[@]}" || rc=$?
              echo "${rc}" > "${RC_FILE}"
              exit 0
            '
          step_rc="$(tr -d '[:space:]' < "${rc_file}" 2>/dev/null || true)"
          if [[ "${step_rc}" != "0" ]]; then
            echo "::error::FinMind two-year broker backfill exited with ${step_rc:-unknown}"
            exit "${step_rc:-1}"
          fi

      - name: Verify and restore steady source-ingest posture
        if: ${{ always() && steps.lease.outcome == 'success' }}
        id: steady_check
        timeout-minutes: 5
        env:
          PANTHEON_DEPLOY_WORKTREE_ROOT: ${{ vars.DEV_DEPLOY_WORKTREE_ROOT }}
          TARGET_ENV: dev
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.ld }}/state.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.ld }}/heartbeat.pid
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-identity.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-failure.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.ld }}/heartbeat.log
          PANTHEON_COLLECTOR_HOST: ${{ vars.PANTHEON_COLLECTOR_HOST }}
          STEADY_CHECK_OUTPUT_PATH: ${{ runner.temp }}/steady-restore-check.json
          REFRESH_OUTCOME_PATH: ${{ runner.temp }}/finmind-broker-backfill-outcome.json
        shell: /bin/bash --noprofile --norc {0}
        run: |
          check_rc=0
          .lease-controller/scripts/run_with_dev_environment_lease.sh \
            ./scripts/deploy_nonprod_vm.sh --refresh-only --steady-check \
              --output "${STEADY_CHECK_OUTPUT_PATH}" </dev/null || check_rc=$?
          python3 - "${STEADY_CHECK_OUTPUT_PATH}" "${REFRESH_OUTCOME_PATH}" "${check_rc}" <<'PY'
          import json, pathlib, sys
          check_path, outcome_path, rc = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), int(sys.argv[3])
          check = {}
          if check_path.is_file():
              try:
                  parsed = json.loads(check_path.read_text(encoding="utf-8"))
                  check = parsed if isinstance(parsed, dict) else {}
              except Exception:
                  check = {}
          if not check:
              check = {"mode": "collector_steady_pull", "reason": f"steady_check_transport_exit_{rc}", "status": "failed"}
          outcome = {}
          if outcome_path.is_file():
              try:
                  parsed = json.loads(outcome_path.read_text(encoding="utf-8"))
                  outcome = parsed if isinstance(parsed, dict) else {}
              except Exception:
                  outcome = {}
          outcome["steady_restore_check"] = {"reason": str(check.get("reason") or ""), "status": str(check.get("status") or "failed")}
          if isinstance(check.get("bounded_runtime"), dict):
              outcome["bounded_runtime"] = check["bounded_runtime"]
          if isinstance(outcome.get("bounded_runtime"), dict):
              br = outcome["bounded_runtime"]
              print(f"bounded runtime: recreates={br.get('enter_recreates')}+{br.get('restore_recreates')} memory.peak={br.get('memory_peak_bytes')} limit={br.get('memory_limit_bytes')} oom_killed={br.get('oom_killed')} hosts={br.get('hosts')} finmind_token={br.get('finmind_token')}")
          outcome_path.write_text(json.dumps(outcome, sort_keys=True) + "\n", encoding="utf-8")
          status, reason = outcome["steady_restore_check"]["status"], outcome["steady_restore_check"]["reason"]
          print(f"steady restore check: status={status} reason={reason or 'none'}")
          if status not in ("healthy", "restored"):
              print(f"::error::steady_restore_check_{status}: {reason or 'unknown'}")
              sys.exit(1)
          PY

      - name: Upload backfill outcome artifact
        if: ${{ always() && steps.lease.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: finmind-broker-backfill-outcome
          path: |
            ${{ runner.temp }}/finmind-broker-backfill-outcome.json

      - name: Stop heartbeat and release lease
        if: ${{ always() && steps.lease.outcome == 'success' }}
        env:
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          LD: ${{ steps.lease.outputs.ld }}
          BACKFILL_OUTCOME: ${{ steps.broker_backfill.outcome }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          heartbeat_pid="$(tr -d '[:space:]' < "${LD}/heartbeat.pid")" || exit 0
          [[ "${heartbeat_pid}" =~ ^[1-9][0-9]*$ ]] || exit 0
          kill -TERM "${heartbeat_pid}" 2>/dev/null || true
          for _ in $(seq 1 40); do
            kill -0 "${heartbeat_pid}" 2>/dev/null || break
            sleep 0.25
          done
          [[ ! -e "${LD}/heartbeat-failure.json" ]] || exit 0
          [[ -s "${LD}/heartbeat-stop.json" ]] || { echo "No graceful heartbeat stop; refusing release." >&2; exit 75; }
          python3 "${CONTROLLER}/scripts/dev_environment_lease.py" release \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --state-file "${LD}/state.json"

      - name: Summarize backfill outcome and verify bounds
        if: ${{ always() && steps.lease.outcome == 'success' }}
        env:
          OUTCOME_FILE: ${{ runner.temp }}/finmind-broker-backfill-outcome.json
          STEP_OUTCOME: ${{ steps.broker_backfill.outcome }}
        run: |
          python3 - "${OUTCOME_FILE}" "${GITHUB_STEP_SUMMARY}" "${STEP_OUTCOME}" <<'SUMMARY_PY'
          import json, pathlib, sys
          outcome_path = pathlib.Path(sys.argv[1])
          summary_path = pathlib.Path(sys.argv[2])
          step_outcome = sys.argv[3]
          payload = {}
          if outcome_path.is_file():
              try:
                  parsed = json.loads(outcome_path.read_text(encoding="utf-8"))
                  if isinstance(parsed, dict):
                      payload = parsed
              except Exception:
                  payload = {}
          status = str(payload.get("status") or "failed")
          reason = str(payload.get("reason") or "")
          mode = str(payload.get("mode") or "two_year_backfill")
          requests_made = int(payload.get("requests_made") or 0)
          plan_cap = int(payload.get("plan_hourly_cap") or 6000)
          completed_count = int(payload.get("completed_count") or 0)
          skipped_count = int(payload.get("skipped_completed_count") or 0)
          remaining_count = int(payload.get("remaining_dates_count") or 0)
          top_records = int(payload.get("top_records") or 0)
          bytes_written = int(payload.get("bytes_written") or 0)
          total_sessions = int(payload.get("total_stored_sessions") or 0)
          total_rows = int(payload.get("total_stored_rows") or 0)
          total_bytes = int(payload.get("total_stored_bytes") or 0)
          max_bytes = int(payload.get("max_total_bytes") or 3_000_000_000)
          max_rows = int(payload.get("max_total_rows") or 60_000_000)
          stopped_reason = str(payload.get("stopped_reason") or "none")
          coverage = payload.get("coverage") if isinstance(payload.get("coverage"), dict) else {}
          cov_sessions = int(coverage.get("two_sided_sessions_count") or 0)
          cov_passed = bool(coverage.get("passed"))
          br = payload.get("bounded_runtime") if isinstance(payload.get("bounded_runtime"), dict) else {}
          br_peak = br.get("memory_peak_bytes")
          br_limit = br.get("memory_limit_bytes")
          br_oom = bool(br.get("oom_killed"))
          lines = [
              "### FinMind Two-Year Broker Backfill Summary",
              "",
              "| Field | Value |",
              "|---|---|",
              f"| Mode | `{mode}` |",
              f"| Step outcome | `{step_outcome}` |",
              f"| Status | `{status}` |",
              f"| Reason | `{reason or 'none'}` |",
              f"| Window | `{payload.get('window_start', '')}` .. `{payload.get('window_end', '')}` |",
              f"| Completed in run | `{completed_count}` |",
              f"| Skipped completed | `{skipped_count}` |",
              f"| Remaining dates in window | `{remaining_count}` |",
              f"| Stopped reason | `{stopped_reason}` |",
              f"| Requests made / hourly cap | `{requests_made}` / `{plan_cap}` |",
              f"| Compact rows written in run | `{top_records}` |",
              f"| Compressed bytes written in run | `{bytes_written}` |",
              f"| Total stored sessions | `{total_sessions}` |",
              f"| Total stored rows / cap | `{total_rows}` / `{max_rows}` |",
              f"| Total stored bytes / cap | `{total_bytes}` / `{max_bytes}` |",
              f"| Bounded runtime memory.peak / limit | `{br_peak}` / `{br_limit}` (`oom_killed={br_oom}`) |",
              f"| Two-year coverage sessions (>=480) | `{cov_sessions}` (`passed={cov_passed}`) |",
              "",
          ]
          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          if step_outcome != "success" or status != "ok" or br_oom:
              raise SystemExit(f"FinMind two-year broker backfill did not succeed: step={step_outcome} status={status} reason={reason} oom_killed={br_oom}")
          if requests_made > plan_cap:
              raise SystemExit(f"requests_made {requests_made} exceeded plan_hourly_cap {plan_cap}")
          if total_bytes > max_bytes or total_rows > max_rows:
              raise SystemExit(f"stored totals exceeded cap: bytes={total_bytes}/{max_bytes} rows={total_rows}/{max_rows}")
          SUMMARY_PY

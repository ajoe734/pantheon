name: Persona Day Acceptance (daily, read-only)

on:
  schedule:
    - cron: "30 11 * * 1-5"  # after the persona daily cycle (10:00Z, window over 10:45Z); judges that UTC day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persona-day-acceptance-dev
  cancel-in-progress: false

jobs:
  persona-day:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    env:
      ACCEPTANCE_BFF_URL: ${{ vars.DEV_BFF_URL }}
      # Read-only viewer dev-login identity (existing dev secret); exchanged in memory, never printed.
      ACCEPTANCE_VIEWER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_ID || 'pantheon-dev-viewer-v1' }}
      ACCEPTANCE_VIEWER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe (GET only; writes nothing on hosted)
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: python3 -I acceptance/persona_day.py | tee persona-day.json
      # Separate verdict: one failing check never hides the other. Pending exits 0; failed exits 1.
      - name: Pool risk snapshot present and pool health known (GET only; viewer identity)
        if: always()
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: timeout 120s python3 -I acceptance/pool_risk_snapshot_day.py | tee pool-risk-snapshot-day.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-day-acceptance
          path: |
            persona-day.json
            pool-risk-snapshot-day.json
          retention-days: 30

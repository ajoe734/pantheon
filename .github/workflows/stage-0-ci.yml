name: Pantheon Stage 0 CI

on:
  pull_request:
    branches:
      - backend-dev-publish-20260429
      - master
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "Run the normal stage-0 gate or strict BFF live evidence"
        required: true
        default: stage0
        type: choice
        options:
          - stage0
          - live-evidence
      environment:
        description: "GitHub environment for live-evidence secrets"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging-live
      bff_base_url:
        description: "Target BFF base URL for live evidence"
        required: true
        default: "https://pantheon-lupin-dev-bff.35.201.239.38.sslip.io"
        type: string
      approval_race_id:
        description: "Expendable approval id for the two-operator race proof"
        required: false
        default: ""
        type: string
      soak_seconds:
        description: "SSE reconnect soak duration; strict evidence requires at least 75"
        required: true
        default: "75"
        type: string

permissions:
  contents: read

concurrency:
  group: pantheon-stage0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover changed stage-0 targets
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'live-evidence' }}
    runs-on: ubuntu-latest
    outputs:
      target_ids: ${{ steps.detect.outputs.target_ids }}
      verify_ids: ${{ steps.detect.outputs.verify_ids }}
      build_ids: ${{ steps.detect.outputs.build_ids }}
      target_count: ${{ steps.detect.outputs.target_count }}
      verify_count: ${{ steps.detect.outputs.verify_count }}
      build_count: ${{ steps.detect.outputs.build_count }}
      global_changed: ${{ steps.detect.outputs.global_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate stage-0 matrix and doc alignment
        run: python3 scripts/ci_stage0.py validate

      - name: Detect changed targets
        id: detect
        env:
          STAGE0_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          STAGE0_HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_stage0.py detect-changes --github-output "$GITHUB_OUTPUT"

  baseline:
    name: Run baseline stage-0 gate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'live-evidence' }}
    runs-on: ubuntu-latest
    needs:
      - discover
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Execute baseline checks
        run: python3 scripts/ci_stage0.py run-baseline

  changed-verify:
    name: Verify changed services
    runs-on: ubuntu-latest
    needs:
      - discover
      - baseline
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.mode != 'live-evidence') && needs.discover.outputs.verify_count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        target_id: ${{ fromJson(needs.discover.outputs.verify_ids) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run verify steps
        run: python3 scripts/ci_stage0.py run-target --target-id "${{ matrix.target_id }}" --mode verify --tag-suffix "${{ github.sha }}"

  changed-build-dry-run:
    name: Docker build dry run
    runs-on: ubuntu-latest
    needs:
      - discover
      - baseline
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.mode != 'live-evidence') && needs.discover.outputs.build_count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        target_id: ${{ fromJson(needs.discover.outputs.build_ids) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build changed image target
        run: python3 scripts/ci_stage0.py run-target --target-id "${{ matrix.target_id }}" --mode build --tag-suffix "${{ github.sha }}"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - discover
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check dependency graph support
        id: dependency_graph
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh api "repos/${{ github.repository }}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" --silent >/dev/null 2>&1; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph API is unavailable for this repository; dependency-review-action would fail before reviewing dependencies. Enable dependency graph in repository security settings to enforce this gate."
          fi

      - name: Review dependency changes
        if: steps.dependency_graph.outputs.supported == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  live-evidence:
    name: Strict BFF live evidence
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'live-evidence' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      PANTHEON_AUDIT_OUT_DIR: .lovable/audits/current-run
      PANTHEON_BFF_BASE_URL: ${{ inputs.bff_base_url }}
      PANTHEON_FRONTEND_SHA: ${{ github.sha }}
      PANTHEON_BFF_SHA: ${{ github.sha }}
      PANTHEON_RELEASE_GATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PANTHEON_BFF_SMOKE_BEARER_TOKEN: ${{ secrets.PANTHEON_BFF_SMOKE_BEARER_TOKEN }}
      PANTHEON_BFF_RBAC_TOKENS_JSON: ${{ secrets.PANTHEON_BFF_RBAC_TOKENS_JSON }}
      PANTHEON_BFF_APPROVAL_RACE_TOKEN_A: ${{ secrets.PANTHEON_BFF_APPROVAL_RACE_TOKEN_A }}
      PANTHEON_BFF_APPROVAL_RACE_TOKEN_B: ${{ secrets.PANTHEON_BFF_APPROVAL_RACE_TOKEN_B }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare current-run audit directory
        run: mkdir -p "$PANTHEON_AUDIT_OUT_DIR"

      - name: Validate strict live inputs
        env:
          APPROVAL_RACE_ID: ${{ inputs.approval_race_id }}
        run: |
          test -n "$PANTHEON_BFF_SMOKE_BEARER_TOKEN"
          test -n "$PANTHEON_BFF_RBAC_TOKENS_JSON"
          test -n "$PANTHEON_BFF_APPROVAL_RACE_TOKEN_A"
          test -n "$PANTHEON_BFF_APPROVAL_RACE_TOKEN_B"
          test -n "$APPROVAL_RACE_ID"

      - name: Strict authenticated live evidence
        run: |
          python3 scripts/probe_bff_authenticated_live.py \
            --base-url "$PANTHEON_BFF_BASE_URL" \
            --strict-live-evidence \
            --include-writes \
            --approval-race-id "${{ inputs.approval_race_id }}" \
            --output "${PANTHEON_AUDIT_OUT_DIR}/BFF-LUV-AUTHED-LIVE-001-live-smoke.json"

      - name: Strict SSE live soak
        run: |
          python3 scripts/probe_bff_sse_stream.py \
            --base-url "$PANTHEON_BFF_BASE_URL" \
            --strict-live-evidence \
            --soak-seconds "${{ inputs.soak_seconds }}" \
            --soak-min-heartbeats 1 \
            --output "${PANTHEON_AUDIT_OUT_DIR}/BFF-CONSOL-011-sse-replay-smoke.json"

      - name: Aggregate current-run release evidence
        if: always()
        continue-on-error: true
        run: |
          node execute-plans/scripts/aggregate-release-gate.mjs \
            --audit-dir "$PANTHEON_AUDIT_OUT_DIR"

      - name: Upload current-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bff-live-evidence-current-run
          path: .lovable/audits/current-run
          if-no-files-found: error

name: Pantheon Stage 0 CI

on:
  pull_request:
    branches:
      - backend-dev-publish-20260429
      - master
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "Run stage-0, strict BFF live evidence, or a task-scoped hosted probe"
        required: true
        default: stage0
        type: choice
        options:
          - stage0
          - live-evidence
          - loop-prod-per-001-hosted-probe
          - tj-e2e-012-hosted-acceptance
      environment:
        description: "GitHub environment for live-evidence secrets"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging-live
      bff_base_url:
        description: "Target BFF base URL for live evidence"
        required: true
        default: "https://pantheon-lupin-dev-bff.35.201.204.12.sslip.io"
        type: string
      expected_sha:
        description: "Expected deployed BFF source commit SHA for task-scoped hosted probes"
        required: false
        default: ""
        type: string
      expected_fe_sha:
        description: "Expected deployed execute-plans commit SHA for TJ-E2E-012"
        required: false
        default: ""
        type: string
      seed_scenarios:
        description: "Dev only: materialize the deterministic TJ-E2E-012 source scenarios before acceptance"
        required: false
        default: false
        type: boolean
      approval_race_id:
        description: "Expendable approval id for the two-operator race proof"
        required: true
        type: string
      two_man_race_id:
        description: "Expendable intervention id for the two-operator two-man-sign race proof"
        required: true
        type: string
      soak_seconds:
        description: "SSE reconnect soak duration; strict evidence requires at least 75"
        required: true
        default: "75"
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    pantheon-stage0-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'stage0' && format('{0}-{1}', inputs.mode, inputs.environment) || 'stage0' }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover changed stage-0 targets
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'stage0' }}
    runs-on: ubuntu-latest
    outputs:
      target_ids: ${{ steps.detect.outputs.target_ids }}
      verify_ids: ${{ steps.detect.outputs.verify_ids }}
      build_ids: ${{ steps.detect.outputs.build_ids }}
      target_count: ${{ steps.detect.outputs.target_count }}
      verify_count: ${{ steps.detect.outputs.verify_count }}
      build_count: ${{ steps.detect.outputs.build_count }}
      global_changed: ${{ steps.detect.outputs.global_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate stage-0 matrix and doc alignment
        run: python3 scripts/ci_stage0.py validate

      - name: Detect changed targets
        id: detect
        env:
          STAGE0_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          STAGE0_HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_stage0.py detect-changes --github-output "$GITHUB_OUTPUT"

  baseline:
    name: Run baseline stage-0 gate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'stage0' }}
    runs-on: ubuntu-latest
    needs:
      - discover
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Execute baseline checks
        run: python3 scripts/ci_stage0.py run-baseline

  changed-verify:
    name: Verify changed services
    runs-on: ubuntu-latest
    needs:
      - discover
      - baseline
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.mode == 'stage0') && needs.discover.outputs.verify_count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        target_id: ${{ fromJson(needs.discover.outputs.verify_ids) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run verify steps
        run: python3 scripts/ci_stage0.py run-target --target-id "${{ matrix.target_id }}" --mode verify --tag-suffix "${{ github.sha }}"

  changed-build-dry-run:
    name: Docker build dry run
    runs-on: ubuntu-latest
    needs:
      - discover
      - baseline
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.mode == 'stage0') && needs.discover.outputs.build_count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        target_id: ${{ fromJson(needs.discover.outputs.build_ids) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build changed image target
        run: python3 scripts/ci_stage0.py run-target --target-id "${{ matrix.target_id }}" --mode build --tag-suffix "${{ github.sha }}"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - discover
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check dependency graph support
        id: dependency_graph
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh api "repos/${{ github.repository }}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" --silent >/dev/null 2>&1; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph API is unavailable for this repository; dependency-review-action would fail before reviewing dependencies. Enable dependency graph in repository security settings to enforce this gate."
          fi

      - name: Review dependency changes
        if: steps.dependency_graph.outputs.supported == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  live-evidence:
    name: Strict BFF live evidence
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'live-evidence' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      PANTHEON_AUDIT_OUT_DIR: .lovable/audits/current-run
      PANTHEON_BFF_BASE_URL: ${{ inputs.bff_base_url }}
      PANTHEON_FRONTEND_SHA: ${{ github.sha }}
      PANTHEON_BFF_SHA: ${{ github.sha }}
      PANTHEON_RELEASE_GATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PANTHEON_LIVE_EVIDENCE_ENVIRONMENT: ${{ inputs.environment }}
      PANTHEON_BFF_SMOKE_BEARER_TOKEN: ${{ secrets.PANTHEON_BFF_SMOKE_BEARER_TOKEN }}
      PANTHEON_BFF_RBAC_TOKENS_JSON: ${{ secrets.PANTHEON_BFF_RBAC_TOKENS_JSON }}
      PANTHEON_BFF_APPROVAL_RACE_TOKEN_A: ${{ secrets.PANTHEON_BFF_APPROVAL_RACE_TOKEN_A }}
      PANTHEON_BFF_APPROVAL_RACE_TOKEN_B: ${{ secrets.PANTHEON_BFF_APPROVAL_RACE_TOKEN_B }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare current-run audit directory
        run: mkdir -p "$PANTHEON_AUDIT_OUT_DIR"

      - name: Validate strict live inputs
        env:
          APPROVAL_RACE_ID: ${{ inputs.approval_race_id }}
          TWO_MAN_RACE_ID: ${{ inputs.two_man_race_id }}
        run: |
          python3 scripts/write_bff_live_evidence_preflight.py \
            --base-url "$PANTHEON_BFF_BASE_URL" \
            --approval-race-id "$APPROVAL_RACE_ID" \
            --two-man-race-id "$TWO_MAN_RACE_ID" \
            --soak-seconds "${{ inputs.soak_seconds }}" \
            --output "${PANTHEON_AUDIT_OUT_DIR}/BFF-LIVE-EVIDENCE-PREFLIGHT.json"

      - name: Strict authenticated live evidence
        run: |
          python3 scripts/probe_bff_authenticated_live.py \
            --base-url "$PANTHEON_BFF_BASE_URL" \
            --strict-live-evidence \
            --include-writes \
            --approval-race-id "${{ inputs.approval_race_id }}" \
            --two-man-race-id "${{ inputs.two_man_race_id }}" \
            --output "${PANTHEON_AUDIT_OUT_DIR}/BFF-LUV-AUTHED-LIVE-001-live-smoke.json"

      - name: Strict SSE live soak
        run: |
          python3 scripts/probe_bff_sse_stream.py \
            --base-url "$PANTHEON_BFF_BASE_URL" \
            --strict-live-evidence \
            --soak-seconds "${{ inputs.soak_seconds }}" \
            --soak-min-heartbeats 2 \
            --reconnect-attempts 7 \
            --output "${PANTHEON_AUDIT_OUT_DIR}/BFF-CONSOL-011-sse-replay-smoke.json"

      - name: Aggregate current-run release evidence
        if: always()
        continue-on-error: true
        run: |
          node scripts/aggregate_bff_release_gate.mjs \
            --audit-dir "$PANTHEON_AUDIT_OUT_DIR"

      - name: Verify live evidence artifact
        if: always()
        run: |
          python3 scripts/verify_bff_live_evidence_artifact.py "$PANTHEON_AUDIT_OUT_DIR" --json > "${PANTHEON_AUDIT_OUT_DIR}/BFF-LIVE-EVIDENCE-ARTIFACT-VERIFY.json"

      - name: Upload current-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bff-live-evidence-current-run
          path: |
            .lovable/audits/current-run/BFF-LIVE-EVIDENCE-PREFLIGHT.json
            .lovable/audits/current-run/BFF-LIVE-EVIDENCE-ARTIFACT-VERIFY.json
            .lovable/audits/current-run/release-gate-summary.json
            .lovable/audits/current-run/release-gate-summary.md
            .lovable/audits/current-run/BFF-LUV-AUTHED-LIVE-001-live-smoke.json
            .lovable/audits/current-run/BFF-CONSOL-011-sse-replay-smoke.json
          if-no-files-found: error

  loop-prod-per-001-hosted-probe:
    name: LOOP-PROD-PER-001 hosted probe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'loop-prod-per-001-hosted-probe' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    env:
      BFF_BASE_URL: ${{ inputs.bff_base_url }}
      EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
      TENANT_ID: pantheon-dev
      DEV_BFF_JWT_SECRET: ${{ secrets.DEV_BFF_JWT_SECRET }}
      DEV_BFF_JWT_ISSUER: ${{ vars.DEV_BFF_JWT_ISSUER || 'pantheon-dev' }}
      DEV_BFF_JWT_AUDIENCE: ${{ vars.DEV_BFF_JWT_AUDIENCE || 'bff-operators' }}
    steps:
      - name: Validate hosted probe environment
        run: |
          if [[ "${{ inputs.environment }}" != "dev" ]]; then
            echo "LOOP-PROD-PER-001 hosted probe must run against the dev environment." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run hosted persona provisioning probe
        run: |
          python3 scripts/probe_loop_prod_per_001_hosted.py \
            --base-url "${BFF_BASE_URL}" \
            --expected-sha "${EXPECTED_SHA}" \
            --tenant-id "${TENANT_ID}" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output ".artifacts/LOOP-PROD-PER-001/hosted-probe.json"

      - name: Upload hosted probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-prod-per-001-hosted-probe
          path: .artifacts/LOOP-PROD-PER-001/hosted-probe.json
          if-no-files-found: error

  tj-e2e-012-hosted-acceptance:
    name: TJ-E2E-012 twelve-scenario hosted evidence
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'tj-e2e-012-hosted-acceptance' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BFF_BASE: ${{ inputs.bff_base_url }}
      TJ_E2E_FE_DEPLOYMENT_URL: ${{ format('{0}/deployment.json', vars.DEV_FE_URL || 'https://pantheon-lupin-dev-fe.35.201.204.12.sslip.io') }}
      TJ_E2E_ALLOWED_BFF_ORIGIN: ${{ vars.DEV_BFF_URL || 'https://pantheon-lupin-dev-bff.35.201.204.12.sslip.io' }}
      TJ_E2E_ALLOWED_FE_ORIGIN: ${{ vars.DEV_FE_URL || 'https://pantheon-lupin-dev-fe.35.201.204.12.sslip.io' }}
      TJ_E2E_EXPECTED_BFF_SHA: ${{ inputs.expected_sha }}
      TJ_E2E_EXPECTED_FE_SHA: ${{ inputs.expected_fe_sha }}
      TJ_E2E_TENANT_ID: tenant-dev
      TJ_E2E_FORBIDDEN_TENANT_ID: tenant-forbidden-proof
      TJ_E2E_REPLAY_AS_OF: "2026-07-12T12:01:30Z"
      TJ_E2E_AMBIGUITY_IDENTIFIER: ambiguous-scenario-9
      TJ_E2E_OPERATOR_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_ID || 'pantheon-dev-operator-a-v1' }}
      TJ_E2E_OPERATOR_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_SECRET }}
      TJ_E2E_VIEWER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_ID || 'pantheon-dev-viewer-v1' }}
      TJ_E2E_VIEWER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_SECRET }}
      TJ_E2E_EVIDENCE_DIR: .artifacts/TJ-E2E-012/${{ github.run_id }}-${{ github.run_attempt }}
      DEV_DEPLOY_SSH_HOST: ${{ vars.DEV_DEPLOY_SSH_HOST || '35.201.204.12' }}
      DEV_DEPLOY_SSH_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
    steps:
      - name: Reject non-dev acceptance dispatch
        if: ${{ inputs.environment != 'dev' }}
        run: |
          echo "TJ-E2E-012 hosted acceptance may only use the dev environment." >&2
          exit 1

      - name: Checkout dispatched revision
        uses: actions/checkout@v6

      - name: Prepare pinned direct SSH transport for dev VM loopback seed
        if: ${{ inputs.seed_scenarios }}
        env:
          DEV_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEV_DEPLOY_SSH_PRIVATE_KEY }}
          DEV_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEV_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          credentials_dir="${RUNNER_TEMP}/pantheon-dev-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scripts/dev_vm_ssh.sh prepare "${credentials_dir}" >/dev/null

      - name: Materialize explicitly authorized dev-only source scenarios
        if: ${{ inputs.seed_scenarios }}
        env:
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          DEV_DEPLOY_WORKTREE: ${{ vars.DEV_DEPLOY_WORKTREE || format('{0}/dev-root', vars.DEV_DEPLOY_WORKTREE_ROOT || '/home/lupin/pantheon-ci-deploy/managed-deploy-worktrees') }}
        run: |
          set -euo pipefail
          [[ "${TJ_E2E_EXPECTED_BFF_SHA}" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "${TJ_E2E_EVIDENCE_DIR}"
          seed_evidence="${TJ_E2E_EVIDENCE_DIR}/canonical-seed.json"
          printf -v worktree_q '%q' "${DEV_DEPLOY_WORKTREE}"
          printf -v expected_sha_q '%q' "${TJ_E2E_EXPECTED_BFF_SHA}"
          set +e
          seed_output="$(scripts/dev_vm_ssh.sh exec \
            "set -euo pipefail; cd ${worktree_q}; test \"\$(git rev-parse HEAD)\" = ${expected_sha_q}; GITHUB_REPOSITORY=ajoe734/pantheon TJ_E2E_TENANT_ID=tenant-dev TJ_E2E_EXPECTED_BFF_SHA=${expected_sha_q} TJ_E2E_TELEMETRY_BASE=http://127.0.0.1:18083 TJ_E2E_RUNTIME_MANAGER_BASE=http://127.0.0.1:18081 TJ_E2E_SEED_BFF_BASE=http://127.0.0.1:18001 python3 scripts/seed_tj_e2e_012_hosted_scenarios.py")"
          seed_status=$?
          set -e
          python3 - "${seed_evidence}" "${seed_status}" "${seed_output}" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          status = int(sys.argv[2])
          lines = [line for line in sys.argv[3].splitlines() if line.strip()]
          parsed = None
          if lines:
              try:
                  parsed = json.loads(lines[-1])
              except json.JSONDecodeError:
                  parsed = None
          payload = {
              "schema_version": "pantheon.tj-e2e-012.canonical-seed-evidence.v1",
              "result": "passed" if status == 0 and isinstance(parsed, dict) else "failed",
              "transport": "direct-ssh-dev-vm-loopback",
              "expected_bff_sha": __import__("os").environ["TJ_E2E_EXPECTED_BFF_SHA"],
              "seed": parsed if isinstance(parsed, dict) else None,
          }
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          if [[ "${seed_status}" -ne 0 ]]; then
            echo "Canonical dev telemetry seed failed; redacted evidence was recorded." >&2
            exit "${seed_status}"
          fi

      - name: Verify exact hosted pair and all twelve source scenarios
        run: python3 scripts/verify_hosted_scenarios.py

      - name: Upload immutable redacted acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tj-e2e-012-hosted-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/TJ-E2E-012/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30

name: Pantheon Ephemeral Staging Deploy

# Five-stage ephemeral staging lifecycle (PROVISION -> DEPLOY -> VERIFY -> COLLECT -> DESTROY).
# Dispatched explicitly for a `dev_verified` release manifest. Never triggers on push or PR;
# merging source mutates zero cloud or GitHub environments.

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Immutable release ID (pantheon-YYYYMMDD-NNN)"
        required: true
        type: string
      release_manifest_path:
        description: "Repository-relative path to the dev_verified release manifest JSON"
        required: true
        type: string
      expected_manifest_sha256:
        description: "Expected sha256:<64-hex> checksum of the immutable release manifest"
        required: true
        type: string
      fe_artifact_uri:
        description: "Immutable FE bundle GCS URI (gs://...) or path matching manifest.frontend.artifact_sha256"
        required: false
        default: ""
        type: string
      fe_baseline_artifact_uri:
        description: "Immutable baseline FE bundle GCS URI (gs://...) or path matching manifest.rollback_baseline.frontend_artifact_sha256"
        required: false
        default: ""
        type: string
      ttl_seconds:
        description: "Bounded staging TTL in seconds (default 7200, max 86400)"
        required: false
        default: "7200"
        type: string
      dry_run:
        description: "Execute controller validation without cloud mutation (true/false)"
        required: false
        default: "true"
        type: string
      hosted_qa_window_seconds:
        description: "Optional bounded hold after successful live verify and before destroy (0 or 300)"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "300"

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-ephemeral-${{ inputs.release_id || github.run_id }}
  cancel-in-progress: false

jobs:
  ephemeral-staging-lifecycle:
    name: Ephemeral Staging (Provision / Deploy / Verify / Collect / Destroy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_MANIFEST_PATH: ${{ inputs.release_manifest_path }}
      EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
      STAGING_FE_ARTIFACT_URI: ${{ inputs.fe_artifact_uri || vars.STAGING_FE_ARTIFACT_URI || '' }}
      STAGING_FE_BASELINE_ARTIFACT_URI: ${{ inputs.fe_baseline_artifact_uri || vars.STAGING_FE_BASELINE_ARTIFACT_URI || '' }}
      STAGING_TTL_SECONDS: ${{ inputs.ttl_seconds || '7200' }}
      STAGING_DRY_RUN: ${{ inputs.dry_run || 'true' }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      STAGING_EPHEMERAL_ENABLED: ${{ vars.STAGING_EPHEMERAL_ENABLED || 'false' }}
      STAGING_GCP_PROJECT_ID: ${{ vars.STAGING_GCP_PROJECT_ID || '' }}
      STAGING_GCP_ZONE: ${{ vars.STAGING_GCP_ZONE || '' }}
      STAGING_WIF_PROVIDER: ${{ vars.STAGING_GCP_WIF_PROVIDER || vars.STAGING_WIF_PROVIDER || '' }}
      STAGING_DEPLOY_SERVICE_ACCOUNT: ${{ vars.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT || vars.STAGING_DEPLOY_SERVICE_ACCOUNT || '' }}
      STAGING_RUNTIME_SERVICE_ACCOUNT: ${{ vars.STAGING_RUNTIME_SERVICE_ACCOUNT || vars.STAGING_SERVICE_ACCOUNT || '' }}
      STAGING_INSTANCE_TEMPLATE: ${{ vars.STAGING_INSTANCE_TEMPLATE || '' }}
      STAGING_SERVICE_ACCOUNT: ${{ vars.STAGING_RUNTIME_SERVICE_ACCOUNT || vars.STAGING_SERVICE_ACCOUNT || '' }}
      STAGING_SANITIZED_SNAPSHOT: ${{ vars.STAGING_SANITIZED_SNAPSHOT || '' }}
      STAGING_TENANT_ID: ${{ vars.STAGING_TENANT_ID || '' }}
      STAGING_SECRETS_GSM_NAME: ${{ vars.STAGING_SECRETS_GSM_NAME || '' }}
      STAGING_POSTGRES_PASSWORD_GSM_NAME: ${{ vars.STAGING_POSTGRES_PASSWORD_GSM_NAME || '' }}
      STAGING_IDP_ISSUER: ${{ vars.STAGING_IDP_ISSUER || '' }}
      STAGING_POSTGRES_IMAGE: ${{ vars.STAGING_POSTGRES_IMAGE || '' }}
      STAGING_NATS_IMAGE: ${{ vars.STAGING_NATS_IMAGE || '' }}
      STAGING_PUBLIC_GCP_IDENTITY_API_KEY: ${{ vars.STAGING_PUBLIC_GCP_IDENTITY_API_KEY || '' }}
      STAGING_PUBLIC_GCP_IDENTITY_PROJECT_ID: ${{ vars.STAGING_PUBLIC_GCP_IDENTITY_PROJECT_ID || '' }}
      STAGING_PUBLIC_GCP_IDENTITY_AUTH_DOMAIN: ${{ vars.STAGING_PUBLIC_GCP_IDENTITY_AUTH_DOMAIN || '' }}
      STAGING_PUBLIC_GCP_IDENTITY_ISSUER: ${{ vars.STAGING_PUBLIC_GCP_IDENTITY_ISSUER || '' }}
      STAGING_PUBLIC_GCP_IDENTITY_AUDIENCE: ${{ vars.STAGING_PUBLIC_GCP_IDENTITY_AUDIENCE || '' }}
      GCLOUD_BIN: gcloud
      PANTHEON_PROVIDER_ENABLED: "false"
      PANTHEON_LIVE_BROKER_ENABLED: "false"
      PANTHEON_REAL_WRITES_ENABLED: "false"
      PANTHEON_DEV_STUB_WRITES_ENABLED: "false"
      PANTHEON_CONTROL_VM_BROKER_CREDENTIALS_PRESENT: "false"
      PANTHEON_MANAGEMENT_NL_ASSISTANT_PROVIDER_ENABLED: "false"
      PANTHEON_MGMT_NL_ASSISTANT_PROVIDER_ENABLED: "false"
      PANTHEON_ASSISTANT_PROVIDER: "disabled"
      PANTHEON_BFF_AUTH_MODE: "strict"
      PANTHEON_BFF_AUTH_STUB: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Gate staging authority and explicit configuration (fail-closed)
        run: |
          if [[ "${STAGING_EPHEMERAL_ENABLED}" != "true" ]]; then
            echo "Staging ephemeral execution is held (STAGING_EPHEMERAL_ENABLED != true)." >&2
            exit 1
          fi
          for req in STAGING_GCP_PROJECT_ID STAGING_GCP_ZONE STAGING_INSTANCE_TEMPLATE STAGING_RUNTIME_SERVICE_ACCOUNT STAGING_SANITIZED_SNAPSHOT; do
            if [[ -z "${!req:-}" ]]; then
              echo "Missing required staging variable: ${req}" >&2
              exit 1
            fi
          done
          if [[ "${STAGING_DRY_RUN}" != "true" ]]; then
            for live_req in STAGING_WIF_PROVIDER STAGING_DEPLOY_SERVICE_ACCOUNT STAGING_FE_ARTIFACT_URI STAGING_FE_BASELINE_ARTIFACT_URI STAGING_PUBLIC_GCP_IDENTITY_API_KEY STAGING_PUBLIC_GCP_IDENTITY_PROJECT_ID STAGING_PUBLIC_GCP_IDENTITY_AUTH_DOMAIN; do
              if [[ -z "${!live_req:-}" ]]; then
                echo "Missing required live staging variable: ${live_req}" >&2
                exit 1
              fi
            done
            if [[ "${STAGING_DEPLOY_SERVICE_ACCOUNT}" == "${STAGING_RUNTIME_SERVICE_ACCOUNT}" ]]; then
              echo "STAGING_DEPLOY_SERVICE_ACCOUNT and STAGING_RUNTIME_SERVICE_ACCOUNT must be distinct identities." >&2
              exit 1
            fi
          fi

      - name: Authenticate to staging GCP project via Workload Identity Federation
        if: ${{ (inputs.dry_run || 'true') != 'true' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WIF_PROVIDER || vars.STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT || vars.STAGING_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        if: ${{ (inputs.dry_run || 'true') != 'true' }}
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Stage 1 & 2 - Provision ephemeral VM and deploy exact immutable artifacts
        id: provision
        env:
          STAGING_STATE_DIR: ${{ runner.temp }}/pantheon-staging-state
        run: |
          ./scripts/deploy/staging_provision.sh

      - name: Stage 3 - Collect and verify live sanitized data, migrations, backup/restore, rollback, and safety readbacks
        id: verify
        if: success()
        env:
          STAGING_STATE_DIR: ${{ runner.temp }}/pantheon-staging-state
        run: |
          ./scripts/deploy/staging_verify.sh

      - name: Stage 3b - Bounded hosted QA window (optional, before always-destroy)
        if: ${{ success() && (inputs.dry_run || 'true') != 'true' && inputs.hosted_qa_window_seconds == '300' }}
        timeout-minutes: 6
        run: sleep 300

      - name: Stage 4 & 5 - Collect bounded evidence and destroy owned staging resources
        id: destroy
        if: always()
        env:
          STAGING_STATE_DIR: ${{ runner.temp }}/pantheon-staging-state
        run: |
          result_flag="success"
          reason_flag="completed"
          if [[ "${{ job.status }}" == "cancelled" ]]; then
            result_flag="failure"
            reason_flag="cancelled"
          elif [[ "${{ steps.provision.outcome }}" != "success" ]]; then
            result_flag="failure"
            reason_flag="partial_create_failure"
          elif [[ "${{ steps.verify.outcome }}" != "success" ]]; then
            result_flag="failure"
            reason_flag="verification_failed"
          fi
          ./scripts/deploy/staging_destroy.sh \
            --mode teardown \
            --result "${result_flag}" \
            --reason "${reason_flag}"

      - name: Upload bounded staging evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-evidence-${{ inputs.release_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pantheon-staging-state/evidence/
          if-no-files-found: ignore
          retention-days: 14

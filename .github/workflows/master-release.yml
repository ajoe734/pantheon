name: Master Release

# Runs after a promote PR is merged into master. Tags `prod/<VER>` on the
# merge commit and notifies the orchestrator. Also fires for hotfix merges
# into master that carry a `Hotfix: yes` trailer.

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: master-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag prod release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Detect release intent
        id: detect
        run: |
          set -e
          SUBJECT=$(git log -1 --format=%s)
          BODY=$(git log -1 --format=%b)
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"

          VER=""
          if [[ "$SUBJECT" =~ ^promote:\ (v[0-9]{4}\.[0-9]{2}(\.[0-9]+){1,2})$ ]]; then
            VER="${BASH_REMATCH[1]}"
            echo "kind=promote" >> "$GITHUB_OUTPUT"
          elif [[ "$SUBJECT" =~ Merge\ pull\ request.*from.*promote/(v[0-9]{4}\.[0-9]{2}(\.[0-9]+){1,2}) ]]; then
            VER="${BASH_REMATCH[1]}"
            echo "kind=promote" >> "$GITHUB_OUTPUT"
          elif grep -q "^Hotfix: yes" <<<"$BODY"; then
            echo "kind=hotfix" >> "$GITHUB_OUTPUT"
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Tag prod release
        if: steps.detect.outputs.kind == 'promote' && steps.detect.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.detect.outputs.version }}
        run: |
          set -e
          git config user.name "pantheon-release-bot"
          git config user.email "pantheon-release-bot@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "prod/$VER" >/dev/null 2>&1; then
            echo "prod/$VER already exists; skipping"
            exit 0
          fi
          git tag -a "prod/$VER" -m "prod release: $VER"
          git push origin "prod/$VER"

      - name: Notify orchestrator
        if: steps.detect.outputs.kind != 'none'
        env:
          SYNC_URL: ${{ secrets.PANTHEON_ORCHESTRATOR_SYNC_URL }}
          SYNC_SECRET: ${{ secrets.PANTHEON_ORCHESTRATOR_SYNC_SECRET }}
          KIND: ${{ steps.detect.outputs.kind }}
          VER: ${{ steps.detect.outputs.version }}
          SUBJECT: ${{ steps.detect.outputs.subject }}
          SHA: ${{ github.sha }}
        run: |
          if [[ -z "$SYNC_URL" ]]; then
            echo "no orchestrator sync url configured; skipping notify"
            exit 0
          fi
          if [[ ! -f scripts/git/notify_orchestrator.py ]]; then
            echo "notify_orchestrator.py not present on this ref; skipping (master pre-bootstrap)"
            exit 0
          fi
          python3 scripts/git/notify_orchestrator.py \
            --event "${KIND}_merged" \
            --payload-json "{\"version\":\"${VER}\",\"sha\":\"${SHA}\",\"subject\":${SUBJECT@Q}}"

name: Regression Tests

on:
  pull_request:
    branches:
      - backend-dev-publish-20260429
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect Lean changes
        id: lean_changes
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          if git diff --name-only FETCH_HEAD HEAD | grep -qE '^lean($|/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No lean/ changes detected; skipping Lean workflow body for this Pantheon PR."
          fi

      - name: Skip Lean workflow body
        if: steps.lean_changes.outputs.changed != 'true'
        run: echo "No lean/ changes detected; Lean workflow body skipped."

      - name: Initialize Lean submodule
        if: steps.lean_changes.outputs.changed == 'true'
        run: git submodule update --init --depth=1 lean

      - name: Liberate disk space
        if: steps.lean_changes.outputs.changed == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Define docker helper
        if: steps.lean_changes.outputs.changed == 'true'
        run: |
          echo 'runInContainer() { docker exec test-container "$@"; }' > $HOME/ci_functions.sh
          echo "BASH_ENV=$HOME/ci_functions.sh" >> $GITHUB_ENV

      - name: Start container
        if: steps.lean_changes.outputs.changed == 'true'
        run: |
          docker run -d \
            --workdir /__w/pantheon/pantheon/lean \
            -v /home/runner/work:/__w \
            --name test-container \
            quantconnect/lean:foundation \
            tail -f /dev/null

      - name: Build
        if: steps.lean_changes.outputs.changed == 'true'
        run: runInContainer dotnet build /p:Configuration=Release /v:quiet /p:WarningLevel=1 QuantConnect.Lean.sln

      - name: Run Tests
        if: steps.lean_changes.outputs.changed == 'true'
        run: |
          runInContainer dotnet test ./Tests/bin/Release/QuantConnect.Tests.dll \
            --filter TestCategory=RegressionTests \
            -- TestRunParameters.Parameter\(name=\"log-handler\", value=\"ConsoleErrorLogHandler\"\) \
            TestRunParameters.Parameter\(name=\"reduced-disk-size\", value=\"true\"\)

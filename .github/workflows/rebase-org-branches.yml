name: Rebase Organization Branches

on:
  push:
    branches:
      - 'master'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebase Organization Branches
        run: |
          if [[ ! -f rebase_organization_branches.sh ]]; then
            echo "rebase_organization_branches.sh is not present on this branch; skipping legacy organization branch rebase."
            exit 0
          fi
          chmod +x rebase_organization_branches.sh
          ./rebase_organization_branches.sh
        env:
          QC_GIT_TOKEN: ${{ secrets.QC_GIT_TOKEN }}

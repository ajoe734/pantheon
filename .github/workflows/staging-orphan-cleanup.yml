name: Pantheon Staging Orphan Cleanup

# Independent scheduled orphan sweeper running every 30 minutes.
# Remains strictly inert (`status=inert_disabled`, exit 0, zero cloud calls) until
# `STAGING_ORPHAN_CLEANUP_ENABLED=true` and `STAGING_GCP_PROJECT_ID` / `STAGING_GCP_ZONE`
# are explicitly configured after staging environment/project authority is verified.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run inventory reconciliation in dry-run mode (true/false)"
        required: false
        default: "true"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-orphan-cleanup
  cancel-in-progress: false

jobs:
  orphan-sweep:
    name: Reconcile and sweep expired staging resources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_ORPHAN_CLEANUP_ENABLED: ${{ vars.STAGING_ORPHAN_CLEANUP_ENABLED || 'false' }}
      STAGING_GCP_PROJECT_ID: ${{ vars.STAGING_GCP_PROJECT_ID || '' }}
      STAGING_GCP_ZONE: ${{ vars.STAGING_GCP_ZONE || '' }}
      STAGING_DRY_RUN: ${{ inputs.dry_run || 'false' }}
      STAGING_STATE_DIR: ${{ runner.temp }}/pantheon-staging-state
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run inert-by-default orphan inventory reconciliation
        run: |
          ./scripts/deploy/staging_destroy.sh --mode orphan-sweep

      - name: Upload orphan sweep evidence if any expired resources were swept
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-orphan-sweep-${{ github.run_id }}
          path: ${{ runner.temp }}/pantheon-staging-state/evidence/
          if-no-files-found: ignore
          retention-days: 14

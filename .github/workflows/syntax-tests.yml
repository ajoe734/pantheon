name: Syntax Tests

on:
  pull_request:
    branches:
      - backend-dev-publish-20260429
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect Lean changes
        id: lean_changes
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          if git diff --name-only FETCH_HEAD HEAD | grep -qE '^lean($|/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No lean/ changes detected; skipping Lean workflow body for this Pantheon PR."
          fi

      - name: Skip Lean workflow body
        if: steps.lean_changes.outputs.changed != 'true'
        run: echo "No lean/ changes detected; Lean workflow body skipped."

      - name: Initialize Lean submodule
        if: steps.lean_changes.outputs.changed == 'true'
        run: git submodule update --init --depth=1 lean

      - name: Liberate disk space
        if: steps.lean_changes.outputs.changed == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Define docker helper
        if: steps.lean_changes.outputs.changed == 'true'
        run: |
          echo 'runInContainer() { docker exec test-container "$@"; }' > $HOME/ci_functions.sh
          echo "BASH_ENV=$HOME/ci_functions.sh" >> $GITHUB_ENV

      - name: Start container
        if: steps.lean_changes.outputs.changed == 'true'
        run: |
          docker run -d \
            --workdir /__w/pantheon/pantheon/lean \
            -v /home/runner/work:/__w \
            --name test-container \
            quantconnect/lean:foundation \
            tail -f /dev/null

      - name: Run Syntax Test
        if: steps.lean_changes.outputs.changed == 'true'
        run: |
          runInContainer bash -c "pip install --no-cache-dir quantconnect-stubs types-requests==2.32.* types-pytz==2025.2.0.* mypy==1.15.0"
          runInContainer python run_syntax_check.py

  vectorbt-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run vectorbt governed smoke path
        run: python services/research/vectorbt/smoke_test.py

      - name: Run vectorbt adapter tests
        run: python -m pytest services/research/vectorbt/test_adapter.py -q

name: Hourly Publish Cut

# Cut a publish snapshot from dev every hour (or on demand) when dev has
# advanced since the latest release tag, then auto-deploy it to the dev VM.
# Per docs/conventions/GIT_WORKFLOW.md §3 (per-task PR model, 2026-05-17).
#
# Trigger:
#   * cron hourly at :00 UTC
#   * workflow_dispatch (manual override)
#
# The cut + push + tag live in scripts/git/nightly_publish.sh so the operator
# can run the same sequence locally. The version suffix (vYYYY.MM.DD.N) auto-
# increments within a UTC day, so multiple cuts per day never collide.
#
# Deploy: nonprod-deploy.yml's `on: push: publish/v*` trigger does NOT fire for
# branches pushed with GITHUB_TOKEN (GitHub suppresses recursive workflow runs),
# so after a successful cut we explicitly dispatch it via the API. workflow_dispatch
# IS exempt from the GITHUB_TOKEN suppression, so this reliably rolls dev forward.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Cut even if dev did not advance (debug only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write   # dispatch nonprod-deploy after a cut

concurrency:
  group: nightly-publish-cut
  cancel-in-progress: false

jobs:
  cut:
    name: Cut nightly publish snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          fetch-tags: true
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config user.name "pantheon-publish-bot"
          git config user.email "pantheon-publish-bot@users.noreply.github.com"

      - name: Check if dev advanced
        id: check
        run: |
          if [[ "${{ inputs.force }}" == "true" ]]; then
            echo "should_cut=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if bash scripts/git/nightly_publish.sh check; then
            echo "should_cut=true" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            if [[ "$rc" == "10" ]]; then
              echo "should_cut=false" >> "$GITHUB_OUTPUT"
              echo "dev has not advanced since the latest release; nothing to cut"
              exit 0
            fi
            echo "nightly_publish.sh check failed with exit $rc" >&2
            exit "$rc"
          fi

      - name: Cut publish snapshot
        id: cut
        if: steps.check.outputs.should_cut == 'true'
        run: |
          out=$(bash scripts/git/nightly_publish.sh now)
          echo "$out"
          # nightly_publish.sh prints "  branch: publish/vYYYY.MM.DD.N" on success.
          # If dev did not actually advance between the check and now (e.g. a
          # back-to-back queued run already cut this SHA), `now` no-ops and prints
          # no branch line — that is a benign skip, not a failure.
          branch=$(printf '%s\n' "$out" | sed -n 's/^[[:space:]]*branch:[[:space:]]*//p' | head -1)
          if [[ -z "$branch" ]]; then
            echo "no snapshot cut this run (dev did not advance); skipping deploy"
          else
            echo "publish_branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy snapshot to dev
        if: steps.check.outputs.should_cut == 'true' && steps.cut.outputs.publish_branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="${{ steps.cut.outputs.publish_branch }}"
          echo "Dispatching nonprod-deploy for ${branch} -> dev"
          # workflow_dispatch (unlike push) IS triggered by GITHUB_TOKEN, so this
          # reliably rolls the dev VM forward to the freshly cut snapshot.
          gh workflow run nonprod-deploy.yml \
            -f environment=dev \
            -f component=auto \
            -f ref="${branch}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Hourly publish cut"
            echo "- should_cut: ${{ steps.check.outputs.should_cut }}"
            echo "- trigger: ${{ github.event_name }}"
            echo "- publish_branch: ${{ steps.cut.outputs.publish_branch }}"
          } >> "$GITHUB_STEP_SUMMARY"

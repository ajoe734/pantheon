name: PPL-ALLOC-009 Hosted Acceptance

on:
  workflow_dispatch:
    inputs:
      bff_base_url:
        description: "Pantheon dev BFF base URL"
        required: true
        default: "https://pantheon-lupin-dev-bff.35.201.204.12.sslip.io"
        type: string
      execute_plans_test_sha:
        description: "Exact harness SHA; must equal expected_fe_sha unless read-only diagnostic mode is active"
        required: false
        default: ""
        type: string
      browser_diagnostic_only:
        description: "Read-only: audit all three hosted routes without executing the governed B1 mutation chain"
        required: false
        default: false
        type: boolean
      diagnostic_persona_id:
        description: "Existing paper Persona used only by read-only browser diagnostic mode"
        required: false
        default: "persona-34ac77f34d030185079d"
        type: string
      diagnostic_pool_id:
        description: "Existing paper capital pool used only by read-only browser diagnostic mode"
        required: false
        default: "pool-persona-paper-75b390797fd9861f92c6"
        type: string
      diagnostic_rebalance_id:
        description: "Existing applied rebalance used only by read-only browser diagnostic mode"
        required: false
        default: "rb-20260725-3be1a73f7b06"
        type: string
      expected_bff_sha:
        description: "Exact deployed Pantheon BFF commit SHA"
        required: true
        type: string
      expected_fe_sha:
        description: "Exact deployed execute-plans commit SHA"
        required: true
        type: string
      fe_base_url:
        description: "Pantheon dev frontend base URL"
        required: true
        default: "https://pantheon-lupin-dev-fe.35.201.204.12.sslip.io"
        type: string
      resume_run_key:
        description: "Original partial-run identity; preserves one Persona and one idempotency chain"
        required: true
        default: "30095677466"
        type: string
      quarter:
        description: "Canonical quarterly ranking window"
        required: true
        default: "2026-Q3"
        type: string
      tenant_id:
        description: "Strict dev acceptance tenant"
        required: true
        default: "tenant-dev"
        type: string

permissions:
  contents: read

concurrency:
  group: ppl-alloc-009-hosted-acceptance-dev
  cancel-in-progress: false

jobs:
  hosted-acceptance:
    name: Governed B1 plus desktop and 393px B3
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    env:
      PPL_ALLOC_009_APPROVER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_ID || 'pantheon-dev-approver-v1' }}
      PPL_ALLOC_009_APPROVER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_SECRET }}
      PPL_ALLOC_009_BFF_BASE_URL: ${{ inputs.bff_base_url }}
      PPL_ALLOC_009_BROWSER_DIAGNOSTIC_ONLY: ${{ inputs.browser_diagnostic_only }}
      PPL_ALLOC_009_DIAGNOSTIC_PERSONA_ID: ${{ inputs.diagnostic_persona_id }}
      PPL_ALLOC_009_DIAGNOSTIC_POOL_ID: ${{ inputs.diagnostic_pool_id }}
      PPL_ALLOC_009_DIAGNOSTIC_REBALANCE_ID: ${{ inputs.diagnostic_rebalance_id }}
      PPL_ALLOC_009_EVIDENCE_DIR: .artifacts/PPL-ALLOC-009/${{ github.run_id }}-${{ github.run_attempt }}
      PPL_ALLOC_009_EXPECTED_BFF_SHA: ${{ inputs.expected_bff_sha }}
      PPL_ALLOC_009_EXPECTED_FE_SHA: ${{ inputs.expected_fe_sha }}
      PPL_ALLOC_009_FE_BASE_URL: ${{ inputs.fe_base_url }}
      PPL_ALLOC_009_OPERATOR_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_ID || 'pantheon-dev-operator-a-v1' }}
      PPL_ALLOC_009_OPERATOR_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_SECRET }}
      PPL_ALLOC_009_QUARTER: ${{ inputs.quarter }}
      PPL_ALLOC_009_RUN_KEY: ${{ inputs.resume_run_key }}
      PPL_ALLOC_009_TENANT_ID: ${{ inputs.tenant_id }}
      PANTHEON_CREDENTIALED_PLAYWRIGHT_NO_ARTIFACTS: "1"
    steps:
      - name: Checkout dispatched Pantheon revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
        with:
          path: pantheon
          persist-credentials: false

      - name: Resolve exact accepted frontend harness
        id: harness
        shell: bash
        env:
          BROWSER_DIAGNOSTIC_ONLY: ${{ inputs.browser_diagnostic_only }}
          EXPECTED_FRONTEND_SHA: ${{ inputs.expected_fe_sha }}
          REQUESTED_TEST_SHA: ${{ inputs.execute_plans_test_sha }}
        run: |
          set -euo pipefail
          if [[ "${BROWSER_DIAGNOSTIC_ONLY}" == "true" ]]; then
            [[ "${REQUESTED_TEST_SHA}" =~ ^[0-9a-f]{40}$ ]]
            echo "test_sha=${REQUESTED_TEST_SHA}" >> "${GITHUB_OUTPUT}"
            echo "PPL_ALLOC_009_TEST_SHA=${REQUESTED_TEST_SHA}" >> "${GITHUB_ENV}"
          else
            python3 pantheon/scripts/resolve_ppl_alloc_009_acceptance_harness.py \
              --expected-frontend-sha "${EXPECTED_FRONTEND_SHA}" \
              --requested-test-sha "${REQUESTED_TEST_SHA}" \
              --github-output "${GITHUB_OUTPUT}" \
              --github-env "${GITHUB_ENV}"
          fi

      - name: Load and mask real browser identity inputs
        shell: bash
        env:
          GCP_IDENTITY_API_KEY: ${{ secrets.PPL_ALLOC_009_GCP_IDENTITY_API_KEY }}
          GCP_IDENTITY_EMAIL: ${{ secrets.PPL_ALLOC_009_GCP_IDENTITY_EMAIL }}
          GCP_IDENTITY_PASSWORD: ${{ secrets.PPL_ALLOC_009_GCP_IDENTITY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GCP_IDENTITY_API_KEY}"
          echo "::add-mask::${GCP_IDENTITY_EMAIL}"
          echo "::add-mask::${GCP_IDENTITY_PASSWORD}"
          if [[ -z "${GCP_IDENTITY_API_KEY}" || -z "${GCP_IDENTITY_EMAIL}" || -z "${GCP_IDENTITY_PASSWORD}" ]]; then
            echo "::error::The real dev browser identity inputs are not fully configured."
            exit 1
          fi
          echo "PPL_ALLOC_009_GCP_IDENTITY_API_KEY=${GCP_IDENTITY_API_KEY}" >> "${GITHUB_ENV}"
          echo "PPL_ALLOC_009_GCP_IDENTITY_EMAIL=${GCP_IDENTITY_EMAIL}" >> "${GITHUB_ENV}"
          echo "PPL_ALLOC_009_GCP_IDENTITY_PASSWORD=${GCP_IDENTITY_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Checkout immutable execute-plans acceptance harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5a
        with:
          repository: ajoe734/execute-plans
          ref: ${{ steps.harness.outputs.test_sha }}
          path: execute-plans
          persist-credentials: false

      - name: Reject unsafe target or incomplete proof inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PPL_ALLOC_009_FE_BASE_URL}" == "https://pantheon-lupin-dev-fe.35.201.204.12.sslip.io" ]]
          [[ "${PPL_ALLOC_009_BFF_BASE_URL}" == "https://pantheon-lupin-dev-bff.35.201.204.12.sslip.io" ]]
          [[ "${PPL_ALLOC_009_EXPECTED_FE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PPL_ALLOC_009_EXPECTED_BFF_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PPL_ALLOC_009_TEST_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PPL_ALLOC_009_BROWSER_DIAGNOSTIC_ONLY}" == "true" || "${PPL_ALLOC_009_TEST_SHA}" == "${PPL_ALLOC_009_EXPECTED_FE_SHA}" ]]
          [[ "$(git -C execute-plans rev-parse HEAD)" == "${PPL_ALLOC_009_TEST_SHA}" ]]
          [[ -f execute-plans/e2e/ppl-alloc-009-cross-repo-hosted.spec.ts ]]
          [[ -n "${PPL_ALLOC_009_OPERATOR_CLIENT_ID}" ]]
          [[ -n "${PPL_ALLOC_009_OPERATOR_CLIENT_SECRET}" ]]
          [[ -n "${PPL_ALLOC_009_APPROVER_CLIENT_ID}" ]]
          [[ -n "${PPL_ALLOC_009_APPROVER_CLIENT_SECRET}" ]]
          [[ -n "${PPL_ALLOC_009_GCP_IDENTITY_API_KEY}" ]]
          [[ -n "${PPL_ALLOC_009_GCP_IDENTITY_EMAIL}" ]]
          [[ -n "${PPL_ALLOC_009_GCP_IDENTITY_PASSWORD}" ]]
          [[ "${PPL_ALLOC_009_RUN_KEY}" == "30095677466" ]]
          [[ "${PPL_ALLOC_009_TENANT_ID}" == "tenant-dev" ]]
          if [[ "${PPL_ALLOC_009_BROWSER_DIAGNOSTIC_ONLY}" == "true" ]]; then
            [[ -n "${PPL_ALLOC_009_DIAGNOSTIC_PERSONA_ID}" ]]
            [[ -n "${PPL_ALLOC_009_DIAGNOSTIC_POOL_ID}" ]]
            [[ -n "${PPL_ALLOC_009_DIAGNOSTIC_REBALANCE_ID}" ]]
          fi

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: execute-plans/package-lock.json

      - name: Install frontend dependencies
        working-directory: execute-plans
        run: npm ci

      - name: Install Chromium
        working-directory: execute-plans
        run: npx playwright install chromium --with-deps

      - name: Run exact-pair governed paper allocation acceptance
        working-directory: execute-plans
        run: |
          set -euo pipefail
          npx playwright test e2e/ppl-alloc-009-cross-repo-hosted.spec.ts \
            --project=chromium \
            --retries=0 \
            --reporter=list \
            --trace=off

      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ppl-alloc-009-hosted-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: execute-plans/.artifacts/PPL-ALLOC-009/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90

name: Canonical Review Gate

# Guarantees the "Pantheon canonical review gate" required status check is
# posted for every PR into dev/master -- success or failure, never silence.
#
# v1 (SUP-REVIEW-PIPELINE-INTEGRITY-20260804) tried to re-derive the review
# policy locally by reading ai-status.json out of this workflow's own
# checkout. That is structurally wrong: a GitHub-hosted runner never sees
# live task-board state, which lives entirely on the Pantheon host as a
# git-independent event log. That version reported failure for every task,
# registered or not, and had to be pulled from branch protection the same
# day it shipped.
#
# v2 (SUP-REVIEW-GATE-GIT-NATIVE-PROOF-20260804) asks a question answerable
# purely over the GitHub API, no live state needed: does a git tag exist at
# the exact reviewed head (refs/tags/pantheon-review/approve/<sha>)? That tag
# is pushed by scripts/git/github_review_bridge.py at approve time, on the
# host that actually has the state -- a tag is part of the repository's own
# object graph, so any `gh api` call sees it, including this runner. This
# workflow does not re-derive policy; it only confirms the artifact the
# trusted internal approve path already produced is present for this exact
# head.
#
# SUP-REVIEW-GATE-DISPATCH-RETRIGGER-20260805: pushing the tag alone does not
# make the required check pass. GitHub pins this named required context to
# whichever identity has historically posted it -- here, this workflow's own
# GITHUB_TOKEN-authenticated run (a status or check-run from this Action's
# job satisfies it; a plain `gh api` status posted from a personal-token host
# process, e.g. github_review_bridge.py's own best-effort status post, does
# not, verified empirically against a live PR). The tag by itself is
# necessary but not sufficient: this workflow also has to actually RUN again
# after the tag exists, so its own, correctly-attributed status is what
# lands. None of `opened`/`synchronize`/`reopened`/`ready_for_review` fire
# from a bare tag push, so github_review_bridge.py explicitly re-dispatches
# this workflow (workflow_dispatch, below) right after a tag lands.
#
# This generic github-actions status is a separate lifecycle check; it cannot
# satisfy the dedicated external-App-pinned canonical reviewer attestation.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
    branches:
      - dev
      - master
  workflow_dispatch:
    inputs:
      head_ref:
        description: "PR head branch (task/<TASK-ID>)"
        required: true
        type: string
      head_sha:
        description: "Exact reviewed commit SHA"
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: canonical-review-gate-${{ github.event.pull_request.number || github.event.inputs.head_sha }}
  cancel-in-progress: true

jobs:
  gate:
    # Keep the Actions check-run name distinct from the commit-status context
    # emitted below.  A pull_request run is expected to observe no proof tag
    # before review and publish a failing required status.  If this job used
    # the same name, its own failure check-run would remain attached to the PR
    # head after the post-approval workflow_dispatch publishes a newer success
    # status, leaving GitHub's mergeability calculation blocked by two
    # conflicting results for the required context.
    name: Publish canonical review status
    runs-on: ubuntu-latest
    steps:
      # Shallow checkout of the PR head only, to run this workflow's own
      # script. No commit-history walking, no local git state -- the check
      # itself is a single GitHub API call. On workflow_dispatch this checks
      # out whatever ref the dispatch call targeted (github_review_bridge.py
      # dispatches against head_ref); the head-ref/head-sha inputs below are
      # what canonical_review_gate_ci.py actually acts on regardless.
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check for the review-proof tag and post the gate status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.inputs.head_ref || github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.inputs.head_sha || github.event.pull_request.head.sha }}
          DELIVERY_CLASS: ${{ contains(github.event.pull_request.labels.*.name, 'delivery:tooling') && 'tooling' || 'product' }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Exit 1 means the fail-closed required status was published because
          # this exact head is not approved yet.  The publisher job itself is
          # not the gate and must not create a second failing result with the
          # required context name.  Missing/failed status publication still
          # fails closed because the required context remains unsatisfied.
          gate_rc=0
          python3 scripts/git/canonical_review_gate_ci.py \
            --repo "$REPO" \
            --head-ref "$HEAD_REF" \
            --head-sha "$HEAD_SHA" \
            --delivery-class "$DELIVERY_CLASS" \
            --target-url "$TARGET_URL" || gate_rc=$?
          if [[ "$gate_rc" -ne 0 && "$gate_rc" -ne 1 ]]; then
            exit "$gate_rc"
          fi

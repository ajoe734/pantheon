name: Coordination Dispatch Receiver v2

# Receives repository_dispatch events from the front-repo as part of the
# Pantheon Console closed-loop coordination protocol.
#
# Accepted event_types:
#   pantheon.frontend_feedback  — front repo completed a Lovable cycle
#   pantheon.bff_gap            — front repo hit a hard contract blocker
#   pantheon.ui_done            — front repo UI implementation is ready for review
#
# Dispatch envelope (client_payload) required fields:
#   event_type, feature_id, payload_path, source_repo, source_commit,
#   source_ref, trigger_mode, origin_workflow
#
# Transport note:
#   - envelope source_commit points to the commit that contains payload_path
#   - payload.source_commit may point to the reviewed UI cycle commit
#
# See .coordination/responses/F-042-lovable-ui-task.yaml and
# docs/02-architecture/consensus/sessions/phase3-2026-04-14-pantheon-console-loop/coordination-loop-spec.md
# for the full protocol contract.

on:
  repository_dispatch:
    types:
      - pantheon.frontend_feedback
      - pantheon.bff_gap
      - pantheon.ui_done

permissions:
  contents: read
  issues: write

jobs:
  receive-and-validate:
    name: Validate and route dispatch envelope
    runs-on: ubuntu-latest
    steps:
      - name: Extract envelope fields
        id: envelope
        env:
          EVENT_TYPE: ${{ github.event.action }}
          FEATURE_ID: ${{ github.event.client_payload.feature_id }}
          PAYLOAD_PATH: ${{ github.event.client_payload.payload_path }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          SOURCE_COMMIT: ${{ github.event.client_payload.source_commit }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          TRIGGER_MODE: ${{ github.event.client_payload.trigger_mode }}
          ORIGIN_WORKFLOW: ${{ github.event.client_payload.origin_workflow }}
          REPLAY_OF: ${{ github.event.client_payload.replay_of }}
        run: |
          echo "event_type=$EVENT_TYPE"           >> "$GITHUB_OUTPUT"
          echo "feature_id=$FEATURE_ID"           >> "$GITHUB_OUTPUT"
          echo "payload_path=$PAYLOAD_PATH"       >> "$GITHUB_OUTPUT"
          echo "source_repo=$SOURCE_REPO"         >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT"     >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF"           >> "$GITHUB_OUTPUT"
          echo "trigger_mode=$TRIGGER_MODE"       >> "$GITHUB_OUTPUT"
          echo "origin_workflow=$ORIGIN_WORKFLOW" >> "$GITHUB_OUTPUT"
          echo "replay_of=$REPLAY_OF"             >> "$GITHUB_OUTPUT"

      - name: Fail fast — required envelope fields
        env:
          FEATURE_ID: ${{ steps.envelope.outputs.feature_id }}
          PAYLOAD_PATH: ${{ steps.envelope.outputs.payload_path }}
          SOURCE_REPO: ${{ steps.envelope.outputs.source_repo }}
          SOURCE_COMMIT: ${{ steps.envelope.outputs.source_commit }}
          TRIGGER_MODE: ${{ steps.envelope.outputs.trigger_mode }}
          ORIGIN_WORKFLOW: ${{ steps.envelope.outputs.origin_workflow }}
          REPLAY_OF: ${{ steps.envelope.outputs.replay_of }}
        run: |
          missing=()
          [[ -z "$FEATURE_ID"      ]] && missing+=("feature_id")
          [[ -z "$PAYLOAD_PATH"    ]] && missing+=("payload_path")
          [[ -z "$SOURCE_REPO"     ]] && missing+=("source_repo")
          [[ -z "$SOURCE_COMMIT"   ]] && missing+=("source_commit")
          [[ -z "$TRIGGER_MODE"    ]] && missing+=("trigger_mode")
          [[ -z "$ORIGIN_WORKFLOW" ]] && missing+=("origin_workflow")

          if [[ "$TRIGGER_MODE" == "replay" && -z "$REPLAY_OF" ]]; then
            missing+=("replay_of (required when trigger_mode=replay)")
          fi

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required envelope fields: ${missing[*]}"
            exit 1
          fi

          # payload_path must be a repo-relative forward-slash path without ..
          if [[ "$PAYLOAD_PATH" == /* || "$PAYLOAD_PATH" == *..* ]]; then
            echo "::error::payload_path must be a repo-relative path using forward slashes: $PAYLOAD_PATH"
            exit 1
          fi

          if [[ "$SOURCE_REPO" != "ajoe734/front-ai-trading-system" ]]; then
            echo "::error::source_repo must be ajoe734/front-ai-trading-system for front-repo dispatches: $SOURCE_REPO"
            exit 1
          fi

          if ! [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_commit must be a full 40-character SHA: $SOURCE_COMMIT"
            exit 1
          fi

      - name: Checkout source repo at source_commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.envelope.outputs.source_repo }}
          ref: ${{ steps.envelope.outputs.source_commit }}
          token: ${{ secrets.COORDINATION_REPO_TOKEN }}
          path: front-repo
          sparse-checkout: |
            ${{ steps.envelope.outputs.payload_path }}
          sparse-checkout-cone-mode: false

      - name: Validate payload exists at source_commit
        id: payload
        env:
          PAYLOAD_PATH: ${{ steps.envelope.outputs.payload_path }}
        run: |
          full_path="front-repo/$PAYLOAD_PATH"
          if [[ ! -f "$full_path" ]]; then
            echo "::error::payload_path '$PAYLOAD_PATH' does not exist in ${{ steps.envelope.outputs.source_repo }} at commit ${{ steps.envelope.outputs.source_commit }}"
            exit 1
          fi
          echo "full_path=$full_path" >> "$GITHUB_OUTPUT"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate payload fields against envelope
        env:
          EVENT_TYPE: ${{ steps.envelope.outputs.event_type }}
          ENVELOPE_FEATURE_ID: ${{ steps.envelope.outputs.feature_id }}
          ENVELOPE_SOURCE_REPO: ${{ steps.envelope.outputs.source_repo }}
          ENVELOPE_SOURCE_COMMIT: ${{ steps.envelope.outputs.source_commit }}
          PAYLOAD_FULL_PATH: ${{ steps.payload.outputs.full_path }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, yaml

          event_type         = os.environ["EVENT_TYPE"]
          envelope_feature_id = os.environ["ENVELOPE_FEATURE_ID"]
          envelope_source_repo = os.environ["ENVELOPE_SOURCE_REPO"]
          envelope_source_commit = os.environ["ENVELOPE_SOURCE_COMMIT"]
          payload_path       = os.environ["PAYLOAD_FULL_PATH"]

          # event_type -> allowed payload type
          allowed_types = {
              "pantheon.frontend_feedback": "frontend-feedback",
              "pantheon.bff_gap":           "bff-gap",
              "pantheon.ui_done":           "ui-done",
          }
          expected_payload_type = allowed_types.get(event_type)
          if expected_payload_type is None:
              print(f"::error::Unknown event_type: {event_type}")
              sys.exit(1)

          with open(payload_path) as f:
              payload = yaml.safe_load(f)

          errors = []

          # Rule 1: feature_id in envelope must match feature_id inside payload
          payload_feature_id = payload.get("feature_id", "")
          if payload_feature_id != envelope_feature_id:
              errors.append(
                  f"feature_id mismatch: envelope='{envelope_feature_id}' "
                  f"payload='{payload_feature_id}'"
              )

          # Rule 3: payload type must be valid for event_type
          payload_type = payload.get("type", "")
          if payload_type != expected_payload_type:
              errors.append(
                  f"payload type mismatch: event_type='{event_type}' "
                  f"requires type='{expected_payload_type}' but got '{payload_type}'"
              )

          payload_source_repo = payload.get("source_repo", "")
          if payload_source_repo and payload_source_repo != envelope_source_repo:
              errors.append(
                  f"source_repo mismatch: envelope='{envelope_source_repo}' "
                  f"payload='{payload_source_repo}'"
              )

          # envelope source_commit is the transport commit that must contain
          # the payload. payload.source_commit may instead pin the reviewed UI
          # cycle commit that Pantheon should inspect.
          payload_source_commit = payload.get("source_commit", "")
          if payload_source_commit and not (
              len(payload_source_commit) == 40 and
              all(c in "0123456789abcdef" for c in payload_source_commit)
          ):
              errors.append(
                  f"payload source_commit must be a full 40-character SHA, got '{payload_source_commit}'"
              )

          # Rule 4: repo-relative paths referenced in payload must not be absolute
          paths_to_check = []
          if payload_type == "frontend-feedback":
              for required in (
                  "source_repo",
                  "source_commit",
                  "feedback_bundle_dir",
                  "feedback_path",
                  "api_gap_requests_path",
                  "ui_decisions_path",
                  "qa_status_path",
                  "changed_files",
                  "pantheon_review_hint",
              ):
                  if not payload.get(required):
                      errors.append(f"frontend-feedback is missing required field: '{required}'")
              bundle_dir = payload.get("feedback_bundle_dir", "")
              if bundle_dir:
                  paths_to_check.append(("feedback_bundle_dir", bundle_dir))
              for key in ("feedback_path", "api_gap_requests_path",
                          "ui_decisions_path", "qa_status_path"):
                  v = payload.get(key, "")
                  if v:
                      paths_to_check.append((key, v))
              for p in payload.get("changed_files", []):
                  paths_to_check.append(("changed_files[]", p))
          elif payload_type == "ui-done":
              for p in payload.get("changed_files", []):
                  paths_to_check.append(("changed_files[]", p))
              for key in ("completion_payload_path",):
                  v = payload.get(key, "")
                  if v:
                      paths_to_check.append((key, v))

          for field, p in paths_to_check:
              if p.startswith("/") or ".." in p:
                  errors.append(
                      f"payload field '{field}' contains an absolute or traversal path: '{p}'"
                  )

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)

          print(f"Payload validation passed: feature_id={envelope_feature_id}, type={payload_type}")
          PYEOF

      - name: Route event to Pantheon worker queue
        env:
          EVENT_TYPE: ${{ steps.envelope.outputs.event_type }}
          FEATURE_ID: ${{ steps.envelope.outputs.feature_id }}
          PAYLOAD_PATH: ${{ steps.envelope.outputs.payload_path }}
          SOURCE_REPO: ${{ steps.envelope.outputs.source_repo }}
          SOURCE_COMMIT: ${{ steps.envelope.outputs.source_commit }}
          TRIGGER_MODE: ${{ steps.envelope.outputs.trigger_mode }}
          REPLAY_OF: ${{ steps.envelope.outputs.replay_of }}
        run: |
          echo "Routing validated dispatch:"
          echo "  event_type   = $EVENT_TYPE"
          echo "  feature_id   = $FEATURE_ID"
          echo "  payload_path = $PAYLOAD_PATH"
          echo "  source_repo  = $SOURCE_REPO"
          echo "  source_commit= $SOURCE_COMMIT"
          echo "  trigger_mode = $TRIGGER_MODE"
          [[ -n "$REPLAY_OF" ]] && echo "  replay_of    = $REPLAY_OF"

          # Routing table: the orchestrator or a downstream workflow step
          # processes these events. Extend this block when automated worker
          # dispatch is wired up.
          case "$EVENT_TYPE" in
            pantheon.frontend_feedback)
              echo "Action: queue Pantheon review lane for feature $FEATURE_ID"
              ;;
            pantheon.bff_gap)
              echo "Action: create contract blocker for feature $FEATURE_ID"
              ;;
            pantheon.ui_done)
              echo "Action: queue Pantheon integration review for feature $FEATURE_ID"
              ;;
          esac

          if [[ "$TRIGGER_MODE" == "replay" ]]; then
            echo "  [replay] original dispatch: $REPLAY_OF"
          fi

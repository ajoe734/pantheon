          DEV_BFF_ROLE_CLAIMS: ${{ vars.DEV_BFF_ROLE_CLAIMS || 'roles,role' }}
          DEV_BFF_ROLE_MAP: ${{ vars.DEV_BFF_ROLE_MAP || 'pantheon-operator=operator;pantheon-viewer=viewer;pantheon-reviewer=reviewer;pantheon-approver=approver;pantheon-risk-owner=risk_owner;pantheon-admin=admin' }}
          DEV_BFF_ROLE_MAP_MODE: ${{ vars.DEV_BFF_ROLE_MAP_MODE || 'strict' }}
          DEV_BFF_DEFAULT_ROLE: ${{ vars.DEV_BFF_DEFAULT_ROLE || 'viewer' }}
          DEV_OPENCLAW_ADAPTER_SERVICE_TOKEN: ${{ secrets.DEV_OPENCLAW_ADAPTER_SERVICE_TOKEN }}
          DEV_OPENCLAW_ADAPTER_SERVICE_AUTH_REQUIRED: ${{ vars.DEV_OPENCLAW_ADAPTER_SERVICE_AUTH_REQUIRED || 'true' }}
          DEV_OPENCLAW_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.DEV_OPENCLAW_CLAUDE_CODE_OAUTH_TOKEN }}
          DEV_OPENCLAW_ANTHROPIC_API_KEY: ${{ secrets.DEV_OPENCLAW_ANTHROPIC_API_KEY }}
          DEV_OPENCLAW_ANTHROPIC_WORKSPACE_ID: ${{ vars.DEV_OPENCLAW_ANTHROPIC_WORKSPACE_ID }}
          DEV_MANAGEMENT_AI_STORE_BACKEND: ${{ vars.DEV_MANAGEMENT_AI_STORE_BACKEND || 'postgres' }}
          DEV_MANAGEMENT_AI_STORE_SCHEMA: ${{ vars.DEV_MANAGEMENT_AI_STORE_SCHEMA || 'management_ai' }}
          DEV_MANAGEMENT_AI_DB_USER: ${{ vars.DEV_MANAGEMENT_AI_DB_USER || 'pantheon_management_ai' }}
          DEV_MANAGEMENT_AI_DB_PASSWORD: ${{ secrets.DEV_MANAGEMENT_AI_DB_PASSWORD }}
          DEV_MANAGEMENT_AI_DATABASE_URL: ${{ secrets.DEV_MANAGEMENT_AI_DATABASE_URL }}
          DEV_AGORA_PRIVATE_CONTENT_DEV_KEK: ${{ secrets.DEV_AGORA_PRIVATE_CONTENT_DEV_KEK }}
          DEV_MANAGEMENT_AI_ATTACH_BUCKET: ${{ vars.DEV_MANAGEMENT_AI_ATTACH_BUCKET }}
          DEV_MANAGEMENT_AI_ATTACH_LOCATION: ${{ vars.DEV_MANAGEMENT_AI_ATTACH_LOCATION || 'asia-east1' }}
          DEV_PPL_ALLOC_009_DEV_PROOF_ENABLED: ${{ inputs.ppl_alloc_009_dev_proof_enabled }}
          PANTHEON_DEV_DOCKER_PRUNE: ${{ vars.PANTHEON_DEV_DOCKER_PRUNE || 'true' }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: bash .target/scripts/compensate_cross_repo_release.sh

      - name: Retire non-served dev paper release cases
        id: retire_release_cases
        # Evidence-only: a retirement failure is recorded and never changes the
        # accepted/compensated outcome. Uses only the Deployment owner retire
        # action; on compensation only this run's case is retired.
        if: ${{ always() && needs.deploy-dev.outputs.paper_bootstrap_requested == 'true' && steps.frontend_release.outputs.evidence_dir != '' && ((steps.frontend_release.outcome == 'success' && steps.final_artifact_verify.outcome == 'success' && (!inputs.run_exact_artifact_roundtrip || (steps.roundtrip_baseline_restore.outcome == 'success' && steps.roundtrip_final_return.outcome == 'success'))) || steps.compensation.outcome == 'success') }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          DEV_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEV_DEPLOY_SSH_PRIVATE_KEY }}
          DEV_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEV_DEPLOY_SSH_KNOWN_HOSTS }}
          DEV_DEPLOY_SSH_HOST: ${{ vars.DEV_DEPLOY_SSH_HOST }}
          RETIRE_EVIDENCE_DIR: ${{ env.RELEASE_EVIDENCE_DIR }}
          RELEASE_OUTCOME: ${{ steps.frontend_release.outcome == 'success' && steps.final_artifact_verify.outcome == 'success' && (!inputs.run_exact_artifact_roundtrip || (steps.roundtrip_baseline_restore.outcome == 'success' && steps.roundtrip_final_return.outcome == 'success')) && 'accepted' || 'compensated' }}
        shell: /bin/bash --noprofile --norc -uo pipefail {0}
        run: |
          evidence="${RETIRE_EVIDENCE_DIR}/dev-paper-release-case-retire.json"
          mkdir -p "${RETIRE_EVIDENCE_DIR}"
          fail_evidence() {
            printf '{"schema_version":"pantheon.dev-paper-release-case-retire.v2","status":"error","run_id":"%s","error":"%s"}\n' \
              "${GITHUB_RUN_ID}" "$1" > "${evidence}"
            echo "[retire-release-cases] $1 (recorded; release outcome unchanged)" >&2
            exit 0
          }
          credentials_dir="${RUNNER_TEMP}/pantheon-dev-ssh-retire-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          transport="${GITHUB_WORKSPACE}/.target/scripts/dev_vm_ssh.sh"
          script="${GITHUB_WORKSPACE}/.target/scripts/retire_dev_paper_release_cases.py"
          [[ -f "${script}" && ! -L "${script}" && -f "${transport}" && ! -L "${transport}" ]] \
            || fail_evidence "retirement script or transport missing"
          "${transport}" prepare "${credentials_dir}" >/dev/null || fail_evidence "ssh transport prepare failed"
          [[ -f "${credentials_dir}/deploy_key" && -f "${credentials_dir}/known_hosts" ]] \
            || fail_evidence "ssh transport credentials missing"
          export DEV_DEPLOY_SSH_KEY_FILE="${credentials_dir}/deploy_key"
          export DEV_DEPLOY_SSH_KNOWN_HOSTS_FILE="${credentials_dir}/known_hosts"
          case_key="dev-paper-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The script travels on stdin so a compensated (older) container
          # image does not need to contain it.
          timeout --kill-after=10 240 "${transport}" exec \
            "docker exec -i pantheon-operator-bff-1 python - --outcome ${RELEASE_OUTCOME} --new-case-key ${case_key} --run-id ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} --timeout-seconds 180" \
            < "${script}" > "${evidence}.tmp" || true
          if python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "${evidence}.tmp" 2>/dev/null; then
            mv -f "${evidence}.tmp" "${evidence}"
          else
            rm -f "${evidence}.tmp"
            fail_evidence "retirement produced no parseable evidence"
          fi
          echo "- dev paper release case retirement: \`$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status"))' "${evidence}")\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload accepted or compensated release evidence
        id: release_evidence_upload
        if: ${{ always() && steps.frontend_release.outputs.evidence_dir != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pantheon-cross-repo-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.frontend_release.outputs.evidence_dir }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Enforce accepted or proven compensated outcome
        if: ${{ always() }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          roundtrip_ok=true
          if [[ "${{ inputs.run_exact_artifact_roundtrip }}" == "true" ]]; then
            if [[ "${{ steps.roundtrip_baseline_restore.outcome }}" != "success" || "${{ steps.roundtrip_final_return.outcome }}" != "success" ]]; then
              roundtrip_ok=false
            fi
          fi
          if [[ "${{ steps.frontend_release.outcome }}" == "success" && \
                "${{ steps.final_artifact_verify.outcome }}" == "success" && \
                "${roundtrip_ok}" == "true" && \
                -s "${RELEASE_EVIDENCE_DIR}/candidate/candidate-frontend.json" ]]; then
            {
              echo "## Exact FE/BFF release accepted"
              echo "- release candidate: \`${{ needs.deploy-dev.outputs.release_candidate_id }}\`"
              echo "- backend: \`${{ needs.deploy-dev.outputs.backend_sha }}\`"
              echo "- frontend: \`${{ needs.deploy-dev.outputs.frontend_sha }}\`"
              echo "- compatibility manifest: \`${{ needs.deploy-dev.outputs.compatibility_manifest_sha256 }}\`"
              echo "- admission artifact: \`${{ needs.deploy-dev.outputs.admission_artifact_digest }}\`"
              echo "- transaction evidence: \`${{ steps.release_evidence_upload.outputs.artifact-digest }}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [[ "${{ steps.compensation.outcome }}" == "success" && \
                -s "${RELEASE_EVIDENCE_DIR}/release-compensation.json" ]]; then
            {
              echo "## Exact FE/BFF release rejected and compensated"
              echo "- rejected candidate: \`${{ needs.deploy-dev.outputs.release_candidate_id }}\`"
              echo "- restored backend: \`${{ needs.deploy-dev.outputs.previous_backend_sha }}\`"
              echo "- restored frontend: \`${{ needs.deploy-dev.outputs.previous_frontend_sha }}\`"
              echo "- compensation evidence: \`${{ steps.release_evidence_upload.outputs.artifact-digest }}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "Frontend admission or switch failed; exact hosted baseline was restored." >&2
            exit 1
          fi
          echo "Frontend admission or switch failed and exact rollback proof is absent." >&2
          exit 75

  isolated-l12-provider-qualification:
    name: Isolated L1-L12 gate with approved provider
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' && inputs.isolated_provider_qualification && !inputs.hosted_all12_chain }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: dev
    env:
      TARGET_REF: ${{ inputs.ref || github.sha }}
      TARGET_COMPONENT: ${{ inputs.component }}
      ALLOW_DIRTY: ${{ inputs.allow_dirty }}
      DEV_AUTH_PROFILE: ${{ inputs.dev_auth_profile }}
    steps:
      # Plain git keeps the pinned checkout-action inventory unchanged. The
      # token travels only through git's environment config, never argv.
      - name: Fetch requested payload
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.extraheader
          GH_TOKEN: ${{ github.token }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          basic="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}"
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin "+refs/heads/dev:refs/remotes/origin/dev" "${TARGET_REF}"
          target_sha="$(git rev-parse --verify "${TARGET_REF}^{commit}")"
          git checkout -q --detach "${target_sha}"
          git submodule update --init --recursive --depth 1

      - name: Validate protected exact dev source
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          sha="$(git rev-parse HEAD)"
          trusted_ref="$(git rev-parse refs/remotes/origin/dev)"
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ || "${sha}" != "${trusted_ref}" || "${GITHUB_REF}" != "refs/heads/dev" || "${GITHUB_SHA}" != "${sha}" ]]; then
            echo "Isolated qualification must run from the exact current Pantheon dev commit ${trusted_ref}; got payload=${sha} workflow_ref=${GITHUB_REF}" >&2
            exit 1
          fi
          if [[ "${TARGET_COMPONENT}" != "auto" || "${ALLOW_DIRTY}" != "false" || "${DEV_AUTH_PROFILE}" != "strict" ]]; then
            echo "Isolated qualification requires component=auto, allow_dirty=false and strict auth." >&2
            exit 1
          fi

      - name: Install harness dependencies
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: python3 -m pip install -r requirements.txt

      - name: Preflight runner resources for full service set
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          echo "=== Runner Disk and Memory Preflight ==="
          df -h .
          free -m
          avail_kb=$(df -k . | awk 'NR==2 {print $4}')
          if [[ "${avail_kb}" -lt 5242880 ]]; then
            echo "Insufficient disk space for isolated compose stack: ${avail_kb} KB < 5GB" >&2
            exit 1
          fi
          avail_mem_kb=$(awk '/MemAvailable/ {print $2}' /proc/meminfo || true)
          if [[ -n "${avail_mem_kb}" && "${avail_mem_kb}" -lt 1048576 ]]; then
            echo "Insufficient memory for isolated compose stack: ${avail_mem_kb} KB < 1GB" >&2
            exit 1
          fi

      # The driver itself owns the shared qualification lease and teardown, so
      # no outer lease is taken here. The provider credential reaches only the
      # gateway container environment; the rendered batch holds unresolved
      # ${ANTHROPIC_WORKSPACE_ID} / ${CLAUDE_CODE_OAUTH_TOKEN} and SecretRef
      # env pointer (OPENCLAW_OPENAI_OAUTH_TOKEN) with no credential value.
      - name: Run original isolated L1-L12 stimulus gate
        env:
          PANTHEON_OPENCLAW_ANTHROPIC_API_KEY: ${{ secrets.DEV_OPENCLAW_ANTHROPIC_API_KEY }}
          PANTHEON_OPENCLAW_ANTHROPIC_WORKSPACE_ID: ${{ vars.DEV_OPENCLAW_ANTHROPIC_WORKSPACE_ID }}
          PANTHEON_OPENCLAW_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.DEV_OPENCLAW_CLAUDE_CODE_OAUTH_TOKEN }}
          PANTHEON_OPENCLAW_OPENAI_OAUTH_TOKEN: ${{ secrets.DEV_OPENCLAW_OPENAI_OAUTH_TOKEN }}
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          batch="$(python3 scripts/openclaw_isolated_model_bootstrap.py)"
          export PANTHEON_OPENCLAW_ISOLATED_MODEL_BATCH="${batch}"
          [[ -n "${PANTHEON_ENVIRONMENT_LEASE_TOKEN}" ]] || { echo "COORDINATION_REPO_TOKEN is required for the qualification lease." >&2; exit 1; }
          mkdir -p "${RUNNER_TEMP}/l12-qualification"
          python3 scripts/run_isolated_l12_runtime_e2e.py \
            --provision-services --stimulus-gate \
            --compose-project "l12q${GITHUB_RUN_ID}x${GITHUB_RUN_ATTEMPT}" \
            --port-offset "$((10000 + GITHUB_RUN_ID % 10 * 1000))" \
            --ready-timeout 600 \
            --evidence-output "${RUNNER_TEMP}/l12-qualification/report.json"

      - name: Upload qualification report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l12-provider-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/l12-qualification/
          if-no-files-found: warn

  # One hosted all-12 chain segment against the already accepted hosted stack.
  # It never deploys, compensates or switches the frontend, never restarts a
  # shared product service, and never waits on a human: a pause uploads its
  # honest incomplete receipt and releases the lease; a later dispatch resumes.
  hosted-all12-chain-phase:
    name: Hosted all-12 chain segment
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' && inputs.hosted_all12_chain }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: dev
    permissions:
      contents: read
      actions: read
    env:
      TARGET_REF: ${{ inputs.ref || github.sha }}
      TARGET_COMPONENT: ${{ inputs.component }}
      ALLOW_DIRTY: ${{ inputs.allow_dirty }}
      DEV_AUTH_PROFILE: ${{ inputs.dev_auth_profile }}
      ISOLATED_REQUESTED: ${{ inputs.isolated_provider_qualification }}
      CHAIN_ID: ${{ inputs.chain_id }}
      CHAIN_PHASE: ${{ inputs.chain_phase }}
      CHAIN_INPUT_JSON: ${{ inputs.chain_input_json }}
      PRIOR_RECEIPT_RUN_ID: ${{ inputs.chain_prior_receipt_run_id }}
      # Only the read-only observation segment runs without the shared lease.
      MUTATING: ${{ inputs.chain_phase != 'D_observe' && 'true' || 'false' }}
      DEV_DEPLOY_SSH_HOST: ${{ vars.DEV_DEPLOY_SSH_HOST }}
      DEV_DEPLOY_SSH_USER: ${{ vars.NONPROD_REMOTE_USER }}
      DEV_BFF_URL: ${{ vars.DEV_BFF_URL || 'https://api.dev.mvl-cap.tw' }}
      DEV_FE_URL: ${{ vars.DEV_FE_URL || 'https://app.dev.mvl-cap.tw' }}
      DEV_DEPLOY_WORKTREE: ${{ vars.DEV_DEPLOY_WORKTREE || format('{0}/dev-root', vars.DEV_DEPLOY_WORKTREE_ROOT) }}
    steps:
      # Plain git keeps the pinned checkout-action inventory unchanged. The
      # token travels only through git's environment config, never argv.
      - name: Fetch requested payload and pinned lease controller
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.extraheader
          GH_TOKEN: ${{ github.token }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          basic="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}"
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin "+refs/heads/dev:refs/remotes/origin/dev" "${TARGET_REF}"
          target_sha="$(git rev-parse --verify "${TARGET_REF}^{commit}")"
          git checkout -q --detach "${target_sha}"
          git submodule update --init --recursive --depth 1
          # Immutable trust root for every lease operation, separate from the payload.
          controller_sha=aee1243573e29d289dac00be13641bb16be7f6bf
          mkdir .lease-controller
          git -C .lease-controller init -q
          git -C .lease-controller remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C .lease-controller fetch -q --depth 1 origin "${controller_sha}"
          git -C .lease-controller checkout -q --detach "${controller_sha}"

      - name: Validate protected exact dev source and hosted segment request
        id: validate
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          sha="$(git rev-parse HEAD)"
          trusted_ref="$(git rev-parse refs/remotes/origin/dev)"
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ || "${sha}" != "${trusted_ref}" || "${GITHUB_REF}" != "refs/heads/dev" || "${GITHUB_SHA}" != "${sha}" ]]; then
            echo "Hosted all-12 chain segments must run from the exact current Pantheon dev commit ${trusted_ref}; got payload=${sha} workflow_ref=${GITHUB_REF}" >&2
            exit 1
          fi
          if [[ "${TARGET_COMPONENT}" != "auto" || "${ALLOW_DIRTY}" != "false" || "${DEV_AUTH_PROFILE}" != "strict" ]]; then
            echo "Hosted all-12 chain segments require component=auto, allow_dirty=false and strict auth." >&2
            exit 1
          fi
          if [[ "${ISOLATED_REQUESTED}" == "true" ]]; then
            echo "hosted_all12_chain and isolated_provider_qualification are mutually exclusive." >&2
            exit 1
          fi
          if [[ ! "${CHAIN_ID}" =~ ^[a-z0-9][a-z0-9-]{7,63}$ ]]; then
            echo "chain_id must be a stable lowercase nonsecret id (8-64 chars of a-z, 0-9, '-')." >&2
            exit 1
          fi
          case "${CHAIN_PHASE}" in
            A_research|B_learning|C_promote|D_observe|E_close) ;;
            *) echo "Unknown chain_phase ${CHAIN_PHASE}" >&2; exit 1 ;;
          esac
          if [[ -n "${PRIOR_RECEIPT_RUN_ID}" && ! "${PRIOR_RECEIPT_RUN_ID}" =~ ^[0-9]{1,20}$ ]]; then
            echo "chain_prior_receipt_run_id must be a numeric workflow run id." >&2
            exit 1
          fi
          evidence_dir="${RUNNER_TEMP}/hosted-all12-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "${evidence_dir}"
          python3 - "${evidence_dir}/chain-input.json" <<'PY'
          import json
          import os
          import re
          import sys

          forbidden = re.compile(r"token|secret|password|credential|authorization|mfa", re.IGNORECASE)
          raw = os.environ.get("CHAIN_INPUT_JSON", "").strip()
          supplied = json.loads(raw) if raw else {}
          if not isinstance(supplied, dict) or set(supplied) - {"decisions", "predecessors"} or len(raw) > 20000:
              raise SystemExit("chain_input_json must be an object with only decisions/predecessors")

          def reject(node, path=""):
              if isinstance(node, dict):
                  for key, value in node.items():
                      here = f"{path}.{key}" if path else str(key)
                      if forbidden.search(str(key)) or str(key).lower() == "approved":
                          raise SystemExit(f"chain_input_json carries a credential or approval flag: {here}")
                      reject(value, here)
              elif isinstance(node, list):
                  for item in node:
                      reject(item, path)

          reject(supplied)
          packet = {
              "chain_id": os.environ["CHAIN_ID"],
              "decisions": supplied.get("decisions") or {},
              "phase": os.environ["CHAIN_PHASE"],
              "predecessors": supplied.get("predecessors") or {},
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(packet, handle, sort_keys=True)
          PY
          echo "evidence_dir=${evidence_dir}" >> "${GITHUB_OUTPUT}"

      - name: Prepare pinned direct SSH transport
        env:
          DEV_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEV_DEPLOY_SSH_PRIVATE_KEY }}
          DEV_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEV_DEPLOY_SSH_KNOWN_HOSTS }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          credentials_dir="${RUNNER_TEMP}/pantheon-dev-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scripts/dev_vm_ssh.sh prepare "${credentials_dir}" >/dev/null

      - name: Prepare fixed trusted command path
        id: runtime
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          trusted_bin="${RUNNER_TEMP}/pantheon-trusted-bin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "${trusted_bin}"
          for command_name in ssh scp ssh-keygen; do
            command_path="$(command -v "${command_name}")"
            [[ -x "${command_path}" && ! -L "${command_path}" ]]
            ln -s "${command_path}" "${trusted_bin}/${command_name}"
          done
          safe_path="${trusted_bin}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          echo "safe_path=${safe_path}" >> "${GITHUB_OUTPUT}"

      # The segment targets whatever pair the hosted stack actually runs. The
      # workflow source SHA is recorded separately and is never presented as
      # the deployed identity.
      - name: Read accepted hosted FE/BFF identity
        id: identity
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          python3 - "${{ steps.validate.outputs.evidence_dir }}/accepted-identity.json" <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          def fetch(url):
              request = urllib.request.Request(url, headers={"Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          manifest = fetch(os.environ["DEV_FE_URL"].rstrip("/") + "/deployment.json")
          version = fetch(os.environ["DEV_BFF_URL"].rstrip("/") + "/bff/version")
          sha = re.compile(r"^[0-9a-f]{40}$")
          backend, frontend = str(manifest.get("bffCommit") or ""), str(manifest.get("frontendSha") or "")
          if manifest.get("deploymentState") not in {"accepted", "functional-accepted"} or not manifest.get("releaseAdmission"):
              raise SystemExit("hosted baseline is not an accepted exact pair; refusing to run a chain segment")
          if not (sha.match(backend) and sha.match(frontend)) or version.get("source_commit_sha") != backend:
              raise SystemExit("hosted FE manifest and BFF /bff/version do not agree on one exact backend commit")
          record = {
              "accepted_backend_sha": backend,
              "accepted_frontend_sha": frontend,
              "bff_reported_source_commit_sha": version.get("source_commit_sha"),
              "deployment_state": manifest.get("deploymentState"),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_source_sha": os.environ["GITHUB_SHA"],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(record, handle, indent=2, sort_keys=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"backend_sha={backend}\n")
          PY

      # The prior receipt is a lookup hint only; owners remain the truth.
      - name: Fetch prior segment receipt hint
        if: ${{ inputs.chain_prior_receipt_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          evidence_dir="${{ steps.validate.outputs.evidence_dir }}"
          download_dir="$(mktemp -d "${RUNNER_TEMP}/hosted-all12-prior-XXXXXX")"
          gh run download "${PRIOR_RECEIPT_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "hosted-all12-${CHAIN_ID}-*" --dir "${download_dir}"
          python3 - "${download_dir}" "${evidence_dir}/prior-receipt.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          found = sorted(pathlib.Path(sys.argv[1]).rglob("receipt.json"))
          if len(found) != 1:
              raise SystemExit(f"expected exactly one prior receipt for this chain, found {len(found)}")
          receipt = json.loads(found[0].read_text(encoding="utf-8"))
          hosted = receipt.get("hosted") or {}
          if hosted.get("chain_id") != os.environ["CHAIN_ID"]:
              raise SystemExit("prior receipt belongs to a different chain id")
          pathlib.Path(sys.argv[2]).write_text(json.dumps(receipt, sort_keys=True), encoding="utf-8")
          PY

      # Only the pinned pytest closure, the jsonschema closure the Registry builder
      # imports (versions read from the existing root test lock) and the CI pip wheel
      # travel to the VM; nothing is installed on the host Python, in a running
      # product container, or from the network.  Wheels are resolved for the real
      # host interpreter/architecture (probed over the pinned SSH transport), not
      # for the CI runner default, because rpds-py is a native wheel.
      - name: Download pinned pytest closure and pip wheel
        id: wheels
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          wheels="${RUNNER_TEMP}/hosted-all12-wheels-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${wheels}"
          pins=()
          for name in pytest iniconfig packaging pluggy pygments jsonschema jsonschema-specifications attrs referencing rpds-py typing-extensions; do
            pin="$(grep -E "^${name}==[0-9][^ ]*$" dependencies/locks/root-tests.txt)"
            [[ -n "${pin}" ]] || { echo "dependencies/locks/root-tests.txt has no pin for ${name}" >&2; exit 1; }
            pins+=("${pin}")
          done
          export DEV_DEPLOY_SSH_KEY_FILE="${RUNNER_TEMP}/pantheon-dev-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/deploy_key"
          export DEV_DEPLOY_SSH_KNOWN_HOSTS_FILE="${RUNNER_TEMP}/pantheon-dev-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/known_hosts"
          host_probe="$(timeout --kill-after=10 60 "${GITHUB_WORKSPACE}/scripts/dev_vm_ssh.sh" exec \
            "python3 -c 'import platform,sys; print(sys.version_info[0], sys.version_info[1], platform.machine())'")"
          read -r host_major host_minor host_arch <<< "${host_probe}"
          [[ "${host_major}.${host_minor}" == "3.12" ]] || { echo "dev VM Python is ${host_major}.${host_minor}, expected 3.12" >&2; exit 1; }
          case "${host_arch}" in
            x86_64|aarch64) ;;
            *) echo "unsupported dev VM architecture ${host_arch}" >&2; exit 1 ;;
          esac
          pip_pin="pip==$(python3 -m pip --version | awk '{print $2}')"
          python3 -m pip download --disable-pip-version-check --only-binary=:all: --no-deps \
            --implementation cp --python-version 3.12 --abi cp312 --abi abi3 --abi none \
            --platform "manylinux2014_${host_arch}" --platform "manylinux_2_17_${host_arch}" \
            --platform "manylinux_2_28_${host_arch}" --platform any \
            --dest "${wheels}" "${pins[@]}" "${pip_pin}"
          printf '%s\n' "${pins[@]}" > "${wheels}/pins.txt"
          echo "wheels_dir=${wheels}" >> "${GITHUB_OUTPUT}"

      - name: Acquire qualification lease and start identity-bound heartbeat
        id: lease
        if: ${{ env.MUTATING == 'true' }}
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: ""
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          ACCEPTED_BACKEND_SHA: ${{ steps.identity.outputs.backend_sha }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          unset BASH_ENV ENV PYTHONPATH PYTHONHOME CDPATH
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
          [[ -n "${lease_token}" ]] || { echo "COORDINATION_REPO_TOKEN is required for the qualification lease." >&2; exit 1; }
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ "$(git -C "${controller}" rev-parse HEAD)" == "aee1243573e29d289dac00be13641bb16be7f6bf" ]]
          [[ -f "${controller}/scripts/dev_environment_lease.py" && ! -L "${controller}/scripts/dev_environment_lease.py" ]]
          printf '%s  %s\n' \
            da9a728ed8cec8e1133b92171e4038f9dc51ef4888911acd02c7e399e54d95ae "${controller}/scripts/dev_environment_lease.py" \
            6c82021b93621f16776d5d67a9e20cb9d690f7ebfa257ebf8c329f7d158fb2c2 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict

          lease_dir="$(mktemp -d "${RUNNER_TEMP}/pantheon-dev-lease-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          chmod 0700 "${lease_dir}"
          state_file="${lease_dir}/state.json"
          pid_file="${lease_dir}/heartbeat.pid"
          identity_file="${lease_dir}/heartbeat-identity.json"
          failure_file="${lease_dir}/heartbeat-failure.json"
          shutdown_file="${lease_dir}/heartbeat-stop.json"
          heartbeat_log="${lease_dir}/heartbeat.log"
          {
            echo "state_file=${state_file}"
            echo "pid_file=${pid_file}"
            echo "identity_file=${identity_file}"
            echo "failure_file=${failure_file}"
            echo "shutdown_file=${shutdown_file}"
            echo "heartbeat_log=${heartbeat_log}"
          } >> "${GITHUB_OUTPUT}"

          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            python3 "${controller}/scripts/dev_environment_lease.py" acquire \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --mode qualification \
            --owner "pantheon:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --ttl-seconds 300 \
            --wait-seconds 1800 \
            --poll-seconds 5 \
            --state-file "${state_file}" \
            --expected-backend-sha "${ACCEPTED_BACKEND_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --json-out "${lease_dir}/acquisition.json"

          exec {token_fd}<<<"${lease_token}"
          env -i \
            PATH="${PATH}" HOME="${HOME}" LANG=C.UTF-8 \
            PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 PYTHONSTARTUP= PYTHONINSPECT= \
            python3 "${controller}/scripts/dev_environment_lease.py" heartbeat-loop \
              --repository ajoe734/execute-plans \
              --branch environment-coordination \
              --path .pantheon/environment-leases/pantheon-dev-environment.json \
              --resource pantheon-dev-environment \
              --state-file "${state_file}" \
              --ttl-seconds 300 \
              --interval-seconds 60 \
              --failure-json-out "${failure_file}" \
              --shutdown-json-out "${shutdown_file}" \
              --identity-json-out "${identity_file}" \
              --token-stdin \
              <&"${token_fd}" >"${heartbeat_log}" 2>&1 &
          heartbeat_pid=$!
          disown "${heartbeat_pid}" 2>/dev/null || true
          exec {token_fd}<&-
          printf '%s\n' "${heartbeat_pid}" > "${pid_file}"
          for _ in $(seq 1 100); do
            [[ -s "${identity_file}" ]] && break
            kill -0 "${heartbeat_pid}" 2>/dev/null || {
              sed -n '1,200p' "${heartbeat_log}" >&2 || true
              exit 75
            }
            sleep 0.1
          done
          [[ -s "${identity_file}" ]]
          python3 "${controller}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
            --identity-file "${identity_file}" \
            --pid "${heartbeat_pid}" \
            --expected-cli "${controller}/scripts/dev_environment_lease.py" \
            --state-file "${state_file}" >/dev/null
          lease_token=""

      # Credentials never enter argv, dispatch inputs, receipts or uploads: the
      # runner exchanges the existing dev-login identity and the child gets it,
      # plus the VM-side service credentials, on the SSH stdin only.
      - name: Run requested phase through the existing stimulus parent
        id: phase
        timeout-minutes: 150
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          # E_close revokes H1 and needs the existing admintest principal, which
          # already holds operator and risk_owner. Other phases keep operator A.
          DEV_BFF_DEV_LOGIN_CLIENT_ID: ${{ inputs.chain_phase == 'E_close' && (vars.DEV_BFF_DEV_LOGIN_TEST_ADMIN_CLIENT_ID || 'pantheon-dev-admin-test') || vars.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_ID }}
          DEV_BFF_DEV_LOGIN_CLIENT_SECRET: ${{ inputs.chain_phase == 'E_close' && secrets.DEV_BFF_DEV_LOGIN_TEST_ADMIN_CLIENT_SECRET || secrets.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_SECRET }}
          HOSTED_CHAIN_TENANT_ID: ${{ vars.DEV_HOSTED_CHAIN_TENANT_ID }}
          ACCEPTED_BACKEND_SHA: ${{ steps.identity.outputs.backend_sha }}
          EVIDENCE_DIR: ${{ steps.validate.outputs.evidence_dir }}
          WHEELS_DIR: ${{ steps.wheels.outputs.wheels_dir }}
          LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
        shell: /bin/bash --noprofile --norc -uo pipefail {0}
        run: |
          credentials_dir="${RUNNER_TEMP}/pantheon-dev-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export DEV_DEPLOY_SSH_KEY_FILE="${credentials_dir}/deploy_key"
          export DEV_DEPLOY_SSH_KNOWN_HOSTS_FILE="${credentials_dir}/known_hosts"
          transport="${GITHUB_WORKSPACE}/scripts/dev_vm_ssh.sh"
          scratch="/tmp/pantheon-hosted-all12-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf -v scratch_q '%q' "${scratch}"
          printf -v worktree_q '%q' "${DEV_DEPLOY_WORKTREE}"
          printf -v sha_q '%q' "${ACCEPTED_BACKEND_SHA}"
          printf -v harness_sha_q '%q' "${GITHUB_SHA}"
          printf -v chain_q '%q' "${CHAIN_ID}"
          printf -v phase_q '%q' "${CHAIN_PHASE}"
          pins_q="$(while read -r pin; do printf '%q ' "${pin}"; done < "${WHEELS_DIR}/pins.txt")"

          bundle="${EVIDENCE_DIR}/.stdin-bundle.json"
          cleanup_bundle() { rm -f "${bundle}"; }
          trap cleanup_bundle EXIT

          # 1. Stage the phase runner, nonsecret packet and wheels privately.
          cat > "${WHEELS_DIR}/run_phase.py" <<'PY'
          #!/usr/bin/env python3
          """Run exactly one hosted all-12 chain phase on the dev VM host (workflow-staged, not a product helper).

          bootstrap: private scratch venv (no pip) + offline pinned pytest closure.
          run:       resolve the live published owner ports, privately assemble credentials
                     (stdin and running-service config only), invoke the existing stimulus
                     parent ::test_hosted_chain_phase and keep a redacted log plus its receipt.
          """

          import argparse
          import glob
          import json
          import os
          import subprocess
          import sys
          import time

          PARENT_NODE = "tests/integration/l12/test_stimulus_cross_loop_deployed_e2e.py::test_hosted_chain_phase"
          HARNESS_FILES = (
              "tests/integration/l12/l12_owner_auth.py",
              "tests/integration/l12/test_stimulus_cross_loop_deployed_e2e.py",
              "tests/integration/l12/test_current_runtime_loops_deployed_e2e.py",
          )
          PROJECT = "pantheon"
          BFF_SERVICE = "operator-bff"
          # (PANTHEON_L12_<name>_URL names, compose service, container port); the host
          # port is read from the running container, never assumed from a default.
          OWNERS = (
              (("SOURCE", "SOURCE_INGEST"), "source-ingest", 8097),
              (("TRAINING",), "training-session-svc", 8099),
              (("RESEARCH",), "research-orchestrator-svc", 8101),
              (("PERSONA",), "persona", 8002),
              (("POLICY_LEARNING",), "policy-learning-svc", 8100),
              (("CONSULTATION",), "consultation-svc", 8096),
              (("BFF",), "operator-bff", 8001),
              (("REGISTRY",), "registry", 8087),
              (("GOVERNANCE",), "governance", 8082),
              (("CAPITAL",), "capital", 8092),
              (("DEPLOYMENT",), "deployment", 8095),
              (("RUNTIME",), "runtime-manager", 8081),
              (("FLEET",), "paper-fleet-reconciler", 8011),
              (("TELEMETRY",), "telemetry", 8083),
              (("RECONCILIATION",), "reconciliation-drift-svc", 8102),
              (("INCIDENTS",), "incidents", 8090),
              (("EVOLUTION",), "evolution", 8093),
          )
          # Existing service credentials, read from the running consumer's own config.
          # (env var for the parent, compose service, container env name, fallback env name)
          SERVICE_CREDENTIALS = (
              ("PANTHEON_L12_AGORA_HANDOFF_TOKEN", "operator-bff", "AGORA_HANDOFF_SERVICE_TOKEN", ""),
              ("PANTHEON_L12_POLICY_LEARNING_TOKEN", "policy-learning-svc", "POLICY_LEARNING_SERVICE_TOKEN", ""),
              ("PANTHEON_L12_CONSULTATION_TOKEN", "consultation-svc", "CONSULTATION_SERVICE_TOKEN", "CONSULTATION_API_TOKEN"),
              ("PANTHEON_L12_PERSONA_SERVICE_TOKEN", "persona", "PANTHEON_PERSONA_SERVICE_TOKEN", "PERSONA_SERVICE_TOKEN"),
              ("PANTHEON_L12_RECONCILIATION_DRIFT_AUTH_TOKEN", "reconciliation-drift-svc", "RECONCILIATION_DRIFT_AUTH_TOKEN", ""),
              ("PANTHEON_L12_EVOLUTION_AUTH_TOKEN", "evolution", "EVOLUTION_AUTH_TOKEN", ""),
          )
          PERSONA_SERVICE = "persona"
          TRAINING_CONSUMER = "training-session-preview-worker"
          PIP_RUNPY = (
              "import runpy, sys; sys.path.insert(0, sys.argv[1]); sys.argv = ['pip'] + sys.argv[2:]; "
              "runpy.run_module('pip', run_name='__main__', alter_sys=True)"
          )


          def run(argv, **kwargs):
              return subprocess.run(argv, capture_output=True, text=True, **kwargs)


          def bootstrap(scratch, pins):
              wheels = os.path.join(scratch, "wheels")
              os.makedirs(wheels, exist_ok=True)
              for name in os.listdir(scratch):
                  if name.endswith(".whl"):
                      os.replace(os.path.join(scratch, name), os.path.join(wheels, name))
              pip_wheels = glob.glob(os.path.join(wheels, "pip-*.whl"))
              if len(pip_wheels) != 1:
                  raise SystemExit("exactly one transferred pip wheel is required")
              venv = os.path.join(scratch, "venv")
              created = run([sys.executable, "-m", "venv", "--without-pip", venv])
              if created.returncode:
                  raise SystemExit(f"venv creation failed: {created.stderr.strip()[-500:]}")
              python = os.path.join(venv, "bin", "python")
              installed = run(
                  [python, "-c", PIP_RUNPY, pip_wheels[0], "install", "--no-index", "--find-links", wheels,
                   "--disable-pip-version-check", "--no-input", *pins]
              )
              if installed.returncode:
                  raise SystemExit(f"offline pytest install failed: {installed.stderr.strip()[-500:]}")
              checked = run([python, "-m", "pytest", "--version"])
              if checked.returncode:
                  raise SystemExit("pytest is not importable in the private venv")
              print(checked.stdout.strip() or checked.stderr.strip())


          def container(service):
              found = run(
                  ["docker", "ps", "-q",
                   "--filter", f"label=com.docker.compose.project={PROJECT}",
                   "--filter", f"label=com.docker.compose.service={service}"]
              )
              ids = found.stdout.split()
              return ids[0] if found.returncode == 0 and len(ids) == 1 else ""


          def host_origin(cid, port):
              published = run(["docker", "port", cid, f"{port}/tcp"])
              for line in published.stdout.splitlines():
                  host_port = line.rsplit(":", 1)[-1].strip()
                  if host_port.isdigit():
                      return f"http://127.0.0.1:{host_port}"
              return ""


          def container_env(cid, name):
              value = run(["docker", "exec", cid, "printenv", name])
              return value.stdout.strip() if value.returncode == 0 else ""


          def training_token(cid):
              path = container_env(cid, "TRAINING_SESSION_WORKER_TOKEN_FILE")
              if path:
                  value = run(["docker", "exec", cid, "cat", path])
                  if value.returncode == 0 and value.stdout.strip():
                      return value.stdout.strip()
              return container_env(cid, "TRAINING_SESSION_WORKER_TOKEN")


          def compose_working_dir(bff_cid):
              return run(
                  ["docker", "inspect", bff_cid, "--format",
                   '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}']
              ).stdout.strip()


          def compose_files(bff_cid):
              labels = run(
                  ["docker", "inspect", bff_cid, "--format",
                   '{{ index .Config.Labels "com.docker.compose.project.config_files" }}']
              ).stdout.strip()
              parts = [part.strip() for part in labels.split(",") if part.strip()]
              # The label is historical command provenance; the release restore step
              # deletes its scratch override (images/.restore-*/images.json). Drop only
              # that evidenced ephemeral path when absent; any other missing persistent
              # input is kept so the owner discovery still fails visibly.
              def restore_override(part):
                  segs = part.split("/")
                  return (
                      len(segs) >= 3
                      and segs[-1] == "images.json"
                      and segs[-2].startswith(".restore-")
                      and segs[-3] == "images"
                  )

              kept = [part for part in parts if os.path.exists(part) or not restore_override(part)]
              return os.pathsep.join(kept)


          def redact(text, secrets):
              for secret in sorted((s for s in secrets if len(s) >= 8), key=len, reverse=True):
                  text = text.replace(secret, "[REDACTED]")
              return text


          def execute(args, bundle):
              scratch = args.scratch
              meta = {"chain_id": args.chain_id, "phase": args.phase, "stage": "preflight"}
              meta_path = os.path.join(scratch, "segment-meta.json")

              def finish(code):
                  with open(meta_path, "w", encoding="utf-8") as handle:
                      json.dump(meta, handle, indent=2, sort_keys=True)
                  return code

              environment = dict(os.environ)
              secrets = [bundle["executor_token"]]
              bff_cid = container(BFF_SERVICE)
              if not bff_cid:
                  meta["error"] = "operator-bff container not found in the compose project"
                  return finish(2)
              worktree = compose_working_dir(bff_cid) or args.worktree
              head = run(["git", "-C", worktree, "rev-parse", "HEAD"]).stdout.strip()
              dirty = run(["git", "-C", worktree, "status", "--porcelain", "--untracked-files=no"]).stdout.strip()
              meta["managed_checkout"] = {
                  "head": head,
                  "expected": args.expected_sha,
                  "clean": not dirty,
                  "worktree": worktree,
              }
              if head != args.expected_sha or dirty:
                  meta["error"] = "managed checkout is not the exact accepted clean source"
                  return finish(2)
              harness_root = os.path.join(scratch, "harness")
              staged_parent = os.path.join(harness_root, "tests/integration/l12/test_stimulus_cross_loop_deployed_e2e.py")
              use_staged_harness = os.path.isfile(staged_parent)
              target_node = f"{staged_parent}::test_hosted_chain_phase" if use_staged_harness else PARENT_NODE
              harness_sha = (getattr(args, "harness_sha", "") or "").strip() or (
                  args.expected_sha if not use_staged_harness else ""
              )
              meta["harness_source"] = {
                  "sha": harness_sha,
                  "staged": use_staged_harness,
                  "files": list(HARNESS_FILES) if use_staged_harness else [],
                  "parent_node": target_node,
                  "runtime_expected_sha": args.expected_sha,
              }
              urls, unresolved = {}, []
              for names, service, port in OWNERS:
                  cid = container(service)
                  origin = host_origin(cid, port) if cid else ""
                  if not origin:
                      unresolved.append(service)
                      continue
                  for name in names:
                      environment[f"PANTHEON_L12_{name}_URL"] = origin
                  urls[service] = origin
              meta["owner_origins"] = urls
              meta["unresolved_owner_services"] = unresolved

              gaps = []
              for env_name, service, source, fallback in SERVICE_CREDENTIALS:
                  cid = container(service)
                  value = (container_env(cid, source) or (container_env(cid, fallback) if fallback else "")) if cid else ""
                  if value:
                      environment[env_name] = value
                      secrets.append(value)
                  else:
                      gaps.append(env_name)
              persona_cid = container(PERSONA_SERVICE)
              environment["PANTHEON_L12_PERSONA_SERVICE_ACTOR_ID"] = (
                  (container_env(persona_cid, "PANTHEON_PERSONA_SERVICE_ACTOR_ID") if persona_cid else "") or "operator-bff"
              )
              consumer = container(TRAINING_CONSUMER)
              value = training_token(consumer) if consumer else ""
              if value:
                  environment["PANTHEON_L12_TRAINING_TOKEN"] = value
                  secrets.append(value)
              else:
                  gaps.append("PANTHEON_L12_TRAINING_TOKEN")
              meta["credential_gaps"] = gaps

              token = bundle["executor_token"]
              environment.update(
                  {
                      "PANTHEON_L12_HOSTED_EXECUTOR_TOKEN": token,
                      "PANTHEON_L12_HOSTED_OWNER_TOKEN": token,
                      "PANTHEON_L12_HOSTED_OWNER_ACTOR_ID": bundle.get("actor_id", ""),
                      "PANTHEON_L12_HOSTED_OWNER_ROLES": ",".join(bundle.get("roles", [])),
                      "PANTHEON_L12_BFF_BEARER": token,
                      # Source GETs have no executor fallback; reuse the same freshly
                      # authenticated identity and admitted tenant (no minting).
                      "PANTHEON_L12_SOURCE_READER_TOKEN": token,
                      "PANTHEON_L12_SOURCE_READER_TENANT_ID": bundle["tenant_id"],
                  }
              )
              # No Capital credential is minted: the chain's Capital writes use the executing
              # session token above, or stop at a named blocker (design section 3).
              meta["capital_credential"] = "executor_session_token_no_service_token"

              packet = os.path.join(scratch, "chain-input.json")
              prior = os.path.join(scratch, "prior-receipt.json")
              receipt = os.path.join(scratch, "receipt.json")
              compose_input = compose_files(bff_cid)
              if not compose_input:
                  meta["error"] = "no persistent Compose input remains for owner discovery"
                  return finish(2)
              environment.update(
                  {
                      "PYTHONDONTWRITEBYTECODE": "1",
                      "PANTHEON_L12_HOSTED_CHAIN": "1",
                      "PANTHEON_L12_STIMULUS_CROSS_LOOP_E2E": "1",
                      "PANTHEON_L12_CROSS_LOOP_RUN_ID": args.chain_id,
                      "PANTHEON_L12_HOSTED_CHAIN_PHASE": args.phase,
                      "PANTHEON_L12_HOSTED_CHAIN_INPUT": packet,
                      "PANTHEON_L12_TENANT_ID": bundle["tenant_id"],
                      "PANTHEON_L12_STIMULUS_EXPECTED_SHA": args.expected_sha,
                      "PANTHEON_L12_STIMULUS_EVIDENCE_OUTPUT": receipt,
                      "PANTHEON_L12_COMPOSE_PROJECT": PROJECT,
                      "PANTHEON_L12_COMPOSE_FILES": compose_input,
                  }
              )
              if os.path.exists(prior):
                  environment["PANTHEON_L12_HOSTED_CHAIN_PRIOR_RECEIPT"] = prior
              if use_staged_harness:
                  existing_py = environment.get("PYTHONPATH", "").strip()
                  environment["PYTHONPATH"] = (
                      f"{harness_root}{os.pathsep}{worktree}"
                      + (f"{os.pathsep}{existing_py}" if existing_py else "")
                  )
                  environment["PANTHEON_L12_HARNESS_ROOT"] = harness_root
                  if harness_sha:
                      environment["PANTHEON_L12_HARNESS_SOURCE_SHA"] = harness_sha
              meta["stage"] = "pytest"
              started = time.time()
              try:
                  completed = subprocess.run(
                      [os.path.join(scratch, "venv", "bin", "python"), "-m", "pytest", "-q", "-p", "no:cacheprovider", target_node],
                      cwd=worktree, env=environment, capture_output=True, text=True, timeout=args.timeout,
                  )
                  code, output = completed.returncode, completed.stdout + completed.stderr
              except subprocess.TimeoutExpired as expired:
                  code, output = 124, f"phase timed out after {args.timeout}s\n{expired.stdout or ''}{expired.stderr or ''}"
              with open(os.path.join(scratch, "phase.log"), "w", encoding="utf-8") as handle:
                  handle.write(redact(output if isinstance(output, str) else output.decode("utf-8", "replace"), secrets))
              meta.update({"stage": "finished", "pytest_exit": code, "seconds": round(time.time() - started, 1)})
              return finish(code)


          def main():
              parser = argparse.ArgumentParser()
              sub = parser.add_subparsers(dest="command", required=True)
              boot = sub.add_parser("bootstrap")
              boot.add_argument("--scratch", required=True)
              boot.add_argument("--pins", nargs="+", required=True)
              runner = sub.add_parser("run")
              runner.add_argument("--scratch", required=True)
              runner.add_argument("--worktree", required=True)
              runner.add_argument("--expected-sha", required=True)
              runner.add_argument("--harness-sha", default="")
              runner.add_argument("--chain-id", required=True)
              runner.add_argument("--phase", required=True)
              runner.add_argument("--timeout", type=int, default=8100)
              args = parser.parse_args()
              if args.command == "bootstrap":
                  bootstrap(args.scratch, args.pins)
                  return 0
              return execute(args, json.load(sys.stdin))


          if __name__ == "__main__":
              sys.exit(main())
          PY
          mkdir -p "${WHEELS_DIR}/harness/tests/integration/l12"
          for harness_rel in \
            tests/integration/l12/l12_owner_auth.py \
            tests/integration/l12/test_stimulus_cross_loop_deployed_e2e.py \
            tests/integration/l12/test_current_runtime_loops_deployed_e2e.py; do
            cp "${GITHUB_WORKSPACE}/${harness_rel}" "${WHEELS_DIR}/harness/${harness_rel}"
          done
          cp "${EVIDENCE_DIR}/chain-input.json" "${WHEELS_DIR}/chain-input.json"
          [[ -f "${EVIDENCE_DIR}/prior-receipt.json" ]] && cp "${EVIDENCE_DIR}/prior-receipt.json" "${WHEELS_DIR}/prior-receipt.json"
          rc=0
          tar -C "${WHEELS_DIR}" -cf - . | timeout --kill-after=10 300 "${transport}" exec \
            "set -euo pipefail; umask 077; rm -rf -- ${scratch_q}; mkdir -m 700 ${scratch_q}; tar -xf - -C ${scratch_q}; python3 ${scratch_q}/run_phase.py bootstrap --scratch ${scratch_q} --pins ${pins_q}" \
            || rc=$?
          if [[ "${rc}" -ne 0 ]]; then
            echo "bootstrap of the private pytest environment failed (exit ${rc})" >&2
            python3 -c 'import json,sys; json.dump({"pytest_exit": None, "stage": "bootstrap", "bootstrap_exit": int(sys.argv[1])}, open(sys.argv[2], "w"))' "${rc}" "${EVIDENCE_DIR}/segment-meta.json"
            exit "${rc}"
          fi

          # 2. Existing real executing identity: dev-login exchange just before use.
          python3 - "${bundle}" <<'PY'
          import base64
          import json
          import os
          import sys
          import urllib.request

          request = urllib.request.Request(
              os.environ["DEV_BFF_URL"].rstrip("/") + "/bff/auth/dev-login",
              data=json.dumps(
                  {
                      "client_id": os.environ["DEV_BFF_DEV_LOGIN_CLIENT_ID"],
                      "client_secret": os.environ["DEV_BFF_DEV_LOGIN_CLIENT_SECRET"],
                  }
              ).encode("utf-8"),
              headers={"Accept": "application/json", "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.loads(response.read().decode("utf-8")).get("access_token") or ""
          if not token:
              raise SystemExit("dev-login returned no access token")
          print(f"::add-mask::{token}")
          part = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
          tenant = os.environ.get("HOSTED_CHAIN_TENANT_ID") or str(claims.get("tenant_id") or "")
          if not tenant or tenant == "*":
              raise SystemExit("no concrete tenant: set DEV_HOSTED_CHAIN_TENANT_ID or use a tenant-bound login")
          roles = claims.get("roles") if isinstance(claims.get("roles"), list) else []
          bundle = {
              "actor_id": str(claims.get("sub") or ""),
              "executor_token": token,
              "roles": [str(role) for role in roles],
              "tenant_id": tenant,
          }
          fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w", encoding="utf-8") as handle:
              json.dump(bundle, handle)
          PY
          [[ -s "${bundle}" ]] || { echo "could not obtain the real executing identity" >&2; exit 1; }

          # 3. One phase process; the parent writes the receipt even when paused.
          rc=0
          timeout --kill-after=30 8400 "${transport}" exec \
            "set -uo pipefail; umask 077; python3 ${scratch_q}/run_phase.py run --scratch ${scratch_q} --worktree ${worktree_q} --expected-sha ${sha_q} --harness-sha ${harness_sha_q} --chain-id ${chain_q} --phase ${phase_q}" \
            < "${bundle}" > "${EVIDENCE_DIR}/phase-console.txt" 2>&1 || rc=$?
          rm -f "${bundle}"

          # 4. Preserve whatever the segment produced, success, pause or failure.
          for name in receipt.json phase.log segment-meta.json; do
            "${transport}" copy-from "${scratch}/${name}" "${EVIDENCE_DIR}/${name}" >/dev/null 2>&1 || true
          done
          python3 - "${EVIDENCE_DIR}" "${rc}" "${CHAIN_PHASE}" <<'PY'
          import json
          import os
          import pathlib
          import sys

          directory, rc, phase = pathlib.Path(sys.argv[1]), int(sys.argv[2]), sys.argv[3]

          def load(name):
              path = directory / name
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return None

          receipt, meta = load("receipt.json") or {}, load("segment-meta.json") or {}
          hosted = receipt.get("hosted") or {}
          status = hosted.get("phase_status")
          result = {
              "accepted_identity": load("accepted-identity.json"),
              "accepted_runtime_sha": os.environ.get("ACCEPTED_BACKEND_SHA", ""),
              "all12_claim_allowed": bool(
                  rc == 0 and phase == "E_close" and status == "completed" and hosted.get("all12_passed") is True
              ),
              "blocked_before": hosted.get("blocked_before"),
              "chain_id": os.environ["CHAIN_ID"],
              "complete": status == "completed",
              "harness_source_sha": (meta.get("harness_source") or {}).get("sha") or os.environ.get("GITHUB_SHA", ""),
              "incomplete_reason": None if status == "completed" else (hosted.get("blocked_before") or "segment_not_completed"),
              "phase": phase,
              "phase_status": status,
              "pytest_exit": rc,
              "receipt_present": bool(receipt),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "schema_version": "pantheon.hosted_all12.workflow_segment_result.v1",
              "segment_meta": meta,
          }
          (directory / "segment-result.json").write_text(json.dumps(result, indent=2, sort_keys=True), encoding="utf-8")
          print(f"segment {phase}: phase_status={status} pytest_exit={rc} complete={result['complete']}")
          PY
          if [[ "${rc}" -ne 0 ]]; then
            echo "phase process failed (exit ${rc}); redacted log is in the uploaded artifact" >&2
          elif [[ -n "${LEASE_FAILURE_FILE}" && -e "${LEASE_FAILURE_FILE}" ]]; then
            echo "lease heartbeat failed during the segment; exclusivity is not proven" >&2
            exit 75
          fi
          exit "${rc}"

      - name: Remove private VM scratch
        if: ${{ always() && steps.runtime.outcome == 'success' }}
        timeout-minutes: 5
        shell: /bin/bash --noprofile --norc -uo pipefail {0}
        run: |
          credentials_dir="${RUNNER_TEMP}/pantheon-dev-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ -f "${credentials_dir}/deploy_key" ]] || exit 0
          export DEV_DEPLOY_SSH_KEY_FILE="${credentials_dir}/deploy_key"
          export DEV_DEPLOY_SSH_KNOWN_HOSTS_FILE="${credentials_dir}/known_hosts"
          scratch="/tmp/pantheon-hosted-all12-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf -v scratch_q '%q' "${scratch}"
          "${GITHUB_WORKSPACE}/scripts/dev_vm_ssh.sh" exec "rm -rf -- ${scratch_q}" || echo "VM scratch cleanup failed; it holds no credentials beyond the redacted log" >&2

      # A pause or failure releases too: the lease is never held for a human.
      # Only an unproven heartbeat identity or a lost lease is quarantined to TTL.
      - name: Stop heartbeat and release the segment lease
        id: lease_cleanup
        if: ${{ always() && steps.lease.conclusion != 'skipped' && steps.lease.outputs.state_file != '' }}
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: ""
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          LEASE_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          LEASE_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          LEASE_SHUTDOWN_FILE: ${{ steps.lease.outputs.shutdown_file }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          unset BASH_ENV ENV PYTHONPATH PYTHONHOME CDPATH
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          printf '%s  %s\n' \
            da9a728ed8cec8e1133b92171e4038f9dc51ef4888911acd02c7e399e54d95ae "${controller}/scripts/dev_environment_lease.py" \
            6c82021b93621f16776d5d67a9e20cb9d690f7ebfa257ebf8c329f7d158fb2c2 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict

          heartbeat_stopped() {
            local state
            state="$(ps -o stat= -p "${heartbeat_pid}" 2>/dev/null | tr -d '[:space:]')"
            case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
            return 1
          }
          verify_identity() {
            python3 "${controller}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
              --identity-file "${LEASE_IDENTITY_FILE}" \
              --pid "${heartbeat_pid}" \
              --expected-cli "${controller}/scripts/dev_environment_lease.py" \
              --state-file "${LEASE_STATE_FILE}" >/dev/null
          }
          stop_heartbeat() {
            local attempt
            heartbeat_stopped && return 0
            verify_identity || return 1
            kill -TERM "${heartbeat_pid}" 2>/dev/null || {
              heartbeat_stopped && return 0
              return 1
            }
            heartbeat_stopped && return 0
            verify_identity || { heartbeat_stopped && return 0; return 1; }
            kill -CONT "${heartbeat_pid}" 2>/dev/null || true
            for attempt in $(seq 1 40); do
              heartbeat_stopped && return 0
              sleep 0.25
            done
            verify_identity || { heartbeat_stopped && return 0; return 1; }
            kill -KILL "${heartbeat_pid}" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              heartbeat_stopped && return 0
              sleep 0.25
            done
            return 1
          }

          if [[ ! -s "${LEASE_PID_FILE}" ]]; then
            echo "Lease heartbeat never became identity-bound; quarantining until TTL." >&2
            exit 0
          fi
          heartbeat_pid="$(tr -d '[:space:]' < "${LEASE_PID_FILE}")"
          [[ "${heartbeat_pid}" =~ ^[1-9][0-9]*$ ]] || {
            echo "Invalid heartbeat PID; quarantining until TTL." >&2
            exit 0
          }
          stop_heartbeat || {
            echo "Could not identity-safely stop heartbeat; refusing release." >&2
            exit 75
          }
          if [[ -e "${LEASE_FAILURE_FILE}" ]]; then
            echo "Lease heartbeat failed; lease quarantined until TTL." >&2
            sed -n '1,200p' "${LEASE_FAILURE_FILE}" >&2 2>/dev/null || true
            exit 75
          fi
          [[ -s "${LEASE_SHUTDOWN_FILE}" ]] || {
            echo "Heartbeat did not record a graceful identity-bound stop; refusing release." >&2
            exit 75
          }
          python3 - "${LEASE_SHUTDOWN_FILE}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          if payload.get("status") != "stopped" or payload.get("resource") != "pantheon-dev-environment":
              raise SystemExit("heartbeat shutdown evidence is invalid")
          PY
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            python3 "${controller}/scripts/dev_environment_lease.py" release \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --state-file "${LEASE_STATE_FILE}"
          lease_token=""

      - name: Upload hosted segment receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-all12-${{ inputs.chain_id }}-${{ inputs.chain_phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hosted-all12-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            ${{ runner.temp }}/hosted-all12-${{ github.run_id }}-${{ github.run_attempt }}/segment-result.json
            ${{ runner.temp }}/hosted-all12-${{ github.run_id }}-${{ github.run_attempt }}/segment-meta.json
            ${{ runner.temp }}/hosted-all12-${{ github.run_id }}-${{ github.run_attempt }}/accepted-identity.json
            ${{ runner.temp }}/hosted-all12-${{ github.run_id }}-${{ github.run_attempt }}/phase.log
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize hosted segment
        if: ${{ always() }}
        shell: /bin/bash --noprofile --norc -uo pipefail {0}
        run: |
          result="${RUNNER_TEMP}/hosted-all12-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/segment-result.json"
          {
            echo "## Hosted all-12 chain segment"
            echo "- chain: \`${CHAIN_ID}\` phase: \`${CHAIN_PHASE}\` (workflow source \`${GITHUB_SHA}\`)"
            if [[ -s "${result}" ]]; then
              python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("- phase_status: " + str(r["phase_status"]) + ", pytest_exit: " + str(r["pytest_exit"]) + ", complete: " + str(r["complete"])); print("- all-12 claim allowed by the E_close receipt" if r["all12_claim_allowed"] else "- all-12 pass is NOT claimed")' "${result}"
            else
              echo "- no segment result was produced"
            fi
            echo "- a paused or failed segment is incomplete progress, never an all-12 pass"
          } >> "${GITHUB_STEP_SUMMARY}"

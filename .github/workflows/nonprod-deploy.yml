          GCP_DEPLOY_PROJECT_ID: ${{ vars.DEV_GCP_DEPLOY_PROJECT_ID || 'pantheon-lupin-dev-20260719' }}
          DEV_BFF_PUBLIC_URL: ${{ vars.DEV_BFF_PUBLIC_URL || 'https://pantheon-lupin-dev-bff.35.201.204.12.sslip.io' }}
          # The generic operator identity is intentionally not MFA-verified.
          # Hosted protected reads use the provisioned governed operator A,
          # which the strict deploy floor requires and binds to MFA.
          DEV_BFF_OIDC_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_ID || 'pantheon-dev-operator-a-v1' }}
          DEV_BFF_OIDC_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_SECRET }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          evidence_name="loop-prod-tel-002-hosted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          readback_name="loop-prod-tel-002-bff-readback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          remote_evidence="/tmp/${evidence_name}"
          local_evidence="/tmp/${evidence_name}"
          readback_evidence="/tmp/${readback_name}"

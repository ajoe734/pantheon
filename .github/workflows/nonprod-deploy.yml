name: Pantheon Nonprod Deploy
run-name: ${{ inputs.environment == 'dev' && format('Dev release {0} + {1}', inputs.ref || github.sha, inputs.frontend_sha) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Non-prod environment to deploy"
        required: true
        type: choice
        options:
          - dev
      component:
        description: "Stack slice to deploy; auto maps to dev/root"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - root
          - bff
      ref:
        description: "Dev requires the exact current Pantheon dev SHA."
        required: false
        default: ""
        type: string
      frontend_sha:
        description: "Dev only: exact execute-plans FE candidate SHA for the paired release."
        required: false
        default: ""
        type: string
      frontend_ref:
        description: "Dev only: exact execute-plans ref that owns frontend_sha (dev or candidate branch)."
        required: false
        default: "dev"
        type: string
      frontend_profile:
        description: "Persistent dev FE profile; automation preserves the accepted hosted profile."
        required: false
        default: read-only
        type: choice
        options:
          - read-only
          - operator-live
      allow_dirty:
        description: "Emergency only: allow dirty remote checkout"
        required: false
        default: false
        type: boolean
      dev_auth_profile:
        description: "Dev only: strict by default; permissive-stub is for bounded governed proof runs"
        required: false
        default: strict
        type: choice
        options:
          - strict
          - permissive-stub
      ppl_alloc_009_dev_proof_enabled:
        description: "Dev strict/root only: temporarily enable the bounded PPL-ALLOC-009 paper proof producer"
        required: false
        default: false
        type: boolean
      run_bounded_source_refresh:
        description: "Dev strict/root only: run one allowlisted TWSE/TPEx source refresh before readiness gates"
        required: false
        default: false
        type: boolean
      run_evolution_dispatch_probe:
        description: "Dev root only: run and upload the EVOLOOP-001 hosted dispatch probe"
        required: false
        default: false
        type: boolean
      run_loop_prod_tel_002_probe:
        description: "Dev root only: prove a natural canonical paper lifecycle against committed telemetry"
        required: false
        default: false
        type: boolean
      bootstrap_empty_host:
        description: "Dev only: admit and deploy an exact predecessor pair to bootstrap an empty host with no deployment.json"
        required: false
        default: false
        type: boolean
      bootstrap_predecessor_backend_sha:
        description: "Dev only: exact 40-hex predecessor backend commit SHA for empty host bootstrap"
        required: false
        default: ""
        type: string
      bootstrap_predecessor_frontend_sha:
        description: "Dev only: exact 40-hex predecessor frontend commit SHA for empty host bootstrap"
        required: false
        default: ""
        type: string
      isolated_provider_qualification:
        description: "Dev only: run the original isolated L1-L12 stimulus gate with the approved product provider; skips every root deploy, compensation and frontend switch"
        required: false
        default: false
        type: boolean
      run_exact_artifact_roundtrip:
        description: "Dev only: optionally execute exact artifact roundtrip (baseline restore -> same-final return) after final candidate verification"
        required: false
        default: false
        type: boolean
      hosted_all12_chain:
        description: "Dev only: run ONE hosted all-12 causal-chain segment against the accepted hosted stack; mutually exclusive with isolated_provider_qualification and skips every root deploy, compensation and frontend switch"
        required: false
        default: false
        type: boolean
      chain_id:
        description: "Hosted chain only: stable lowercase nonsecret chain id (reuse the same id for every segment)"
        required: false
        default: ""
        type: string
      chain_phase:
        description: "Hosted chain only: the one segment to run"
        required: false
        default: A_research
        type: choice
        options:
          - A_research
          - B_learning
          - C_promote
          - D_observe
          - E_close
      chain_input_json:
        description: "Hosted chain only: nonsecret JSON object with optional decisions/predecessors references; credentials and approval flags are rejected"
        required: false
        default: ""
        type: string
      chain_prior_receipt_run_id:
        description: "Hosted chain only: run id whose uploaded segment receipt is a lookup hint for this segment (owners stay the truth)"
        required: false
        default: ""
        type: string
permissions:
  contents: read
  id-token: write

concurrency:
  group: pantheon-nonprod-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy dev under shared environment lease
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' && !inputs.isolated_provider_qualification && !inputs.hosted_all12_chain }}
    runs-on: ubuntu-latest
    # A root deploy rebuilds the complete dev image set on one VM.  The direct
    # SSH deadline below is two hours; the job budget must also leave room for
    # lease acquisition, paper baseline, smoke, and a bounded rollback.
    timeout-minutes: 240
    environment: dev
    outputs:
      backend_sha: ${{ steps.target.outputs.sha }}
      frontend_sha: ${{ steps.frontend.outputs.sha }}
      frontend_ref: ${{ steps.frontend.outputs.ref }}
      previous_backend_sha: ${{ steps.rollback_baseline.outputs.sha }}
      previous_frontend_sha: ${{ steps.rollback_baseline.outputs.frontend_sha }}
      is_bootstrap: ${{ steps.rollback_baseline.outputs.is_bootstrap }}
      release_candidate_id: ${{ steps.release_admission.outputs.release_candidate_id }}
      compatibility_manifest_sha256: ${{ steps.release_admission.outputs.compatibility_manifest_sha256 }}
      admission_artifact_digest: ${{ steps.release_admission_upload.outputs.artifact-digest }}
      artifact_baseline_manifest_sha256: ${{ steps.artifact_baseline.outputs.manifest_sha256 }}
      artifact_baseline_id: ${{ steps.artifact_baseline_upload.outputs.artifact-id }}
      artifact_baseline_digest: ${{ steps.artifact_baseline_upload.outputs.artifact-digest }}
      artifact_candidate_manifest_sha256: ${{ steps.artifact_candidate_seal.outputs.candidate_image_manifest_sha256 }}
      artifact_candidate_id: ${{ steps.artifact_candidate_upload.outputs.artifact-id }}
      artifact_candidate_digest: ${{ steps.artifact_candidate_upload.outputs.artifact-digest }}
      # Admission requires mandatory restart/persistence checks, sealed artifacts,
      # and successful identity-bound lease cleanup after the entire sequence.
      bff_fe_pair_verified: ${{ steps.lease_cleanup.outputs.complete_success == 'true' }}
      paper_bootstrap_requested: ${{ env.PAPER_BOOTSTRAP_REQUESTED }}
    env:
      TARGET_ENV: dev
      TARGET_COMPONENT: ${{ inputs.component }}
      TARGET_REF: ${{ inputs.ref || github.sha }}
      FRONTEND_SHA: ${{ inputs.frontend_sha }}
      FRONTEND_REF: ${{ inputs.frontend_ref }}
      ALLOW_DIRTY: ${{ inputs.allow_dirty }}
      DEV_AUTH_PROFILE: ${{ inputs.dev_auth_profile }}
      PPL_ALLOC_009_DEV_PROOF_ENABLED: ${{ inputs.ppl_alloc_009_dev_proof_enabled }}
      BOUNDED_SOURCE_REFRESH_ENABLED: ${{ inputs.run_bounded_source_refresh }}
      DEV_DEPLOY_SSH_HOST: ${{ vars.DEV_DEPLOY_SSH_HOST }}
      DEV_DEPLOY_SSH_USER: ${{ vars.NONPROD_REMOTE_USER }}
      BOOTSTRAP_EMPTY_HOST: ${{ inputs.bootstrap_empty_host || false }}
      # One applicability decision for the run-scoped paper case: only an
      # explicit proof/probe/bootstrap request on auto/root creates it, so an
      # ordinary code release preserves the current paper reservation.
      PAPER_BOOTSTRAP_REQUESTED: ${{ (inputs.component == 'auto' || inputs.component == 'root') && (inputs.ppl_alloc_009_dev_proof_enabled || inputs.run_loop_prod_tel_002_probe || inputs.run_evolution_dispatch_probe || inputs.run_bounded_source_refresh || inputs.bootstrap_empty_host) && 'true' || 'false' }}
      BOOTSTRAP_PREDECESSOR_BACKEND_SHA: ${{ inputs.bootstrap_predecessor_backend_sha || '' }}
      BOOTSTRAP_PREDECESSOR_FRONTEND_SHA: ${{ inputs.bootstrap_predecessor_frontend_sha || '' }}
    steps:
      # This checkout is the immutable trust root for every lease operation.
      # It is intentionally separate from the requested deployment payload.
      - name: Checkout pinned lease controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ajoe734/pantheon
          ref: aee1243573e29d289dac00be13641bb16be7f6bf
          path: .lease-controller
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout requested payload
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_REF }}
          path: .target
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Checkout accepted Agora gate controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ajoe734/pantheon
          ref: dev
          path: .agora-gate-controller
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout accepted Agora frontend history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ajoe734/execute-plans
          ref: ${{ env.FRONTEND_REF }}
          path: .agora-frontend
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate dev payload
        id: target
        working-directory: .target
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          RUN_EVOLUTION_DISPATCH_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_evolution_dispatch_probe || false }}
          RUN_LOOP_PROD_TEL_002_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_loop_prod_tel_002_probe || false }}
        run: |
          sha="$(git rev-parse HEAD)"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]
          trusted_ref="$(git rev-parse refs/remotes/origin/dev)"
          [[ "${trusted_ref}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${sha}" != "${trusted_ref}" || "${GITHUB_REF}" != "refs/heads/dev" || "${GITHUB_SHA}" != "${sha}" ]]; then
            echo "Dev release must run from the exact current Pantheon dev commit ${trusted_ref}; got payload=${sha} workflow_ref=${GITHUB_REF} workflow_sha=${GITHUB_SHA}" >&2
            exit 1
          fi
          case "${TARGET_COMPONENT}" in
            auto|root|bff) ;;
            *) echo "Invalid dev deployment component: ${TARGET_COMPONENT}" >&2; exit 1 ;;
          esac
          docker compose -f docker-compose.yml config --quiet
          if [[ "${RUN_LOOP_PROD_TEL_002_PROBE}" == "true" && ( "${TARGET_COMPONENT}" != "root" || "${DEV_AUTH_PROFILE}" != "strict" ) ]]; then
            echo "LOOP-PROD-TEL-002 hosted proof requires dev/root with strict auth." >&2
            exit 1
          fi
          case "${PPL_ALLOC_009_DEV_PROOF_ENABLED}" in
            true|false) ;;
            *) echo "PPL-ALLOC-009 dev proof flag must be true or false." >&2; exit 1 ;;
          esac
          case "${BOUNDED_SOURCE_REFRESH_ENABLED}" in
            true|false) ;;
            *) echo "Bounded source refresh flag must be true or false." >&2; exit 1 ;;
          esac
          if [[ "${PPL_ALLOC_009_DEV_PROOF_ENABLED}" == "true" && (
            "${TARGET_COMPONENT}" != "root" ||
            "${DEV_AUTH_PROFILE}" != "strict" ||
            "${ALLOW_DIRTY}" != "false" ||
            "${RUN_EVOLUTION_DISPATCH_PROBE}" != "false" ||
            "${RUN_LOOP_PROD_TEL_002_PROBE}" != "false"
          ) ]]; then
            echo "PPL-ALLOC-009 dev proof requires an isolated clean dev/root deploy with strict auth." >&2
            exit 1
          fi
          if [[ "${BOUNDED_SOURCE_REFRESH_ENABLED}" == "true" && (
            ( "${TARGET_COMPONENT}" != "auto" && "${TARGET_COMPONENT}" != "root" ) ||
            "${DEV_AUTH_PROFILE}" != "strict" ||
            "${ALLOW_DIRTY}" != "false" ||
            "${PPL_ALLOC_009_DEV_PROOF_ENABLED}" != "false" ||
            "${RUN_EVOLUTION_DISPATCH_PROBE}" != "false" ||
            "${RUN_LOOP_PROD_TEL_002_PROBE}" != "false"
          ) ]]; then
            echo "Bounded source refresh requires an isolated clean dev/root deploy with strict auth." >&2
            exit 1
          fi
          if [[ "${BOOTSTRAP_EMPTY_HOST}" == "true" ]]; then
            if [[ "${TARGET_ENV}" != "dev" ]]; then
              echo "Bootstrap input is only permitted for dev environment; got environment=${TARGET_ENV}" >&2
              exit 1
            fi
            [[ "${BOOTSTRAP_PREDECESSOR_BACKEND_SHA,,}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "bootstrap_predecessor_backend_sha must be one exact lowercase 40-character commit SHA" >&2
              exit 1
            }
            [[ "${BOOTSTRAP_PREDECESSOR_FRONTEND_SHA,,}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "bootstrap_predecessor_frontend_sha must be one exact lowercase 40-character commit SHA" >&2
              exit 1
            }
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Resolve exact execute-plans dev payload
        id: frontend
        working-directory: .agora-frontend
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          requested="${FRONTEND_SHA,,}"
          [[ "${requested}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "frontend_sha must be one exact lowercase 40-character commit SHA" >&2
            exit 1
          }
          [[ "${FRONTEND_REF}" =~ ^[A-Za-z0-9._/-]+$ && "${FRONTEND_REF}" != *..* && "${FRONTEND_REF}" != /* && "${FRONTEND_REF}" != */ && "${FRONTEND_REF}" != *//* ]] || {
            echo "frontend_ref must be one exact branch ref" >&2
            exit 1
          }
          git fetch --no-tags origin "refs/heads/${FRONTEND_REF}:refs/remotes/origin/${FRONTEND_REF}" >/dev/null 2>&1 || {
            echo "execute-plans frontend ref does not exist: ${FRONTEND_REF}" >&2
            exit 1
          }
          resolved="$(git rev-parse "${requested}^{commit}")"
          [[ "${resolved}" == "${requested}" ]] || {
            echo "execute-plans frontend ref does not resolve to the requested SHA" >&2
            exit 1
          }
          ref_tip="$(git rev-parse "refs/remotes/origin/${FRONTEND_REF}")"
          [[ "${ref_tip}" == "${requested}" ]] || {
            echo "execute-plans frontend ref ${FRONTEND_REF} moved: tip=${ref_tip} requested=${requested}" >&2
            exit 1
          }
          if [[ "${FRONTEND_REF}" == "dev" ]]; then
            current="$(git rev-parse refs/remotes/origin/dev)"
            [[ "${requested}" == "${current}" ]] || {
              echo "current execute-plans dev moved: current=${current} requested=${requested}" >&2
              exit 1
            }
          fi
          echo "sha=${requested}" >> "${GITHUB_OUTPUT}"
          echo "ref=${FRONTEND_REF}" >> "${GITHUB_OUTPUT}"

      - name: Generate immutable exact-pair admission before any dev switch
        id: release_admission
        working-directory: .agora-gate-controller
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          controller_sha="$(git rev-parse HEAD)"
          [[ "${controller_sha}" == "${{ steps.target.outputs.sha }}" ]] || {
            echo "The Pantheon gate controller must be the exact backend release commit." >&2
            exit 1
          }
          grep -Fxq \
            'PANTHEON_DEPLOY_CONTROLLER_CONTRACT_VERSION="dev-root-isolation-v1"' \
            scripts/deploy_nonprod_vm.sh
          evidence_dir="${RUNNER_TEMP%/}/pantheon-dev-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          manifest="${evidence_dir}/release-compatibility-manifest.json"
          ledger="${evidence_dir}/release-candidate-ledger.json"
          install -d -m 0700 "${evidence_dir}"
          python3 scripts/agora_compat_manifest.py write \
            --output "${manifest}" \
            --frontend-root "${GITHUB_WORKSPACE}/.agora-frontend" \
            --backend-dev-ref refs/remotes/origin/dev \
            --frontend-dev-ref "refs/remotes/origin/${FRONTEND_REF}" \
            --backend-runtime-commit "${{ steps.target.outputs.sha }}" \
            --frontend-runtime-commit "${{ steps.frontend.outputs.sha }}" \
            --compatibility-status accepted
          python3 scripts/agora_compat_manifest.py deployment-gate \
            --manifest "${manifest}" \
            --frontend-root "${GITHUB_WORKSPACE}/.agora-frontend" \
            --backend-dev-ref refs/remotes/origin/dev \
            --frontend-dev-ref "refs/remotes/origin/${FRONTEND_REF}" \
            --backend-runtime-commit "${{ steps.target.outputs.sha }}" \
            --frontend-runtime-commit "${{ steps.frontend.outputs.sha }}" \
            --evidence-out "${ledger}"
          python3 - "${ledger}" "${evidence_dir}" >> "${GITHUB_OUTPUT}" <<'PY'
          import json
          import pathlib
          import sys

          ledger = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          candidate = ledger.get("release_candidate") or {}
          if candidate.get("compatibility_status") != "compatible":
              raise SystemExit("release candidate is not compatible")
          print(f"release_candidate_id={candidate['release_candidate_id']}")
          print(
              "compatibility_manifest_sha256="
              f"{candidate['compatibility_manifest']['sha256']}"
          )
          print(f"evidence_dir={sys.argv[2]}")
          PY

      - name: Capture exact hosted FE and BFF rollback baseline
        id: rollback_baseline
        env:
          DEV_BFF_URL: ${{ vars.DEV_BFF_URL || 'https://api.dev.mvl-cap.tw' }}
          DEV_FE_URL: ${{ vars.DEV_FE_URL || 'https://app.dev.mvl-cap.tw' }}
          EVIDENCE_DIR: ${{ steps.release_admission.outputs.evidence_dir }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          version_json="${EVIDENCE_DIR}/bff-version-before.json"
          deployment_json="${EVIDENCE_DIR}/frontend-deployment-before.json"
          if [[ "${BOOTSTRAP_EMPTY_HOST:-false}" == "true" ]]; then
            if [[ -z "${DEV_FE_URL:-}" || -z "${DEV_BFF_URL:-}" ]]; then
              echo "Empty-host bootstrap requires DEV_FE_URL and DEV_BFF_URL to be set." >&2
              exit 1
            fi
            manifest_status="$(curl --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --output "${deployment_json}" --write-out '%{http_code}' \
              "${DEV_FE_URL%/}/deployment.json")" || {
                echo "Empty-host bootstrap prerequisite failed closed: deployment.json was unreachable." >&2
                exit 1
              }
            if [[ "${manifest_status}" != "404" ]]; then
              echo "Empty-host bootstrap prerequisite failed closed: expected explicit HTTP 404, got ${manifest_status}." >&2
              exit 1
            fi
            bootstrap_backend="${BOOTSTRAP_PREDECESSOR_BACKEND_SHA,,}"
            bootstrap_frontend="${BOOTSTRAP_PREDECESSOR_FRONTEND_SHA,,}"
            [[ "${bootstrap_backend}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Bootstrap predecessor backend SHA must be an exact 40-character lowercase hex commit." >&2
              exit 1
            }
            [[ "${bootstrap_frontend}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Bootstrap predecessor frontend SHA must be an exact 40-character lowercase hex commit." >&2
              exit 1
            }
            git -C .agora-gate-controller merge-base --is-ancestor \
              "${bootstrap_backend}" refs/remotes/origin/dev || {
                echo "Bootstrap predecessor backend commit ${bootstrap_backend} is not contained in Pantheon dev." >&2
                exit 1
              }
            git -C .agora-frontend merge-base --is-ancestor \
              "${bootstrap_frontend}" refs/remotes/origin/dev || {
                echo "Bootstrap predecessor frontend commit ${bootstrap_frontend} is not contained in execute-plans dev." >&2
                exit 1
              }

            bootstrap_manifest="${EVIDENCE_DIR}/bootstrap-predecessor-compatibility-manifest.json"
            bootstrap_ledger="${EVIDENCE_DIR}/bootstrap-predecessor-candidate-ledger.json"
            python3 .target/scripts/agora_compat_manifest.py write \
              --output "${bootstrap_manifest}" \
              --frontend-root "${GITHUB_WORKSPACE}/.agora-frontend" \
              --backend-dev-ref refs/remotes/origin/dev \
              --frontend-dev-ref "refs/remotes/origin/dev" \
              --backend-runtime-commit "${bootstrap_backend}" \
              --frontend-runtime-commit "${bootstrap_frontend}" \
              --compatibility-status accepted
            python3 .target/scripts/agora_compat_manifest.py deployment-gate \
              --manifest "${bootstrap_manifest}" \
              --frontend-root "${GITHUB_WORKSPACE}/.agora-frontend" \
              --backend-dev-ref refs/remotes/origin/dev \
              --frontend-dev-ref "refs/remotes/origin/dev" \
              --backend-runtime-commit "${bootstrap_backend}" \
              --frontend-runtime-commit "${bootstrap_frontend}" \
              --evidence-out "${bootstrap_ledger}"

            python3 -c 'import json, pathlib, sys; ledger = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")); candidate = ledger.get("release_candidate") or {}; sys.exit(0 if candidate.get("compatibility_status") == "compatible" else "bootstrap predecessor pair is not compatible")' "${bootstrap_ledger}"

            previous="${bootstrap_backend}"
            previous_frontend="${bootstrap_frontend}"
            deployment_state="standby"
            baseline_source="bootstrap_predecessor_pair"
            observed_previous=""
          else
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              "${DEV_FE_URL%/}/deployment.json" > "${deployment_json}"
            read -r previous previous_frontend deployment_state < <(
              python3 - "${deployment_json}" "${DEV_BFF_URL}" <<'PY'
          import json
          import re
          import sys

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_bff_url = sys.argv[2].rstrip("/")
          sha = re.compile(r"^[0-9a-f]{40}$")

          def exact_sha(*values, label="release identity"):
              if not values or any(not isinstance(value, str) or not sha.fullmatch(value) for value in values):
                  raise SystemExit(f"frontend deployment manifest lacks an exact {label}")
              if len(set(values)) != 1:
                  raise SystemExit(f"frontend deployment manifest has conflicting {label} values")
              return values[0]

          schema_version = manifest.get("schemaVersion")
          app = manifest.get("app")
          repository = manifest.get("repository")
          source_branch = manifest.get("sourceBranch")
          deployment_state = manifest.get("deploymentState")
          bff_commit_evidence = manifest.get("bffCommitEvidence")

          if (
              schema_version != 1
              or app != "execute-plans"
              or repository != "ajoe734/execute-plans"
              or source_branch != "dev"
              or bff_commit_evidence is not True
              or deployment_state not in ("accepted", "standby")
          ):
              raise SystemExit("frontend deployment manifest is not an accepted or verified standby Pantheon dev release")

          bff = manifest.get("bff") or {}
          if not isinstance(bff, dict) or bff.get("baseUrl", "").rstrip("/") != expected_bff_url:
              raise SystemExit("frontend deployment manifest is not bound to the expected BFF endpoint")

          frontend = manifest.get("frontend") or {}
          if not isinstance(frontend, dict):
              raise SystemExit("frontend deployment manifest has no frontend release identity")

          backend_sha = exact_sha(
              manifest.get("bffCommit"),
              manifest.get("bffSourceCommitSha"),
              bff.get("sourceCommitSha"),
              label="backend release identity",
          )
          frontend_sha = exact_sha(
              manifest.get("commit"),
              manifest.get("frontendSha"),
              frontend.get("commitSha"),
              label="frontend release identity",
          )

          if deployment_state == "standby":
              profile = manifest.get("profile")
              deployment_profile = manifest.get("deploymentProfile")
              if profile != "read-only" or deployment_profile != "read-only":
                  raise SystemExit("standby frontend deployment manifest must use read-only profile")

              build_mode = manifest.get("buildMode")
              if not isinstance(build_mode, dict):
                  raise SystemExit("standby frontend deployment manifest has invalid buildMode")

              if (
                  build_mode.get("VITE_BFF_MODE") != "live"
                  or build_mode.get("VITE_BFF_FALLBACK") != "strict"
                  or str(build_mode.get("VITE_BFF_REAL_WRITES", "")).lower() != "false"
                  or str(build_mode.get("VITE_BFF_ALLOW_DEV_STUB_WRITES", "")).lower() != "false"
                  or str(build_mode.get("VITE_BFF_EMBEDDED_BEARER_TOKEN", "")).lower() != "false"
              ):
                  raise SystemExit("standby frontend deployment manifest must use strict live read-only build mode")

              release_admission = manifest.get("releaseAdmission")
              if not isinstance(release_admission, dict):
                  raise SystemExit("standby frontend deployment manifest lacks releaseAdmission")

              adm_backend = release_admission.get("backend") or {}
              adm_frontend = release_admission.get("frontend") or {}
              if (
                  release_admission.get("schemaVersion") != "pantheon.dev-release-candidate-admission.v1"
                  or release_admission.get("compatibilityStatus") != "compatible"
                  or not isinstance(adm_backend, dict)
                  or adm_backend.get("repository") != "ajoe734/pantheon"
                  or adm_backend.get("branch") != "dev"
                  or adm_backend.get("commitSha") != backend_sha
                  or not isinstance(adm_frontend, dict)
                  or adm_frontend.get("repository") != "ajoe734/execute-plans"
                  or adm_frontend.get("branch") != "dev"
                  or adm_frontend.get("commitSha") != frontend_sha
              ):
                  raise SystemExit("standby frontend deployment manifest has invalid or mismatched releaseAdmission")

              agora = manifest.get("agoraCompatibility")
              if not isinstance(agora, dict):
                  raise SystemExit("standby frontend deployment manifest lacks agoraCompatibility")

              agora_backend = agora.get("backend") or {}
              agora_frontend = agora.get("frontend") or {}
              if (
                  agora.get("schema_version") != "pantheon.agora.compatibility-gate-evidence.v1"
                  or agora.get("compatibility_status") not in ("accepted", "compatible")
                  or not isinstance(agora_backend, dict)
                  or agora_backend.get("repo") != "ajoe734/pantheon"
                  or agora_backend.get("runtime_commit") != backend_sha
                  or not isinstance(agora_frontend, dict)
                  or agora_frontend.get("repo") != "ajoe734/execute-plans"
                  or agora_frontend.get("runtime_commit") != frontend_sha
              ):
                  raise SystemExit("standby frontend deployment manifest has invalid or mismatched agoraCompatibility")

          print(backend_sha, frontend_sha, deployment_state)
          PY
          )
          baseline_source="${deployment_state}_frontend_pair_manifest"
          observed_previous=""
          if curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            "${DEV_BFF_URL%/}/bff/version" > "${version_json}"; then
            observed_previous="$(
              python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("source_commit_sha") or "")' \
                "${version_json}"
            )"
            if [[ "${observed_previous}" == "${previous}" ]]; then
              baseline_source="${deployment_state}_frontend_pair_manifest+live_bff_match"
            else
              [[ "${observed_previous}" =~ ^[0-9a-f]{40}$ ]] || {
                echo "Hosted BFF drift identity is not an exact commit SHA." >&2
                exit 1
              }
              git -C .agora-gate-controller merge-base --is-ancestor \
                "${observed_previous}" refs/remotes/origin/dev || {
                  echo "Hosted BFF drift identity is not contained in Pantheon dev." >&2
                  exit 1
                }
              echo "Hosted BFF differs from the ${deployment_state} frontend pair; retaining the ${deployment_state} pair as rollback authority." >&2
              baseline_source="${deployment_state}_frontend_pair_manifest+live_bff_drift_recovery"
            fi
          else
            echo "Hosted BFF version endpoint is unavailable; recovering from the ${deployment_state} frontend pair manifest." >&2
          fi
          fi
          git -C .agora-gate-controller merge-base --is-ancestor \
            "${previous}" refs/remotes/origin/dev || {
              echo "Hosted rollback commit ${previous} is not contained in Pantheon dev." >&2
              exit 1
            }
          git -C .agora-frontend merge-base --is-ancestor \
            "${previous_frontend}" refs/remotes/origin/dev || {
              echo "Hosted frontend rollback commit ${previous_frontend} is not contained in execute-plans dev." >&2
              exit 1
            }
          python3 - "${EVIDENCE_DIR}/rollback-baseline.json" "${previous}" "${previous_frontend}" \
            "${{ steps.target.outputs.sha }}" "${{ steps.frontend.outputs.sha }}" \
            "${{ steps.release_admission.outputs.release_candidate_id }}" "${baseline_source}" "${observed_previous}" <<'PY'
          import json
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "schema_version": "pantheon.dev-release-rollback-baseline.v1",
                      "previous_backend_sha": sys.argv[2],
                      "previous_frontend_sha": sys.argv[3],
                      "candidate_backend_sha": sys.argv[4],
                      "candidate_frontend_sha": sys.argv[5],
                      "release_candidate_id": sys.argv[6],
                      "baseline_source": sys.argv[7],
                      "observed_live_bff_sha": sys.argv[8] or None,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          echo "sha=${previous}" >> "${GITHUB_OUTPUT}"
          echo "frontend_sha=${previous_frontend}" >> "${GITHUB_OUTPUT}"
          echo "is_bootstrap=${BOOTSTRAP_EMPTY_HOST:-false}" >> "${GITHUB_OUTPUT}"

      - name: Seal exact-pair admission artifact before any dev switch
        id: release_admission_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pantheon-dev-release-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.release_admission.outputs.evidence_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce dev auth deployment floor
        working-directory: .target
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          DEV_BFF_JWT_SECRET: ${{ secrets.DEV_BFF_JWT_SECRET }}
          DEV_PAPER_PRINCIPALS_AUTHORIZED: ${{ vars.DEV_PAPER_PRINCIPALS_AUTHORIZED || 'false' }}
          DEV_BFF_JWT_ISSUER: ${{ vars.DEV_BFF_JWT_ISSUER || 'pantheon-dev' }}
          DEV_BFF_JWT_AUDIENCE: ${{ vars.DEV_BFF_JWT_AUDIENCE || 'bff-operators' }}
          DEV_BFF_JWKS_URI: ${{ vars.DEV_BFF_JWKS_URI || 'https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com' }}
          DEV_BFF_OIDC_DISCOVERY_URL: ${{ vars.DEV_BFF_OIDC_DISCOVERY_URL }}
          DEV_BFF_OIDC_ISSUER: ${{ vars.DEV_BFF_OIDC_ISSUER || 'https://securetoken.google.com/pantheon-dev-20260902' }}
          DEV_BFF_OIDC_AUDIENCE: ${{ vars.DEV_BFF_OIDC_AUDIENCE || 'pantheon-dev-20260902' }}
          DEV_BFF_OIDC_CLIENT_ID: ${{ secrets.DEV_BFF_OIDC_CLIENT_ID }}
          DEV_BFF_OIDC_CLIENT_SECRET: ${{ secrets.DEV_BFF_OIDC_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_ID || 'pantheon-dev-viewer-v1' }}
          DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_ID || 'pantheon-dev-approver-v1' }}
          DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_ID || 'pantheon-dev-risk-owner-v1' }}
          DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_ID || 'pantheon-dev-operator-a-v1' }}
          DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_ID || 'pantheon-dev-operator-b-v1' }}
          DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_SECRET }}
          DEV_BFF_MFA_REQUIRED: ${{ vars.DEV_BFF_MFA_REQUIRED || 'false' }}
          DEV_BFF_MFA_CLAIMS: ${{ vars.DEV_BFF_MFA_CLAIMS || 'amr,acr,mfa,mfa_verified,firebase.sign_in_second_factor' }}
          DEV_BFF_MFA_VALUES: ${{ vars.DEV_BFF_MFA_VALUES || 'true,1,yes,mfa,otp,totp,webauthn' }}
          DEV_BFF_REQUIRE_EMAIL_VERIFIED: ${{ vars.DEV_BFF_REQUIRE_EMAIL_VERIFIED || 'true' }}
          DEV_ASSISTANT_CONTROL_PASSPHRASE_HASH: ${{ secrets.DEV_ASSISTANT_CONTROL_PASSPHRASE_HASH }}
          DEV_BFF_ROLE_CLAIMS: ${{ vars.DEV_BFF_ROLE_CLAIMS || 'roles,role' }}
          DEV_BFF_ROLE_MAP: ${{ vars.DEV_BFF_ROLE_MAP || 'pantheon-operator=operator;pantheon-viewer=viewer;pantheon-reviewer=reviewer;pantheon-approver=approver;pantheon-risk-owner=risk_owner;pantheon-admin=admin' }}
          DEV_BFF_ROLE_MAP_MODE: ${{ vars.DEV_BFF_ROLE_MAP_MODE || 'strict' }}
          DEV_BFF_DEFAULT_ROLE: ${{ vars.DEV_BFF_DEFAULT_ROLE || 'viewer' }}
        run: |
          case "${DEV_AUTH_PROFILE}" in
            strict)
              if [[ -z "${DEV_BFF_JWT_SECRET}" || -z "${DEV_BFF_OIDC_CLIENT_ID}" || -z "${DEV_BFF_OIDC_CLIENT_SECRET}" || -z "${DEV_ASSISTANT_CONTROL_PASSPHRASE_HASH}" ]]; then
                echo "::error::Dev BFF deploy credentials are not provisioned; refusing to run any target ref before strict auth can be verified."
                exit 1
              fi
              for identity in VIEWER APPROVER RISK_OWNER OPERATOR_A OPERATOR_B; do
                id_var="DEV_BFF_DEV_LOGIN_${identity}_CLIENT_ID"
                secret_var="DEV_BFF_DEV_LOGIN_${identity}_CLIENT_SECRET"
                if [[ -z "${!id_var}" || -z "${!secret_var}" ]]; then
                  echo "::error::Dedicated ${identity,,} dev-login credentials are not provisioned; refusing a strict deploy without distinct governed proof actors."
                  exit 1
                fi
              done

              deploy_script="scripts/deploy_nonprod_vm.sh"
              required_markers=(
                'DEV_BFF_AUTH_STUB="${DEV_BFF_AUTH_STUB:-false}"'
                'DEV_BFF_AUTH_MODE="${DEV_BFF_AUTH_MODE:-strict}"'
                'DEV_BFF_MFA_REQUIRED="${DEV_BFF_MFA_REQUIRED:-false}"'
                'assert "mfa_verified" not in claims'
                'no governed verifier/dev-login credentials'
                'assert_bff_auth_gate'
                'DEV_PPL_ALLOC_009_DEV_PROOF_ENABLED="${DEV_PPL_ALLOC_009_DEV_PROOF_ENABLED:-false}"'
                'assert_ppl_alloc_009_dev_proof_gate'
              )
              for marker in "${required_markers[@]}"; do
                if ! grep -Fq -- "${marker}" "${deploy_script}"; then
                  echo "::error::Requested ref lacks the dev strict-auth deployment contract: ${marker}"
                  exit 1
                fi
              done
              ;;
            permissive-stub)
              echo "::notice::Explicit bounded permissive-stub profile selected; strict credential/ref floor is not applied."
              ;;
            *)
              echo "::error::Unknown dev auth profile: ${DEV_AUTH_PROFILE}"
              exit 1
              ;;
          esac

      - name: Prepare pinned direct SSH transport
        env:
          DEV_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEV_DEPLOY_SSH_PRIVATE_KEY }}
          DEV_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEV_DEPLOY_SSH_KNOWN_HOSTS }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          credentials_dir="${RUNNER_TEMP}/pantheon-dev-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          .agora-gate-controller/scripts/dev_vm_ssh.sh prepare "${credentials_dir}" >/dev/null

      - name: Prepare fixed trusted command path
        id: runtime
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          trusted_bin="${RUNNER_TEMP}/pantheon-trusted-bin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "${trusted_bin}"
          for command_name in ssh scp ssh-keygen; do
            command_path="$(command -v "${command_name}")"
            [[ -x "${command_path}" && ! -L "${command_path}" ]]
            ln -s "${command_path}" "${trusted_bin}/${command_name}"
          done
          safe_path="${trusted_bin}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          echo "safe_path=${safe_path}" >> "${GITHUB_OUTPUT}"

      - name: Acquire shared dev environment lease
        id: lease
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: ""
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          unset BASH_ENV ENV PYTHONPATH PYTHONHOME CDPATH
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ "$(git -C "${controller}" rev-parse HEAD)" == "aee1243573e29d289dac00be13641bb16be7f6bf" ]]
          [[ -f "${controller}/scripts/dev_environment_lease.py" && ! -L "${controller}/scripts/dev_environment_lease.py" ]]
          [[ -f "${controller}/scripts/run_with_dev_environment_lease.sh" && ! -L "${controller}/scripts/run_with_dev_environment_lease.sh" ]]
          printf '%s  %s\n' \
            da9a728ed8cec8e1133b92171e4038f9dc51ef4888911acd02c7e399e54d95ae "${controller}/scripts/dev_environment_lease.py" \
            6c82021b93621f16776d5d67a9e20cb9d690f7ebfa257ebf8c329f7d158fb2c2 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict

          lease_dir="$(mktemp -d "${RUNNER_TEMP}/pantheon-dev-lease-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          chmod 0700 "${lease_dir}"
          state_file="${lease_dir}/state.json"
          acquisition_file="${lease_dir}/acquisition.json"
          pid_file="${lease_dir}/heartbeat.pid"
          identity_file="${lease_dir}/heartbeat-identity.json"
          failure_file="${lease_dir}/heartbeat-failure.json"
          shutdown_file="${lease_dir}/heartbeat-stop.json"
          heartbeat_log="${lease_dir}/heartbeat.log"

          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            python3 "${controller}/scripts/dev_environment_lease.py" acquire \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --mode deployment \
            --owner "pantheon:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --ttl-seconds 300 \
            --wait-seconds 1800 \
            --poll-seconds 5 \
            --state-file "${state_file}" \
            --expected-backend-sha "${TARGET_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --json-out "${acquisition_file}"
          lease_token=""

          lease_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["leaseId"])' "${state_file}")"
          [[ "${lease_id}" =~ ^[0-9a-f-]{36}$ ]]
          {
            echo "lease_id=${lease_id}"
            echo "state_file=${state_file}"
            echo "pid_file=${pid_file}"
            echo "identity_file=${identity_file}"
            echo "failure_file=${failure_file}"
            echo "shutdown_file=${shutdown_file}"
            echo "heartbeat_log=${heartbeat_log}"
          } >> "${GITHUB_OUTPUT}"

      - name: Start identity-bound lease heartbeat
        id: heartbeat
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: ""
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          LEASE_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          LEASE_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}

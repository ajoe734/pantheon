              local state
              [[ -n "${rollback_heartbeat_pid}" ]] || return 0
              state="$(ps -o stat= -p "${rollback_heartbeat_pid}" 2>/dev/null | tr -d '[:space:]')"
              case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
              return 1
            }

            stop_rollback_heartbeat() {
              rollback_heartbeat_stopped && return 0
              python3 "${controller}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
                --identity-file "${rollback_identity_file}" \
                --pid "${rollback_heartbeat_pid}" \
                --expected-cli "${controller}/scripts/dev_environment_lease.py" \
                --state-file "${rollback_state_file}" >/dev/null || return 1
              kill -TERM "${rollback_heartbeat_pid}" 2>/dev/null || {
                rollback_heartbeat_stopped && return 0
                return 1
              }
              kill -CONT "${rollback_heartbeat_pid}" 2>/dev/null || true
              for _ in $(seq 1 40); do
                rollback_heartbeat_stopped && return 0
                sleep 0.25
              done
              return 1
            }

            cleanup_rollback_lease() {
              local status=$?
              trap - EXIT INT TERM
              if [[ -n "${rollback_heartbeat_pid}" ]]; then
                if ! stop_rollback_heartbeat; then
                  echo "[dev-deploy-compensation] rollback heartbeat identity could not be stopped safely" >&2
                  status=75
                fi
              fi
              if [[ "${rollback_deploy_succeeded}" == "true" ]]; then
                [[ ! -e "${rollback_failure_file}" ]] || status=75
                [[ -s "${rollback_shutdown_file}" ]] || status=75
                if [[ "${status}" -eq 0 ]]; then
                  PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
                    python3 "${controller}/scripts/dev_environment_lease.py" verify \
                      --repository ajoe734/execute-plans \
                      --branch environment-coordination \
                      --path .pantheon/environment-leases/pantheon-dev-environment.json \
                      --resource pantheon-dev-environment \
                      --state-file "${rollback_state_file}" \
                      --max-heartbeat-age-seconds 120 >/dev/null || status=75
                fi
                if [[ "${status}" -eq 0 ]]; then
                  PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
                    python3 "${controller}/scripts/dev_environment_lease.py" release \
                      --repository ajoe734/execute-plans \
                      --branch environment-coordination \
                      --path .pantheon/environment-leases/pantheon-dev-environment.json \
                      --resource pantheon-dev-environment \
                      --state-file "${rollback_state_file}" >/dev/null || status=75
                fi
              else
                echo "[dev-deploy-compensation] rollback incomplete; lease remains quarantined until TTL" >&2
              fi
              exit "${status}"
            }

            trap cleanup_rollback_lease EXIT INT TERM

            stop_predecessor_heartbeat() {
              local pid_file="${PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE:-}"
              local identity_file="${PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE:-}"
              local state_file="${PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE:-}"
              [[ -n "${pid_file}" && -s "${pid_file}" ]] || return 0
              local pred_pid
              pred_pid="$(tr -d '[:space:]' < "${pid_file}")"
              [[ "${pred_pid}" =~ ^[1-9][0-9]*$ ]] || return 0

              kill -0 "${pred_pid}" 2>/dev/null || return 0

              local state
              state="$(ps -o stat= -p "${pred_pid}" 2>/dev/null | tr -d '[:space:]' || true)"
              case "${state}" in ""|Z*|X*|x*) return 0 ;; esac

              echo "[dev-deploy-compensation] Stopping active predecessor heartbeat (pid=${pred_pid}) before rollback lease acquisition..."
              if [[ -z "${identity_file}" || ! -f "${identity_file}" || -z "${state_file}" || ! -f "${state_file}" ]]; then
                echo "[dev-deploy-compensation] Missing identity/state files for active predecessor heartbeat (pid=${pred_pid})" >&2
                return 1
              fi

              if ! python3 "${controller}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
                --identity-file "${identity_file}" \
                --pid "${pred_pid}" \
                --expected-cli "${controller}/scripts/dev_environment_lease.py" \
                --state-file "${state_file}" >/dev/null; then
                echo "[dev-deploy-compensation] Predecessor heartbeat identity verification failed for pid=${pred_pid}" >&2
                return 1
              fi

              kill -TERM "${pred_pid}" 2>/dev/null || {
                kill -0 "${pred_pid}" 2>/dev/null || return 0
                state="$(ps -o stat= -p "${pred_pid}" 2>/dev/null | tr -d '[:space:]' || true)"
                case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
                return 1
              }
              kill -CONT "${pred_pid}" 2>/dev/null || true
              for _ in $(seq 1 40); do
                kill -0 "${pred_pid}" 2>/dev/null || return 0
                state="$(ps -o stat= -p "${pred_pid}" 2>/dev/null | tr -d '[:space:]' || true)"
                case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
                sleep 0.25
              done

              if ! python3 "${controller}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
                --identity-file "${identity_file}" \
                --pid "${pred_pid}" \
                --expected-cli "${controller}/scripts/dev_environment_lease.py" \
                --state-file "${state_file}" >/dev/null; then
                echo "[dev-deploy-compensation] Predecessor heartbeat identity verification failed before SIGKILL escalation for pid=${pred_pid}" >&2
                return 1
              fi

              kill -KILL "${pred_pid}" 2>/dev/null || {
                kill -0 "${pred_pid}" 2>/dev/null || return 0
                state="$(ps -o stat= -p "${pred_pid}" 2>/dev/null | tr -d '[:space:]' || true)"
                case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
                return 1
              }
              for _ in $(seq 1 20); do
                kill -0 "${pred_pid}" 2>/dev/null || return 0
                state="$(ps -o stat= -p "${pred_pid}" 2>/dev/null | tr -d '[:space:]' || true)"
                case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
                sleep 0.25
              done

              if kill -0 "${pred_pid}" 2>/dev/null; then
                state="$(ps -o stat= -p "${pred_pid}" 2>/dev/null | tr -d '[:space:]' || true)"
                case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
                echo "[dev-deploy-compensation] Predecessor heartbeat process (pid=${pred_pid}) remains alive after SIGKILL" >&2
                return 1
              fi
              return 0
            }

            if ! stop_predecessor_heartbeat; then
              echo "[dev-deploy-compensation] Failed to stop predecessor heartbeat cleanly; failing closed" >&2
              exit 75
            fi

            PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
              python3 "${controller}/scripts/dev_environment_lease.py" acquire \
                --repository ajoe734/execute-plans \
                --branch environment-coordination \
                --path .pantheon/environment-leases/pantheon-dev-environment.json \
                --resource pantheon-dev-environment \
                --mode deployment \
                --owner "pantheon:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:rollback" \
                --ttl-seconds 300 \
                --wait-seconds 1800 \
                --poll-seconds 5 \
                --state-file "${rollback_state_file}" \
                --expected-backend-sha "${PANTHEON_ROLLBACK_BACKEND_SHA}" \
                --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                --json-out "${rollback_acquisition_file}"

            exec {token_fd}<<<"${lease_token}"
            env -i \
              PATH="${PATH}" HOME="${HOME}" LANG=C.UTF-8 \
              PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 PYTHONSTARTUP= PYTHONINSPECT= \
              python3 "${controller}/scripts/dev_environment_lease.py" heartbeat-loop \
                --repository ajoe734/execute-plans \
                --branch environment-coordination \
                --path .pantheon/environment-leases/pantheon-dev-environment.json \
                --resource pantheon-dev-environment \
                --state-file "${rollback_state_file}" \
                --ttl-seconds 300 \
                --interval-seconds 60 \
                --failure-json-out "${rollback_failure_file}" \
                --shutdown-json-out "${rollback_shutdown_file}" \
                --identity-json-out "${rollback_identity_file}" \
                --token-stdin \
                <&"${token_fd}" >"${rollback_heartbeat_log}" 2>&1 &
            rollback_heartbeat_pid=$!
            exec {token_fd}<&-
            printf '%s\n' "${rollback_heartbeat_pid}" > "${rollback_pid_file}"

            for _ in $(seq 1 100); do
              [[ -s "${rollback_identity_file}" ]] && break
              kill -0 "${rollback_heartbeat_pid}" 2>/dev/null || {
                sed -n '1,200p' "${rollback_heartbeat_log}" >&2 || true
                exit 75
              }
              sleep 0.1
            done
            [[ -s "${rollback_identity_file}" ]]
            python3 "${controller}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
              --identity-file "${rollback_identity_file}" \
              --pid "${rollback_heartbeat_pid}" \
              --expected-cli "${controller}/scripts/dev_environment_lease.py" \
              --state-file "${rollback_state_file}" >/dev/null
            PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
              python3 "${controller}/scripts/dev_environment_lease.py" verify \
                --repository ajoe734/execute-plans \
                --branch environment-coordination \
                --path .pantheon/environment-leases/pantheon-dev-environment.json \
                --resource pantheon-dev-environment \
                --state-file "${rollback_state_file}" \
                --max-heartbeat-age-seconds 120 >/dev/null

            export TARGET_ENV=dev
            export PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE="${rollback_state_file}"
            export PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE="${rollback_pid_file}"
            export PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE="${rollback_identity_file}"
            export PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE="${rollback_failure_file}"
            export PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG="${rollback_heartbeat_log}"
            export PANTHEON_DEV_ENVIRONMENT_LEASE_MAX_HEARTBEAT_AGE_SECONDS=120
            export PANTHEON_DEV_ENVIRONMENT_LEASE_VERIFY_INTERVAL_SECONDS=30

            PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            PANTHEON_DEV_ROLLBACK_BACKEND_SHA="${PANTHEON_ROLLBACK_BACKEND_SHA}" \
              "${GITHUB_WORKSPACE}/.lease-controller/scripts/run_with_dev_environment_lease.sh" \
              bash "${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/deploy_nonprod_vm.sh" \
                --environment dev \
                --component bff \
                --sha "${PANTHEON_ROLLBACK_BACKEND_SHA}" \
                --rollback-sha "${PANTHEON_ROLLBACK_BACKEND_SHA}" \
                --project-id "${GCP_DEPLOY_PROJECT_ID}" \
                --deadline-seconds "${DEV_DEPLOY_DEADLINE_SECONDS}"

            rollback_deploy_succeeded=true
          fi
          actual_bff="$(curl --connect-timeout 10 --max-time 30 -fsS "${DEV_BFF_URL}/bff/version" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("source_commit_sha") or "")')"
          [[ "${actual_bff}" == "${PANTHEON_ROLLBACK_BACKEND_SHA}" ]]
          actual_fe="$(curl --connect-timeout 10 --max-time 30 -fsS "${DEV_FE_URL}/deployment.json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("frontendSha") or d.get("commit") or "")')"
          [[ "${actual_fe}" == "${PANTHEON_ROLLBACK_FRONTEND_SHA}" ]]
          if [[ -n "${current_bff}" && "${current_bff}" == "${PANTHEON_ROLLBACK_BACKEND_SHA}" ]]; then
            echo "Preserved exact hosted dev baseline pair without deploy mutation: BFF=${actual_bff} FE=${actual_fe}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Restored exact hosted dev baseline pair: BFF=${actual_bff} FE=${actual_fe}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Stop heartbeat and release only after complete success
        id: lease_cleanup
        if: ${{ always() && steps.lease.outcome == 'success' }}
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: ""
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          LEASE_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          LEASE_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          LEASE_SHUTDOWN_FILE: ${{ steps.lease.outputs.shutdown_file }}
          LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.heartbeat_log }}
          HEARTBEAT_OUTCOME: ${{ steps.heartbeat.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          PAPER_BOOTSTRAP_OUTCOME: ${{ steps.paper_bootstrap.outcome }}
          OPENCLAW_OUTCOME: ${{ steps.openclaw.outcome }}
          PUBLIC_SMOKE_OUTCOME: ${{ steps.public_smoke.outcome }}
          DEPLOY_POSTURE_EVIDENCE_OUTCOME: ${{ steps.deploy-posture-evidence.outcome }}
          AGORA_OUTCOME: ${{ steps.agora.outcome }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          unset BASH_ENV ENV PYTHONPATH PYTHONHOME CDPATH
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ -f "${controller}/scripts/dev_environment_lease.py" && ! -L "${controller}/scripts/dev_environment_lease.py" ]]
          printf '%s  %s\n' \
            52276793f99162fc7ca307a1370addd8d99478208ebf7beb67eab23b97b83048 "${controller}/scripts/dev_environment_lease.py" \
            6c82021b93621f16776d5d67a9e20cb9d690f7ebfa257ebf8c329f7d158fb2c2 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict

          heartbeat_stopped() {
            local state
            state="$(ps -o stat= -p "${heartbeat_pid}" 2>/dev/null | tr -d '[:space:]')"
            case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
            return 1
          }
          verify_identity() {
            python3 "${controller}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
              --identity-file "${LEASE_IDENTITY_FILE}" \
              --pid "${heartbeat_pid}" \
              --expected-cli "${controller}/scripts/dev_environment_lease.py" \
              --state-file "${LEASE_STATE_FILE}" >/dev/null
          }
          stop_heartbeat() {
            local attempt
            heartbeat_stopped && return 0
            verify_identity || return 1
            kill -TERM "${heartbeat_pid}" 2>/dev/null || {
              heartbeat_stopped && return 0
              return 1
            }
            heartbeat_stopped && return 0
            verify_identity || { heartbeat_stopped && return 0; return 1; }
            kill -CONT "${heartbeat_pid}" 2>/dev/null || true
            for attempt in $(seq 1 40); do
              heartbeat_stopped && return 0
              sleep 0.25
            done
            verify_identity || { heartbeat_stopped && return 0; return 1; }
            kill -KILL "${heartbeat_pid}" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              heartbeat_stopped && return 0
              sleep 0.25
            done
            return 1
          }

          complete_success=false
          case "${TARGET_COMPONENT}" in
            auto|root)
              [[ "${HEARTBEAT_OUTCOME}:${DEPLOY_OUTCOME}:${PAPER_BOOTSTRAP_OUTCOME}:${OPENCLAW_OUTCOME}:${PUBLIC_SMOKE_OUTCOME}:${DEPLOY_POSTURE_EVIDENCE_OUTCOME}:${AGORA_OUTCOME}" == "success:success:success:success:success:success:success" ]] && complete_success=true
              ;;
            bff)
              [[ "${HEARTBEAT_OUTCOME}:${DEPLOY_OUTCOME}:${PAPER_BOOTSTRAP_OUTCOME}:${OPENCLAW_OUTCOME}:${PUBLIC_SMOKE_OUTCOME}:${DEPLOY_POSTURE_EVIDENCE_OUTCOME}:${AGORA_OUTCOME}" == "success:success:skipped:skipped:success:success:success" ]] && complete_success=true
              ;;
          esac

          if [[ ! -s "${LEASE_PID_FILE}" ]]; then
            echo "Lease heartbeat never became identity-bound; quarantining until TTL." >&2
            exit 0
          fi
          heartbeat_pid="$(tr -d '[:space:]' < "${LEASE_PID_FILE}")"
          [[ "${heartbeat_pid}" =~ ^[1-9][0-9]*$ ]] || {
            echo "Invalid heartbeat PID; quarantining until TTL." >&2
            exit 0
          }
          stop_heartbeat || {
            echo "Could not identity-safely stop heartbeat; refusing release." >&2
            exit 75
          }

          if [[ "${complete_success}" != "true" || -e "${LEASE_FAILURE_FILE}" ]]; then
            echo "Protected dev sequence was incomplete; lease quarantined until TTL." >&2
            sed -n '1,200p' "${LEASE_FAILURE_FILE}" >&2 2>/dev/null || true
            exit 0
          fi
          [[ -s "${LEASE_SHUTDOWN_FILE}" ]] || {
            echo "Heartbeat did not record a graceful identity-bound stop; refusing release." >&2
            exit 75
          }
          python3 - "${LEASE_SHUTDOWN_FILE}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          if payload.get("status") != "stopped" or payload.get("resource") != "pantheon-dev-environment":
              raise SystemExit("heartbeat shutdown evidence is invalid")
          PY
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            python3 "${controller}/scripts/dev_environment_lease.py" verify \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --state-file "${LEASE_STATE_FILE}" \
            --max-heartbeat-age-seconds 120 >/dev/null
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            python3 "${controller}/scripts/dev_environment_lease.py" release \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --state-file "${LEASE_STATE_FILE}"
          lease_token=""

      - name: Summarize dev deployment
        if: ${{ success() }}
        run: |
          {
            echo "## Dev backend candidate"
            echo "- Payload: \`${{ steps.target.outputs.sha }}\`"
            echo "- Frontend candidate: \`${{ steps.frontend.outputs.sha }}\`"
            echo "- Release candidate: \`${{ steps.release_admission.outputs.release_candidate_id }}\`"
            echo "- Compatibility manifest: \`${{ steps.release_admission.outputs.compatibility_manifest_sha256 }}\`"
            echo "- Admission artifact digest: \`${{ steps.release_admission_upload.outputs.artifact-digest }}\`"
            echo "- Rollback BFF baseline: \`${{ steps.rollback_baseline.outputs.sha }}\`"
            echo "- Rollback FE baseline: \`${{ steps.rollback_baseline.outputs.frontend_sha }}\`"
            echo "- Lease: \`${{ steps.lease.outputs.lease_id }}\`"
            echo "- Controller: \`9e564718da8c39199a4c311f1a667b74226e3428\`"
            echo "- Target: \`dev/${TARGET_COMPONENT}\`"
            echo "- Deploy deadline: \`${{ vars.DEV_DEPLOY_DEADLINE_SECONDS || '1200' }}s\`"
            echo "- PPL-ALLOC-009 dev proof enabled: \`${PPL_ALLOC_009_DEV_PROOF_ENABLED}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  coordinate-dev-release:
    name: Admit and switch exact FE/BFF release
    needs:
      - deploy-dev
    # Admission depends only on BFF/FE compatibility actually being verified,
    # not on deploy-dev's overall pass/fail -- that job also runs smoke tests
    # for unrelated subsystems (e.g. OpenClaw) whose failure has no bearing on
    # whether this FE/BFF pair is safe to admit. See bff_fe_pair_verified.
    if: ${{ !cancelled() && needs.deploy-dev.outputs.bff_fe_pair_verified == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_sha: ${{ needs.deploy-dev.outputs.backend_sha }}
      frontend_sha: ${{ needs.deploy-dev.outputs.frontend_sha }}
      release_candidate_id: ${{ needs.deploy-dev.outputs.release_candidate_id }}
      pair_id: ${{ steps.frontend_release.outputs.pair_id || needs.deploy-dev.outputs.pair_id }}
      candidate_id: ${{ steps.frontend_release.outputs.candidate_id || needs.deploy-dev.outputs.release_candidate_id }}
      profile: ${{ steps.frontend_release.outputs.profile }}
      source_mode: ${{ steps.frontend_release.outputs.source_mode }}
      expires_at: ${{ steps.frontend_release.outputs.expires_at }}
      evidence_dir: ${{ steps.frontend_release.outputs.evidence_dir }}
    env:
      TARGET_ENV: dev
      RELEASE_EVIDENCE_DIR: ${{ github.workspace }}/.pantheon-cross-repo-release-${{ github.run_id }}-${{ github.run_attempt }}
      DEV_BFF_URL: ${{ vars.DEV_BFF_URL || 'https://pantheon-lupin-dev-bff.35.201.204.12.sslip.io' }}
      DEV_FE_URL: ${{ vars.DEV_FE_URL || 'https://pantheon-lupin-dev-fe.35.201.204.12.sslip.io' }}
    steps:
      - name: Checkout pinned lease controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ajoe734/pantheon
          ref: 9e564718da8c39199a4c311f1a667b74226e3428
          path: .lease-controller
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact release controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ajoe734/pantheon
          ref: ${{ needs.deploy-dev.outputs.backend_sha }}
          path: .target
          fetch-depth: 0
          persist-credentials: false

      - name: Dispatch exact frontend gate and switch
        id: frontend_release
        continue-on-error: true
        env:
          CROSS_REPO_RELEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          BACKEND_SHA: ${{ needs.deploy-dev.outputs.backend_sha }}
          FRONTEND_SHA: ${{ needs.deploy-dev.outputs.frontend_sha }}
          RELEASE_CANDIDATE_ID: ${{ needs.deploy-dev.outputs.release_candidate_id }}
          PAIR_ID: ${{ needs.deploy-dev.outputs.pair_id }}
          COMPATIBILITY_MANIFEST_SHA256: ${{ needs.deploy-dev.outputs.compatibility_manifest_sha256 }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          install -d -m 0700 "${RELEASE_EVIDENCE_DIR}"
          controller_log="${RELEASE_EVIDENCE_DIR}/release-controller.log"
          controller_evidence="${RELEASE_EVIDENCE_DIR}/release-controller-accepted.json"
          set +e
          python3 .target/scripts/cross_repo_release_controller.py \
            --frontend-sha "${FRONTEND_SHA}" \
            --backend-sha "${BACKEND_SHA}" \
            --bff-base-url "${DEV_BFF_URL}" \
            --fe-base-url "${DEV_FE_URL}" \
            --release-candidate-id "${RELEASE_CANDIDATE_ID}" \
            --pair-id "${PAIR_ID}" \
            --compatibility-manifest-sha256 "${COMPATIBILITY_MANIFEST_SHA256}" \
            --controller-run-id "${GITHUB_RUN_ID}" \
            --evidence-out "${controller_evidence}" \
            --candidate-out "${RELEASE_EVIDENCE_DIR}/release-candidate.json" \
            >"${controller_log}" 2>&1
          controller_status=$?
          set -e
          if [[ "${controller_status}" -ne 0 ]]; then
            python3 - \
              "${RELEASE_EVIDENCE_DIR}/release-controller-rejected.json" \
              "${controller_status}" <<'PY'
          import json
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "schema_version": "pantheon.cross-repo-release-controller-evidence.v1",
                      "release_candidate_id": os.environ["RELEASE_CANDIDATE_ID"],
                      "compatibility_manifest_sha256": os.environ[
                          "COMPATIBILITY_MANIFEST_SHA256"
                      ],
                      "backend": {"commit": os.environ["BACKEND_SHA"]},
                      "frontend": {"commit": os.environ["FRONTEND_SHA"]},
                      "controller": {
                          "repository": os.environ["GITHUB_REPOSITORY"],
                          "workflow": "nonprod-deploy.yml",
                          "run_id": os.environ["GITHUB_RUN_ID"],
                      },
                      "outcome": "rejected",
                      "controller_exit_code": int(sys.argv[2]),
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          fi
          echo "evidence_dir=${RELEASE_EVIDENCE_DIR}" >> "${GITHUB_OUTPUT}"
          echo "controller_log=${controller_log}" >> "${GITHUB_OUTPUT}"
          exit "${controller_status}"

      - name: Authenticate rollback to Google Cloud
        if: ${{ steps.frontend_release.outcome != 'success' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.DEV_GCP_WIF_PROVIDER || 'projects/317269804408/locations/global/workloadIdentityPools/pantheon-github-pool/providers/pantheon-github-provider' }}
          service_account: ${{ vars.DEV_GCP_DEPLOY_SERVICE_ACCOUNT || 'pantheon-cloud-build@pantheon-lupin-dev-20260719.iam.gserviceaccount.com' }}

      - name: Set up rollback Cloud SDK
        if: ${{ steps.frontend_release.outcome != 'success' }}
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Compensate rejected release to exact hosted baseline
        id: compensation
        if: ${{ steps.frontend_release.outcome != 'success' }}
        continue-on-error: true
        env:
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_LEASE_CONTROLLER_ROOT: ${{ github.workspace }}/.lease-controller
          PANTHEON_RELEASE_REPO_ROOT: ${{ github.workspace }}/.target
          PANTHEON_ROLLBACK_BACKEND_SHA: ${{ needs.deploy-dev.outputs.previous_backend_sha }}
          PANTHEON_ROLLBACK_FRONTEND_SHA: ${{ needs.deploy-dev.outputs.previous_frontend_sha }}
          PANTHEON_FAILED_BACKEND_SHA: ${{ needs.deploy-dev.outputs.backend_sha }}
          PANTHEON_FAILED_FRONTEND_SHA: ${{ needs.deploy-dev.outputs.frontend_sha }}
          PANTHEON_RELEASE_CANDIDATE_ID: ${{ needs.deploy-dev.outputs.release_candidate_id }}
          PANTHEON_RELEASE_CONTROLLER_LOG: ${{ steps.frontend_release.outputs.controller_log }}
          PANTHEON_ROLLBACK_EVIDENCE_OUT: ${{ env.RELEASE_EVIDENCE_DIR }}/release-compensation.json
          GITHUB_TOKEN: ${{ github.token }}
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-lupin-dev' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          GCP_DEPLOY_PROJECT_ID: ${{ vars.DEV_GCP_DEPLOY_PROJECT_ID || 'pantheon-lupin-dev-20260719' }}
          DEV_REMOTE_DIR: ${{ vars.DEV_REMOTE_DIR || '/home/lupin/pantheon' }}
          PANTHEON_DEPLOY_WORKTREE_ROOT: ${{ vars.DEV_DEPLOY_WORKTREE_ROOT || '/home/lupin/pantheon-ci-deploy/managed-deploy-worktrees' }}
          DEV_LIFECYCLE_PROJECTOR_HEALTH_MAX_AGE_SECONDS: ${{ vars.DEV_LIFECYCLE_PROJECTOR_HEALTH_MAX_AGE_SECONDS || '300' }}
          DEV_BFF_CANONICAL_CORS_ORIGIN: ${{ vars.DEV_BFF_CANONICAL_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.204.12.sslip.io' }}
          DEV_BFF_CORS_ORIGINS: ${{ vars.DEV_BFF_CORS_ORIGINS || vars.DEV_BFF_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.204.12.sslip.io' }}
          DEV_BFF_AUTH_STUB: "false"
          DEV_BFF_AUTH_MODE: strict
          DEV_BFF_JWT_SECRET: ${{ secrets.DEV_BFF_JWT_SECRET }}
          DEV_BFF_JWT_ISSUER: ${{ vars.DEV_BFF_JWT_ISSUER || 'pantheon-dev' }}
          DEV_BFF_JWT_AUDIENCE: ${{ vars.DEV_BFF_JWT_AUDIENCE || 'bff-operators' }}
          DEV_BFF_JWKS_URI: ${{ vars.DEV_BFF_JWKS_URI || 'https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com' }}
          DEV_BFF_OIDC_DISCOVERY_URL: ${{ vars.DEV_BFF_OIDC_DISCOVERY_URL }}
          DEV_BFF_OIDC_ISSUER: ${{ vars.DEV_BFF_OIDC_ISSUER || 'https://securetoken.google.com/pantheon-lupin-dev-20260719' }}
          DEV_BFF_OIDC_AUDIENCE: ${{ vars.DEV_BFF_OIDC_AUDIENCE || 'pantheon-lupin-dev-20260719' }}
          DEV_BFF_OIDC_CLIENT_ID: ${{ secrets.DEV_BFF_OIDC_CLIENT_ID }}
          DEV_BFF_OIDC_CLIENT_SECRET: ${{ secrets.DEV_BFF_OIDC_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_ID || 'pantheon-dev-viewer-v1' }}
          DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_ID || 'pantheon-dev-approver-v1' }}
          DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_ID || 'pantheon-dev-risk-owner-v1' }}
          DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_ID || 'pantheon-dev-operator-a-v1' }}
          DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_ID || 'pantheon-dev-operator-b-v1' }}
          DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_SECRET }}
          DEV_BFF_MFA_REQUIRED: ${{ vars.DEV_BFF_MFA_REQUIRED || 'true' }}
          DEV_BFF_MFA_CLAIMS: ${{ vars.DEV_BFF_MFA_CLAIMS || 'amr,acr,mfa,mfa_verified,firebase.sign_in_second_factor' }}
          DEV_BFF_MFA_VALUES: ${{ vars.DEV_BFF_MFA_VALUES || 'true,1,yes,mfa,otp,totp,webauthn' }}
          DEV_BFF_REQUIRE_EMAIL_VERIFIED: ${{ vars.DEV_BFF_REQUIRE_EMAIL_VERIFIED || 'true' }}
          DEV_BFF_DEV_LOGIN_OPERATOR_MFA_VERIFIED: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_MFA_VERIFIED || 'false' }}
          DEV_BFF_DEV_LOGIN_VIEWER_MFA_VERIFIED: ${{ vars.DEV_BFF_DEV_LOGIN_VIEWER_MFA_VERIFIED || 'true' }}
          DEV_BFF_DEV_LOGIN_APPROVER_MFA_VERIFIED: ${{ vars.DEV_BFF_DEV_LOGIN_APPROVER_MFA_VERIFIED || 'true' }}
          DEV_BFF_DEV_LOGIN_RISK_OWNER_MFA_VERIFIED: ${{ vars.DEV_BFF_DEV_LOGIN_RISK_OWNER_MFA_VERIFIED || 'true' }}
          DEV_BFF_DEV_LOGIN_OPERATOR_A_MFA_VERIFIED: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_A_MFA_VERIFIED || 'true' }}
          DEV_BFF_DEV_LOGIN_OPERATOR_B_MFA_VERIFIED: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_B_MFA_VERIFIED || 'true' }}
          DEV_ASSISTANT_CONTROL_PASSPHRASE_HASH: ${{ secrets.DEV_ASSISTANT_CONTROL_PASSPHRASE_HASH }}
          DEV_BFF_ROLE_CLAIMS: ${{ vars.DEV_BFF_ROLE_CLAIMS || 'roles,role' }}
          DEV_BFF_ROLE_MAP: ${{ vars.DEV_BFF_ROLE_MAP || 'pantheon-operator=operator;pantheon-viewer=viewer;pantheon-reviewer=reviewer;pantheon-approver=approver;pantheon-risk-owner=risk_owner;pantheon-admin=admin' }}
          DEV_BFF_ROLE_MAP_MODE: ${{ vars.DEV_BFF_ROLE_MAP_MODE || 'strict' }}
          DEV_BFF_DEFAULT_ROLE: ${{ vars.DEV_BFF_DEFAULT_ROLE || 'viewer' }}
          DEV_OPENCLAW_ADAPTER_SERVICE_TOKEN: ${{ secrets.DEV_OPENCLAW_ADAPTER_SERVICE_TOKEN }}
          DEV_OPENCLAW_ADAPTER_SERVICE_AUTH_REQUIRED: ${{ vars.DEV_OPENCLAW_ADAPTER_SERVICE_AUTH_REQUIRED || 'true' }}
          DEV_MANAGEMENT_AI_STORE_BACKEND: ${{ vars.DEV_MANAGEMENT_AI_STORE_BACKEND || 'postgres' }}
          DEV_MANAGEMENT_AI_STORE_SCHEMA: ${{ vars.DEV_MANAGEMENT_AI_STORE_SCHEMA || 'management_ai' }}
          DEV_MANAGEMENT_AI_DB_USER: ${{ vars.DEV_MANAGEMENT_AI_DB_USER || 'pantheon_management_ai' }}
          DEV_MANAGEMENT_AI_DB_PASSWORD: ${{ secrets.DEV_MANAGEMENT_AI_DB_PASSWORD }}
          DEV_MANAGEMENT_AI_DATABASE_URL: ${{ secrets.DEV_MANAGEMENT_AI_DATABASE_URL }}
          DEV_MANAGEMENT_AI_ATTACH_BUCKET: ${{ vars.DEV_MANAGEMENT_AI_ATTACH_BUCKET }}
          DEV_MANAGEMENT_AI_ATTACH_LOCATION: ${{ vars.DEV_MANAGEMENT_AI_ATTACH_LOCATION || 'asia-east1' }}
          DEV_PPL_ALLOC_009_DEV_PROOF_ENABLED: ${{ inputs.ppl_alloc_009_dev_proof_enabled }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: bash .target/scripts/compensate_cross_repo_release.sh

      - name: Upload accepted or compensated release evidence
        id: release_evidence_upload
        if: ${{ always() && steps.frontend_release.outputs.evidence_dir != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pantheon-cross-repo-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.frontend_release.outputs.evidence_dir }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Enforce accepted or proven compensated outcome
        if: ${{ always() }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          if [[ "${{ steps.frontend_release.outcome }}" == "success" ]]; then
            {
              echo "## Exact FE/BFF release accepted"
              echo "- release candidate: \`${{ needs.deploy-dev.outputs.release_candidate_id }}\`"
              echo "- backend: \`${{ needs.deploy-dev.outputs.backend_sha }}\`"
              echo "- frontend: \`${{ needs.deploy-dev.outputs.frontend_sha }}\`"
              echo "- compatibility manifest: \`${{ needs.deploy-dev.outputs.compatibility_manifest_sha256 }}\`"
              echo "- admission artifact: \`${{ needs.deploy-dev.outputs.admission_artifact_digest }}\`"
              echo "- transaction evidence: \`${{ steps.release_evidence_upload.outputs.artifact-digest }}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [[ "${{ steps.compensation.outcome }}" == "success" && \
                -s "${RELEASE_EVIDENCE_DIR}/release-compensation.json" ]]; then
            {
              echo "## Exact FE/BFF release rejected and compensated"
              echo "- rejected candidate: \`${{ needs.deploy-dev.outputs.release_candidate_id }}\`"
              echo "- restored backend: \`${{ needs.deploy-dev.outputs.previous_backend_sha }}\`"
              echo "- restored frontend: \`${{ needs.deploy-dev.outputs.previous_frontend_sha }}\`"
              echo "- compensation evidence: \`${{ steps.release_evidence_upload.outputs.artifact-digest }}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "Frontend admission or switch failed; exact hosted baseline was restored." >&2
            exit 1
          fi
          echo "Frontend admission or switch failed and exact rollback proof is absent." >&2
          exit 75

  deploy-staging-live:
    name: Deploy staging-live (independent environment)
    if: ${{ (github.event_name == 'push' && github.ref_name == 'master') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging-live') }}
    runs-on: ubuntu-latest
    environment: staging-live
    env:
      TARGET_ENV: staging-live
      TARGET_COMPONENT: ${{ github.event_name == 'push' && 'auto' || inputs.component }}
      TARGET_REF: ${{ github.event_name == 'push' && github.sha || inputs.ref || github.sha }}
      ALLOW_DIRTY: ${{ github.event_name == 'push' && 'false' || inputs.allow_dirty }}
      ALLOW_EXAMPLE_ENV: ${{ github.event_name == 'push' && 'false' || inputs.allow_example_env }}
      PPL_ALLOC_009_DEV_PROOF_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.ppl_alloc_009_dev_proof_enabled || false }}
    steps:
      - name: Checkout requested staging payload
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Resolve and validate staging payload
        id: target
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          sha="$(git rev-parse HEAD)"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]
          trusted_ref="$(git rev-parse refs/remotes/origin/master)"
          [[ "${trusted_ref}" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "${sha}" "${trusted_ref}" || {
            echo "Staging payload ${sha} is not contained in protected origin/master" >&2
            exit 1
          }
          case "${TARGET_COMPONENT}" in
            auto|control|exec|all) ;;
            *) echo "Invalid staging deployment component: ${TARGET_COMPONENT}" >&2; exit 1 ;;
          esac
          if [[ "${PPL_ALLOC_009_DEV_PROOF_ENABLED}" != "false" ]]; then
            echo "PPL-ALLOC-009 dev proof cannot be enabled for staging-live." >&2
            exit 1
          fi
          bash scripts/validate_split_topology.sh
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Deploy staging VM stack
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          STAGING_CONTROL_VM: ${{ vars.STAGING_CONTROL_VM || 'pantheon-lupin-staging-control' }}
          STAGING_CONTROL_ZONE: ${{ vars.STAGING_CONTROL_ZONE || 'asia-east1-b' }}
          STAGING_CONTROL_REMOTE_DIR: ${{ vars.STAGING_CONTROL_REMOTE_DIR || '/home/lupin/code/pantheon' }}
          STAGING_EXEC_VM: ${{ vars.STAGING_EXEC_VM || 'pantheon-lupin-staging-exec' }}
          STAGING_EXEC_ZONE: ${{ vars.STAGING_EXEC_ZONE || 'asia-east1-b' }}
          STAGING_EXEC_REMOTE_DIR: ${{ vars.STAGING_EXEC_REMOTE_DIR || '/home/lupin/code/pantheon' }}
          STAGING_EXEC_HEALTH_URL: ${{ vars.STAGING_EXEC_HEALTH_URL || 'http://10.50.0.21:28081' }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          args=(
            --environment staging-live
            --component "${TARGET_COMPONENT}"
            --sha "${{ steps.target.outputs.sha }}"
            --project-id "${{ vars.GCP_DEPLOY_PROJECT_ID || 'pantheon-benjamin-20260528' }}"
          )
          [[ "${ALLOW_DIRTY}" == "true" ]] && args+=(--allow-dirty)
          [[ "${ALLOW_EXAMPLE_ENV}" == "true" ]] && args+=(--allow-example-env)
          bash scripts/deploy_nonprod_vm.sh "${args[@]}"

      - name: Public staging BFF smoke
        if: ${{ env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'control' || env.TARGET_COMPONENT == 'all' }}
        env:
          STAGING_BFF_URL: ${{ vars.STAGING_BFF_URL || 'https://pantheon-lupin-staging-bff.104.155.223.192.sslip.io' }}
          STAGING_BFF_CORS_ORIGIN: ${{ vars.STAGING_BFF_CORS_ORIGIN || 'https://pantheon-ai-system-front-staging-live.lovable.app' }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          curl -fsS "${STAGING_BFF_URL}/health" >/dev/null
          actual="$(curl -fsS "${STAGING_BFF_URL}/bff/version" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("source_commit_sha") or "")')"
          [[ "${actual}" == "${TARGET_SHA}" ]]
          curl -sS -D - -o "${RUNNER_TEMP}/staging-cors-body" \
            -X OPTIONS "${STAGING_BFF_URL}/health" \
            -H "Origin: ${STAGING_BFF_CORS_ORIGIN}" \
            -H 'Access-Control-Request-Method: GET' \
            | grep -qi "access-control-allow-origin: ${STAGING_BFF_CORS_ORIGIN}"

      - name: Summarize staging deployment
        if: ${{ success() }}
        run: |
          {
            echo "## Staging-live deployment"
            echo "- Payload: \`${{ steps.target.outputs.sha }}\`"
            echo "- Target: \`staging-live/${TARGET_COMPONENT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

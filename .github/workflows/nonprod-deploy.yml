          DEV_MANAGEMENT_AI_ATTACH_LOCATION: ${{ vars.DEV_MANAGEMENT_AI_ATTACH_LOCATION || 'asia-east1' }}
          DEV_PPL_ALLOC_009_DEV_PROOF_ENABLED: "false"
          PANTHEON_ROLLBACK_BACKEND_SHA: ${{ steps.rollback_baseline.outputs.sha }}
          PANTHEON_ROLLBACK_FRONTEND_SHA: ${{ steps.rollback_baseline.outputs.frontend_sha }}
          PANTHEON_DEV_ROLLBACK_BACKEND_SHA: ${{ steps.rollback_baseline.outputs.sha }}
          PANTHEON_FAILED_BACKEND_SHA: ${{ steps.target.outputs.sha }}
          PANTHEON_FAILED_FRONTEND_SHA: ${{ steps.frontend.outputs.sha }}

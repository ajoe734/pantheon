name: Pantheon Nonprod Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Non-prod environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - staging-live
      component:
        description: "Stack slice to deploy; auto maps to dev/root or staging/all"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - root
          - bff
          - control
          - exec
          - all
      ref:
        description: "Commit SHA, branch, or tag to deploy. Leave blank for the workflow ref."
        required: false
        default: ""
        type: string
      allow_dirty:
        description: "Emergency only: allow dirty remote checkout"
        required: false
        default: false
        type: boolean
      allow_example_env:
        description: "Rehearsal only: allow staging to use env/*.env.example"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - "publish/v*"
      - "master"

permissions:
  contents: read
  id-token: write

concurrency:
  group: pantheon-nonprod-deploy-${{ github.event_name == 'push' && (startsWith(github.ref_name, 'publish/') && 'dev-auto' || 'staging-auto') || inputs.environment }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  deploy-dev:
    name: Deploy dev under shared environment lease
    if: ${{ (github.event_name == 'push' && startsWith(github.ref_name, 'publish/')) || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      TARGET_ENV: dev
      TARGET_COMPONENT: ${{ github.event_name == 'push' && 'auto' || inputs.component }}
      TARGET_REF: ${{ github.event_name == 'push' && github.sha || inputs.ref || github.sha }}
      ALLOW_DIRTY: ${{ github.event_name == 'push' && 'false' || inputs.allow_dirty }}
    steps:
      # This checkout is the immutable trust root for every lease operation.
      # It is intentionally separate from the requested deployment payload.
      - name: Checkout pinned lease controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ajoe734/pantheon
          ref: 65a1d653222ab378c994df6c40349139cd429831
          path: .lease-controller
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout requested payload
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_REF }}
          path: .target
          submodules: recursive
          persist-credentials: false

      - name: Resolve and validate dev payload
        id: target
        working-directory: .target
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          sha="$(git rev-parse HEAD)"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]
          case "${TARGET_COMPONENT}" in
            auto|root|bff) ;;
            *) echo "Invalid dev deployment component: ${TARGET_COMPONENT}" >&2; exit 1 ;;
          esac
          docker compose -f docker-compose.yml config --quiet
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Prepare fixed trusted command path
        id: runtime
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          trusted_bin="${RUNNER_TEMP}/pantheon-trusted-bin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "${trusted_bin}"
          gcloud_path="$(command -v gcloud)"
          [[ -x "${gcloud_path}" && ! -L "${gcloud_path}" ]]
          ln -s "${gcloud_path}" "${trusted_bin}/gcloud"
          safe_path="${trusted_bin}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          echo "safe_path=${safe_path}" >> "${GITHUB_OUTPUT}"

      - name: Acquire shared dev environment lease
        id: lease
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: "0"
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          unset BASH_ENV ENV PYTHONPATH PYTHONHOME CDPATH
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ "$(git -C "${controller}" rev-parse HEAD)" == "65a1d653222ab378c994df6c40349139cd429831" ]]
          [[ -f "${controller}/scripts/dev_environment_lease.py" && ! -L "${controller}/scripts/dev_environment_lease.py" ]]
          [[ -f "${controller}/scripts/run_with_dev_environment_lease.sh" && ! -L "${controller}/scripts/run_with_dev_environment_lease.sh" ]]
          printf '%s  %s\n' \
            5e72d6a4d2c945d79a9a1fcc2e205584b9a1f06cc53c973c7ba3ae76205db102 "${controller}/scripts/dev_environment_lease.py" \
            f3995a2baedc2ff47178a0de8ad1952096df4de508d5a47c8e0042a151ab7ea8 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict

          lease_dir="$(mktemp -d "${RUNNER_TEMP}/pantheon-dev-lease-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          chmod 0700 "${lease_dir}"
          state_file="${lease_dir}/state.json"
          acquisition_file="${lease_dir}/acquisition.json"
          pid_file="${lease_dir}/heartbeat.pid"
          identity_file="${lease_dir}/heartbeat-identity.json"
          failure_file="${lease_dir}/heartbeat-failure.json"
          shutdown_file="${lease_dir}/heartbeat-stop.json"
          heartbeat_log="${lease_dir}/heartbeat.log"

          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            python3 "${controller}/scripts/dev_environment_lease.py" acquire \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --mode deployment \
            --owner "pantheon:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --ttl-seconds 300 \
            --wait-seconds 7200 \
            --poll-seconds 5 \
            --state-file "${state_file}" \
            --expected-backend-sha "${TARGET_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --json-out "${acquisition_file}"
          lease_token=""

          lease_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["leaseId"])' "${state_file}")"
          [[ "${lease_id}" =~ ^[0-9a-f-]{36}$ ]]
          {
            echo "lease_id=${lease_id}"
            echo "state_file=${state_file}"
            echo "pid_file=${pid_file}"
            echo "identity_file=${identity_file}"
            echo "failure_file=${failure_file}"
            echo "shutdown_file=${shutdown_file}"
            echo "heartbeat_log=${heartbeat_log}"
          } >> "${GITHUB_OUTPUT}"

      - name: Start identity-bound lease heartbeat
        id: heartbeat
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: "0"
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          LEASE_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          LEASE_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          LEASE_SHUTDOWN_FILE: ${{ steps.lease.outputs.shutdown_file }}
          LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.heartbeat_log }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          unset BASH_ENV ENV PYTHONPATH PYTHONHOME CDPATH
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ -f "${controller}/scripts/dev_environment_lease.py" && ! -L "${controller}/scripts/dev_environment_lease.py" ]]
          printf '%s  %s\n' \
            5e72d6a4d2c945d79a9a1fcc2e205584b9a1f06cc53c973c7ba3ae76205db102 "${controller}/scripts/dev_environment_lease.py" \
            f3995a2baedc2ff47178a0de8ad1952096df4de508d5a47c8e0042a151ab7ea8 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict
          exec {token_fd}<<<"${lease_token}"
          env -i \
            PATH="${PATH}" HOME="${HOME}" LANG=C.UTF-8 \
            PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 PYTHONSTARTUP= PYTHONINSPECT=0 \
            python3 "${controller}/scripts/dev_environment_lease.py" heartbeat-loop \
              --repository ajoe734/execute-plans \
              --branch environment-coordination \
              --path .pantheon/environment-leases/pantheon-dev-environment.json \
              --resource pantheon-dev-environment \
              --state-file "${LEASE_STATE_FILE}" \
              --ttl-seconds 300 \
              --interval-seconds 60 \
              --failure-json-out "${LEASE_FAILURE_FILE}" \
              --shutdown-json-out "${LEASE_SHUTDOWN_FILE}" \
              --identity-json-out "${LEASE_IDENTITY_FILE}" \
              --token-stdin \
              <&"${token_fd}" >"${LEASE_HEARTBEAT_LOG}" 2>&1 &
          heartbeat_pid=$!
          exec {token_fd}<&-
          printf '%s\n' "${heartbeat_pid}" > "${LEASE_PID_FILE}"

          for _ in $(seq 1 100); do
            [[ -s "${LEASE_IDENTITY_FILE}" ]] && break
            kill -0 "${heartbeat_pid}" 2>/dev/null || {
              sed -n '1,200p' "${LEASE_HEARTBEAT_LOG}" >&2 || true
              exit 75
            }
            sleep 0.1
          done
          [[ -s "${LEASE_IDENTITY_FILE}" ]]
          python3 "${controller}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
            --identity-file "${LEASE_IDENTITY_FILE}" \
            --pid "${heartbeat_pid}" \
            --expected-cli "${controller}/scripts/dev_environment_lease.py" \
            --state-file "${LEASE_STATE_FILE}" >/dev/null
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            python3 "${controller}/scripts/dev_environment_lease.py" verify \
              --repository ajoe734/execute-plans \
              --branch environment-coordination \
              --path .pantheon/environment-leases/pantheon-dev-environment.json \
              --resource pantheon-dev-environment \
              --state-file "${LEASE_STATE_FILE}" \
              --max-heartbeat-age-seconds 120 >/dev/null
          lease_token=""

      - name: Deploy dev VM stack under lease
        id: deploy
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: "0"
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.heartbeat_log }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_MAX_HEARTBEAT_AGE_SECONDS: "120"
          PANTHEON_DEV_ENVIRONMENT_LEASE_VERIFY_INTERVAL_SECONDS: "30"
          GITHUB_TOKEN: ${{ github.token }}
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-lupin-dev' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          DEV_REMOTE_DIR: ${{ vars.DEV_REMOTE_DIR || '/home/lupin/code/pantheon' }}
          DEV_BFF_CANONICAL_CORS_ORIGIN: ${{ vars.DEV_BFF_CANONICAL_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.239.38.sslip.io' }}
          DEV_BFF_CORS_ORIGINS: ${{ vars.DEV_BFF_CORS_ORIGINS || vars.DEV_BFF_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.239.38.sslip.io' }}
          DEV_MANAGEMENT_AI_STORE_BACKEND: ${{ vars.DEV_MANAGEMENT_AI_STORE_BACKEND || 'postgres' }}
          DEV_MANAGEMENT_AI_STORE_SCHEMA: ${{ vars.DEV_MANAGEMENT_AI_STORE_SCHEMA || 'management_ai' }}
          DEV_MANAGEMENT_AI_DB_USER: ${{ vars.DEV_MANAGEMENT_AI_DB_USER || 'pantheon_management_ai' }}
          DEV_MANAGEMENT_AI_DB_PASSWORD: ${{ secrets.DEV_MANAGEMENT_AI_DB_PASSWORD }}
          DEV_MANAGEMENT_AI_DATABASE_URL: ${{ secrets.DEV_MANAGEMENT_AI_DATABASE_URL }}
          DEV_MANAGEMENT_AI_ATTACH_BUCKET: ${{ vars.DEV_MANAGEMENT_AI_ATTACH_BUCKET }}
          DEV_MANAGEMENT_AI_ATTACH_LOCATION: ${{ vars.DEV_MANAGEMENT_AI_ATTACH_LOCATION || 'asia-east1' }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ -f "${controller}/scripts/run_with_dev_environment_lease.sh" && ! -L "${controller}/scripts/run_with_dev_environment_lease.sh" ]]
          printf '%s  %s\n' \
            5e72d6a4d2c945d79a9a1fcc2e205584b9a1f06cc53c973c7ba3ae76205db102 "${controller}/scripts/dev_environment_lease.py" \
            f3995a2baedc2ff47178a0de8ad1952096df4de508d5a47c8e0042a151ab7ea8 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict
          args=(
            bash "${GITHUB_WORKSPACE}/.target/scripts/deploy_nonprod_vm.sh"
            --environment dev
            --component "${TARGET_COMPONENT}"
            --sha "${TARGET_SHA}"
            --project-id "${{ vars.GCP_DEPLOY_PROJECT_ID || 'pantheon-benjamin-20260528' }}"
          )
          [[ "${ALLOW_DIRTY}" == "true" ]] && args+=(--allow-dirty)
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            exec "${GITHUB_WORKSPACE}/.lease-controller/scripts/run_with_dev_environment_lease.sh" "${args[@]}"

      - name: Dev OpenClaw assistant live smoke under lease
        id: openclaw
        if: ${{ env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'root' }}
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: "0"
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.heartbeat_log }}
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-lupin-dev' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          GCP_DEPLOY_PROJECT_ID: ${{ vars.GCP_DEPLOY_PROJECT_ID || 'pantheon-benjamin-20260528' }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ -f "${controller}/scripts/run_with_dev_environment_lease.sh" && ! -L "${controller}/scripts/run_with_dev_environment_lease.sh" ]]
          printf '%s  %s\n' \
            5e72d6a4d2c945d79a9a1fcc2e205584b9a1f06cc53c973c7ba3ae76205db102 "${controller}/scripts/dev_environment_lease.py" \
            f3995a2baedc2ff47178a0de8ad1952096df4de508d5a47c8e0042a151ab7ea8 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            exec "${GITHUB_WORKSPACE}/.lease-controller/scripts/run_with_dev_environment_lease.sh" \
            bash -c 'gcloud compute ssh "${REMOTE_USER}@${DEV_VM}" --zone "${DEV_ZONE}" --project "${GCP_DEPLOY_PROJECT_ID}" --ssh-flag=-T --command "OPENCLAW_GATEWAY_ADAPTER_URL=http://127.0.0.1:18104 bash -s" < "$1"' \
            bash "${GITHUB_WORKSPACE}/.target/scripts/openclaw-assistant-openclaw-live-smoke.sh"

      - name: Public dev BFF smoke and exact version proof under lease
        id: public_smoke
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: "0"
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.heartbeat_log }}
          DEV_BFF_URL: ${{ vars.DEV_BFF_URL || 'https://pantheon-lupin-dev-bff.35.201.239.38.sslip.io' }}
          DEV_BFF_CANONICAL_CORS_ORIGIN: ${{ vars.DEV_BFF_CANONICAL_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.239.38.sslip.io' }}
          DEV_BFF_CORS_ORIGIN: ${{ vars.DEV_BFF_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.239.38.sslip.io' }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ -f "${controller}/scripts/run_with_dev_environment_lease.sh" && ! -L "${controller}/scripts/run_with_dev_environment_lease.sh" ]]
          printf '%s  %s\n' \
            5e72d6a4d2c945d79a9a1fcc2e205584b9a1f06cc53c973c7ba3ae76205db102 "${controller}/scripts/dev_environment_lease.py" \
            f3995a2baedc2ff47178a0de8ad1952096df4de508d5a47c8e0042a151ab7ea8 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            exec "${GITHUB_WORKSPACE}/.lease-controller/scripts/run_with_dev_environment_lease.sh" \
            bash -c '
              set -euo pipefail
              curl -fsS "${DEV_BFF_URL}/health" >/dev/null
              actual="$(curl -fsS "${DEV_BFF_URL}/bff/version" | python3 -c '\''import json,sys; print(json.load(sys.stdin).get("source_commit_sha") or "")'\'')"
              [[ "${actual}" == "${TARGET_SHA}" ]]
              origins="${DEV_BFF_CANONICAL_CORS_ORIGIN}"
              if [[ -n "${DEV_BFF_CORS_ORIGIN}" && ",${origins}," != *",${DEV_BFF_CORS_ORIGIN},"* ]]; then
                origins="${origins},${DEV_BFF_CORS_ORIGIN}"
              fi
              IFS="," read -r -a cors_origins <<< "${origins}"
              for origin in "${cors_origins[@]}"; do
                origin="${origin//[[:space:]]/}"
                [[ -z "${origin}" ]] && continue
                curl -sS -D - -o "${RUNNER_TEMP}/dev-cors-body" -X OPTIONS "${DEV_BFF_URL}/health" \
                  -H "Origin: ${origin}" -H "Access-Control-Request-Method: GET" \
                  | grep -qi "access-control-allow-origin: ${origin}"
              done
            '

      - name: Dev Agora restart persistence smoke under lease
        id: agora
        if: ${{ env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'root' || env.TARGET_COMPONENT == 'bff' }}
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: "0"
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.heartbeat_log }}
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-lupin-dev' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          DEV_BFF_URL: ${{ vars.DEV_BFF_URL || 'https://pantheon-lupin-dev-bff.35.201.239.38.sslip.io' }}
          GCP_DEPLOY_PROJECT_ID: ${{ vars.GCP_DEPLOY_PROJECT_ID || 'pantheon-benjamin-20260528' }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ -f "${controller}/scripts/run_with_dev_environment_lease.sh" && ! -L "${controller}/scripts/run_with_dev_environment_lease.sh" ]]
          printf '%s  %s\n' \
            5e72d6a4d2c945d79a9a1fcc2e205584b9a1f06cc53c973c7ba3ae76205db102 "${controller}/scripts/dev_environment_lease.py" \
            f3995a2baedc2ff47178a0de8ad1952096df4de508d5a47c8e0042a151ab7ea8 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            exec "${GITHUB_WORKSPACE}/.lease-controller/scripts/run_with_dev_environment_lease.sh" \
            bash -c '
              set -euo pipefail
              idem="agora-restart-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              workshop_id="$(curl -fsS -X POST "${DEV_BFF_URL}/bff/agora/workshops" \
                -H "Authorization: Bearer agora-deploy-smoke:operator" \
                -H "Idempotency-Key: ${idem}" -H "Content-Type: application/json" \
                --data "{\"initial_message\":\"Versioned dev restart-persistence smoke\"}" \
                | jq -er ".data.workshop_id")"
              gcloud compute ssh "${REMOTE_USER}@${DEV_VM}" --zone "${DEV_ZONE}" \
                --project "${GCP_DEPLOY_PROJECT_ID}" --ssh-flag=-T \
                --command "docker inspect pantheon-operator-bff-1 --format '\''{{range .Config.Env}}{{println .}}{{end}}'\'' | grep -q '\''^AGORA_WORKSHOP_STORE_BACKEND=postgres$'\'' && docker logs pantheon-operator-bff-1 2>&1 | grep -q '\''Agora workshop store initialized backend=postgres'\'' && cd /home/lupin/code/pantheon && docker compose -p pantheon -f docker-compose.yml restart operator-bff"
              for _ in $(seq 1 30); do
                curl -fsS "${DEV_BFF_URL}/readyz" >/dev/null && break
                sleep 2
              done
              test "$(curl -fsS "${DEV_BFF_URL}/bff/agora/workshops/${workshop_id}" -H "Authorization: Bearer agora-deploy-smoke:operator" | jq -er ".data.workshop_id")" = "${workshop_id}"
            '

      - name: Stop heartbeat and release only after complete success
        id: lease_cleanup
        if: ${{ always() && steps.lease.outcome == 'success' }}
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: "0"
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          LEASE_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          LEASE_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          LEASE_SHUTDOWN_FILE: ${{ steps.lease.outputs.shutdown_file }}
          LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.heartbeat_log }}
          HEARTBEAT_OUTCOME: ${{ steps.heartbeat.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          OPENCLAW_OUTCOME: ${{ steps.openclaw.outcome }}
          PUBLIC_SMOKE_OUTCOME: ${{ steps.public_smoke.outcome }}
          AGORA_OUTCOME: ${{ steps.agora.outcome }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          unset BASH_ENV ENV PYTHONPATH PYTHONHOME CDPATH
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ -f "${controller}/scripts/dev_environment_lease.py" && ! -L "${controller}/scripts/dev_environment_lease.py" ]]
          printf '%s  %s\n' \
            5e72d6a4d2c945d79a9a1fcc2e205584b9a1f06cc53c973c7ba3ae76205db102 "${controller}/scripts/dev_environment_lease.py" \
            f3995a2baedc2ff47178a0de8ad1952096df4de508d5a47c8e0042a151ab7ea8 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict

          heartbeat_stopped() {
            local state
            state="$(ps -o stat= -p "${heartbeat_pid}" 2>/dev/null | tr -d '[:space:]')"
            case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
            return 1
          }
          verify_identity() {
            python3 "${controller}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
              --identity-file "${LEASE_IDENTITY_FILE}" \
              --pid "${heartbeat_pid}" \
              --expected-cli "${controller}/scripts/dev_environment_lease.py" \
              --state-file "${LEASE_STATE_FILE}" >/dev/null
          }
          stop_heartbeat() {
            local attempt
            heartbeat_stopped && return 0
            verify_identity || return 1
            kill -TERM "${heartbeat_pid}" 2>/dev/null || {
              heartbeat_stopped && return 0
              return 1
            }
            heartbeat_stopped && return 0
            verify_identity || { heartbeat_stopped && return 0; return 1; }
            kill -CONT "${heartbeat_pid}" 2>/dev/null || true
            for attempt in $(seq 1 40); do
              heartbeat_stopped && return 0
              sleep 0.25
            done
            verify_identity || { heartbeat_stopped && return 0; return 1; }
            kill -KILL "${heartbeat_pid}" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              heartbeat_stopped && return 0
              sleep 0.25
            done
            return 1
          }

          complete_success=false
          case "${TARGET_COMPONENT}" in
            auto|root)
              [[ "${HEARTBEAT_OUTCOME}:${DEPLOY_OUTCOME}:${OPENCLAW_OUTCOME}:${PUBLIC_SMOKE_OUTCOME}:${AGORA_OUTCOME}" == "success:success:success:success:success" ]] && complete_success=true
              ;;
            bff)
              [[ "${HEARTBEAT_OUTCOME}:${DEPLOY_OUTCOME}:${OPENCLAW_OUTCOME}:${PUBLIC_SMOKE_OUTCOME}:${AGORA_OUTCOME}" == "success:success:skipped:success:success" ]] && complete_success=true
              ;;
          esac

          if [[ ! -s "${LEASE_PID_FILE}" ]]; then
            echo "Lease heartbeat never became identity-bound; quarantining until TTL." >&2
            exit 0
          fi
          heartbeat_pid="$(tr -d '[:space:]' < "${LEASE_PID_FILE}")"
          [[ "${heartbeat_pid}" =~ ^[1-9][0-9]*$ ]] || {
            echo "Invalid heartbeat PID; quarantining until TTL." >&2
            exit 0
          }
          stop_heartbeat || {
            echo "Could not identity-safely stop heartbeat; refusing release." >&2
            exit 75
          }

          if [[ "${complete_success}" != "true" || -e "${LEASE_FAILURE_FILE}" ]]; then
            echo "Protected dev sequence was incomplete; lease quarantined until TTL." >&2
            sed -n '1,200p' "${LEASE_FAILURE_FILE}" >&2 2>/dev/null || true
            exit 0
          fi
          [[ -s "${LEASE_SHUTDOWN_FILE}" ]] || {
            echo "Heartbeat did not record a graceful identity-bound stop; refusing release." >&2
            exit 75
          }
          python3 - "${LEASE_SHUTDOWN_FILE}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          if payload.get("status") != "stopped" or payload.get("resource") != "pantheon-dev-environment":
              raise SystemExit("heartbeat shutdown evidence is invalid")
          PY
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            python3 "${controller}/scripts/dev_environment_lease.py" verify \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --state-file "${LEASE_STATE_FILE}" \
            --max-heartbeat-age-seconds 120 >/dev/null
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            python3 "${controller}/scripts/dev_environment_lease.py" release \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --state-file "${LEASE_STATE_FILE}"
          lease_token=""

      - name: Summarize dev deployment
        if: ${{ success() }}
        run: |
          {
            echo "## Dev deployment"
            echo "- Payload: \`${{ steps.target.outputs.sha }}\`"
            echo "- Lease: \`${{ steps.lease.outputs.lease_id }}\`"
            echo "- Controller: \`65a1d653222ab378c994df6c40349139cd429831\`"
            echo "- Target: \`dev/${TARGET_COMPONENT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-staging-live:
    name: Deploy staging-live (independent environment)
    if: ${{ (github.event_name == 'push' && github.ref_name == 'master') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging-live') }}
    runs-on: ubuntu-latest
    environment: staging-live
    env:
      TARGET_ENV: staging-live
      TARGET_COMPONENT: ${{ github.event_name == 'push' && 'auto' || inputs.component }}
      TARGET_REF: ${{ github.event_name == 'push' && github.sha || inputs.ref || github.sha }}
      ALLOW_DIRTY: ${{ github.event_name == 'push' && 'false' || inputs.allow_dirty }}
      ALLOW_EXAMPLE_ENV: ${{ github.event_name == 'push' && 'false' || inputs.allow_example_env }}
    steps:
      - name: Checkout requested staging payload
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_REF }}
          submodules: recursive
          persist-credentials: false

      - name: Resolve and validate staging payload
        id: target
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          sha="$(git rev-parse HEAD)"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]
          case "${TARGET_COMPONENT}" in
            auto|control|exec|all) ;;
            *) echo "Invalid staging deployment component: ${TARGET_COMPONENT}" >&2; exit 1 ;;
          esac
          bash scripts/validate_split_topology.sh
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Deploy staging VM stack
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          STAGING_CONTROL_VM: ${{ vars.STAGING_CONTROL_VM || 'pantheon-lupin-staging-control' }}
          STAGING_CONTROL_ZONE: ${{ vars.STAGING_CONTROL_ZONE || 'asia-east1-b' }}
          STAGING_CONTROL_REMOTE_DIR: ${{ vars.STAGING_CONTROL_REMOTE_DIR || '/home/lupin/code/pantheon' }}
          STAGING_EXEC_VM: ${{ vars.STAGING_EXEC_VM || 'pantheon-lupin-staging-exec' }}
          STAGING_EXEC_ZONE: ${{ vars.STAGING_EXEC_ZONE || 'asia-east1-b' }}
          STAGING_EXEC_REMOTE_DIR: ${{ vars.STAGING_EXEC_REMOTE_DIR || '/home/lupin/code/pantheon' }}
          STAGING_EXEC_HEALTH_URL: ${{ vars.STAGING_EXEC_HEALTH_URL || 'http://10.50.0.21:28081' }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          args=(
            --environment staging-live
            --component "${TARGET_COMPONENT}"
            --sha "${{ steps.target.outputs.sha }}"
            --project-id "${{ vars.GCP_DEPLOY_PROJECT_ID || 'pantheon-benjamin-20260528' }}"
          )
          [[ "${ALLOW_DIRTY}" == "true" ]] && args+=(--allow-dirty)
          [[ "${ALLOW_EXAMPLE_ENV}" == "true" ]] && args+=(--allow-example-env)
          bash scripts/deploy_nonprod_vm.sh "${args[@]}"

      - name: Public staging BFF smoke
        if: ${{ env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'control' || env.TARGET_COMPONENT == 'all' }}
        env:
          STAGING_BFF_URL: ${{ vars.STAGING_BFF_URL || 'https://pantheon-lupin-staging-bff.104.155.223.192.sslip.io' }}
          STAGING_BFF_CORS_ORIGIN: ${{ vars.STAGING_BFF_CORS_ORIGIN || 'https://pantheon-ai-system-front-staging-live.lovable.app' }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          curl -fsS "${STAGING_BFF_URL}/health" >/dev/null
          actual="$(curl -fsS "${STAGING_BFF_URL}/bff/version" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("source_commit_sha") or "")')"
          [[ "${actual}" == "${TARGET_SHA}" ]]
          curl -sS -D - -o "${RUNNER_TEMP}/staging-cors-body" \
            -X OPTIONS "${STAGING_BFF_URL}/health" \
            -H "Origin: ${STAGING_BFF_CORS_ORIGIN}" \
            -H 'Access-Control-Request-Method: GET' \
            | grep -qi "access-control-allow-origin: ${STAGING_BFF_CORS_ORIGIN}"

      - name: Summarize staging deployment
        if: ${{ success() }}
        run: |
          {
            echo "## Staging-live deployment"
            echo "- Payload: \`${{ steps.target.outputs.sha }}\`"
            echo "- Target: \`staging-live/${TARGET_COMPONENT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

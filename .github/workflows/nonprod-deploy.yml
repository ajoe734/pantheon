          printf -v worktree_q '%q' "${DEV_DEPLOY_WORKTREE}"
          printf -v deploy_sha_q '%q' "${DEPLOY_SHA}"
          printf -v remote_evidence_q '%q' "${remote_evidence}"
          printf -v container_evidence_q '%q' "${container_evidence}"
          echo "artifact_path=${local_evidence}" >> "$GITHUB_OUTPUT"
          echo "readback_artifact_path=${readback_evidence}" >> "$GITHUB_OUTPUT"
          set +e
          .agora-gate-controller/scripts/dev_vm_ssh.sh exec \
            "set -uo pipefail; cd ${worktree_q} || exit 1; scripts/run_loop_prod_tel_002_hosted_probe.sh --expected-sha ${deploy_sha_q} --container-output ${container_evidence_q} --remote-output ${remote_evidence_q} --timeout-seconds 420 --poll-seconds 5"
          probe_status=$?
          scp_status=0
          .agora-gate-controller/scripts/dev_vm_ssh.sh copy-from \
            "${remote_evidence}" "${local_evidence}" || scp_status=$?
          set -e
          if [[ "${scp_status}" -ne 0 || ! -s "${local_evidence}" ]]; then
            python3 -c 'import sys; from pathlib import Path; from services.trade_journey.hosted_lifecycle_probe import write_failure_artifact; write_failure_artifact(Path(sys.argv[1]), expected_sha=sys.argv[2], code="hosted_probe_transport_error", message="hosted lifecycle evidence transport failed")' "${local_evidence}" "${DEPLOY_SHA}"
          fi
          readback_status=0
          python3 -m services.trade_journey.hosted_bff_readback \
            --source "${local_evidence}" \
            --output "${readback_evidence}" \
            --expected-sha "${DEPLOY_SHA}" \
            --expected-login-identity operator_a \
            --base-url "${DEV_BFF_PUBLIC_URL}" || readback_status=$?
          echo "Canonical lifecycle hosted evidence: ${evidence_name}" >> "$GITHUB_STEP_SUMMARY"
          echo "Authenticated public BFF readback evidence: ${readback_name}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${probe_status}" -ne 0 ]]; then
            exit "${probe_status}"
          fi
          if [[ "${scp_status}" -ne 0 ]]; then
            exit "${scp_status}"
          fi
          exit "${readback_status}"


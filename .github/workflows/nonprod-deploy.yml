          PANTHEON_DEV_ARTIFACT_BASELINE_ACTIONS_ARTIFACT_ID: ${{ steps.artifact_baseline_upload.outputs.artifact-id }}
          PANTHEON_DEV_ARTIFACT_BASELINE_ACTIONS_ARTIFACT_SHA256: ${{ steps.artifact_baseline_upload.outputs.artifact-digest }}
          PANTHEON_DEV_ARTIFACT_CANDIDATE_RECEIPT_FILE: ${{ steps.artifact_candidate_seal.outputs.receipt_file }}
          PANTHEON_DEV_ARTIFACT_CANDIDATE_IMAGE_MANIFEST_SHA256: ${{ steps.artifact_candidate_seal.outputs.candidate_image_manifest_sha256 }}
          PANTHEON_DEV_ARTIFACT_CANDIDATE_ACTIONS_ARTIFACT_ID: ${{ steps.artifact_candidate_upload.outputs.artifact-id }}

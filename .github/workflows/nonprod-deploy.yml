name: Pantheon Nonprod Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Non-prod environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - staging-live
      component:
        description: "Stack slice to deploy; auto maps to dev/root or staging/all"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - root
          - bff
          - control
          - exec
          - all
      ref:
        description: "Commit SHA, branch, or tag to deploy. Leave blank for the workflow ref."
        required: false
        default: ""
        type: string
      allow_dirty:
        description: "Emergency only: allow dirty remote checkout"
        required: false
        default: false
        type: boolean
      allow_example_env:
        description: "Rehearsal only: allow staging to use env/*.env.example"
        required: false
        default: false
        type: boolean
  push:
    branches:
      # publish/v* push  → auto-redeploy DEV VM with the publish snapshot.
      - "publish/v*"
      # master push      → auto-redeploy STAGING-LIVE VMs with master HEAD.
      #                    Triggered after promote PR / hotfix PR merges.
      - "master"

permissions:
  contents: read
  id-token: write

concurrency:
  # dev (publish push) and staging-live (master push) run in independent
  # groups so they do not cancel each other. Within each group, newer
  # pushes cancel older runs (latest source-of-truth wins).
  group: pantheon-nonprod-deploy-${{ github.event_name == 'push' && (startsWith(github.ref_name, 'publish/') && 'dev-auto' || 'staging-auto') || inputs.environment }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  deploy-manual:
    name: Nonprod deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && (startsWith(github.ref_name, 'publish/') && 'dev' || 'staging-live') || inputs.environment }}
    env:
      # Trigger → env mapping:
      #   workflow_dispatch       → operator inputs
      #   push on publish/v*      → dev / auto / pushed publish branch
      #   push on master          → staging-live / auto / master HEAD
      TARGET_ENV: ${{ github.event_name == 'push' && (startsWith(github.ref_name, 'publish/') && 'dev' || 'staging-live') || inputs.environment }}
      TARGET_COMPONENT: ${{ github.event_name == 'push' && 'auto' || inputs.component }}
      TARGET_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.ref || github.sha }}
      ALLOW_DIRTY: ${{ github.event_name == 'push' && 'false' || inputs.allow_dirty }}
      ALLOW_EXAMPLE_ENV: ${{ github.event_name == 'push' && 'false' || inputs.allow_example_env }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          submodules: recursive

      - name: Resolve commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate target and compose contract
        run: |
          case "${TARGET_ENV}:${TARGET_COMPONENT}" in
            dev:auto|dev:root|dev:bff)
              docker compose -f docker-compose.yml config --quiet
              ;;
            staging-live:auto|staging-live:control|staging-live:exec|staging-live:all)
              bash scripts/validate_split_topology.sh
              ;;
            *)
              echo "Invalid deployment target: ${TARGET_ENV}/${TARGET_COMPONENT}" >&2
              exit 1
              ;;
          esac

      - name: Require dev short-lived auth qualification prerequisites
        if: ${{ env.TARGET_ENV == 'dev' && (env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'root' || env.TARGET_COMPONENT == 'bff') }}
        env:
          DEV_BFF_JWT_SECRET: ${{ env.TARGET_ENV == 'dev' && (env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'root' || env.TARGET_COMPONENT == 'bff') && secrets.DEV_BFF_JWT_SECRET || '' }}
          DEV_BFF_DEV_LOGIN_CLIENT_PROFILES_JSON: ${{ env.TARGET_ENV == 'dev' && (env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'root' || env.TARGET_COMPONENT == 'bff') && secrets.DEV_BFF_DEV_LOGIN_CLIENT_PROFILES_JSON || '' }}
          DEV_BFF_CI_CLIENT_ID: ${{ env.TARGET_ENV == 'dev' && (env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'root' || env.TARGET_COMPONENT == 'bff') && secrets.DEV_BFF_CI_CLIENT_ID || '' }}
          DEV_BFF_CI_CLIENT_SECRET: ${{ env.TARGET_ENV == 'dev' && (env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'root' || env.TARGET_COMPONENT == 'bff') && secrets.DEV_BFF_CI_CLIENT_SECRET || '' }}
        run: |
          if [[ ! "${DEV_BFF_JWT_SECRET}" =~ [^[:space:]] || ! "${DEV_BFF_DEV_LOGIN_CLIENT_PROFILES_JSON}" =~ [^[:space:]] || ! "${DEV_BFF_CI_CLIENT_ID}" =~ [^[:space:]] || ! "${DEV_BFF_CI_CLIENT_SECRET}" =~ [^[:space:]] ]]; then
            echo "::error::Dev deployment is BLOCKED: governed dev-login profile and CI credential secrets are not provisioned."
            {
              echo "## Dev auth qualification"
              echo "- Outcome: **BLOCKED**"
              echo "- Reason: JWT/profile configuration and/or the least-role CI client credential are not provisioned"
              echo "- No deployment was attempted"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! jq -e '
            .[$ENV.DEV_BFF_CI_CLIENT_ID] as $profile
            | ($profile | type == "object")
            and $profile.secret == $ENV.DEV_BFF_CI_CLIENT_SECRET
            and $profile.subject == "pantheon-dev-ci-agora"
            and ($profile.roles | sort == ["operator"])
            and $profile.tenant_id == "tenant-dev"
            and $profile.allowed_tenants == ["tenant-dev"]
            and (($profile.capabilities // []) | all(startswith("assistant.kernel.") | not))
            and ($profile.mfa_verified == false)
          ' <<<"${DEV_BFF_DEV_LOGIN_CLIENT_PROFILES_JSON}" >/dev/null; then
            echo "::error::Dev deployment is BLOCKED: CI client is not a distinct least-role governed profile."
            echo "- Dev auth qualification profile: **BLOCKED** (invalid CI actor/role/tenant/capability policy)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- Dev auth qualification prerequisites: configured" >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy requested VM stack
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-lupin-dev' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          DEV_REMOTE_DIR: ${{ vars.DEV_REMOTE_DIR || '/home/lupin/code/pantheon' }}
          DEV_BFF_CANONICAL_CORS_ORIGIN: ${{ vars.DEV_BFF_CANONICAL_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.239.38.sslip.io' }}
          DEV_BFF_CORS_ORIGINS: ${{ vars.DEV_BFF_CORS_ORIGINS || vars.DEV_BFF_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.239.38.sslip.io' }}
          DEV_BFF_JWT_SECRET: ${{ env.TARGET_ENV == 'dev' && (env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'root' || env.TARGET_COMPONENT == 'bff') && secrets.DEV_BFF_JWT_SECRET || '' }}
          DEV_BFF_DEV_LOGIN_CLIENT_PROFILES_JSON: ${{ env.TARGET_ENV == 'dev' && (env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'root' || env.TARGET_COMPONENT == 'bff') && secrets.DEV_BFF_DEV_LOGIN_CLIENT_PROFILES_JSON || '' }}
          DEV_MANAGEMENT_AI_STORE_BACKEND: ${{ vars.DEV_MANAGEMENT_AI_STORE_BACKEND || 'postgres' }}
          DEV_MANAGEMENT_AI_STORE_SCHEMA: ${{ vars.DEV_MANAGEMENT_AI_STORE_SCHEMA || 'management_ai' }}
          DEV_MANAGEMENT_AI_DB_USER: ${{ vars.DEV_MANAGEMENT_AI_DB_USER || 'pantheon_management_ai' }}
          DEV_MANAGEMENT_AI_DB_PASSWORD: ${{ env.TARGET_ENV == 'dev' && secrets.DEV_MANAGEMENT_AI_DB_PASSWORD || '' }}
          DEV_MANAGEMENT_AI_DATABASE_URL: ${{ env.TARGET_ENV == 'dev' && secrets.DEV_MANAGEMENT_AI_DATABASE_URL || '' }}
          DEV_MANAGEMENT_AI_ATTACH_BUCKET: ${{ vars.DEV_MANAGEMENT_AI_ATTACH_BUCKET }}
          DEV_MANAGEMENT_AI_ATTACH_LOCATION: ${{ vars.DEV_MANAGEMENT_AI_ATTACH_LOCATION || 'asia-east1' }}
          STAGING_CONTROL_VM: ${{ vars.STAGING_CONTROL_VM || 'pantheon-lupin-staging-control' }}
          STAGING_CONTROL_ZONE: ${{ vars.STAGING_CONTROL_ZONE || 'asia-east1-b' }}
          STAGING_CONTROL_REMOTE_DIR: ${{ vars.STAGING_CONTROL_REMOTE_DIR || '/home/lupin/code/pantheon' }}
          STAGING_EXEC_VM: ${{ vars.STAGING_EXEC_VM || 'pantheon-lupin-staging-exec' }}
          STAGING_EXEC_ZONE: ${{ vars.STAGING_EXEC_ZONE || 'asia-east1-b' }}
          STAGING_EXEC_REMOTE_DIR: ${{ vars.STAGING_EXEC_REMOTE_DIR || '/home/lupin/code/pantheon' }}
          STAGING_EXEC_HEALTH_URL: ${{ vars.STAGING_EXEC_HEALTH_URL || 'http://10.50.0.21:28081' }}
        run: |
          args=(
            --environment "${TARGET_ENV}"
            --component "${TARGET_COMPONENT}"
            --sha "${{ steps.sha.outputs.sha }}"
            --project-id "${{ vars.GCP_DEPLOY_PROJECT_ID || 'pantheon-benjamin-20260528' }}"
          )

          if [[ "${ALLOW_DIRTY}" == "true" ]]; then
            args+=(--allow-dirty)
          fi

          if [[ "${ALLOW_EXAMPLE_ENV}" == "true" ]]; then
            args+=(--allow-example-env)
          fi

          bash scripts/deploy_nonprod_vm.sh "${args[@]}"

      - name: Dev OpenClaw assistant live smoke
        if: ${{ env.TARGET_ENV == 'dev' && (env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'root') }}
        env:
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-lupin-dev' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          DEV_REMOTE_DIR: ${{ vars.DEV_REMOTE_DIR || '/home/lupin/code/pantheon' }}
          GCP_DEPLOY_PROJECT_ID: ${{ vars.GCP_DEPLOY_PROJECT_ID || 'pantheon-benjamin-20260528' }}
        run: |
          gcloud compute ssh "${REMOTE_USER}@${DEV_VM}" \
            --zone "${DEV_ZONE}" \
            --project "${GCP_DEPLOY_PROJECT_ID}" \
            --ssh-flag=-T \
            --command "OPENCLAW_GATEWAY_ADAPTER_URL=http://127.0.0.1:18104 bash -s" \
            < scripts/openclaw-assistant-openclaw-live-smoke.sh

      - name: Public BFF smoke
        env:
          DEV_BFF_URL: ${{ vars.DEV_BFF_URL || 'https://pantheon-lupin-dev-bff.35.201.239.38.sslip.io' }}
          DEV_BFF_CANONICAL_CORS_ORIGIN: ${{ vars.DEV_BFF_CANONICAL_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.239.38.sslip.io' }}
          DEV_BFF_CORS_ORIGIN: ${{ vars.DEV_BFF_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.239.38.sslip.io' }}
          STAGING_BFF_URL: ${{ vars.STAGING_BFF_URL || 'https://pantheon-lupin-staging-bff.104.155.223.192.sslip.io' }}
          # TODO(off-lovable): staging-live FE is migrating off Lovable to a self-hosted
          # sslip.io origin; replace this default once the staging FE URL is provisioned.
          STAGING_BFF_CORS_ORIGIN: ${{ vars.STAGING_BFF_CORS_ORIGIN || 'https://pantheon-ai-system-front-staging-live.lovable.app' }}
        run: |
          case "${TARGET_ENV}:${TARGET_COMPONENT}" in
            dev:* )
              curl -fsS "${DEV_BFF_URL}/health"
              dev_origins="${DEV_BFF_CANONICAL_CORS_ORIGIN}"
              if [[ -n "${DEV_BFF_CORS_ORIGIN}" && ",${dev_origins}," != *",${DEV_BFF_CORS_ORIGIN},"* ]]; then
                dev_origins="${dev_origins},${DEV_BFF_CORS_ORIGIN}"
              fi
              IFS=',' read -r -a dev_cors_origins <<< "${dev_origins}"
              for origin in "${dev_cors_origins[@]}"; do
                origin="${origin//[[:space:]]/}"
                [[ -z "${origin}" ]] && continue
                echo "Checking dev BFF CORS origin: ${origin}"
                curl -sS -D - -o /tmp/dev-cors-body \
                  -X OPTIONS "${DEV_BFF_URL}/health" \
                  -H "Origin: ${origin}" \
                  -H 'Access-Control-Request-Method: GET' \
                  | grep -qi "access-control-allow-origin: ${origin}"
              done
              ;;
            staging-live:auto|staging-live:control|staging-live:all )
              curl -fsS "${STAGING_BFF_URL}/health"
              curl -sS -D - -o /tmp/staging-cors-body \
                -X OPTIONS "${STAGING_BFF_URL}/health" \
                -H "Origin: ${STAGING_BFF_CORS_ORIGIN}" \
                -H 'Access-Control-Request-Method: GET' \
                | grep -qi "access-control-allow-origin: ${STAGING_BFF_CORS_ORIGIN}"
              ;;
            staging-live:exec )
              echo "Execution-only deploy has no public BFF smoke."
              ;;
          esac

      - name: Dev Agora workshop restart persistence smoke
        if: ${{ env.TARGET_ENV == 'dev' && (env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'root' || env.TARGET_COMPONENT == 'bff') }}
        env:
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-lupin-dev' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          DEV_BFF_URL: ${{ vars.DEV_BFF_URL || 'https://pantheon-lupin-dev-bff.35.201.239.38.sslip.io' }}
          DEV_BFF_CI_CLIENT_ID: ${{ secrets.DEV_BFF_CI_CLIENT_ID }}
          DEV_BFF_CI_CLIENT_SECRET: ${{ secrets.DEV_BFF_CI_CLIENT_SECRET }}
          GCP_DEPLOY_PROJECT_ID: ${{ vars.GCP_DEPLOY_PROJECT_ID || 'pantheon-benjamin-20260528' }}
        run: |
          set -euo pipefail
          if [[ -z "${DEV_BFF_CI_CLIENT_ID}" || -z "${DEV_BFF_CI_CLIENT_SECRET}" ]]; then
            echo "::error::Agora restart smoke is BLOCKED: least-role CI dev-login secrets are not provisioned."
            echo "- Agora restart smoke: **BLOCKED** (DEV_BFF_CI_CLIENT_ID/SECRET not provisioned)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          login_request="$(mktemp)"
          login_response="$(mktemp)"
          trap 'rm -f "${login_request}" "${login_response}"' EXIT
          chmod 0600 "${login_request}" "${login_response}"
          jq -n \
            '{grant_type:"client_credentials", client_id:$ENV.DEV_BFF_CI_CLIENT_ID, client_secret:$ENV.DEV_BFF_CI_CLIENT_SECRET}' \
            > "${login_request}"
          export -n DEV_BFF_CI_CLIENT_SECRET
          DEV_BFF_CI_CLIENT_SECRET=""
          curl -fsS -X POST "${DEV_BFF_URL}/bff/auth/dev-login" \
            -H 'Content-Type: application/json' \
            --data @"${login_request}" \
            > "${login_response}"
          token_type="$(jq -er '.token_type | select(type == "string")' "${login_response}")"
          [[ "${token_type,,}" == "bearer" ]] || { echo "::error::Dev login returned a non-bearer token type."; exit 1; }
          bff_auth_token="$(jq -er '.access_token | select(type == "string")' "${login_response}")"
          if (( ${#bff_auth_token} < 32 || ${#bff_auth_token} > 8192 )) \
            || [[ ! "${bff_auth_token}" =~ ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Dev login returned a malformed compact JWT."
            exit 1
          fi
          auth_header="$(mktemp)"
          chmod 0600 "${auth_header}"
          printf 'Authorization: Bearer %s\n' "${bff_auth_token}" > "${auth_header}"
          trap 'rm -f "${login_request}" "${login_response}" "${auth_header}"' EXIT

          ci_identity="$(mktemp)"
          chmod 0600 "${ci_identity}"
          trap 'rm -f "${login_request}" "${login_response}" "${auth_header}" "${ci_identity}"' EXIT
          curl -fsS "${DEV_BFF_URL}/bff/me" -H "@${auth_header}" > "${ci_identity}"
          jq -e '
            .data.currentUser.id == "pantheon-dev-ci-agora"
            and ((.data.roles // []) | sort == ["operator"])
            and ((.data.capabilities // []) | all(startswith("assistant.kernel.") | not))
            and .data.tenant.id == "tenant-dev"
            and .data.tenant.allowed_ids == ["tenant-dev"]
          ' "${ci_identity}" >/dev/null || {
            echo "::error::CI dev-login profile is not the expected distinct least-role, single-tenant identity."
            exit 1
          }

          idem="agora-restart-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          workshop_id="$(
            curl -fsS -X POST "${DEV_BFF_URL}/bff/agora/workshops" \
              -H "@${auth_header}" \
              -H "Idempotency-Key: ${idem}" \
              -H 'Content-Type: application/json' \
              --data '{"initial_message":"Versioned dev restart-persistence smoke"}' \
              | jq -er '.data.workshop_id'
          )"
          if [[ ! "${workshop_id}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo "::error::Agora smoke returned an invalid workshop id."
            exit 1
          fi
          gcloud compute ssh "${REMOTE_USER}@${DEV_VM}" \
            --zone "${DEV_ZONE}" \
            --project "${GCP_DEPLOY_PROJECT_ID}" \
            --ssh-flag=-T \
            --command "docker inspect pantheon-operator-bff-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^AGORA_WORKSHOP_STORE_BACKEND=postgres$' && docker logs pantheon-operator-bff-1 2>&1 | grep -q 'Agora workshop store initialized backend=postgres' && cd /home/lupin/code/pantheon && docker compose -p pantheon -f docker-compose.yml restart operator-bff"
          for attempt in $(seq 1 30); do
            if curl -fsS "${DEV_BFF_URL}/readyz" >/dev/null; then break; fi
            sleep 2
          done
          test "$(curl -fsS "${DEV_BFF_URL}/bff/agora/workshops/${workshop_id}" -H "@${auth_header}" | jq -er '.data.workshop_id')" = "${workshop_id}"
          echo "Workshop ${workshop_id} survived operator-bff restart." >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize auto-deploy
        if: github.event_name == 'push'
        run: |
          {
            echo "## Auto dev redeploy"
            echo "- Trigger: push on \`${{ github.ref_name }}\`"
            echo "- Deployed ref: \`${{ steps.sha.outputs.sha }}\`"
            echo "- Target: \`${TARGET_ENV}/${TARGET_COMPONENT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

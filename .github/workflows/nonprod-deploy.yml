              python3 "${GITHUB_WORKSPACE}/.target/scripts/wait_for_bff_lifecycle_readiness.py" \
                --url "${DEV_BFF_URL}/readyz" \
                --expected-deployment-sha "${PANTHEON_DEPLOY_SHA}" \
                --initial-timeout-seconds 120 \
                --recovery-extension-seconds 120 \
                --stalled-timeout-seconds 45 \
                --poll-interval-seconds 2 \
                --request-timeout-seconds 2 \
                --exact-evidence-max-age-seconds 30
              "${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/dev_vm_ssh.sh" exec \
                "set -euo pipefail; cd ${remote_dir_q}; docker compose -p pantheon -f docker-compose.yml exec -T operator-bff python /workspace/scripts/agora_workshop_restart_persistence_smoke.py verify --workshop-id ${workshop_id_q} --tenant-id ${tenant_id_q} --user-id ${user_id_q}"
              echo "Workshop ${workshop_id} and proposal proposal-${workshop_id} survived operator-bff restart with exactly-once replay and pending outbox recovery." >> "$GITHUB_STEP_SUMMARY"
            '

      - name: Compensate dev deployment failure to exact hosted baseline
        id: deploy_compensation
        if: ${{ always() && steps.lease.outcome == 'success' && steps.artifact_baseline.outcome == 'success' && (cancelled() || steps.heartbeat.outcome != 'success' || steps.deploy.outcome != 'success' || steps.artifact_baseline_upload.outcome != 'success' || steps.artifact_candidate_seal.outcome != 'success' || steps.artifact_candidate_upload.outcome != 'success' || (env.PAPER_BOOTSTRAP_REQUESTED == 'true' && steps.paper_bootstrap.outcome != 'success') || steps.public_smoke.outcome != 'success' || steps.deploy-posture-evidence.outcome != 'success' || ((env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'root' || env.TARGET_COMPONENT == 'bff') && steps.agora.outcome != 'success')) }}

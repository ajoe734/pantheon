name: Pantheon Nonprod Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Non-prod environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - staging-live
      component:
        description: "Stack slice to deploy; auto maps to dev/root or staging/all"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - root
          - bff
          - control
          - exec
          - all
      ref:
        description: "Commit SHA, branch, or tag to deploy. Leave blank for the workflow ref."
        required: false
        default: ""
        type: string
      allow_dirty:
        description: "Emergency only: allow dirty remote checkout"
        required: false
        default: false
        type: boolean
      allow_example_env:
        description: "Rehearsal only: allow staging to use env/*.env.example"
        required: false
        default: false
        type: boolean
      dev_auth_profile:
        description: "Dev only: strict by default; permissive-stub is for bounded governed proof runs"
        required: false
        default: strict
        type: choice
        options:
          - strict
          - permissive-stub
      run_evolution_dispatch_probe:
        description: "Dev root only: run and upload the EVOLOOP-001 hosted dispatch probe"
        required: false
        default: false
        type: boolean
  push:
    branches:
      # publish/v* push  → auto-redeploy DEV VM with the publish snapshot.
      - "publish/v*"
      # master push      → auto-redeploy STAGING-LIVE VMs with master HEAD.
      #                    Triggered after promote PR / hotfix PR merges.
      - "master"

permissions:
  contents: read
  id-token: write

concurrency:
  # dev (publish push) and staging-live (master push) run in independent
  # groups so they do not cancel each other. Within each group, newer
  # pushes cancel older runs (latest source-of-truth wins).
  group: pantheon-nonprod-deploy-${{ github.event_name == 'push' && (startsWith(github.ref_name, 'publish/') && 'dev-auto' || 'staging-auto') || inputs.environment }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  deploy-manual:
    name: Nonprod deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && (startsWith(github.ref_name, 'publish/') && 'dev' || 'staging-live') || inputs.environment }}
    env:
      # Trigger → env mapping:
      #   workflow_dispatch       → operator inputs
      #   push on publish/v*      → dev / auto / pushed publish branch
      #   push on master          → staging-live / auto / master HEAD
      TARGET_ENV: ${{ github.event_name == 'push' && (startsWith(github.ref_name, 'publish/') && 'dev' || 'staging-live') || inputs.environment }}
      TARGET_COMPONENT: ${{ github.event_name == 'push' && 'auto' || inputs.component }}
      TARGET_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.ref || github.sha }}
      ALLOW_DIRTY: ${{ github.event_name == 'push' && 'false' || inputs.allow_dirty }}
      ALLOW_EXAMPLE_ENV: ${{ github.event_name == 'push' && 'false' || inputs.allow_example_env }}
      DEV_AUTH_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.dev_auth_profile || 'strict' }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          submodules: recursive

      - name: Resolve commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate target and compose contract
        run: |
          case "${TARGET_ENV}:${TARGET_COMPONENT}" in
            dev:auto|dev:root|dev:bff)
              docker compose -f docker-compose.yml config --quiet
              ;;
            staging-live:auto|staging-live:control|staging-live:exec|staging-live:all)
              bash scripts/validate_split_topology.sh
              ;;
            *)
              echo "Invalid deployment target: ${TARGET_ENV}/${TARGET_COMPONENT}" >&2
              exit 1
              ;;
          esac

          if [[ "${TARGET_ENV}" != "dev" && "${DEV_AUTH_PROFILE}" != "strict" ]]; then
            echo "Auth profile ${DEV_AUTH_PROFILE} is valid only for dev deployments." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy requested VM stack
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-lupin-dev' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          DEV_REMOTE_DIR: ${{ vars.DEV_REMOTE_DIR || '/home/lupin/code/pantheon' }}
          DEV_BFF_CANONICAL_CORS_ORIGIN: ${{ vars.DEV_BFF_CANONICAL_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.239.38.sslip.io' }}
          DEV_BFF_CORS_ORIGINS: ${{ vars.DEV_BFF_CORS_ORIGINS || vars.DEV_BFF_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.239.38.sslip.io' }}
          # Governed verifier/dev-login credentials for the strict auth cutover.
          # Must be provisioned as repo/environment secrets by a human; deploy_nonprod_vm.sh
          # refuses to deploy dev with DEV_BFF_AUTH_MODE=strict if these are empty.
          DEV_BFF_JWT_SECRET: ${{ secrets.DEV_BFF_JWT_SECRET }}
          DEV_BFF_OIDC_CLIENT_ID: ${{ secrets.DEV_BFF_OIDC_CLIENT_ID }}
          DEV_BFF_OIDC_CLIENT_SECRET: ${{ secrets.DEV_BFF_OIDC_CLIENT_SECRET }}
          DEV_MANAGEMENT_AI_STORE_BACKEND: ${{ vars.DEV_MANAGEMENT_AI_STORE_BACKEND || 'postgres' }}
          DEV_MANAGEMENT_AI_STORE_SCHEMA: ${{ vars.DEV_MANAGEMENT_AI_STORE_SCHEMA || 'management_ai' }}
          DEV_MANAGEMENT_AI_DB_USER: ${{ vars.DEV_MANAGEMENT_AI_DB_USER || 'pantheon_management_ai' }}
          DEV_MANAGEMENT_AI_DB_PASSWORD: ${{ secrets.DEV_MANAGEMENT_AI_DB_PASSWORD }}
          DEV_MANAGEMENT_AI_DATABASE_URL: ${{ secrets.DEV_MANAGEMENT_AI_DATABASE_URL }}
          DEV_MANAGEMENT_AI_ATTACH_BUCKET: ${{ vars.DEV_MANAGEMENT_AI_ATTACH_BUCKET }}
          DEV_MANAGEMENT_AI_ATTACH_LOCATION: ${{ vars.DEV_MANAGEMENT_AI_ATTACH_LOCATION || 'asia-east1' }}
          STAGING_CONTROL_VM: ${{ vars.STAGING_CONTROL_VM || 'pantheon-lupin-staging-control' }}
          STAGING_CONTROL_ZONE: ${{ vars.STAGING_CONTROL_ZONE || 'asia-east1-b' }}
          STAGING_CONTROL_REMOTE_DIR: ${{ vars.STAGING_CONTROL_REMOTE_DIR || '/home/lupin/code/pantheon' }}
          STAGING_EXEC_VM: ${{ vars.STAGING_EXEC_VM || 'pantheon-lupin-staging-exec' }}
          STAGING_EXEC_ZONE: ${{ vars.STAGING_EXEC_ZONE || 'asia-east1-b' }}
          STAGING_EXEC_REMOTE_DIR: ${{ vars.STAGING_EXEC_REMOTE_DIR || '/home/lupin/code/pantheon' }}
          STAGING_EXEC_HEALTH_URL: ${{ vars.STAGING_EXEC_HEALTH_URL || 'http://10.50.0.21:28081' }}
        run: |
          case "${DEV_AUTH_PROFILE}" in
            strict)
              export DEV_BFF_AUTH_STUB=false
              export DEV_BFF_AUTH_MODE=strict
              ;;
            permissive-stub)
              if [[ "${TARGET_ENV}" != "dev" ]]; then
                echo "Auth profile permissive-stub is valid only for dev deployments." >&2
                exit 1
              fi
              export DEV_BFF_AUTH_STUB=true
              export DEV_BFF_AUTH_MODE=permissive
              ;;
            *)
              echo "Unknown dev auth profile: ${DEV_AUTH_PROFILE}" >&2
              exit 1
              ;;
          esac

          echo "Dev BFF auth profile: ${DEV_AUTH_PROFILE} (stub=${DEV_BFF_AUTH_STUB}, mode=${DEV_BFF_AUTH_MODE})"

          args=(
            --environment "${TARGET_ENV}"
            --component "${TARGET_COMPONENT}"
            --sha "${{ steps.sha.outputs.sha }}"
            --project-id "${{ vars.GCP_DEPLOY_PROJECT_ID || 'pantheon-benjamin-20260528' }}"
          )

          if [[ "${ALLOW_DIRTY}" == "true" ]]; then
            args+=(--allow-dirty)
          fi

          if [[ "${ALLOW_EXAMPLE_ENV}" == "true" ]]; then
            args+=(--allow-example-env)
          fi

          bash scripts/deploy_nonprod_vm.sh "${args[@]}"

      - name: Dev evolution dispatch hosted probe
        id: evolution-dispatch-probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_evolution_dispatch_probe && env.TARGET_ENV == 'dev' && env.TARGET_COMPONENT == 'root' }}
        env:
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-lupin-dev' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          DEV_DEPLOY_WORKTREE: ${{ vars.DEV_DEPLOY_WORKTREE || '/home/lupin/pantheon-ci-deploy/dev-root' }}
          GCP_DEPLOY_PROJECT_ID: ${{ vars.GCP_DEPLOY_PROJECT_ID || 'pantheon-benjamin-20260528' }}
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          evidence_name="evoloop-001-hosted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          remote_evidence="/tmp/${evidence_name}"
          local_evidence="/tmp/${evidence_name}"
          prefix="evoloop-001-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf -v worktree_q '%q' "${DEV_DEPLOY_WORKTREE}"
          printf -v deploy_sha_q '%q' "${DEPLOY_SHA}"
          printf -v remote_evidence_q '%q' "${remote_evidence}"
          printf -v prefix_q '%q' "${prefix}"
          printf -v requested_ref_q '%q' "${TARGET_REF}"
          printf -v run_id_q '%q' "${GITHUB_RUN_ID}"
          printf -v run_attempt_q '%q' "${GITHUB_RUN_ATTEMPT}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf -v run_url_q '%q' "${run_url}"
          gcloud compute ssh "${REMOTE_USER}@${DEV_VM}" \
            --zone "${DEV_ZONE}" \
            --project "${GCP_DEPLOY_PROJECT_ID}" \
            --ssh-flag=-T \
            --command "set -euo pipefail; cd ${worktree_q}; python3 -m services.evolution.hosted_compose_probe --expected-sha ${deploy_sha_q} --requested-ref ${requested_ref_q} --deploy-run-id ${run_id_q} --deploy-run-attempt ${run_attempt_q} --deploy-run-url ${run_url_q} --prefix ${prefix_q} --output ${remote_evidence_q}"
          gcloud compute scp \
            --zone "${DEV_ZONE}" \
            --project "${GCP_DEPLOY_PROJECT_ID}" \
            "${REMOTE_USER}@${DEV_VM}:${remote_evidence}" \
            "${local_evidence}"
          echo "artifact_path=${local_evidence}" >> "$GITHUB_OUTPUT"
          echo "Hosted evolution dispatch evidence: ${evidence_name}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evolution dispatch hosted evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_evolution_dispatch_probe && env.TARGET_ENV == 'dev' && env.TARGET_COMPONENT == 'root' }}
        uses: actions/upload-artifact@v4
        with:
          name: evoloop-001-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evolution-dispatch-probe.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Dev OpenClaw assistant live smoke
        if: ${{ env.TARGET_ENV == 'dev' && (env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'root') }}
        env:
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-lupin-dev' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          DEV_REMOTE_DIR: ${{ vars.DEV_REMOTE_DIR || '/home/lupin/code/pantheon' }}
          GCP_DEPLOY_PROJECT_ID: ${{ vars.GCP_DEPLOY_PROJECT_ID || 'pantheon-benjamin-20260528' }}
        run: |
          gcloud compute ssh "${REMOTE_USER}@${DEV_VM}" \
            --zone "${DEV_ZONE}" \
            --project "${GCP_DEPLOY_PROJECT_ID}" \
            --ssh-flag=-T \
            --command "OPENCLAW_GATEWAY_ADAPTER_URL=http://127.0.0.1:18104 bash -s" \
            < scripts/openclaw-assistant-openclaw-live-smoke.sh

      - name: Public BFF smoke
        env:
          DEV_BFF_URL: ${{ vars.DEV_BFF_URL || 'https://pantheon-lupin-dev-bff.35.201.239.38.sslip.io' }}
          DEV_BFF_CANONICAL_CORS_ORIGIN: ${{ vars.DEV_BFF_CANONICAL_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.239.38.sslip.io' }}
          DEV_BFF_CORS_ORIGIN: ${{ vars.DEV_BFF_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.239.38.sslip.io' }}
          STAGING_BFF_URL: ${{ vars.STAGING_BFF_URL || 'https://pantheon-lupin-staging-bff.104.155.223.192.sslip.io' }}
          # TODO(off-lovable): staging-live FE is migrating off Lovable to a self-hosted
          # sslip.io origin; replace this default once the staging FE URL is provisioned.
          STAGING_BFF_CORS_ORIGIN: ${{ vars.STAGING_BFF_CORS_ORIGIN || 'https://pantheon-ai-system-front-staging-live.lovable.app' }}
        run: |
          case "${TARGET_ENV}:${TARGET_COMPONENT}" in
            dev:* )
              curl -fsS "${DEV_BFF_URL}/health"
              dev_origins="${DEV_BFF_CANONICAL_CORS_ORIGIN}"
              if [[ -n "${DEV_BFF_CORS_ORIGIN}" && ",${dev_origins}," != *",${DEV_BFF_CORS_ORIGIN},"* ]]; then
                dev_origins="${dev_origins},${DEV_BFF_CORS_ORIGIN}"
              fi
              IFS=',' read -r -a dev_cors_origins <<< "${dev_origins}"
              for origin in "${dev_cors_origins[@]}"; do
                origin="${origin//[[:space:]]/}"
                [[ -z "${origin}" ]] && continue
                echo "Checking dev BFF CORS origin: ${origin}"
                curl -sS -D - -o /tmp/dev-cors-body \
                  -X OPTIONS "${DEV_BFF_URL}/health" \
                  -H "Origin: ${origin}" \
                  -H 'Access-Control-Request-Method: GET' \
                  | grep -qi "access-control-allow-origin: ${origin}"
              done
              ;;
            staging-live:auto|staging-live:control|staging-live:all )
              curl -fsS "${STAGING_BFF_URL}/health"
              curl -sS -D - -o /tmp/staging-cors-body \
                -X OPTIONS "${STAGING_BFF_URL}/health" \
                -H "Origin: ${STAGING_BFF_CORS_ORIGIN}" \
                -H 'Access-Control-Request-Method: GET' \
                | grep -qi "access-control-allow-origin: ${STAGING_BFF_CORS_ORIGIN}"
              ;;
            staging-live:exec )
              echo "Execution-only deploy has no public BFF smoke."
              ;;
          esac

      - name: Dev Agora governance restart persistence smoke
        if: ${{ env.TARGET_ENV == 'dev' && (env.TARGET_COMPONENT == 'auto' || env.TARGET_COMPONENT == 'root' || env.TARGET_COMPONENT == 'bff') }}
        env:
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-lupin-dev' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          DEV_REMOTE_DIR: ${{ vars.DEV_REMOTE_DIR || '/home/lupin/code/pantheon' }}
          DEV_BFF_URL: ${{ vars.DEV_BFF_URL || 'https://pantheon-lupin-dev-bff.35.201.239.38.sslip.io' }}
          GCP_DEPLOY_PROJECT_ID: ${{ vars.GCP_DEPLOY_PROJECT_ID || 'pantheon-benjamin-20260528' }}
        run: |
          set -euo pipefail
          workshop_id="deploy-restart-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tenant_id="pantheon-dev"
          user_id="pantheon-dev-browser"
          printf -v remote_dir_q '%q' "${DEV_REMOTE_DIR}"
          printf -v workshop_id_q '%q' "${workshop_id}"
          printf -v tenant_id_q '%q' "${tenant_id}"
          printf -v user_id_q '%q' "${user_id}"
          gcloud compute ssh "${REMOTE_USER}@${DEV_VM}" \
            --zone "${DEV_ZONE}" \
            --project "${GCP_DEPLOY_PROJECT_ID}" \
            --ssh-flag=-T \
            --command "set -euo pipefail; docker inspect pantheon-operator-bff-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -F -x 'AGORA_WORKSHOP_STORE_BACKEND=postgres' >/dev/null; docker inspect pantheon-operator-bff-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -F -x 'AGORA_GOVERNANCE_STORE_BACKEND=postgres' >/dev/null; docker inspect pantheon-operator-bff-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -F -x 'AGORA_DATASET_STORE_BACKEND=postgres' >/dev/null; docker logs pantheon-operator-bff-1 2>&1 | grep -F 'Agora workshop store initialized backend=postgres' >/dev/null; docker logs pantheon-operator-bff-1 2>&1 | grep -F 'Agora governance store initialized backend=postgres' >/dev/null; docker logs pantheon-operator-bff-1 2>&1 | grep -F 'Agora dataset store initialized backend=postgres' >/dev/null; cd ${remote_dir_q}; docker compose -p pantheon -f docker-compose.yml exec -T operator-bff python /workspace/scripts/agora_workshop_restart_persistence_smoke.py seed --workshop-id ${workshop_id_q} --tenant-id ${tenant_id_q} --user-id ${user_id_q}; docker compose -p pantheon -f docker-compose.yml restart operator-bff"
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS "${DEV_BFF_URL}/readyz" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "${ready}" = true
          gcloud compute ssh "${REMOTE_USER}@${DEV_VM}" \
            --zone "${DEV_ZONE}" \
            --project "${GCP_DEPLOY_PROJECT_ID}" \
            --ssh-flag=-T \
            --command "set -euo pipefail; cd ${remote_dir_q}; docker compose -p pantheon -f docker-compose.yml exec -T operator-bff python /workspace/scripts/agora_workshop_restart_persistence_smoke.py verify --workshop-id ${workshop_id_q} --tenant-id ${tenant_id_q} --user-id ${user_id_q}"
          echo "Workshop ${workshop_id} and proposal proposal-${workshop_id} survived operator-bff restart with exactly-once replay and pending outbox recovery." >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize auto-deploy
        if: github.event_name == 'push'
        run: |
          {
            echo "## Auto dev redeploy"
            echo "- Trigger: push on \`${{ github.ref_name }}\`"
            echo "- Deployed ref: \`${{ steps.sha.outputs.sha }}\`"
            echo "- Target: \`${TARGET_ENV}/${TARGET_COMPONENT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

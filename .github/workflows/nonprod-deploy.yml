name: Pantheon Nonprod Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Non-prod environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - staging-live
      component:
        description: "Stack slice to deploy; auto maps to dev/root or staging/all"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - root
          - bff
          - control
          - exec
          - all
      ref:
        description: "Commit SHA, branch, or tag to deploy. Leave blank for the workflow ref."
        required: false
        default: ""
        type: string
      allow_dirty:
        description: "Emergency only: allow dirty remote checkout"
        required: false
        default: false
        type: boolean
      allow_example_env:
        description: "Rehearsal only: allow staging to use env/*.env.example"
        required: false
        default: false
        type: boolean
      dev_auth_profile:
        description: "Dev only: strict by default; permissive-stub is for bounded governed proof runs"
        required: false
        default: strict
        type: choice
        options:
          - strict
          - permissive-stub
      run_evolution_dispatch_probe:
        description: "Dev root only: run and upload the EVOLOOP-001 hosted dispatch probe"
        required: false
        default: false
        type: boolean
      run_loop_prod_tel_002_probe:
        description: "Dev root only: prove a natural canonical paper lifecycle against committed telemetry"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - "publish/v*"
      - "master"

permissions:
  contents: read
  id-token: write

concurrency:
  group: pantheon-nonprod-deploy-${{ github.event_name == 'push' && (startsWith(github.ref_name, 'publish/') && 'dev-auto' || 'staging-auto') || inputs.environment }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  deploy-dev:
    name: Deploy dev under shared environment lease
    if: ${{ (github.event_name == 'push' && startsWith(github.ref_name, 'publish/')) || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      TARGET_ENV: dev
      TARGET_COMPONENT: ${{ github.event_name == 'push' && 'auto' || inputs.component }}
      TARGET_REF: ${{ github.event_name == 'push' && github.sha || inputs.ref || github.sha }}
      ALLOW_DIRTY: ${{ github.event_name == 'push' && 'false' || inputs.allow_dirty }}
      DEV_AUTH_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.dev_auth_profile || 'strict' }}
    steps:
      # This checkout is the immutable trust root for every lease operation.
      # It is intentionally separate from the requested deployment payload.
      - name: Checkout pinned lease controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ajoe734/pantheon
          ref: ddf4d0d5d33a848b3c86e3be2f6713e2ad9c0524
          path: .lease-controller
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout requested payload
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_REF }}
          path: .target
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Resolve and validate dev payload
        id: target
        working-directory: .target
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          RUN_LOOP_PROD_TEL_002_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_loop_prod_tel_002_probe || false }}
        run: |
          sha="$(git rev-parse HEAD)"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]
          trusted_ref="$(git rev-parse refs/remotes/origin/dev)"
          [[ "${trusted_ref}" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "${sha}" "${trusted_ref}" || {
            echo "Dev payload ${sha} is not contained in protected origin/dev" >&2
            exit 1
          }
          case "${TARGET_COMPONENT}" in
            auto|root|bff) ;;
            *) echo "Invalid dev deployment component: ${TARGET_COMPONENT}" >&2; exit 1 ;;
          esac
          docker compose -f docker-compose.yml config --quiet
          if [[ "${RUN_LOOP_PROD_TEL_002_PROBE}" == "true" && ( "${TARGET_COMPONENT}" != "root" || "${DEV_AUTH_PROFILE}" != "strict" ) ]]; then
            echo "LOOP-PROD-TEL-002 hosted proof requires dev/root with strict auth." >&2
            exit 1
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Enforce dev auth deployment floor
        working-directory: .target
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          DEV_BFF_JWT_SECRET: ${{ secrets.DEV_BFF_JWT_SECRET }}
          DEV_BFF_OIDC_CLIENT_ID: ${{ secrets.DEV_BFF_OIDC_CLIENT_ID }}
          DEV_BFF_OIDC_CLIENT_SECRET: ${{ secrets.DEV_BFF_OIDC_CLIENT_SECRET }}
        run: |
          case "${DEV_AUTH_PROFILE}" in
            strict)
              if [[ -z "${DEV_BFF_JWT_SECRET}" || -z "${DEV_BFF_OIDC_CLIENT_ID}" || -z "${DEV_BFF_OIDC_CLIENT_SECRET}" ]]; then
                echo "::error::Dev BFF deploy credentials are not provisioned; refusing to run any target ref before strict auth can be verified."
                exit 1
              fi

              deploy_script="scripts/deploy_nonprod_vm.sh"
              required_markers=(
                'DEV_BFF_AUTH_STUB="${DEV_BFF_AUTH_STUB:-false}"'
                'DEV_BFF_AUTH_MODE="${DEV_BFF_AUTH_MODE:-strict}"'
                'no governed verifier/dev-login credentials'
                'assert_bff_auth_gate'
              )
              for marker in "${required_markers[@]}"; do
                if ! grep -Fq -- "${marker}" "${deploy_script}"; then
                  echo "::error::Requested ref lacks the dev strict-auth deployment contract: ${marker}"
                  exit 1
                fi
              done
              ;;
            permissive-stub)
              echo "::notice::Explicit bounded permissive-stub profile selected; strict credential/ref floor is not applied."
              ;;
            *)
              echo "::error::Unknown dev auth profile: ${DEV_AUTH_PROFILE}"
              exit 1
              ;;
          esac

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Prepare fixed trusted command path
        id: runtime
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          trusted_bin="${RUNNER_TEMP}/pantheon-trusted-bin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "${trusted_bin}"
          gcloud_path="$(command -v gcloud)"
          [[ -x "${gcloud_path}" && ! -L "${gcloud_path}" ]]
          ln -s "${gcloud_path}" "${trusted_bin}/gcloud"
          safe_path="${trusted_bin}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          echo "safe_path=${safe_path}" >> "${GITHUB_OUTPUT}"

      - name: Acquire shared dev environment lease
        id: lease
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: "0"
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          unset BASH_ENV ENV PYTHONPATH PYTHONHOME CDPATH
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ "$(git -C "${controller}" rev-parse HEAD)" == "ddf4d0d5d33a848b3c86e3be2f6713e2ad9c0524" ]]
          [[ -f "${controller}/scripts/dev_environment_lease.py" && ! -L "${controller}/scripts/dev_environment_lease.py" ]]
          [[ -f "${controller}/scripts/run_with_dev_environment_lease.sh" && ! -L "${controller}/scripts/run_with_dev_environment_lease.sh" ]]
          printf '%s  %s\n' \
            52276793f99162fc7ca307a1370addd8d99478208ebf7beb67eab23b97b83048 "${controller}/scripts/dev_environment_lease.py" \
            f3995a2baedc2ff47178a0de8ad1952096df4de508d5a47c8e0042a151ab7ea8 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict

          lease_dir="$(mktemp -d "${RUNNER_TEMP}/pantheon-dev-lease-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          chmod 0700 "${lease_dir}"
          state_file="${lease_dir}/state.json"
          acquisition_file="${lease_dir}/acquisition.json"
          pid_file="${lease_dir}/heartbeat.pid"
          identity_file="${lease_dir}/heartbeat-identity.json"
          failure_file="${lease_dir}/heartbeat-failure.json"
          shutdown_file="${lease_dir}/heartbeat-stop.json"
          heartbeat_log="${lease_dir}/heartbeat.log"

          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            python3 "${controller}/scripts/dev_environment_lease.py" acquire \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --mode deployment \
            --owner "pantheon:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --ttl-seconds 300 \
            --wait-seconds 7200 \
            --poll-seconds 5 \
            --state-file "${state_file}" \
            --expected-backend-sha "${TARGET_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --json-out "${acquisition_file}"
          lease_token=""

          lease_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["leaseId"])' "${state_file}")"
          [[ "${lease_id}" =~ ^[0-9a-f-]{36}$ ]]
          {
            echo "lease_id=${lease_id}"
            echo "state_file=${state_file}"
            echo "pid_file=${pid_file}"
            echo "identity_file=${identity_file}"
            echo "failure_file=${failure_file}"
            echo "shutdown_file=${shutdown_file}"
            echo "heartbeat_log=${heartbeat_log}"
          } >> "${GITHUB_OUTPUT}"

      - name: Start identity-bound lease heartbeat
        id: heartbeat
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: "0"
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          LEASE_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          LEASE_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          LEASE_SHUTDOWN_FILE: ${{ steps.lease.outputs.shutdown_file }}
          LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.heartbeat_log }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          unset BASH_ENV ENV PYTHONPATH PYTHONHOME CDPATH
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ -f "${controller}/scripts/dev_environment_lease.py" && ! -L "${controller}/scripts/dev_environment_lease.py" ]]
          printf '%s  %s\n' \
            52276793f99162fc7ca307a1370addd8d99478208ebf7beb67eab23b97b83048 "${controller}/scripts/dev_environment_lease.py" \
            f3995a2baedc2ff47178a0de8ad1952096df4de508d5a47c8e0042a151ab7ea8 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict
          exec {token_fd}<<<"${lease_token}"
          env -i \
            PATH="${PATH}" HOME="${HOME}" LANG=C.UTF-8 \
            PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 PYTHONSTARTUP= PYTHONINSPECT=0 \
            python3 "${controller}/scripts/dev_environment_lease.py" heartbeat-loop \
              --repository ajoe734/execute-plans \
              --branch environment-coordination \
              --path .pantheon/environment-leases/pantheon-dev-environment.json \
              --resource pantheon-dev-environment \
              --state-file "${LEASE_STATE_FILE}" \
              --ttl-seconds 300 \
              --interval-seconds 60 \
              --failure-json-out "${LEASE_FAILURE_FILE}" \
              --shutdown-json-out "${LEASE_SHUTDOWN_FILE}" \
              --identity-json-out "${LEASE_IDENTITY_FILE}" \
              --token-stdin \
              <&"${token_fd}" >"${LEASE_HEARTBEAT_LOG}" 2>&1 &
          heartbeat_pid=$!
          exec {token_fd}<&-
          printf '%s\n' "${heartbeat_pid}" > "${LEASE_PID_FILE}"

          for _ in $(seq 1 100); do
            [[ -s "${LEASE_IDENTITY_FILE}" ]] && break
            kill -0 "${heartbeat_pid}" 2>/dev/null || {
              sed -n '1,200p' "${LEASE_HEARTBEAT_LOG}" >&2 || true
              exit 75
            }
            sleep 0.1
          done
          [[ -s "${LEASE_IDENTITY_FILE}" ]]
          python3 "${controller}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
            --identity-file "${LEASE_IDENTITY_FILE}" \
            --pid "${heartbeat_pid}" \
            --expected-cli "${controller}/scripts/dev_environment_lease.py" \
            --state-file "${LEASE_STATE_FILE}" >/dev/null
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            python3 "${controller}/scripts/dev_environment_lease.py" verify \
              --repository ajoe734/execute-plans \
              --branch environment-coordination \
              --path .pantheon/environment-leases/pantheon-dev-environment.json \
              --resource pantheon-dev-environment \
              --state-file "${LEASE_STATE_FILE}" \
              --max-heartbeat-age-seconds 120 \
              --initial-visibility-wait-seconds 15 \
              --initial-visibility-poll-seconds 1 >/dev/null
          lease_token=""

      - name: Deploy dev VM stack under lease
        id: deploy
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: "0"
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.heartbeat_log }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_MAX_HEARTBEAT_AGE_SECONDS: "120"
          PANTHEON_DEV_ENVIRONMENT_LEASE_VERIFY_INTERVAL_SECONDS: "30"
          GITHUB_TOKEN: ${{ github.token }}
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-lupin-dev' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          DEV_REMOTE_DIR: ${{ vars.DEV_REMOTE_DIR || '/home/lupin/code/pantheon' }}
          DEV_BFF_CANONICAL_CORS_ORIGIN: ${{ vars.DEV_BFF_CANONICAL_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.239.38.sslip.io' }}
          DEV_BFF_CORS_ORIGINS: ${{ vars.DEV_BFF_CORS_ORIGINS || vars.DEV_BFF_CORS_ORIGIN || 'https://pantheon-lupin-dev-fe.35.201.239.38.sslip.io' }}
          # Governed verifier/dev-login credentials for the strict auth cutover.
          # Must be provisioned as repo/environment secrets by a human; deploy_nonprod_vm.sh
          # refuses to deploy dev with DEV_BFF_AUTH_MODE=strict if these are empty.
          DEV_BFF_JWT_SECRET: ${{ secrets.DEV_BFF_JWT_SECRET }}
          DEV_BFF_OIDC_CLIENT_ID: ${{ secrets.DEV_BFF_OIDC_CLIENT_ID }}
          DEV_BFF_OIDC_CLIENT_SECRET: ${{ secrets.DEV_BFF_OIDC_CLIENT_SECRET }}
          # Human-provisioned BFF-to-adapter credential. The deploy preflight
          # rejects an empty value while service auth is required.
          DEV_OPENCLAW_ADAPTER_SERVICE_TOKEN: ${{ secrets.DEV_OPENCLAW_ADAPTER_SERVICE_TOKEN }}
          DEV_OPENCLAW_ADAPTER_SERVICE_AUTH_REQUIRED: ${{ vars.DEV_OPENCLAW_ADAPTER_SERVICE_AUTH_REQUIRED || 'true' }}
          DEV_MANAGEMENT_AI_STORE_BACKEND: ${{ vars.DEV_MANAGEMENT_AI_STORE_BACKEND || 'postgres' }}
          DEV_MANAGEMENT_AI_STORE_SCHEMA: ${{ vars.DEV_MANAGEMENT_AI_STORE_SCHEMA || 'management_ai' }}
          DEV_MANAGEMENT_AI_DB_USER: ${{ vars.DEV_MANAGEMENT_AI_DB_USER || 'pantheon_management_ai' }}
          DEV_MANAGEMENT_AI_DB_PASSWORD: ${{ secrets.DEV_MANAGEMENT_AI_DB_PASSWORD }}
          DEV_MANAGEMENT_AI_DATABASE_URL: ${{ secrets.DEV_MANAGEMENT_AI_DATABASE_URL }}
          DEV_MANAGEMENT_AI_ATTACH_BUCKET: ${{ vars.DEV_MANAGEMENT_AI_ATTACH_BUCKET }}
          DEV_MANAGEMENT_AI_ATTACH_LOCATION: ${{ vars.DEV_MANAGEMENT_AI_ATTACH_LOCATION || 'asia-east1' }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ -f "${controller}/scripts/run_with_dev_environment_lease.sh" && ! -L "${controller}/scripts/run_with_dev_environment_lease.sh" ]]
          printf '%s  %s\n' \
            52276793f99162fc7ca307a1370addd8d99478208ebf7beb67eab23b97b83048 "${controller}/scripts/dev_environment_lease.py" \
            f3995a2baedc2ff47178a0de8ad1952096df4de508d5a47c8e0042a151ab7ea8 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict
          case "${DEV_AUTH_PROFILE}" in
            strict)
              export DEV_BFF_AUTH_STUB=false
              export DEV_BFF_AUTH_MODE=strict
              ;;
            permissive-stub)
              export DEV_BFF_AUTH_STUB=true
              export DEV_BFF_AUTH_MODE=permissive
              ;;
            *)
              echo "Unknown dev auth profile: ${DEV_AUTH_PROFILE}" >&2
              exit 1
              ;;
          esac
          echo "Dev BFF auth profile: ${DEV_AUTH_PROFILE} (stub=${DEV_BFF_AUTH_STUB}, mode=${DEV_BFF_AUTH_MODE})"
          args=(
            bash "${GITHUB_WORKSPACE}/.target/scripts/deploy_nonprod_vm.sh"
            --environment dev
            --component "${TARGET_COMPONENT}"
            --sha "${TARGET_SHA}"
            --project-id "${{ vars.GCP_DEPLOY_PROJECT_ID || 'pantheon-benjamin-20260528' }}"
          )
          [[ "${ALLOW_DIRTY}" == "true" ]] && args+=(--allow-dirty)
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            exec "${GITHUB_WORKSPACE}/.lease-controller/scripts/run_with_dev_environment_lease.sh" "${args[@]}"

      - name: Dev evolution dispatch hosted probe
        id: evolution-dispatch-probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_evolution_dispatch_probe && env.TARGET_COMPONENT == 'root' }}
        env:
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER || 'lupin' }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-lupin-dev' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          DEV_DEPLOY_WORKTREE: ${{ vars.DEV_DEPLOY_WORKTREE || '/home/lupin/pantheon-ci-deploy/dev-root' }}
          GCP_DEPLOY_PROJECT_ID: ${{ vars.GCP_DEPLOY_PROJECT_ID || 'pantheon-benjamin-20260528' }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          evidence_name="evoloop-001-hosted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          remote_evidence="/tmp/${evidence_name}"
          local_evidence="/tmp/${evidence_name}"
          prefix="evoloop-001-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf -v worktree_q '%q' "${DEV_DEPLOY_WORKTREE}"
          printf -v deploy_sha_q '%q' "${DEPLOY_SHA}"
          printf -v remote_evidence_q '%q' "${remote_evidence}"
          printf -v prefix_q '%q' "${prefix}"
          printf -v requested_ref_q '%q' "${TARGET_REF}"
          printf -v run_id_q '%q' "${GITHUB_RUN_ID}"
          printf -v run_attempt_q '%q' "${GITHUB_RUN_ATTEMPT}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf -v run_url_q '%q' "${run_url}"
          gcloud compute ssh "${REMOTE_USER}@${DEV_VM}" \
            --zone "${DEV_ZONE}" \
            --project "${GCP_DEPLOY_PROJECT_ID}" \
            --ssh-flag=-T \
            --command "set -euo pipefail; cd ${worktree_q}; python3 -m services.evolution.hosted_compose_probe --expected-sha ${deploy_sha_q} --requested-ref ${requested_ref_q} --deploy-run-id ${run_id_q} --deploy-run-attempt ${run_attempt_q} --deploy-run-url ${run_url_q} --prefix ${prefix_q} --output ${remote_evidence_q}"
          gcloud compute scp \
            --zone "${DEV_ZONE}" \
            --project "${GCP_DEPLOY_PROJECT_ID}" \
            "${REMOTE_USER}@${DEV_VM}:${remote_evidence}" \
            "${local_evidence}"
          echo "artifact_path=${local_evidence}" >> "$GITHUB_OUTPUT"
          echo "Hosted evolution dispatch evidence: ${evidence_name}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evolution dispatch hosted evidence

              ;;
            *)
              echo "Unknown dev auth profile: ${DEV_AUTH_PROFILE}" >&2
              exit 1
              ;;
          esac
          artifact_env="${RUNNER_TEMP}/pantheon-dev-artifacts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/rollback.env"
          python3 "${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/dev_artifact_compensation_evidence.py" \
            prepare --provenance runner-local --output-env "${artifact_env}"
          # This file is generated only from validated fixed-schema nonsecret
          # values; the downloaded manifest itself is never executed.
          source "${artifact_env}"
          # Equal source SHAs do not prove equal images. Always enter a fresh
          # guard to restore admitted artifacts or verify an unchanged baseline.
          {
            rollback_lease_dir="$(mktemp -d "${RUNNER_TEMP}/pantheon-dev-rollback-lease-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
            chmod 0700 "${rollback_lease_dir}"
            rollback_state_file="${rollback_lease_dir}/state.json"
            rollback_acquisition_file="${rollback_lease_dir}/acquisition.json"
            rollback_pid_file="${rollback_lease_dir}/heartbeat.pid"
            rollback_identity_file="${rollback_lease_dir}/heartbeat-identity.json"
            rollback_failure_file="${rollback_lease_dir}/heartbeat-failure.json"
            rollback_shutdown_file="${rollback_lease_dir}/heartbeat-stop.json"
            rollback_heartbeat_log="${rollback_lease_dir}/heartbeat.log"
            rollback_heartbeat_pid=""
            rollback_deploy_succeeded=false

            rollback_heartbeat_stopped() {
              local state
              [[ -n "${rollback_heartbeat_pid}" ]] || return 0
              state="$(ps -o stat= -p "${rollback_heartbeat_pid}" 2>/dev/null | tr -d '[:space:]')"
              case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
              return 1
            }

            stop_rollback_heartbeat() {
              rollback_heartbeat_stopped && return 0
              python3 "${controller}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
                --identity-file "${rollback_identity_file}" \
                --pid "${rollback_heartbeat_pid}" \
                --expected-cli "${controller}/scripts/dev_environment_lease.py" \
                --state-file "${rollback_state_file}" >/dev/null || return 1
              kill -TERM "${rollback_heartbeat_pid}" 2>/dev/null || {
                rollback_heartbeat_stopped && return 0
                return 1
              }
              kill -CONT "${rollback_heartbeat_pid}" 2>/dev/null || true
              for _ in $(seq 1 40); do
                rollback_heartbeat_stopped && return 0
                sleep 0.25
              done
              return 1
            }

            cleanup_rollback_lease() {
              local status=$?
              trap - EXIT INT TERM
              if [[ -n "${rollback_heartbeat_pid}" ]]; then
                if ! stop_rollback_heartbeat; then
                  echo "[dev-deploy-compensation] rollback heartbeat identity could not be stopped safely" >&2
                  status=75
                fi
              fi
              if [[ "${rollback_deploy_succeeded}" == "true" ]]; then
                [[ ! -e "${rollback_failure_file}" ]] || status=75
                [[ -s "${rollback_shutdown_file}" ]] || status=75
                if [[ "${status}" -eq 0 ]]; then
                  PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
                    python3 "${controller}/scripts/dev_environment_lease.py" verify \
                      --repository ajoe734/execute-plans \
                      --branch environment-coordination \
                      --path .pantheon/environment-leases/pantheon-dev-environment.json \
                      --resource pantheon-dev-environment \
                      --state-file "${rollback_state_file}" \
                      --max-heartbeat-age-seconds 120 >/dev/null || status=75
                fi
                if [[ "${status}" -eq 0 ]]; then
                  PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
                    python3 "${controller}/scripts/dev_environment_lease.py" release \
                      --repository ajoe734/execute-plans \
                      --branch environment-coordination \
                      --path .pantheon/environment-leases/pantheon-dev-environment.json \
                      --resource pantheon-dev-environment \
                      --state-file "${rollback_state_file}" >/dev/null || status=75
                fi
              else
                echo "[dev-deploy-compensation] rollback incomplete; lease remains quarantined until TTL" >&2
              fi
              exit "${status}"
            }

            trap cleanup_rollback_lease EXIT INT TERM

            stop_predecessor_heartbeat() {
              local pid_file="${PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE:-}"
              local identity_file="${PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE:-}"
              local state_file="${PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE:-}"
              [[ -n "${pid_file}" && -s "${pid_file}" ]] || return 0
              local pred_pid
              pred_pid="$(tr -d '[:space:]' < "${pid_file}")"
              [[ "${pred_pid}" =~ ^[1-9][0-9]*$ ]] || return 0

              kill -0 "${pred_pid}" 2>/dev/null || return 0

              local state
              state="$(ps -o stat= -p "${pred_pid}" 2>/dev/null | tr -d '[:space:]' || true)"
              case "${state}" in ""|Z*|X*|x*) return 0 ;; esac

              echo "[dev-deploy-compensation] Stopping active predecessor heartbeat (pid=${pred_pid}) before rollback lease acquisition..."
              if [[ -z "${identity_file}" || ! -f "${identity_file}" || -z "${state_file}" || ! -f "${state_file}" ]]; then
                echo "[dev-deploy-compensation] Missing identity/state files for active predecessor heartbeat (pid=${pred_pid})" >&2
                return 1
              fi

              if ! python3 "${controller}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
                --identity-file "${identity_file}" \
                --pid "${pred_pid}" \
                --expected-cli "${controller}/scripts/dev_environment_lease.py" \
                --state-file "${state_file}" >/dev/null; then
                echo "[dev-deploy-compensation] Predecessor heartbeat identity verification failed for pid=${pred_pid}" >&2
                return 1
              fi

              kill -TERM "${pred_pid}" 2>/dev/null || {
                kill -0 "${pred_pid}" 2>/dev/null || return 0
                state="$(ps -o stat= -p "${pred_pid}" 2>/dev/null | tr -d '[:space:]' || true)"
                case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
                return 1
              }
              kill -CONT "${pred_pid}" 2>/dev/null || true
              for _ in $(seq 1 40); do
                kill -0 "${pred_pid}" 2>/dev/null || return 0
                state="$(ps -o stat= -p "${pred_pid}" 2>/dev/null | tr -d '[:space:]' || true)"
                case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
                sleep 0.25
              done

              if ! python3 "${controller}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
                --identity-file "${identity_file}" \
                --pid "${pred_pid}" \
                --expected-cli "${controller}/scripts/dev_environment_lease.py" \
                --state-file "${state_file}" >/dev/null; then
                echo "[dev-deploy-compensation] Predecessor heartbeat identity verification failed before SIGKILL escalation for pid=${pred_pid}" >&2
                return 1
              fi

              kill -KILL "${pred_pid}" 2>/dev/null || {
                kill -0 "${pred_pid}" 2>/dev/null || return 0
                state="$(ps -o stat= -p "${pred_pid}" 2>/dev/null | tr -d '[:space:]' || true)"
                case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
                return 1
              }
              for _ in $(seq 1 20); do
                kill -0 "${pred_pid}" 2>/dev/null || return 0
                state="$(ps -o stat= -p "${pred_pid}" 2>/dev/null | tr -d '[:space:]' || true)"
                case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
                sleep 0.25
              done

              if kill -0 "${pred_pid}" 2>/dev/null; then
                state="$(ps -o stat= -p "${pred_pid}" 2>/dev/null | tr -d '[:space:]' || true)"
                case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
                echo "[dev-deploy-compensation] Predecessor heartbeat process (pid=${pred_pid}) remains alive after SIGKILL" >&2
                return 1
              fi
              return 0
            }

            if ! stop_predecessor_heartbeat; then
              echo "[dev-deploy-compensation] Failed to stop predecessor heartbeat cleanly; failing closed" >&2
              exit 75
            fi

            PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
              python3 "${controller}/scripts/dev_environment_lease.py" acquire \
                --repository ajoe734/execute-plans \
                --branch environment-coordination \
                --path .pantheon/environment-leases/pantheon-dev-environment.json \
                --resource pantheon-dev-environment \
                --mode deployment \
                --owner "pantheon:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:rollback" \
                --ttl-seconds 300 \
                --wait-seconds 1800 \
                --poll-seconds 5 \
                --state-file "${rollback_state_file}" \
                --expected-backend-sha "${PANTHEON_ROLLBACK_BACKEND_SHA}" \
                --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                --json-out "${rollback_acquisition_file}"

            exec {token_fd}<<<"${lease_token}"
            env -i \
              PATH="${PATH}" HOME="${HOME}" LANG=C.UTF-8 \
              PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 PYTHONSTARTUP= PYTHONINSPECT= \
              python3 "${controller}/scripts/dev_environment_lease.py" heartbeat-loop \
                --repository ajoe734/execute-plans \
                --branch environment-coordination \
                --path .pantheon/environment-leases/pantheon-dev-environment.json \
                --resource pantheon-dev-environment \
                --state-file "${rollback_state_file}" \
                --ttl-seconds 300 \
                --interval-seconds 60 \
                --failure-json-out "${rollback_failure_file}" \
                --shutdown-json-out "${rollback_shutdown_file}" \
                --identity-json-out "${rollback_identity_file}" \
                --token-stdin \
                <&"${token_fd}" >"${rollback_heartbeat_log}" 2>&1 &
            rollback_heartbeat_pid=$!
            disown "${rollback_heartbeat_pid}" 2>/dev/null || true
            exec {token_fd}<&-
            printf '%s\n' "${rollback_heartbeat_pid}" > "${rollback_pid_file}"

            for _ in $(seq 1 100); do
              [[ -s "${rollback_identity_file}" ]] && break
              kill -0 "${rollback_heartbeat_pid}" 2>/dev/null || {
                sed -n '1,200p' "${rollback_heartbeat_log}" >&2 || true
                exit 75
              }
              sleep 0.1
            done
            [[ -s "${rollback_identity_file}" ]]
            python3 "${controller}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
              --identity-file "${rollback_identity_file}" \
              --pid "${rollback_heartbeat_pid}" \
              --expected-cli "${controller}/scripts/dev_environment_lease.py" \
              --state-file "${rollback_state_file}" >/dev/null
            PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
              python3 "${controller}/scripts/dev_environment_lease.py" verify \
                --repository ajoe734/execute-plans \
                --branch environment-coordination \
                --path .pantheon/environment-leases/pantheon-dev-environment.json \
                --resource pantheon-dev-environment \
                --state-file "${rollback_state_file}" \
                --max-heartbeat-age-seconds 120 \
                --initial-visibility-wait-seconds 15 \
                --initial-visibility-poll-seconds 1 >/dev/null

            export TARGET_ENV=dev
            export PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE="${rollback_state_file}"
            export PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE="${rollback_pid_file}"
            export PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE="${rollback_identity_file}"
            export PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE="${rollback_failure_file}"
            export PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG="${rollback_heartbeat_log}"
            export PANTHEON_DEV_ENVIRONMENT_LEASE_MAX_HEARTBEAT_AGE_SECONDS=120
            export PANTHEON_DEV_ENVIRONMENT_LEASE_VERIFY_INTERVAL_SECONDS=30

            PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            PANTHEON_DEV_ROLLBACK_BACKEND_SHA="${PANTHEON_ROLLBACK_BACKEND_SHA}" \
              "${GITHUB_WORKSPACE}/.lease-controller/scripts/run_with_dev_environment_lease.sh" \
              bash "${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/deploy_nonprod_vm.sh" \
                --environment dev \
                --component bff \
                --sha "${PANTHEON_ROLLBACK_BACKEND_SHA}" \
                --rollback-sha "${PANTHEON_ROLLBACK_BACKEND_SHA}" \
                "--artifact-${PANTHEON_DEV_ARTIFACT_OPERATION}" \
                --artifact-readback-out "${EVIDENCE_DIR}/dev-compensation-artifact-readback.json" \
                --project-id "${GCP_DEPLOY_PROJECT_ID}" \
                --deadline-seconds "${DEV_DEPLOY_DEADLINE_SECONDS}"

            rollback_deploy_succeeded=true
          }
          actual_bff="$(curl --connect-timeout 10 --max-time 30 -fsS "${DEV_BFF_URL}/bff/version" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("source_commit_sha") or "")')"
          [[ "${actual_bff}" == "${PANTHEON_ROLLBACK_BACKEND_SHA}" ]]
          actual_fe="$(curl --connect-timeout 10 --max-time 30 -fsS "${DEV_FE_URL}/deployment.json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("frontendSha") or d.get("commit") or "")')"
          [[ "${actual_fe}" == "${PANTHEON_ROLLBACK_FRONTEND_SHA}" ]]
          echo "Artifact ${PANTHEON_DEV_ARTIFACT_OPERATION} proved exact prior images and FE bytes: BFF=${actual_bff} FE=${actual_fe}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload validated dev compensation artifact readback
        if: ${{ always() && steps.deploy_compensation.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pantheon-dev-artifact-compensation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.release_admission.outputs.evidence_dir }}/dev-compensation-artifact-readback.json
          if-no-files-found: error
          retention-days: 30

      - name: Retire this run's dev paper release case after deploy compensation
        id: retire_release_cases
        # Evidence-only: a retirement failure is recorded and never changes the
        # accepted/compensated outcome. Uses only the Deployment owner retire
        # action; on compensation only this run's case is retired.
        if: ${{ always() && env.PAPER_BOOTSTRAP_REQUESTED == 'true' && steps.deploy_compensation.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          DEV_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEV_DEPLOY_SSH_PRIVATE_KEY }}
          DEV_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEV_DEPLOY_SSH_KNOWN_HOSTS }}
          DEV_DEPLOY_SSH_HOST: ${{ vars.DEV_DEPLOY_SSH_HOST }}
          RETIRE_EVIDENCE_DIR: ${{ steps.release_admission.outputs.evidence_dir }}
          RELEASE_OUTCOME: compensated
        shell: /bin/bash --noprofile --norc -uo pipefail {0}
        run: |
          evidence="${RETIRE_EVIDENCE_DIR}/dev-paper-release-case-retire.json"
          mkdir -p "${RETIRE_EVIDENCE_DIR}"
          fail_evidence() {
            printf '{"schema_version":"pantheon.dev-paper-release-case-retire.v2","status":"error","run_id":"%s","error":"%s"}\n' \
              "${GITHUB_RUN_ID}" "$1" > "${evidence}"
            echo "[retire-release-cases] $1 (recorded; release outcome unchanged)" >&2
            exit 0
          }
          credentials_dir="${RUNNER_TEMP}/pantheon-dev-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          transport="${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/dev_vm_ssh.sh"
          script="${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/retire_dev_paper_release_cases.py"
          [[ -f "${script}" && ! -L "${script}" && -f "${transport}" && ! -L "${transport}" ]] \
            || fail_evidence "retirement script or transport missing"
          [[ -f "${credentials_dir}/deploy_key" && -f "${credentials_dir}/known_hosts" ]] \
            || fail_evidence "ssh transport credentials missing"
          export DEV_DEPLOY_SSH_KEY_FILE="${credentials_dir}/deploy_key"
          export DEV_DEPLOY_SSH_KNOWN_HOSTS_FILE="${credentials_dir}/known_hosts"
          case_key="dev-paper-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The script travels on stdin so a compensated (older) container
          # image does not need to contain it.
          timeout --kill-after=10 240 "${transport}" exec \
            "docker exec -i pantheon-operator-bff-1 python - --outcome ${RELEASE_OUTCOME} --new-case-key ${case_key} --run-id ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} --timeout-seconds 180" \
            < "${script}" > "${evidence}.tmp" || true
          if python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "${evidence}.tmp" 2>/dev/null; then
            mv -f "${evidence}.tmp" "${evidence}"
          else
            rm -f "${evidence}.tmp"
            fail_evidence "retirement produced no parseable evidence"
          fi
          echo "- dev paper release case retirement: \`$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status"))' "${evidence}")\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload dev paper release case retirement evidence
        if: ${{ always() && steps.retire_release_cases.conclusion != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pantheon-dev-paper-release-case-retire-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.release_admission.outputs.evidence_dir }}/dev-paper-release-case-retire.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop heartbeat and release only after complete success
        id: lease_cleanup
        if: ${{ always() && steps.lease.outcome == 'success' }}
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: ""
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          LEASE_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          LEASE_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          LEASE_SHUTDOWN_FILE: ${{ steps.lease.outputs.shutdown_file }}
          LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.heartbeat_log }}
          HEARTBEAT_OUTCOME: ${{ steps.heartbeat.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          PAPER_BOOTSTRAP_OUTCOME: ${{ steps.paper_bootstrap.outcome }}
          PAPER_BOOTSTRAP_REQUESTED: ${{ env.PAPER_BOOTSTRAP_REQUESTED }}
          PUBLIC_SMOKE_OUTCOME: ${{ steps.public_smoke.outcome }}
          DEPLOY_POSTURE_EVIDENCE_OUTCOME: ${{ steps.deploy-posture-evidence.outcome }}
          AGORA_OUTCOME: ${{ steps.agora.outcome }}
          ARTIFACTS_VERIFIED: ${{ job.status != 'cancelled' && steps.artifact_baseline.outcome == 'success' && steps.artifact_baseline_upload.outcome == 'success' && steps.artifact_candidate_seal.outcome == 'success' && steps.artifact_candidate_upload.outcome == 'success' }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          unset BASH_ENV ENV PYTHONPATH PYTHONHOME CDPATH
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ -f "${controller}/scripts/dev_environment_lease.py" && ! -L "${controller}/scripts/dev_environment_lease.py" ]]
          printf '%s  %s\n' \
            da9a728ed8cec8e1133b92171e4038f9dc51ef4888911acd02c7e399e54d95ae "${controller}/scripts/dev_environment_lease.py" \
            6c82021b93621f16776d5d67a9e20cb9d690f7ebfa257ebf8c329f7d158fb2c2 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict

          heartbeat_stopped() {
            local state
            state="$(ps -o stat= -p "${heartbeat_pid}" 2>/dev/null | tr -d '[:space:]')"
            case "${state}" in ""|Z*|X*|x*) return 0 ;; esac
            return 1
          }
          verify_identity() {
            python3 "${controller}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
              --identity-file "${LEASE_IDENTITY_FILE}" \
              --pid "${heartbeat_pid}" \
              --expected-cli "${controller}/scripts/dev_environment_lease.py" \
              --state-file "${LEASE_STATE_FILE}" >/dev/null
          }
          stop_heartbeat() {
            local attempt
            heartbeat_stopped && return 0
            verify_identity || return 1
            kill -TERM "${heartbeat_pid}" 2>/dev/null || {
              heartbeat_stopped && return 0
              return 1
            }
            heartbeat_stopped && return 0
            verify_identity || { heartbeat_stopped && return 0; return 1; }
            kill -CONT "${heartbeat_pid}" 2>/dev/null || true
            for attempt in $(seq 1 40); do
              heartbeat_stopped && return 0
              sleep 0.25
            done
            verify_identity || { heartbeat_stopped && return 0; return 1; }
            kill -KILL "${heartbeat_pid}" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              heartbeat_stopped && return 0
              sleep 0.25
            done
            return 1
          }

          complete_success=false
          # An unrequested paper bootstrap is intentionally skipped; a
          # requested one must have succeeded.
          expected_paper=skipped
          [[ "${PAPER_BOOTSTRAP_REQUESTED}" == "true" ]] && expected_paper=success
          case "${TARGET_COMPONENT}" in
            auto|root|bff)
              [[ "${HEARTBEAT_OUTCOME}:${DEPLOY_OUTCOME}:${PAPER_BOOTSTRAP_OUTCOME}:${PUBLIC_SMOKE_OUTCOME}:${DEPLOY_POSTURE_EVIDENCE_OUTCOME}:${AGORA_OUTCOME}" == "success:success:${expected_paper}:success:success:success" ]] && complete_success=true
              ;;
          esac

          [[ "${ARTIFACTS_VERIFIED}" == "true" ]] || complete_success=false

          if [[ ! -s "${LEASE_PID_FILE}" ]]; then
            echo "Lease heartbeat never became identity-bound; quarantining until TTL." >&2
            exit 0
          fi
          heartbeat_pid="$(tr -d '[:space:]' < "${LEASE_PID_FILE}")"
          [[ "${heartbeat_pid}" =~ ^[1-9][0-9]*$ ]] || {
            echo "Invalid heartbeat PID; quarantining until TTL." >&2
            exit 0
          }
          stop_heartbeat || {
            echo "Could not identity-safely stop heartbeat; refusing release." >&2
            exit 75
          }

          if [[ "${complete_success}" != "true" || -e "${LEASE_FAILURE_FILE}" ]]; then
            echo "Protected dev sequence was incomplete; lease quarantined until TTL." >&2
            sed -n '1,200p' "${LEASE_FAILURE_FILE}" >&2 2>/dev/null || true
            exit 0
          fi
          [[ -s "${LEASE_SHUTDOWN_FILE}" ]] || {
            echo "Heartbeat did not record a graceful identity-bound stop; refusing release." >&2
            exit 75
          }
          python3 - "${LEASE_SHUTDOWN_FILE}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          if payload.get("status") != "stopped" or payload.get("resource") != "pantheon-dev-environment":
              raise SystemExit("heartbeat shutdown evidence is invalid")
          PY
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            python3 "${controller}/scripts/dev_environment_lease.py" verify \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --state-file "${LEASE_STATE_FILE}" \
            --max-heartbeat-age-seconds 120 >/dev/null
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            python3 "${controller}/scripts/dev_environment_lease.py" release \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --state-file "${LEASE_STATE_FILE}"
          lease_token=""
          echo "complete_success=true" >> "${GITHUB_OUTPUT}"

      - name: Summarize dev deployment
        if: ${{ success() }}
        run: |
          {
            echo "## Dev backend candidate"
            echo "- Payload: \`${{ steps.target.outputs.sha }}\`"
            echo "- Frontend candidate: \`${{ steps.frontend.outputs.sha }}\`"
            echo "- Release candidate: \`${{ steps.release_admission.outputs.release_candidate_id }}\`"
            echo "- Compatibility manifest: \`${{ steps.release_admission.outputs.compatibility_manifest_sha256 }}\`"
            echo "- Admission artifact digest: \`${{ steps.release_admission_upload.outputs.artifact-digest }}\`"
            echo "- Rollback BFF baseline: \`${{ steps.rollback_baseline.outputs.sha }}\`"
            echo "- Rollback FE baseline: \`${{ steps.rollback_baseline.outputs.frontend_sha }}\`"
            echo "- Lease: \`${{ steps.lease.outputs.lease_id }}\`"
            echo "- Controller: \`aee1243573e29d289dac00be13641bb16be7f6bf\`"
            echo "- Target: \`dev/${TARGET_COMPONENT}\`"
            echo "- Deploy deadline: \`${{ vars.DEV_DEPLOY_DEADLINE_SECONDS || '7200' }}s\`"
            echo "- PPL-ALLOC-009 dev proof enabled: \`${PPL_ALLOC_009_DEV_PROOF_ENABLED}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  coordinate-dev-release:
    name: Admit and switch exact FE/BFF release
    needs:
      - deploy-dev
    # Mandatory backend checks and lease cleanup precede admission.
    # Optional provider live acceptance remains separate from deployment.
    if: ${{ !cancelled() && needs.deploy-dev.outputs.bff_fe_pair_verified == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      backend_sha: ${{ needs.deploy-dev.outputs.backend_sha }}
      frontend_sha: ${{ needs.deploy-dev.outputs.frontend_sha }}
      frontend_ref: ${{ needs.deploy-dev.outputs.frontend_ref }}
      release_candidate_id: ${{ needs.deploy-dev.outputs.release_candidate_id }}
      pair_id: ${{ steps.frontend_release.outputs.pair_id }}
      candidate_id: ${{ steps.frontend_release.outputs.candidate_id || needs.deploy-dev.outputs.release_candidate_id }}
      profile: ${{ steps.frontend_release.outputs.profile }}
      source_mode: ${{ steps.frontend_release.outputs.source_mode }}
      expires_at: ${{ steps.frontend_release.outputs.expires_at }}
      evidence_dir: ${{ steps.frontend_release.outputs.evidence_dir }}
    env:
      TARGET_ENV: dev
      RELEASE_EVIDENCE_DIR: ${{ github.workspace }}/.pantheon-cross-repo-release-${{ github.run_id }}-${{ github.run_attempt }}
      DEV_BFF_URL: ${{ vars.DEV_BFF_URL || 'https://api.dev.mvl-cap.tw' }}
      DEV_FE_URL: ${{ vars.DEV_FE_URL || 'https://app.dev.mvl-cap.tw' }}
      FRONTEND_REF: ${{ needs.deploy-dev.outputs.frontend_ref }}
      DEV_DEPLOY_SSH_HOST: ${{ vars.DEV_DEPLOY_SSH_HOST }}
      DEV_DEPLOY_SSH_USER: ${{ vars.NONPROD_REMOTE_USER }}
    steps:
      - name: Checkout pinned lease controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ajoe734/pantheon
          ref: aee1243573e29d289dac00be13641bb16be7f6bf
          path: .lease-controller
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact release controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ajoe734/pantheon
          ref: ${{ needs.deploy-dev.outputs.backend_sha }}
          path: .target
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact same-run rollback artifacts before frontend switch
        id: artifact_download
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASELINE_ARTIFACT_ID: ${{ needs.deploy-dev.outputs.artifact_baseline_id }}
          BASELINE_ARTIFACT_SHA256: ${{ needs.deploy-dev.outputs.artifact_baseline_digest }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.deploy-dev.outputs.artifact_candidate_id }}
          CANDIDATE_ARTIFACT_SHA256: ${{ needs.deploy-dev.outputs.artifact_candidate_digest }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          install -d -m 0700 "${RELEASE_EVIDENCE_DIR}"
          python3 .target/scripts/fetch_dev_artifact_evidence.py \
            --kind baseline --artifact-id "${BASELINE_ARTIFACT_ID}" \
            --artifact-sha256 "${BASELINE_ARTIFACT_SHA256}" \
            --run-id "${GITHUB_RUN_ID}" --attempt "${GITHUB_RUN_ATTEMPT}" \
            --output-dir "${RELEASE_EVIDENCE_DIR}/baseline"
          python3 .target/scripts/fetch_dev_artifact_evidence.py \
            --kind candidate --artifact-id "${CANDIDATE_ARTIFACT_ID}" \
            --artifact-sha256 "${CANDIDATE_ARTIFACT_SHA256}" \
            --run-id "${GITHUB_RUN_ID}" --attempt "${GITHUB_RUN_ATTEMPT}" \
            --output-dir "${RELEASE_EVIDENCE_DIR}/candidate"

      - name: Dispatch exact frontend gate and switch
        id: frontend_release
        continue-on-error: true
        env:
          CROSS_REPO_RELEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          FRONTEND_PROFILE: ${{ inputs.frontend_profile || 'read-only' }}
          BACKEND_SHA: ${{ needs.deploy-dev.outputs.backend_sha }}
          FRONTEND_SHA: ${{ needs.deploy-dev.outputs.frontend_sha }}
          PREVIOUS_BACKEND_SHA: ${{ needs.deploy-dev.outputs.previous_backend_sha }}
          PREVIOUS_FRONTEND_SHA: ${{ needs.deploy-dev.outputs.previous_frontend_sha }}
          RELEASE_CANDIDATE_ID: ${{ needs.deploy-dev.outputs.release_candidate_id }}
          COMPATIBILITY_MANIFEST_SHA256: ${{ needs.deploy-dev.outputs.compatibility_manifest_sha256 }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          install -d -m 0700 "${RELEASE_EVIDENCE_DIR}"
          controller_log="${RELEASE_EVIDENCE_DIR}/release-controller.log"
          umask 077
          controller_evidence="${RELEASE_EVIDENCE_DIR}/release-controller-accepted.json"
          set +e
          python3 .target/scripts/cross_repo_release_controller.py \
            --frontend-sha "${FRONTEND_SHA}" \
            --frontend-ref "${FRONTEND_REF}" \
            --backend-sha "${BACKEND_SHA}" \
            --bff-base-url "${DEV_BFF_URL}" \
            --fe-base-url "${DEV_FE_URL}" \
            --predecessor-fe-sha "${PREVIOUS_FRONTEND_SHA}" \
            --predecessor-bff-sha "${PREVIOUS_BACKEND_SHA}" \
            --release-candidate-id "${RELEASE_CANDIDATE_ID}" \
            --compatibility-manifest-sha256 "${COMPATIBILITY_MANIFEST_SHA256}" \
            --controller-run-id "${GITHUB_RUN_ID}" \
            --evidence-out "${controller_evidence}" \
            --candidate-profile "${FRONTEND_PROFILE}" \
            --candidate-out "${RELEASE_EVIDENCE_DIR}/release-candidate.json" \
            >"${controller_log}" 2>&1
          controller_status=$?
          set -e
          if [[ "${controller_status}" -ne 0 ]]; then
            python3 - \
              "${RELEASE_EVIDENCE_DIR}/release-controller-rejected.json" \
              "${controller_status}" <<'PY'
          import json
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "schema_version": "pantheon.cross-repo-release-controller-evidence.v1",
                      "release_candidate_id": os.environ["RELEASE_CANDIDATE_ID"],
                      "compatibility_manifest_sha256": os.environ[
                          "COMPATIBILITY_MANIFEST_SHA256"
                      ],
                      "backend": {"commit": os.environ["BACKEND_SHA"]},
                      "frontend": {"commit": os.environ["FRONTEND_SHA"]},
                      "controller": {
                          "repository": os.environ["GITHUB_REPOSITORY"],
                          "workflow": "nonprod-deploy.yml",
                          "run_id": os.environ["GITHUB_RUN_ID"],
                      },
                      "outcome": "rejected",
                      "controller_exit_code": int(sys.argv[2]),
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          fi
          echo "evidence_dir=${RELEASE_EVIDENCE_DIR}" >> "${GITHUB_OUTPUT}"
          echo "controller_log=${controller_log}" >> "${GITHUB_OUTPUT}"
          exit "${controller_status}"

      - name: Verify and seal admitted final candidate
        id: final_artifact_verify
        if: ${{ steps.frontend_release.outcome == 'success' }}
        env:
          PANTHEON_RELEASE_REPO_ROOT: ${{ github.workspace }}/.target
          PANTHEON_ROLLBACK_BACKEND_SHA: ${{ needs.deploy-dev.outputs.previous_backend_sha }}
          PANTHEON_ROLLBACK_FRONTEND_SHA: ${{ needs.deploy-dev.outputs.previous_frontend_sha }}

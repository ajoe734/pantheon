          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: ""
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_LEASE_EXPECTED_BACKEND_SHA: ${{ steps.target.outputs.sha }}
          PANTHEON_DEV_BOOTSTRAP_PREDECESSOR: "true"
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.heartbeat_log }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_MAX_HEARTBEAT_AGE_SECONDS: "120"
          PANTHEON_DEV_ENVIRONMENT_LEASE_VERIFY_INTERVAL_SECONDS: "30"
          DEV_BFF_URL: ${{ vars.DEV_BFF_URL || 'https://api.dev.mvl-cap.tw' }}
          DEV_FE_URL: ${{ vars.DEV_FE_URL || 'https://app.dev.mvl-cap.tw' }}
          EVIDENCE_DIR: ${{ steps.release_admission.outputs.evidence_dir }}
          GITHUB_TOKEN: ${{ github.token }}
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER }}
          DEV_REMOTE_DIR: ${{ vars.DEV_REMOTE_DIR || '/home/chloe_ong_dev_cctech_support_com/pantheon' }}
          PANTHEON_DEPLOY_WORKTREE_ROOT: ${{ vars.DEV_DEPLOY_WORKTREE_ROOT }}
          DEV_AUTH_PROFILE: ${{ env.DEV_AUTH_PROFILE }}
          DEV_BFF_CANONICAL_CORS_ORIGIN: ${{ vars.DEV_BFF_CANONICAL_CORS_ORIGIN || 'https://app.dev.mvl-cap.tw' }}
          DEV_BFF_CORS_ORIGINS: ${{ vars.DEV_BFF_CORS_ORIGINS || vars.DEV_BFF_CORS_ORIGIN || 'https://app.dev.mvl-cap.tw' }}
          DEV_BFF_PUBLIC_HOST: ${{ vars.DEV_BFF_PUBLIC_HOST || 'api.dev.mvl-cap.tw' }}
          DEV_FE_PUBLIC_HOST: ${{ vars.DEV_FE_PUBLIC_HOST || 'app.dev.mvl-cap.tw' }}
          DEV_FE_STATIC_ROOT: ${{ vars.DEV_FE_STATIC_ROOT || '/var/www/pantheon-dev-fe' }}
          DEV_BFF_JWT_SECRET: ${{ secrets.DEV_BFF_JWT_SECRET }}
          DEV_PAPER_PRINCIPALS_AUTHORIZED: ${{ vars.DEV_PAPER_PRINCIPALS_AUTHORIZED || 'false' }}
          DEV_BFF_JWT_ISSUER: ${{ vars.DEV_BFF_JWT_ISSUER || 'pantheon-dev' }}
          DEV_BFF_JWT_AUDIENCE: ${{ vars.DEV_BFF_JWT_AUDIENCE || 'bff-operators' }}
          DEV_BFF_JWKS_URI: ${{ vars.DEV_BFF_JWKS_URI || 'https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com' }}
          DEV_BFF_OIDC_DISCOVERY_URL: ${{ vars.DEV_BFF_OIDC_DISCOVERY_URL }}
          DEV_BFF_OIDC_ISSUER: ${{ vars.DEV_BFF_OIDC_ISSUER || 'https://securetoken.google.com/pantheon-dev-20260902' }}
          DEV_BFF_OIDC_AUDIENCE: ${{ vars.DEV_BFF_OIDC_AUDIENCE || 'pantheon-dev-20260902' }}
          DEV_BFF_OIDC_CLIENT_ID: ${{ secrets.DEV_BFF_OIDC_CLIENT_ID }}
          DEV_BFF_OIDC_CLIENT_SECRET: ${{ secrets.DEV_BFF_OIDC_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_ID || 'pantheon-dev-viewer-v1' }}
          DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_ID || 'pantheon-dev-approver-v1' }}
          DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_ID || 'pantheon-dev-risk-owner-v1' }}
          DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_ID || 'pantheon-dev-operator-a-v1' }}
          DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_ID || 'pantheon-dev-operator-b-v1' }}
          DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_TEST_ADMIN_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_TEST_ADMIN_CLIENT_ID || 'pantheon-dev-admin-test' }}
          DEV_BFF_DEV_LOGIN_TEST_ADMIN_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_TEST_ADMIN_CLIENT_SECRET }}
          DEV_BFF_ROLE_CLAIMS: ${{ vars.DEV_BFF_ROLE_CLAIMS || 'roles,role' }}
          DEV_BFF_ROLE_MAP: ${{ vars.DEV_BFF_ROLE_MAP || 'pantheon-operator=operator;pantheon-viewer=viewer;pantheon-reviewer=reviewer;pantheon-approver=approver;pantheon-risk-owner=risk_owner;pantheon-admin=admin' }}
          DEV_BFF_ROLE_MAP_MODE: ${{ vars.DEV_BFF_ROLE_MAP_MODE || 'strict' }}
          DEV_BFF_DEFAULT_ROLE: ${{ vars.DEV_BFF_DEFAULT_ROLE || 'viewer' }}
          DEV_OPENCLAW_ADAPTER_SERVICE_TOKEN: ${{ secrets.DEV_OPENCLAW_ADAPTER_SERVICE_TOKEN }}
          DEV_OPENCLAW_ADAPTER_SERVICE_AUTH_REQUIRED: ${{ vars.DEV_OPENCLAW_ADAPTER_SERVICE_AUTH_REQUIRED || 'true' }}
          DEV_OPENCLAW_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.DEV_OPENCLAW_CLAUDE_CODE_OAUTH_TOKEN }}
          DEV_OPENCLAW_ANTHROPIC_API_KEY: ${{ secrets.DEV_OPENCLAW_ANTHROPIC_API_KEY }}
          DEV_OPENCLAW_ANTHROPIC_WORKSPACE_ID: ${{ vars.DEV_OPENCLAW_ANTHROPIC_WORKSPACE_ID }}
          BOOTSTRAP_PREDECESSOR_BACKEND_SHA: ${{ steps.rollback_baseline.outputs.sha }}
          BOOTSTRAP_PREDECESSOR_FRONTEND_SHA: ${{ steps.rollback_baseline.outputs.frontend_sha }}
          CROSS_REPO_RELEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-dev-deploy' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          GCP_DEPLOY_PROJECT_ID: ${{ vars.DEV_GCP_DEPLOY_PROJECT_ID || 'pantheon-dev-20260902' }}
          DEV_DEPLOY_DEADLINE_SECONDS: ${{ vars.DEV_DEPLOY_DEADLINE_SECONDS || '7200' }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          case "${DEV_AUTH_PROFILE}" in
            strict)
              export DEV_BFF_AUTH_STUB=false
              export DEV_BFF_AUTH_MODE=strict
              ;;
            permissive-stub)
              export DEV_BFF_AUTH_STUB=true
              export DEV_BFF_AUTH_MODE=permissive
              ;;
            *)
              echo "Unknown dev auth profile: ${DEV_AUTH_PROFILE}" >&2
              exit 1
              ;;
          esac
          # Require current DEV_* variables and fail closed if any is missing
          for var_name in DEV_VM DEV_ZONE GCP_DEPLOY_PROJECT_ID DEV_BFF_URL DEV_FE_URL DEV_DEPLOY_DEADLINE_SECONDS; do
            if [[ -z "${!var_name:-}" ]]; then
              echo "Required bootstrap variable ${var_name} is unset or empty; refusing to deploy." >&2
              exit 1
            fi
          done
          # 1. Deploy predecessor backend to empty host
          args=(
            bash "${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/deploy_nonprod_vm.sh"
            --environment dev
            --component bff
            --sha "${BOOTSTRAP_PREDECESSOR_BACKEND_SHA}"
            --project-id "${GCP_DEPLOY_PROJECT_ID}"
            --deadline-seconds "${DEV_DEPLOY_DEADLINE_SECONDS}"
          )
          [[ "${ALLOW_DIRTY}" == "true" ]] && args+=(--allow-dirty)
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            "${GITHUB_WORKSPACE}/.lease-controller/scripts/run_with_dev_environment_lease.sh" "${args[@]}"

          # The predecessor checkout predates the fail-closed /deployment.json
          # Caddy handler. Reapply the current accepted ingress template before
          # the frontend controller runs, otherwise its placeholder index.html
          # would turn the empty-host sentinel back into a misleading HTTP 200.
          caddy_template="${GITHUB_WORKSPACE}/.agora-gate-controller/deploy/caddy/dev.Caddyfile.tmpl"
          [[ -f "${caddy_template}" && ! -L "${caddy_template}" ]]
          rendered_caddy="$(mktemp)"
          trap 'rm -f "${rendered_caddy}"' EXIT
          sed \
            -e "s|__BFF_HOST__|${DEV_BFF_PUBLIC_HOST}|g" \
            -e "s|__FE_HOST__|${DEV_FE_PUBLIC_HOST}|g" \
            -e "s|__FE_ROOT__|${DEV_FE_STATIC_ROOT}|g" \
            "${caddy_template}" > "${rendered_caddy}"
          caddy_payload="$(base64 -w0 "${rendered_caddy}")"
          "${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/dev_vm_ssh.sh" exec \
            "printf '%s' '${caddy_payload}' | base64 -d | sudo -n install -o root -g root -m 0644 /dev/stdin /etc/caddy/Caddyfile && sudo -n caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null && sudo -n systemctl reload caddy"

          # 2. Deploy predecessor frontend in strict live read-only mode via release controller
          bootstrap_evidence="${EVIDENCE_DIR}/bootstrap-predecessor-controller.json"
          bootstrap_ledger="${EVIDENCE_DIR}/bootstrap-predecessor-candidate-ledger.json"
          read -r pred_candidate_id pred_manifest_sha < <(
            python3 - "${bootstrap_ledger}" <<'PY'
          import json, sys, pathlib
          ledger = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          candidate = ledger.get("release_candidate") or {}
          print(candidate["release_candidate_id"], candidate["compatibility_manifest"]["sha256"])
          PY
          )

          # The empty-host predecessor is normally the last published FE pair;
          # the controller requires its branch ref to resolve to the exact SHA.
          # When the requested predecessor FE is already the current protected
          # dev tip, use that protected ref so the bootstrap gate exercises the
          # same repaired gate code that will validate the successor pair. This
          # keeps the bootstrap read-only and exact while avoiding a drifted
          # historical release branch with stale fixture contracts.
          bootstrap_frontend_ref="publish/v2026.09.01.0"
          if [[ "${BOOTSTRAP_PREDECESSOR_FRONTEND_SHA}" == "${{ steps.frontend.outputs.sha }}" ]]; then
            bootstrap_frontend_ref="${FRONTEND_REF}"
          fi
          python3 .target/scripts/cross_repo_release_controller.py \
            --frontend-sha "${BOOTSTRAP_PREDECESSOR_FRONTEND_SHA}" \
            --frontend-ref "${bootstrap_frontend_ref}" \
            --backend-sha "${BOOTSTRAP_PREDECESSOR_BACKEND_SHA}" \
            --bff-base-url "${DEV_BFF_URL}" \
            --fe-base-url "${DEV_FE_URL}" \
            --release-candidate-id "${pred_candidate_id}" \
            --compatibility-manifest-sha256 "${pred_manifest_sha}" \
            --controller-run-id "${GITHUB_RUN_ID}" \
            --candidate-profile "read-only" \
            --evidence-out "${bootstrap_evidence}"

          # 3. Read back served identity from host and verify exact match
          readback_evidence="${EVIDENCE_DIR}/bootstrap-served-readback.json"
          python3 - "${DEV_BFF_URL}" "${DEV_FE_URL}" "${BOOTSTRAP_PREDECESSOR_BACKEND_SHA}" "${BOOTSTRAP_PREDECESSOR_FRONTEND_SHA}" "${readback_evidence}" <<'PY'
          import json
          import sys
          import urllib.request

          bff_url = sys.argv[1].rstrip("/") + "/bff/version"
          fe_url = sys.argv[2].rstrip("/") + "/deployment.json"
          expected_bff = sys.argv[3]
          expected_fe = sys.argv[4]
          evidence_out = sys.argv[5]

          req_bff = urllib.request.Request(bff_url, headers={"User-Agent": "pantheon-bootstrap-verifier"})
          with urllib.request.urlopen(req_bff, timeout=30) as resp:
              bff_data = json.loads(resp.read().decode("utf-8"))
          actual_bff = bff_data.get("source_commit_sha") or bff_data.get("commit") or ""
          if actual_bff != expected_bff:
              raise SystemExit(f"mismatched served identity: BFF served {actual_bff} != expected {expected_bff}")

          req_fe = urllib.request.Request(fe_url, headers={"User-Agent": "pantheon-bootstrap-verifier"})
          with urllib.request.urlopen(req_fe, timeout=30) as resp:
              fe_data = json.loads(resp.read().decode("utf-8"))
          actual_fe = fe_data.get("frontendSha") or fe_data.get("commit") or (fe_data.get("frontend") or {}).get("commitSha") or ""
          if actual_fe != expected_fe:
              raise SystemExit(f"mismatched served identity: FE served {actual_fe} != expected {expected_fe}")

          profile = fe_data.get("profile") or fe_data.get("deploymentProfile")
          if profile != "read-only":
              raise SystemExit(f"mismatched served identity: bootstrap FE profile must be read-only, got {profile!r}")

          import pathlib
          pathlib.Path(evidence_out).write_text(json.dumps({
              "schema_version": "pantheon.dev-release-bootstrap-readback.v1",
              "served_bff_sha": actual_bff,
              "served_frontend_sha": actual_fe,
              "profile": profile,
              "status": "verified",
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Capture actual prior artifacts under pinned dev lease
        id: artifact_baseline
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: ""
          CDPATH: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.heartbeat_log }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-dev-deploy' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          GCP_DEPLOY_PROJECT_ID: ${{ vars.DEV_GCP_DEPLOY_PROJECT_ID || 'pantheon-dev-20260902' }}
          DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_ID || 'pantheon-dev-viewer-v1' }}
          DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_SECRET }}
          PANTHEON_DEV_ARTIFACT_CANDIDATE_ID: ${{ steps.release_admission.outputs.release_candidate_id }}
          PANTHEON_DEV_ARTIFACT_RUN_ID: ${{ github.run_id }}
          PANTHEON_DEV_ARTIFACT_ATTEMPT: ${{ github.run_attempt }}
          PANTHEON_DEV_ARTIFACT_CONTROLLER_SHA: ${{ steps.target.outputs.sha }}
          PANTHEON_DEV_ARTIFACT_CANDIDATE_BACKEND_SHA: ${{ steps.target.outputs.sha }}
          PANTHEON_DEV_ARTIFACT_CANDIDATE_FRONTEND_SHA: ${{ steps.frontend.outputs.sha }}
          PANTHEON_DEV_ARTIFACT_PREVIOUS_BACKEND_SHA: ${{ steps.rollback_baseline.outputs.sha }}
          PANTHEON_DEV_ARTIFACT_PREVIOUS_FRONTEND_SHA: ${{ steps.rollback_baseline.outputs.frontend_sha }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          printf '%s  %s\n' \
            da9a728ed8cec8e1133b92171e4038f9dc51ef4888911acd02c7e399e54d95ae "${controller}/scripts/dev_environment_lease.py" \
            6c82021b93621f16776d5d67a9e20cb9d690f7ebfa257ebf8c329f7d158fb2c2 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict
          exec "${controller}/scripts/run_with_dev_environment_lease.sh" \
            python3 "${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/capture_dev_artifact_baseline.py" \
            --evidence-dir "${RUNNER_TEMP}/pantheon-dev-artifacts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/baseline"

      - name: Upload sealed prior artifact metadata before candidate mutation
        id: artifact_baseline_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pantheon-dev-artifact-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.artifact_baseline.outputs.evidence_dir }}/artifact-baseline.json
            ${{ steps.artifact_baseline.outputs.evidence_dir }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Deploy dev VM stack under lease
        id: deploy
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: ""
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.heartbeat_log }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_MAX_HEARTBEAT_AGE_SECONDS: "120"
          PANTHEON_DEV_ENVIRONMENT_LEASE_VERIFY_INTERVAL_SECONDS: "30"
          GITHUB_TOKEN: ${{ github.token }}
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-dev-deploy' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          DEV_REMOTE_DIR: ${{ vars.DEV_REMOTE_DIR }}
          PANTHEON_DEPLOY_WORKTREE_ROOT: ${{ vars.DEV_DEPLOY_WORKTREE_ROOT }}
          DEV_LIFECYCLE_PROJECTOR_HEALTH_MAX_AGE_SECONDS: ${{ vars.DEV_LIFECYCLE_PROJECTOR_HEALTH_MAX_AGE_SECONDS || '300' }}
          DEV_BFF_CANONICAL_CORS_ORIGIN: ${{ vars.DEV_BFF_CANONICAL_CORS_ORIGIN || 'https://app.dev.mvl-cap.tw' }}
          DEV_BFF_CORS_ORIGINS: ${{ vars.DEV_BFF_CORS_ORIGINS || vars.DEV_BFF_CORS_ORIGIN || 'https://app.dev.mvl-cap.tw' }}
          # Governed verifier/dev-login credentials for the strict auth cutover.
          # Must be provisioned as repo/environment secrets by a human; deploy_nonprod_vm.sh
          # refuses to deploy dev with DEV_BFF_AUTH_MODE=strict if these are empty.
          DEV_BFF_JWT_SECRET: ${{ secrets.DEV_BFF_JWT_SECRET }}
          DEV_PAPER_PRINCIPALS_AUTHORIZED: ${{ vars.DEV_PAPER_PRINCIPALS_AUTHORIZED || 'false' }}
          DEV_BFF_JWT_ISSUER: ${{ vars.DEV_BFF_JWT_ISSUER || 'pantheon-dev' }}
          DEV_BFF_JWT_AUDIENCE: ${{ vars.DEV_BFF_JWT_AUDIENCE || 'bff-operators' }}
          # External browser IdP verification uses only public identity
          # metadata here. No IdP client secret is shipped to the frontend.
          DEV_BFF_JWKS_URI: ${{ vars.DEV_BFF_JWKS_URI || 'https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com' }}
          DEV_BFF_OIDC_DISCOVERY_URL: ${{ vars.DEV_BFF_OIDC_DISCOVERY_URL }}
          DEV_BFF_OIDC_ISSUER: ${{ vars.DEV_BFF_OIDC_ISSUER || 'https://securetoken.google.com/pantheon-dev-20260902' }}
          DEV_BFF_OIDC_AUDIENCE: ${{ vars.DEV_BFF_OIDC_AUDIENCE || 'pantheon-dev-20260902' }}
          DEV_BFF_OIDC_CLIENT_ID: ${{ secrets.DEV_BFF_OIDC_CLIENT_ID }}
          DEV_BFF_OIDC_CLIENT_SECRET: ${{ secrets.DEV_BFF_OIDC_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_ID || 'pantheon-dev-viewer-v1' }}
          DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_VIEWER_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_ID || 'pantheon-dev-approver-v1' }}
          DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_APPROVER_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_ID || 'pantheon-dev-risk-owner-v1' }}
          DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_RISK_OWNER_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_ID || 'pantheon-dev-operator-a-v1' }}
          DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_ID || 'pantheon-dev-operator-b-v1' }}
          DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_OPERATOR_B_CLIENT_SECRET }}
          DEV_BFF_DEV_LOGIN_TEST_ADMIN_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_TEST_ADMIN_CLIENT_ID || 'pantheon-dev-admin-test' }}
          DEV_BFF_DEV_LOGIN_TEST_ADMIN_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_TEST_ADMIN_CLIENT_SECRET }}
          DEV_BFF_MFA_REQUIRED: ${{ vars.DEV_BFF_MFA_REQUIRED || 'false' }}
          DEV_BFF_MFA_CLAIMS: ${{ vars.DEV_BFF_MFA_CLAIMS || 'amr,acr,mfa,mfa_verified,firebase.sign_in_second_factor' }}
          DEV_BFF_MFA_VALUES: ${{ vars.DEV_BFF_MFA_VALUES || 'true,1,yes,mfa,otp,totp,webauthn' }}
          DEV_BFF_REQUIRE_EMAIL_VERIFIED: ${{ vars.DEV_BFF_REQUIRE_EMAIL_VERIFIED || 'true' }}
          DEV_ASSISTANT_CONTROL_PASSPHRASE_HASH: ${{ secrets.DEV_ASSISTANT_CONTROL_PASSPHRASE_HASH }}
          DEV_BFF_ROLE_CLAIMS: ${{ vars.DEV_BFF_ROLE_CLAIMS || 'roles,role' }}
          DEV_BFF_ROLE_MAP: ${{ vars.DEV_BFF_ROLE_MAP || 'pantheon-operator=operator;pantheon-viewer=viewer;pantheon-reviewer=reviewer;pantheon-approver=approver;pantheon-risk-owner=risk_owner;pantheon-admin=admin' }}
          DEV_BFF_ROLE_MAP_MODE: ${{ vars.DEV_BFF_ROLE_MAP_MODE || 'strict' }}
          DEV_BFF_DEFAULT_ROLE: ${{ vars.DEV_BFF_DEFAULT_ROLE || 'viewer' }}
          # Human-provisioned BFF-to-adapter credential. The deploy preflight
          # rejects an empty value while service auth is required.
          DEV_OPENCLAW_ADAPTER_SERVICE_TOKEN: ${{ secrets.DEV_OPENCLAW_ADAPTER_SERVICE_TOKEN }}
          DEV_OPENCLAW_ADAPTER_SERVICE_AUTH_REQUIRED: ${{ vars.DEV_OPENCLAW_ADAPTER_SERVICE_AUTH_REQUIRED || 'true' }}
          # Long-lived (`claude setup-token`) credential for the Claude CLI
          # the openclaw-gateway container runs internally. Distinct from the
          # adapter service token above: this authenticates the container's
          # own `claude -p` calls, not calls to it. Optional -- an empty
          # value leaves the container on its persisted interactive-login
          # session, which is the prior (refresh-dependent) behavior.
          DEV_OPENCLAW_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.DEV_OPENCLAW_CLAUDE_CODE_OAUTH_TOKEN }}
          DEV_OPENCLAW_ANTHROPIC_API_KEY: ${{ secrets.DEV_OPENCLAW_ANTHROPIC_API_KEY }}
          DEV_OPENCLAW_ANTHROPIC_WORKSPACE_ID: ${{ vars.DEV_OPENCLAW_ANTHROPIC_WORKSPACE_ID }}
          DEV_MANAGEMENT_AI_STORE_BACKEND: ${{ vars.DEV_MANAGEMENT_AI_STORE_BACKEND || 'postgres' }}
          DEV_MANAGEMENT_AI_STORE_SCHEMA: ${{ vars.DEV_MANAGEMENT_AI_STORE_SCHEMA || 'management_ai' }}
          DEV_MANAGEMENT_AI_DB_USER: ${{ vars.DEV_MANAGEMENT_AI_DB_USER || 'pantheon_management_ai' }}
          DEV_MANAGEMENT_AI_DB_PASSWORD: ${{ secrets.DEV_MANAGEMENT_AI_DB_PASSWORD }}
          DEV_MANAGEMENT_AI_DATABASE_URL: ${{ secrets.DEV_MANAGEMENT_AI_DATABASE_URL }}
          DEV_AGORA_PRIVATE_CONTENT_DEV_KEK: ${{ secrets.DEV_AGORA_PRIVATE_CONTENT_DEV_KEK }}
          DEV_MANAGEMENT_AI_ATTACH_BUCKET: ${{ vars.DEV_MANAGEMENT_AI_ATTACH_BUCKET }}
          DEV_MANAGEMENT_AI_ATTACH_LOCATION: ${{ vars.DEV_MANAGEMENT_AI_ATTACH_LOCATION || 'asia-east1' }}
          DEV_PPL_ALLOC_009_DEV_PROOF_ENABLED: ${{ env.PPL_ALLOC_009_DEV_PROOF_ENABLED }}
          # The recovery switch is deliberately one boolean with a fixed
          # connector and exact reviewed hosts. Callers cannot inject profiles,
          # wildcard domains, credentials, query strings, or arbitrary egress.
          PANTHEON_DEV_COMPOSE_PROFILES: ${{ env.BOUNDED_SOURCE_REFRESH_ENABLED == 'true' && 'root,source-ingest-scheduler' || 'root' }}
          PANTHEON_EXTERNAL_EGRESS: ${{ env.BOUNDED_SOURCE_REFRESH_ENABLED == 'true' && 'allowlist' || 'deny' }}
          PANTHEON_EXTERNAL_EGRESS_ALLOWED_HOSTS: ${{ env.BOUNDED_SOURCE_REFRESH_ENABLED == 'true' && 'openapi.twse.com.tw,www.tpex.org.tw' || '' }}
          SOURCE_INGEST_BOUNDED_CONNECTOR_ID: tw-twse-tpex-official-market
          SOURCE_INGEST_BOUNDED_RUN_TIMEOUT_SECONDS: "1800"
          SOURCE_INGEST_CONTROLLER_MAX_TICKS: "1"
          SOURCE_INGEST_SCHEDULER_MAX_CONCURRENCY: "1"
          SOURCE_INGEST_MAX_RECORDS: "100"
          PANTHEON_DEV_DOCKER_PRUNE: ${{ vars.PANTHEON_DEV_DOCKER_PRUNE || 'true' }}
          DEV_DEPLOY_DEADLINE_SECONDS: ${{ vars.DEV_DEPLOY_DEADLINE_SECONDS || '7200' }}
          PANTHEON_DEV_ROLLBACK_BACKEND_SHA: ${{ steps.rollback_baseline.outputs.sha }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          PANTHEON_DEV_ARTIFACT_CANDIDATE_ID: ${{ steps.release_admission.outputs.release_candidate_id }}
          PANTHEON_DEV_ARTIFACT_RUN_ID: ${{ github.run_id }}
          PANTHEON_DEV_ARTIFACT_ATTEMPT: ${{ github.run_attempt }}
          PANTHEON_DEV_ARTIFACT_CONTROLLER_SHA: ${{ steps.target.outputs.sha }}
          PANTHEON_DEV_ARTIFACT_CANDIDATE_BACKEND_SHA: ${{ steps.target.outputs.sha }}
          PANTHEON_DEV_ARTIFACT_CANDIDATE_FRONTEND_SHA: ${{ steps.frontend.outputs.sha }}
          PANTHEON_DEV_ARTIFACT_PREVIOUS_BACKEND_SHA: ${{ steps.rollback_baseline.outputs.sha }}
          PANTHEON_DEV_ARTIFACT_PREVIOUS_FRONTEND_SHA: ${{ steps.rollback_baseline.outputs.frontend_sha }}
          PANTHEON_DEV_ARTIFACT_MANIFEST_PATH: ${{ steps.artifact_baseline.outputs.manifest_path }}
          PANTHEON_DEV_ARTIFACT_MANIFEST_SHA256: ${{ steps.artifact_baseline.outputs.manifest_sha256 }}
          PANTHEON_DEV_ARTIFACT_DRIVER_PATH: ${{ steps.artifact_baseline.outputs.driver_path }}
          PANTHEON_DEV_ARTIFACT_DRIVER_SHA256: ${{ steps.artifact_baseline.outputs.driver_sha256 }}
          PANTHEON_DEV_ARTIFACT_LIBRARY_SHA256: ${{ steps.artifact_baseline.outputs.library_sha256 }}
          PANTHEON_DEV_ARTIFACT_COMPOSE_FILE: ${{ steps.artifact_baseline.outputs.compose_file }}
          PANTHEON_DEV_ARTIFACT_RUNNER_EVIDENCE_DIR: ${{ runner.temp }}/pantheon-dev-artifacts-${{ github.run_id }}-${{ github.run_attempt }}/candidate
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ -f "${controller}/scripts/run_with_dev_environment_lease.sh" && ! -L "${controller}/scripts/run_with_dev_environment_lease.sh" ]]
          printf '%s  %s\n' \
            da9a728ed8cec8e1133b92171e4038f9dc51ef4888911acd02c7e399e54d95ae "${controller}/scripts/dev_environment_lease.py" \
            6c82021b93621f16776d5d67a9e20cb9d690f7ebfa257ebf8c329f7d158fb2c2 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict
          case "${DEV_AUTH_PROFILE}" in
            strict)
              export DEV_BFF_AUTH_STUB=false
              export DEV_BFF_AUTH_MODE=strict
              ;;
            permissive-stub)
              export DEV_BFF_AUTH_STUB=true
              export DEV_BFF_AUTH_MODE=permissive
              ;;
            *)
              echo "Unknown dev auth profile: ${DEV_AUTH_PROFILE}" >&2
              exit 1
              ;;
          esac
          echo "Dev BFF auth profile: ${DEV_AUTH_PROFILE} (stub=${DEV_BFF_AUTH_STUB}, mode=${DEV_BFF_AUTH_MODE})"
          echo "PPL-ALLOC-009 dev proof enabled: ${DEV_PPL_ALLOC_009_DEV_PROOF_ENABLED}"
          args=(
            bash "${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/deploy_nonprod_vm.sh"
            --environment dev
            --component "${TARGET_COMPONENT}"
            --sha "${TARGET_SHA}"
            --project-id "${{ vars.DEV_GCP_DEPLOY_PROJECT_ID || 'pantheon-dev-20260902' }}"
            --deadline-seconds "${DEV_DEPLOY_DEADLINE_SECONDS}"
            --rollback-sha "${{ steps.rollback_baseline.outputs.sha }}"
          )
          [[ "${ALLOW_DIRTY}" == "true" ]] && args+=(--allow-dirty)
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            exec "${GITHUB_WORKSPACE}/.lease-controller/scripts/run_with_dev_environment_lease.sh" "${args[@]}"

      - name: Validate retained candidate image seal for evidence upload
        id: artifact_candidate_seal
        if: ${{ always() && steps.artifact_baseline.outcome == 'success' && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          candidate_dir="${RUNNER_TEMP}/pantheon-dev-artifacts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/candidate"
          python3 "${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/dev_candidate_receipt.py" \
            --context "${candidate_dir}/context.json" --receipt "${candidate_dir}/candidate-receipt.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Upload candidate image admission receipt
        id: artifact_candidate_upload
        if: ${{ always() && steps.artifact_candidate_seal.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pantheon-dev-artifact-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.artifact_candidate_seal.outputs.receipt_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Ensure governed dev paper baseline under lease
        id: paper_bootstrap
        if: ${{ env.PAPER_BOOTSTRAP_REQUESTED == 'true' }}
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: ""
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.heartbeat_log }}
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-dev-deploy' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          GCP_DEPLOY_PROJECT_ID: ${{ vars.DEV_GCP_DEPLOY_PROJECT_ID || 'pantheon-dev-20260902' }}
          EXPECTED_BFF_SHA: ${{ steps.target.outputs.sha }}
          EXPECTED_FE_SHA: ${{ steps.frontend.outputs.sha }}
          DEV_PAPER_RUN_ID: ${{ github.run_id }}
          DEV_PAPER_ATTEMPT: ${{ github.run_attempt }}
          DEV_PAPER_PHASE: paper_bootstrap
          DEV_PAPER_PREBOOTSTRAP_WORKTREE: ${{ vars.DEV_DEPLOY_WORKTREE || format('{0}/dev-root', vars.DEV_DEPLOY_WORKTREE_ROOT) }}
          PANTHEON_MARKET_INPUT_BOOTSTRAP_GRACE_SECONDS: "120"
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          [[ "${EXPECTED_BFF_SHA}" =~ ^[0-9a-f]{40}$ ]]
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ -f "${controller}/scripts/run_with_dev_environment_lease.sh" && ! -L "${controller}/scripts/run_with_dev_environment_lease.sh" ]]
          printf '%s  %s\n' \
            da9a728ed8cec8e1133b92171e4038f9dc51ef4888911acd02c7e399e54d95ae "${controller}/scripts/dev_environment_lease.py" \
            6c82021b93621f16776d5d67a9e20cb9d690f7ebfa257ebf8c329f7d158fb2c2 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict
          # The guard binary above is the immutable pinned trust root; the
          # guarded command below comes from the accepted dev-tip controller
          # checkout, so a merged CAPTURE change here takes effect on the
          # next deploy run without moving the lease guard's pin.
          #
          # The guarded script runs, inside the same guarded child so
          # failure diagnostics can still be captured before quarantine:
          #   docker exec pantheon-operator-bff-1 python /workspace/scripts/bootstrap_dev_paper_baseline.py --timeout-seconds 420 --poll-seconds 5
          diagnostics_script="${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/run_dev_paper_baseline_with_diagnostics.sh"
          [[ -f "${diagnostics_script}" && ! -L "${diagnostics_script}" ]]
          collector="${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/collect_dev_paper_diagnostics.py"
          [[ -f "${collector}" && ! -L "${collector}" ]]
          diagnostic_dir="${RUNNER_TEMP}/dev-paper-diagnostics-${DEV_PAPER_RUN_ID}-${DEV_PAPER_ATTEMPT}"
          mkdir -p "${diagnostic_dir}"
          # Predeclare fixed run/attempt runner paths and initialize terminal
          # evidence before guard invocation. A cancellation or lease loss that
          # terminates the step mid-flight still leaves behind durable status on
          # disk, and the upload step finds it via the fixed path without depending
          # on outputs written only after the guarded command returns.
          echo "diagnostic_dir=${diagnostic_dir}" >> "${GITHUB_OUTPUT}"
          echo "diagnostics_file=${diagnostic_dir}/diagnostics.json" >> "${GITHUB_OUTPUT}"
          echo "status_file=${diagnostic_dir}/collection-status.json" >> "${GITHUB_OUTPUT}"
          echo "checksum_file=${diagnostic_dir}/SHA256SUMS" >> "${GITHUB_OUTPUT}"
          python3 -c "import datetime as dt, json, sys; doc = {'schemaVersion': 1, 'collectionStatus': 'not_started', 'bootstrapExit': None, 'collectedAt': dt.datetime.now(dt.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'), 'collectorExit': None, 'collectorErrorCategory': None, 'collectorStderrSummary': None}; open(sys.argv[1], 'w', encoding='utf-8').write(json.dumps(doc, sort_keys=True) + '\n')" "${diagnostic_dir}/collection-status.json"
          baseline_status=0
          # Collection happens inside this same guarded child, before the
          # guard observes the failure and quarantines the lease/heartbeat.
          # A later, separate guard invocation cannot do this: the guard's
          # own EXIT trap already stops the heartbeat for quarantine as soon
          # as this command returns non-zero.
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            DEV_PAPER_DIAGNOSTICS_DIR="${diagnostic_dir}" \
            DEV_PAPER_DIAGNOSTICS_COLLECTOR="${collector}" \
            EXPECTED_FE_SHA="${EXPECTED_FE_SHA}" \
            DEV_PAPER_RUN_ID="${DEV_PAPER_RUN_ID}" \
            DEV_PAPER_ATTEMPT="${DEV_PAPER_ATTEMPT}" \
            DEV_PAPER_PHASE="${DEV_PAPER_PHASE}" \
            DEV_PAPER_PREBOOTSTRAP_WORKTREE="${DEV_PAPER_PREBOOTSTRAP_WORKTREE}" \
            "${GITHUB_WORKSPACE}/.lease-controller/scripts/run_with_dev_environment_lease.sh" \
            "${diagnostics_script}" || baseline_status=$?
          exit "${baseline_status}"

      - name: Upload dev paper failure diagnostics
        id: paper_bootstrap_diagnostics_upload
        if: ${{ always() && steps.paper_bootstrap.conclusion != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pantheon-dev-paper-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dev-paper-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/diagnostics.json
            ${{ runner.temp }}/dev-paper-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/collection-status.json
            ${{ runner.temp }}/dev-paper-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7

      - name: Dev evolution dispatch hosted probe
        id: evolution-dispatch-probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_evolution_dispatch_probe && env.TARGET_COMPONENT == 'root' }}
        env:
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-dev-deploy' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          DEV_DEPLOY_WORKTREE: ${{ vars.DEV_DEPLOY_WORKTREE || format('{0}/dev-root', vars.DEV_DEPLOY_WORKTREE_ROOT) }}
          GCP_DEPLOY_PROJECT_ID: ${{ vars.DEV_GCP_DEPLOY_PROJECT_ID || 'pantheon-dev-20260902' }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          evidence_name="evoloop-001-hosted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          remote_evidence="/tmp/${evidence_name}"
          local_evidence="/tmp/${evidence_name}"
          prefix="evoloop-001-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf -v worktree_q '%q' "${DEV_DEPLOY_WORKTREE}"
          printf -v deploy_sha_q '%q' "${DEPLOY_SHA}"
          printf -v remote_evidence_q '%q' "${remote_evidence}"
          printf -v prefix_q '%q' "${prefix}"
          printf -v requested_ref_q '%q' "${TARGET_REF}"
          printf -v run_id_q '%q' "${GITHUB_RUN_ID}"
          printf -v run_attempt_q '%q' "${GITHUB_RUN_ATTEMPT}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf -v run_url_q '%q' "${run_url}"
          .agora-gate-controller/scripts/dev_vm_ssh.sh exec \
            "set -euo pipefail; cd ${worktree_q}; python3 -m services.evolution.hosted_compose_probe --expected-sha ${deploy_sha_q} --requested-ref ${requested_ref_q} --deploy-run-id ${run_id_q} --deploy-run-attempt ${run_attempt_q} --deploy-run-url ${run_url_q} --prefix ${prefix_q} --output ${remote_evidence_q}"
          .agora-gate-controller/scripts/dev_vm_ssh.sh copy-from \
            "${remote_evidence}" "${local_evidence}"
          echo "artifact_path=${local_evidence}" >> "$GITHUB_OUTPUT"
          echo "Hosted evolution dispatch evidence: ${evidence_name}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evolution dispatch hosted evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_evolution_dispatch_probe && env.TARGET_COMPONENT == 'root' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evoloop-001-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evolution-dispatch-probe.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Dev canonical paper lifecycle hosted probe
        id: loop-prod-tel-002-probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_loop_prod_tel_002_probe && env.TARGET_COMPONENT == 'root' }}
        working-directory: .target
        env:
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-dev-deploy' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          DEV_DEPLOY_WORKTREE: ${{ vars.DEV_DEPLOY_WORKTREE || format('{0}/dev-root', vars.DEV_DEPLOY_WORKTREE_ROOT) }}
          GCP_DEPLOY_PROJECT_ID: ${{ vars.DEV_GCP_DEPLOY_PROJECT_ID || 'pantheon-dev-20260902' }}
          DEV_BFF_PUBLIC_URL: ${{ vars.DEV_BFF_PUBLIC_URL || 'https://api.dev.mvl-cap.tw' }}
          # The generic operator identity is intentionally not MFA-verified.
          # Hosted protected reads use the provisioned governed operator A,
          # which the strict deploy floor requires and binds to MFA.
          DEV_BFF_OIDC_CLIENT_ID: ${{ vars.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_ID || 'pantheon-dev-operator-a-v1' }}
          DEV_BFF_OIDC_CLIENT_SECRET: ${{ secrets.DEV_BFF_DEV_LOGIN_OPERATOR_A_CLIENT_SECRET }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          PREBOOTSTRAP_HIGH_WATERMARK: ${{ steps.paper_bootstrap.outputs.prebootstrap_high_watermark }}
        run: |
          set -euo pipefail
          evidence_name="loop-prod-tel-002-hosted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          readback_name="loop-prod-tel-002-bff-readback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          remote_evidence="/tmp/${evidence_name}"
          local_evidence="/tmp/${evidence_name}"
          readback_evidence="/tmp/${readback_name}"
          container_evidence="/tmp/${evidence_name}"
          case_key="dev-paper-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf -v worktree_q '%q' "${DEV_DEPLOY_WORKTREE}"
          printf -v deploy_sha_q '%q' "${DEPLOY_SHA}"
          printf -v remote_evidence_q '%q' "${remote_evidence}"
          printf -v container_evidence_q '%q' "${container_evidence}"
          printf -v case_key_q '%q' "${case_key}"
          printf -v baseline_q '%q' "${PREBOOTSTRAP_HIGH_WATERMARK:-}"
          echo "artifact_path=${local_evidence}" >> "$GITHUB_OUTPUT"
          echo "readback_artifact_path=${readback_evidence}" >> "$GITHUB_OUTPUT"
          set +e
          "${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/dev_vm_ssh.sh" exec \
            "set -uo pipefail; cd ${worktree_q} || exit 1; scripts/run_loop_prod_tel_002_hosted_probe.sh --expected-sha ${deploy_sha_q} --container-output ${container_evidence_q} --remote-output ${remote_evidence_q} --timeout-seconds 420 --poll-seconds 5 --mode natural --case-key ${case_key_q} --baseline-high-watermark ${baseline_q}"
          probe_status=$?
          scp_status=0
          "${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/dev_vm_ssh.sh" copy-from \
            "${remote_evidence}" "${local_evidence}" || scp_status=$?
          set -e
          if [[ "${scp_status}" -ne 0 || ! -s "${local_evidence}" ]]; then
            python3 -c 'import sys; from pathlib import Path; from services.trade_journey.hosted_lifecycle_probe import write_failure_artifact; write_failure_artifact(Path(sys.argv[1]), expected_sha=sys.argv[2], code="hosted_probe_transport_error", message="hosted lifecycle evidence transport failed", mode="natural", case_key=sys.argv[3])' "${local_evidence}" "${DEPLOY_SHA}" "${case_key}"
          fi
          readback_status=0
          python3 -m services.trade_journey.hosted_bff_readback \
            --source "${local_evidence}" \
            --output "${readback_evidence}" \
            --expected-sha "${DEPLOY_SHA}" \
            --expected-login-identity operator_a \
            --base-url "${DEV_BFF_PUBLIC_URL}" || readback_status=$?
          echo "Canonical lifecycle hosted evidence: ${evidence_name}" >> "$GITHUB_STEP_SUMMARY"
          echo "Authenticated public BFF readback evidence: ${readback_name}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${probe_status}" -ne 0 ]]; then
            exit "${probe_status}"
          fi
          if [[ "${scp_status}" -ne 0 ]]; then
            exit "${scp_status}"
          fi
          exit "${readback_status}"

      - name: Upload canonical paper lifecycle hosted evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_loop_prod_tel_002_probe && env.TARGET_COMPONENT == 'root' && steps.loop-prod-tel-002-probe.outputs.artifact_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loop-prod-tel-002-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.loop-prod-tel-002-probe.outputs.artifact_path }}
            ${{ steps.loop-prod-tel-002-probe.outputs.readback_artifact_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Public dev BFF smoke and exact version proof under lease
        id: public_smoke
        timeout-minutes: 5
        env:
          PATH: ${{ steps.runtime.outputs.safe_path }}
          BASH_ENV: ""
          ENV: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
          PYTHONSAFEPATH: "1"
          PYTHONSTARTUP: ""
          PYTHONINSPECT: ""
          CDPATH: ""
          HOME: /home/runner
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          GIT_SSH_COMMAND: ""
          GIT_ASKPASS: ""
          SSH_ASKPASS: ""
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.state_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.pid_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.identity_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.failure_file }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.heartbeat_log }}
          DEV_BFF_URL: ${{ vars.DEV_BFF_URL || 'https://api.dev.mvl-cap.tw' }}
          DEV_BFF_CANONICAL_CORS_ORIGIN: ${{ vars.DEV_BFF_CANONICAL_CORS_ORIGIN || 'https://app.dev.mvl-cap.tw' }}
          DEV_BFF_CORS_ORIGIN: ${{ vars.DEV_BFF_CORS_ORIGIN || 'https://app.dev.mvl-cap.tw' }}
          REMOTE_USER: ${{ vars.NONPROD_REMOTE_USER }}
          DEV_VM: ${{ vars.DEV_VM || 'pantheon-dev-deploy' }}
          DEV_ZONE: ${{ vars.DEV_ZONE || 'asia-east1-b' }}
          GCP_DEPLOY_PROJECT_ID: ${{ vars.DEV_GCP_DEPLOY_PROJECT_ID || 'pantheon-dev-20260902' }}
          PPL_ALLOC_009_DEV_PROOF_ENABLED: ${{ env.PPL_ALLOC_009_DEV_PROOF_ENABLED }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          lease_token="${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          unset PANTHEON_ENVIRONMENT_LEASE_TOKEN
          controller="${GITHUB_WORKSPACE}/.lease-controller"
          [[ -f "${controller}/scripts/run_with_dev_environment_lease.sh" && ! -L "${controller}/scripts/run_with_dev_environment_lease.sh" ]]
          printf '%s  %s\n' \
            da9a728ed8cec8e1133b92171e4038f9dc51ef4888911acd02c7e399e54d95ae "${controller}/scripts/dev_environment_lease.py" \
            6c82021b93621f16776d5d67a9e20cb9d690f7ebfa257ebf8c329f7d158fb2c2 "${controller}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict
          PANTHEON_ENVIRONMENT_LEASE_TOKEN="${lease_token}" \
            exec "${GITHUB_WORKSPACE}/.lease-controller/scripts/run_with_dev_environment_lease.sh" \
            bash -c '
              set -euo pipefail
              curl --connect-timeout 10 --max-time 30 -fsS "${DEV_BFF_URL}/health" >/dev/null
              actual="$(curl --connect-timeout 10 --max-time 30 -fsS "${DEV_BFF_URL}/bff/version" | python3 -c '\''import json,sys; print(json.load(sys.stdin).get("source_commit_sha") or "")'\'')"
              [[ "${actual}" == "${TARGET_SHA}" ]]
              origins="${DEV_BFF_CANONICAL_CORS_ORIGIN}"
              if [[ -n "${DEV_BFF_CORS_ORIGIN}" && ",${origins}," != *",${DEV_BFF_CORS_ORIGIN},"* ]]; then
                origins="${origins},${DEV_BFF_CORS_ORIGIN}"
              fi
              IFS="," read -r -a cors_origins <<< "${origins}"
              for origin in "${cors_origins[@]}"; do
                origin="${origin//[[:space:]]/}"
                [[ -z "${origin}" ]] && continue
                curl --connect-timeout 10 --max-time 30 -sS -D - -o "${RUNNER_TEMP}/dev-cors-body" -X OPTIONS "${DEV_BFF_URL}/health" \
                  -H "Origin: ${origin}" -H "Access-Control-Request-Method: GET" \
                  | grep -qi "access-control-allow-origin: ${origin}"
              done
              effective_line="$(
                "${GITHUB_WORKSPACE}/.agora-gate-controller/scripts/dev_vm_ssh.sh" exec \
                  "docker inspect pantheon-operator-bff-1 --format '\''{{range .Config.Env}}{{println .}}{{end}}'\'' | grep -F -x '\''PANTHEON_PPL_ALLOC_009_DEV_PROOF_ENABLED=${PPL_ALLOC_009_DEV_PROOF_ENABLED}'\''"
              )"
              evidence_path="${RUNNER_TEMP}/ppl-alloc-009-deployment-posture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
              python3 "${GITHUB_WORKSPACE}/.target/scripts/ppl_alloc_009_deployment_evidence.py" \
                --output "${evidence_path}" \
                --target-sha "${TARGET_SHA}" \
                --component "${TARGET_COMPONENT}" \
                --auth-profile "${DEV_AUTH_PROFILE}" \
                --expected-enabled "${PPL_ALLOC_009_DEV_PROOF_ENABLED}" \
                --effective-env-line "${effective_line}" \
                --workflow-run-id "${GITHUB_RUN_ID}" \
                --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
                --workflow-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                --bff-url "${DEV_BFF_URL}"
              echo "deployment_evidence_path=${evidence_path}" >> "${GITHUB_OUTPUT}"
            '

      - name: Upload dev deployment posture evidence
        id: deploy-posture-evidence

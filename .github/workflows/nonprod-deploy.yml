          PANTHEON_DEV_ARTIFACT_CANDIDATE_COMPOSE_FILE: ${{ vars.DEV_DEPLOY_WORKTREE_ROOT && format('{0}/dev-{1}/docker-compose.yml', vars.DEV_DEPLOY_WORKTREE_ROOT, inputs.component == 'bff' && 'bff' || 'root') || '' }}
          PANTHEON_DEV_ARTIFACT_CANDIDATE_COMPONENT: ${{ inputs.component == 'bff' && 'bff' || 'root' }}

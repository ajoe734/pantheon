name: Coordination Handoff Publisher

on:
  push:
    paths:
      - ".coordination/responses/*-contract-ready.yaml"
      - ".coordination/responses/*-backend-delivery.yaml"

permissions:
  contents: write

jobs:
  publish-handoffs:
    name: Mirror Pantheon handoffs and dispatch to front repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pantheon
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Checkout front repo
        uses: actions/checkout@v6
        with:
          repository: ajoe734/front-ai-trading-system
          ref: main
          token: ${{ secrets.COORDINATION_REPO_TOKEN }}
          path: front-target
          fetch-depth: 0

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Detect changed Pantheon handoff payloads
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t changed_files < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          else
            mapfile -t changed_files < <(git diff-tree --no-commit-id --name-only -r "$AFTER_SHA")
          fi

          filtered=()
          for file in "${changed_files[@]}"; do
            case "$file" in
              .coordination/responses/*-contract-ready.yaml|.coordination/responses/*-backend-delivery.yaml)
                filtered+=("$file")
                ;;
            esac
          done

          echo "count=${#filtered[@]}" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "${filtered[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Mirror changed handoff bundles into front repo checkout
        if: ${{ steps.changed.outputs.count != '0' }}
        env:
          RESULT_DIR: ${{ runner.temp }}/coordination-handoff-results
        run: |
          mkdir -p "$RESULT_DIR"
          while IFS= read -r payload_path; do
            [[ -z "$payload_path" ]] && continue
            safe_name=$(basename "$payload_path" .yaml)
            python3 scripts/coordination_publish_handoff.py \
              --payload-path "$payload_path" \
              --target-root "$GITHUB_WORKSPACE/front-target" \
              --output-json "$RESULT_DIR/$safe_name.json"
          done <<< "${{ steps.changed.outputs.files }}"

      - name: Commit mirrored front-repo handoffs
        id: mirror
        if: ${{ steps.changed.outputs.count != '0' }}
        working-directory: front-target
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            mirror_commit=$(git rev-parse HEAD)
            echo "No front-repo mirror diff detected; reusing $mirror_commit"
          else
            git config user.name "pantheon-bot"
            git config user.email "pantheon-bot@users.noreply.github.com"
            git add .coordination docs
            git commit -m "coordination: mirror Pantheon handoffs [skip ci]"
            git push origin HEAD:main
            mirror_commit=$(git rev-parse HEAD)
            echo "Mirrored handoffs pushed to front repo at $mirror_commit"
          fi
          echo "mirror_commit=$mirror_commit" >> "$GITHUB_OUTPUT"

      - name: Emit repository_dispatch events to front repo
        if: ${{ steps.changed.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          RESULT_DIR: ${{ runner.temp }}/coordination-handoff-results
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          MIRROR_COMMIT: ${{ steps.mirror.outputs.mirror_commit }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          result_dir = Path(os.environ["RESULT_DIR"])
          source_repo = os.environ["SOURCE_REPO"]
          source_commit = os.environ["SOURCE_COMMIT"]
          source_ref = os.environ.get("SOURCE_REF", "")
          run_id = os.environ["RUN_ID"]
          mirror_commit = os.environ["MIRROR_COMMIT"]

          for result_path in sorted(result_dir.glob("*.json")):
            payload = json.loads(result_path.read_text(encoding="utf-8"))
            command = [
              "gh",
              "api",
              "--method",
              "POST",
              "-H",
              "Accept: application/vnd.github+json",
              "/repos/ajoe734/front-ai-trading-system/dispatches",
              "-f",
              f"event_type={payload['event_type']}",
              "-F",
              f"client_payload[feature_id]={payload['feature_id']}",
              "-F",
              f"client_payload[payload_path]={payload['payload_path']}",
              "-F",
              f"client_payload[source_repo]={source_repo}",
              "-F",
              f"client_payload[source_commit]={source_commit}",
              "-F",
              f"client_payload[source_ref]={source_ref}",
              "-F",
              "client_payload[trigger_mode]=normal",
              "-F",
              f"client_payload[origin_workflow]=coordination-handoff-publisher/{run_id}",
              "-F",
              f"client_payload[mirror_commit]={mirror_commit}",
            ]
            print(f"Dispatching {payload['event_type']} for {payload['feature_id']}")
            subprocess.run(command, check=True)
          PYEOF

      - name: Write Pantheon dispatch audit breadcrumbs
        if: ${{ steps.changed.outputs.count != '0' }}
        env:
          RESULT_DIR: ${{ runner.temp }}/coordination-handoff-results
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          MIRROR_COMMIT: ${{ steps.mirror.outputs.mirror_commit }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          result_dir = Path(os.environ["RESULT_DIR"])
          audit_dir = Path(".coordination/audit")
          audit_dir.mkdir(parents=True, exist_ok=True)

          for index, result_path in enumerate(sorted(result_dir.glob("*.json"))):
            payload = json.loads(result_path.read_text(encoding="utf-8"))
            stamp = datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")
            audit_payload = {
              "feature_id": payload["feature_id"],
              "event_type": payload["event_type"],
              "payload_path": payload["payload_path"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "source_ref": os.environ.get("SOURCE_REF", ""),
              "mirror_commit": os.environ["MIRROR_COMMIT"],
              "dispatch_mode": "normal",
              "dispatched_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "run_id": os.environ["RUN_ID"],
              "run_url": os.environ["RUN_URL"],
            }
            audit_path = audit_dir / f"{payload['feature_id']}-dispatch-emitted-{stamp}-{index}.json"
            audit_path.write_text(json.dumps(audit_payload, indent=2) + "\n", encoding="utf-8")
          PYEOF

      - name: Commit Pantheon dispatch audit breadcrumbs
        if: ${{ steps.changed.outputs.count != '0' }}
        run: |
          if [[ -z "$(git status --porcelain .coordination/audit)" ]]; then
            echo "No Pantheon audit diff detected."
            exit 0
          fi

          git config user.name "pantheon-bot"
          git config user.email "pantheon-bot@users.noreply.github.com"
          git add .coordination/audit
          git commit -m "coordination: record handoff dispatch audit [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

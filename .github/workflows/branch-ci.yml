name: Branch CI Gate

# Gate every push and PR that participates in the task / publish / master
# pipeline. Runs commit-trailer checks, runtime-mirror guard, and a fast
# smoke acceptance. The three jobs below ("Commit trailers", "Runtime
# mirror guard", "Smoke acceptance") are the required status checks on
# the dev and master branch protections.

on:
  push:
    branches:
      - "task/**"
      - "hotfix/**"
      - "dev"
      - "publish/**"
      - "master"
  pull_request:
    branches:
      - "dev"
      - "master"

permissions:
  contents: read

concurrency:
  group: branch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trailers:
    name: Commit trailers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # On pull_request, github.sha is the synthetic merge commit (PR head
      # merged into the current base tip), so it must never anchor the range:
      # doing so pulls in every base commit that landed after base.sha and
      # fails the PR on somebody else's already-merged dev commit. The PR
      # range is always <base branch>..<pull_request.head.sha>.
      - name: Determine commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
        run: |
          python3 scripts/git/resolve_commit_trailer_range.py \
            --event "$EVENT" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --pr-head-sha "$PR_HEAD_SHA" \
            --ref-name "$REF_NAME" \
            --pr-base-ref "$PR_BASE_REF" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check commit trailers
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          if [[ "$EVENT" == "pull_request" && "$HEAD_REF" == promote/* ]]; then
            echo "Skipping commit trailer re-scan for promote PR ${HEAD_REF}; publish history was already validated before snapshot cut."
            exit 0
          fi
          if [[ "$EVENT" == "push" && "$REF_NAME" == "master" ]]; then
            subject="$(git log -1 --format=%s "$HEAD_SHA")"
            if [[ "$subject" == Merge\ pull\ request*promote/* ]]; then
              echo "Skipping commit trailer re-scan for master promote merge: ${subject}"
              exit 0
            fi
          fi
          if [[ -z "$RANGE" ]]; then
            echo "commit range was not resolved; refusing to skip the trailer gate" >&2
            exit 1
          fi
          echo "Checking commit trailers over ${RANGE}"
          python3 scripts/git/check_commit_trailers.py \
            --range "$RANGE" \
            --skip-merge

  generated-files:
    name: Runtime mirror guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Diff against base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          else
            CHANGED=$(git diff --name-only "$HEAD_SHA~1" "$HEAD_SHA" 2>/dev/null || true)
          fi
          if [[ -z "$CHANGED" ]]; then exit 0; fi
          echo "$CHANGED" | xargs python3 scripts/check_staged_generated_files.py
      - name: Reject embedded frontend mirror
        run: |
          if [[ -n "$(git ls-files execute-plans)" ]]; then
            echo "execute-plans is a separate repository; remove the embedded frontend mirror" >&2
            exit 1
          fi
  packaging:
    name: Python packaging provision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # requirements.txt is the root-level test dependency file. Installed
      # strictly, not best-effort: telemetry capture degrades silently without
      # jsonschema, so a partial install would turn the acceptance below into a
      # false pass rather than a failure. setuptools is explicit because
      # setup-python 3.12 ships none and the editable build needs one.
      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip "setuptools>=68"
          python3 -m pip install -r requirements.txt pytest

      # Same entry point the auto-worker test bootstrap uses (see
      # AI_COLLABORATION_GUIDE.md § Python Test Environment Provisioning), so CI
      # and workers can never install different distributions. --mode current is
      # admissible here and only here: a GitHub runner is a disposable
      # single-checkout container, so rebinding its interpreter cannot collide
      # with another checkout. The script verifies the binding and fails closed.
      - name: Provision the repository distribution
        run: |
          python3 scripts/dev/provision_python_distribution.py \
            --mode current --allow-system-interpreter

      # The packaging contract plus the four-mode AC2 acceptance
      # (OPS-L12-PYTHON-PACKAGING-PROVISION-001). Both are meaningful only once
      # the distribution is installed, which the step above just did.
      - name: Packaging contract and telemetry import acceptance
        run: |
          python3 -m pytest -q \
            scripts/dev/test_provision_python_distribution.py \
            services/telemetry/test_discovery_imports.py

  smoke:
    name: Smoke acceptance
    runs-on: ubuntu-latest
    needs:
      - trailers
      - generated-files
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps (best-effort)
        run: |
          if [[ -f requirements.txt ]]; then
            python3 -m pip install --upgrade pip
            pip install -r requirements.txt || true
          fi
          if [[ -f requirements-dev.txt ]]; then
            pip install -r requirements-dev.txt || true
          fi

      - name: Run smoke gate
        run: |
          if [[ -x scripts/run-acceptance.sh ]]; then
            ./scripts/run-acceptance.sh smoke
          elif [[ -f scripts/ci_stage0.py ]]; then
            python3 scripts/ci_stage0.py run-baseline
          else
            echo "no smoke gate configured; skipping"
          fi

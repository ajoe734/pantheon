name: Branch CI Gate

# Gate every push and PR that participates in the task / publish / master
# pipeline. Runs commit-trailer checks, runtime-mirror guard, and a fast
# smoke acceptance. The three jobs below ("Commit trailers", "Runtime
# mirror guard", "Smoke acceptance") are the required status checks on
# the dev and master branch protections.

on:
  push:
    branches:
      - "task/**"
      - "hotfix/**"
      - "dev"
      - "publish/**"
      - "master"
  pull_request:
    branches:
      - "dev"
      - "master"

permissions:
  contents: read

concurrency:
  group: branch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trailers:
    name: Commit trailers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            echo "range=${BASE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              # New branch push — fall back to HEAD~..HEAD or just HEAD.
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                echo "range=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
              else
                echo "range=HEAD~0..HEAD" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "range=${BASE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check commit trailers
        run: |
          python3 scripts/git/check_commit_trailers.py \
            --range "${{ steps.range.outputs.range }}" \
            --skip-merge

  generated-files:
    name: Runtime mirror guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Diff against base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          else
            CHANGED=$(git diff --name-only "$HEAD_SHA~1" "$HEAD_SHA" 2>/dev/null || true)
          fi
          if [[ -z "$CHANGED" ]]; then exit 0; fi
          echo "$CHANGED" | xargs python3 scripts/check_staged_generated_files.py

  smoke:
    name: Smoke acceptance
    runs-on: ubuntu-latest
    needs:
      - trailers
      - generated-files
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps (best-effort)
        run: |
          if [[ -f requirements.txt ]]; then
            python3 -m pip install --upgrade pip
            pip install -r requirements.txt || true
          fi
          if [[ -f requirements-dev.txt ]]; then
            pip install -r requirements-dev.txt || true
          fi

      - name: Run smoke gate
        run: |
          if [[ -x scripts/run-acceptance.sh ]]; then
            ./scripts/run-acceptance.sh smoke
          elif [[ -f scripts/ci_stage0.py ]]; then
            python3 scripts/ci_stage0.py run-baseline
          else
            echo "no smoke gate configured; skipping"
          fi

name: Branch CI Gate

# Gate every push and PR that participates in the task / publish / master
# pipeline. Promote PRs created by publish-promote use the explicit
# workflow_dispatch path because GitHub does not recursively emit pull_request
# events for a PR created with that workflow's GITHUB_TOKEN. Runs
# commit-trailer checks, runtime-mirror guard, and a fast smoke acceptance.
# The three jobs below ("Commit trailers", "Runtime mirror guard", "Smoke
# acceptance") are the required status checks on the dev and master branch
# protections.

on:
  push:
    branches:
      - "task/**"
      - "hotfix/**"
      - "dev"
      - "publish/**"
      - "master"
  pull_request:
    branches:
      - "dev"
      - "master"
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: "Exact promote PR head that must receive the required checks"
        required: true
        type: string
      promote_pr_number:
        description: "Promote PR number for audit output"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # A task-branch push and its PR synchronize event validate the same head.
  # Give them one key so the later PR run (which has delivery labels) replaces
  # the label-blind push run instead of publishing contradictory check results.
  group: branch-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  trailers:
    name: Commit trailers
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit promote dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          HEAD_SHA: ${{ github.sha }}
          PROMOTE_PR_NUMBER: ${{ inputs.promote_pr_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_head_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ "$REF_NAME" != promote/* ]]; then
            echo "manual Branch CI dispatch is restricted to promote/* refs" >&2
            exit 1
          fi
          if [[ "$HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "dispatch head mismatch for promote PR #${PROMOTE_PR_NUMBER}: expected ${EXPECTED_HEAD_SHA}, got ${HEAD_SHA}" >&2
            exit 1
          fi
          echo "Validated exact promote PR #${PROMOTE_PR_NUMBER} head ${HEAD_SHA}"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # On pull_request, github.sha is the synthetic merge commit (PR head
      # merged into the current base tip), so it must never anchor the range:
      # doing so pulls in every base commit that landed after base.sha and
      # fails the PR on somebody else's already-merged dev commit. The PR
      # range is always <base branch>..<pull_request.head.sha>.
      - name: Determine commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
        run: |
          python3 scripts/git/resolve_commit_trailer_range.py \
            --event "$EVENT" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --pr-head-sha "$PR_HEAD_SHA" \
            --ref-name "$REF_NAME" \
            --pr-base-ref "$PR_BASE_REF" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check commit trailers
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          RANGE: ${{ steps.range.outputs.range }}
          DELIVERY_CLASS: ${{ contains(github.event.pull_request.labels.*.name, 'delivery:tooling') && 'tooling' || 'product' }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" && "$REF_NAME" == promote/* ]]; then
            echo "Skipping commit trailer re-scan for exact-head promote dispatch ${REF_NAME}; publish history was already validated before snapshot cut."
            exit 0
          fi
          if [[ "$EVENT" == "pull_request" && "$HEAD_REF" == promote/* ]]; then
            echo "Skipping commit trailer re-scan for promote PR ${HEAD_REF}; publish history was already validated before snapshot cut."
            exit 0
          fi
          if [[ "$EVENT" == "push" && "$REF_NAME" == "master" ]]; then
            subject="$(git log -1 --format=%s "$HEAD_SHA")"
            if [[ "$subject" == Merge\ pull\ request*promote/* ]]; then
              echo "Skipping commit trailer re-scan for master promote merge: ${subject}"
              exit 0
            fi
          fi
          if [[ -z "$RANGE" ]]; then
            echo "commit range was not resolved; refusing to skip the trailer gate" >&2
            exit 1
          fi
          echo "Checking commit trailers over ${RANGE}"
          python3 scripts/git/check_commit_trailers.py \
            --range "$RANGE" \
            --skip-merge \
            --delivery-class "$DELIVERY_CLASS"

  generated-files:
    name: Runtime mirror guard
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit promote dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          HEAD_SHA: ${{ github.sha }}
          PROMOTE_PR_NUMBER: ${{ inputs.promote_pr_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_head_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ "$REF_NAME" != promote/* ]]; then
            echo "manual Branch CI dispatch is restricted to promote/* refs" >&2
            exit 1
          fi
          if [[ "$HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "dispatch head mismatch for promote PR #${PROMOTE_PR_NUMBER}: expected ${EXPECTED_HEAD_SHA}, got ${HEAD_SHA}" >&2
            exit 1
          fi
          echo "Validated exact promote PR #${PROMOTE_PR_NUMBER} head ${HEAD_SHA}"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Diff against base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            CHANGED=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" || true)
          else
            CHANGED=$(git diff --name-status "$HEAD_SHA~1" "$HEAD_SHA" 2>/dev/null || true)
          fi
          if [[ -z "$CHANGED" ]]; then exit 0; fi
          printf '%s\n' "$CHANGED" | python3 scripts/check_staged_generated_files.py \
            --diff-name-status
      - name: Reject embedded frontend mirror
        run: |
          if [[ -n "$(git ls-files execute-plans)" ]]; then
            echo "execute-plans is a separate repository; remove the embedded frontend mirror" >&2
            exit 1
          fi
  packaging:
    name: Python packaging provision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # requirements.txt is the root-level test dependency file. Installed
      # strictly, not best-effort: telemetry capture degrades silently without
      # jsonschema, so a partial install would turn the acceptance below into a
      # false pass rather than a failure. setuptools is explicit because
      # setup-python 3.12 ships none and the editable build needs one.
      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip "setuptools>=68"
          python3 -m pip install -r requirements.txt pytest

      # Same entry point the auto-worker test bootstrap uses (see
      # AI_COLLABORATION_GUIDE.md § Python Test Environment Provisioning), so CI
      # and workers can never install different distributions. --mode current is
      # admissible here and only here: a GitHub runner is a disposable
      # single-checkout container, so rebinding its interpreter cannot collide
      # with another checkout. The script verifies the binding and fails closed.
      - name: Provision the repository distribution
        run: |
          python3 scripts/dev/provision_python_distribution.py \
            --mode current --allow-system-interpreter

      # This is a packaging check for this repository's distribution. Product
      # telemetry imports belong to the product-runtime gate, not every tooling
      # change.
      - name: Packaging contract
        run: |
          python3 -m pytest -q \
            scripts/dev/test_provision_python_distribution.py

  smoke:
    name: Smoke acceptance
    runs-on: ubuntu-latest
    needs:
      - trailers
      - generated-files
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps (best-effort)
        run: |
          if [[ -f requirements.txt ]]; then
            python3 -m pip install --upgrade pip
            pip install -r requirements.txt || true
          fi
          if [[ -f requirements-dev.txt ]]; then
            pip install -r requirements-dev.txt || true
          fi
          # The tooling smoke imports canonical signature and boundary helpers.
          # Keep these explicit: requirements.txt intentionally does not pull
          # product service dependencies into a tooling-only change.
          python3 -m pip install cryptography pyyaml "pydantic>=2" pytest

      - name: Classify changed components
        id: boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "${BASE_SHA}^{commit}"; then
            classification="$(python3 scripts/component_boundary.py --base "$BASE_SHA" --head "$HEAD_SHA" --json)"
          else
            classification="$(python3 scripts/component_boundary.py --base "${HEAD_SHA}~1" --head "$HEAD_SHA" --json)"
          fi
          echo "$classification"
          for field in tooling_only development_tooling_touched product_touched delivery_touched; do
            value="$(CLASSIFICATION="$classification" FIELD="$field" python3 -c 'import json, os; print(str(json.loads(os.environ["CLASSIFICATION"])[os.environ["FIELD"]]).lower())')"
            echo "${field}=${value}" >> "$GITHUB_OUTPUT"
          done

      # DTG-CI-01: these three gates are independent, not mutually exclusive.
      # A mixed tooling/product diff must run every applicable gate; an
      # unknown-only or delivery-only diff falls through to the product/mixed
      # gate below so there is never a successful no-test path.
      - name: Run tooling smoke gate
        if: steps.boundary.outputs.development_tooling_touched == 'true'
        run: |
          PYTHONPATH=.orchestrator python3 -m unittest \
            test_supervisor test_runtime_state test_approval_queue \
            rewrite.test_task_contract \
            test_supervisor_recovery_process_e2e test_supervisor_watchdog \
            scripts.test_ai_status scripts.test_status_command_runtime_pin \
            scripts.test_check_config_drift scripts.test_component_boundary
          PYTHONPATH=.orchestrator python3 -m pytest -q \
            .orchestrator/development_bridge/tests/test_dev_bridge_inbox_cli.py \
            .orchestrator/development_bridge/tests/test_dev_bridge_reliability.py \
            scripts/test_verify_task_state_store.py

      - name: Run tooling integration-authority gate
        if: steps.boundary.outputs.development_tooling_touched == 'true'
        run: |
          PYTHONPATH=.orchestrator python3 -m pytest -q \
            scripts/git/test_auto_integrator.py \
            scripts/git/test_task_review_merge_gate.py \
            scripts/git/test_github_review_bridge.py \
            scripts/test_run_auto_integrator.py \
            scripts/test_auto_integrator_install.py \
            scripts/test_supervisor_launch_ownership.py \
            scripts/test_supervisor_watchdog_install.py

      - name: Run product or mixed smoke gate
        if: steps.boundary.outputs.product_touched == 'true' || (steps.boundary.outputs.development_tooling_touched != 'true' && steps.boundary.outputs.product_touched != 'true')
        run: |
          if [[ -x scripts/run-acceptance.sh ]]; then
            ./scripts/run-acceptance.sh smoke
          elif [[ -f scripts/ci_stage0.py ]]; then
            python3 scripts/ci_stage0.py run-baseline
          else
            echo "no smoke gate configured; skipping"
          fi

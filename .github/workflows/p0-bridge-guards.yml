name: Pantheon P0 Bridge Guards

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pantheon-p0-bridge-guards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submodule-authority:
    name: Submodule authority
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with LEAN bridge
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify pantheon/lean bridge authority
        run: python3 scripts/check_execution_bridge.py

  no-wrong-repo-target:
    name: No lean-platform P0 target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify P0 task targets
        run: python3 scripts/check_task_targets.py

  health-endpoint-cleanup-scan:
    name: Health endpoint cleanup scan
    runs-on: ubuntu-latest
    env:
      HEALTH_ENDPOINT_CLEANUP_MODE: warn
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Report legacy compose health endpoints
        run: python3 scripts/check_health_endpoints.py --mode "${HEALTH_ENDPOINT_CLEANUP_MODE}"

  source-search-bounded:
    name: Source/search bounded smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build source/search bounded smoke images
        run: docker compose --profile source-search-bounded build source-ingest search-svc source-search-bounded-smoke

      - name: Run source/search bounded smoke
        run: docker compose --profile source-search-bounded run --rm --use-aliases source-search-bounded-smoke

      - name: Stop source/search bounded smoke stack
        if: always()
        run: docker compose --profile source-search-bounded down --volumes --remove-orphans

  research-fail-closed:
    name: Research/learning fail-closed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify OSS activation-ready matrix and compose guards
        run: python3 scripts/test_smoke_oss_activation_ready_matrix.py

      - name: Verify research activation gates remain blocked without evidence
        run: |
          set +e
          python3 scripts/run_research_activation_gates.py --as-of 2026-05-01 --output-dir /tmp/pantheon-research-gates
          status=$?
          if [ "$status" -ne 2 ]; then
            echo "expected activation gates to remain blocked without evidence, got exit code $status"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/pantheon-research-gates/research-oss-activation-gate-report.json").read_text())
          assert report["status"] == "activation_gates_blocked", report
          assert not report["production_activated_rows"], report
          expected = {"Qlib", "TRL", "RL stack", "W&B"}
          assert expected.issubset(set(report["blocked_rows"])), report
          PY

  openclaw-facade-fail-closed:
    name: OpenClaw facade fail-closed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OpenClaw adapter smoke dependencies
        run: python3 -m pip install -r services/openclaw-gateway-adapter/requirements.txt

      - name: Run OpenClaw activation-ready fail-closed smoke
        run: python3 scripts/smoke_openclaw_activation_ready_e2e.py --json-out /tmp/openclaw-activation-ready-e2e.json

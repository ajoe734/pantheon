name: Pantheon P0 Bridge Guards

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pantheon-p0-bridge-guards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submodule-authority:
    name: Submodule authority
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with LEAN bridge
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify pantheon/lean bridge authority
        run: python3 scripts/check_execution_bridge.py

  no-wrong-repo-target:
    name: No lean-platform P0 target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify P0 task targets
        run: python3 scripts/check_task_targets.py

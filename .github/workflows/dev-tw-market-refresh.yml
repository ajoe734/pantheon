name: Dev Taiwan Market Daily Refresh

on:
  schedule:
    - cron: '0 7 * * 1-5'
    - cron: '0 8 * * 1-5'
    # FinMind broker reports publish at 18:00 Taipei (10:00 UTC); poll after publication.
    - cron: '30 10 * * 1-5'
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force refresh even outside market session or if already fresh'
        required: false
        default: false
        type: boolean

jobs:
  refresh:
    name: Taiwan Market Daily Refresh
    runs-on: ubuntu-latest
    # 6 chip profiles x 15 min + fundamentals 15 + steady check 10 + ~9 min of earlier steps.
    timeout-minutes: 150
    environment: dev
    env:
      CONTROLLER: ${{ github.workspace }}/.lease-controller
      DEV_DEPLOY_SSH_HOST: ${{ vars.DEV_DEPLOY_SSH_HOST }}
      DEV_DEPLOY_SSH_USER: ${{ vars.NONPROD_REMOTE_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ajoe734/pantheon
          ref: 081075781d28a6563c731909667b98b7b5c153f9
          path: .lease-controller
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned direct SSH transport
        env:
          DEV_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEV_DEPLOY_SSH_PRIVATE_KEY }}
          DEV_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEV_DEPLOY_SSH_KNOWN_HOSTS }}
        run: scripts/dev_vm_ssh.sh prepare "${RUNNER_TEMP}/pantheon-dev-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null
      - name: Acquire shared dev environment lease
        id: lease
        env:
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$(git -C "${CONTROLLER}" rev-parse HEAD)" == "081075781d28a6563c731909667b98b7b5c153f9" ]]
          printf '%s  %s\n' \
            c6fbde26c185b963d962ef9d8433fa31498440886d89691f9410ab22a5afbaaa "${CONTROLLER}/scripts/dev_environment_lease.py" \
            6c82021b93621f16776d5d67a9e20cb9d690f7ebfa257ebf8c329f7d158fb2c2 "${CONTROLLER}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict
          lease_dir="$(mktemp -d "${RUNNER_TEMP}/pantheon-dev-lease-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          python3 "${CONTROLLER}/scripts/dev_environment_lease.py" acquire \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --mode deployment \
            --owner "pantheon:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --ttl-seconds 300 \
            --wait-seconds 0 \
            --poll-seconds 5 \
            --state-file "${lease_dir}/state.json" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "ld=${lease_dir}" >> "${GITHUB_OUTPUT}"

      - name: Start identity-bound lease heartbeat
        id: heartbeat
        env:
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          LD: ${{ steps.lease.outputs.ld }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          exec {token_fd}<<<"${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          env -i \
            PATH="${PATH}" HOME="${HOME}" LANG=C.UTF-8 \
            PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 PYTHONSTARTUP= PYTHONINSPECT= \
            python3 "${CONTROLLER}/scripts/dev_environment_lease.py" heartbeat-loop \
              --repository ajoe734/execute-plans \
              --branch environment-coordination \
              --path .pantheon/environment-leases/pantheon-dev-environment.json \
              --resource pantheon-dev-environment \
              --state-file "${LD}/state.json" \
              --ttl-seconds 300 \
              --interval-seconds 60 \
              --failure-json-out "${LD}/heartbeat-failure.json" \
              --shutdown-json-out "${LD}/heartbeat-stop.json" \
              --identity-json-out "${LD}/heartbeat-identity.json" \
              --token-stdin \
              <&"${token_fd}" >"${LD}/heartbeat.log" 2>&1 &
          heartbeat_pid=$!
          disown "${heartbeat_pid}" 2>/dev/null || true
          exec {token_fd}<&-
          printf '%s\n' "${heartbeat_pid}" > "${LD}/heartbeat.pid"
          for _ in $(seq 1 100); do
            [[ -s "${LD}/heartbeat-identity.json" ]] && break
            kill -0 "${heartbeat_pid}" 2>/dev/null || { cat "${LD}/heartbeat.log" >&2; exit 75; }
            sleep 0.1
          done
          python3 "${CONTROLLER}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
            --identity-file "${LD}/heartbeat-identity.json" \
            --pid "${heartbeat_pid}" \
            --expected-cli "${CONTROLLER}/scripts/dev_environment_lease.py" \
            --state-file "${LD}/state.json" >/dev/null
          python3 "${CONTROLLER}/scripts/dev_environment_lease.py" verify \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --state-file "${LD}/state.json" \
            --max-heartbeat-age-seconds 120 \
            --initial-visibility-wait-seconds 15 \
            --initial-visibility-poll-seconds 1 >/dev/null

      - name: Execute bounded TAIFEX contract refresh
        if: ${{ github.event.schedule != '30 10 * * 1-5' && github.event.schedule != '30 12 * * 1-5' }}
        id: taifex_refresh
        continue-on-error: true
        env:
          PANTHEON_DEPLOY_WORKTREE_ROOT: ${{ vars.DEV_DEPLOY_WORKTREE_ROOT }}
          TARGET_ENV: dev
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.ld }}/state.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.ld }}/heartbeat.pid
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-identity.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-failure.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.ld }}/heartbeat.log
          PANTHEON_EXTERNAL_EGRESS_ALLOWED_HOSTS: openapi.taifex.com.tw,www.taifex.com.tw
          SOURCE_INGEST_BOUNDED_CONNECTOR_ID: tw-taifex-futures-options-chip
          SOURCE_INGEST_BOUNDED_DATASET: taifex_ssf_contracts
          PANTHEON_COLLECTOR_HOST: ${{ vars.PANTHEON_COLLECTOR_HOST }}
          PANTHEON_COLLECTOR_BUNDLE_TOKEN: ${{ secrets.PANTHEON_COLLECTOR_BUNDLE_TOKEN }}
          REFRESH_OUTPUT_PATH: ${{ runner.temp }}/taifex-ssf-refresh-outcome.json
          FORCE_REFRESH: ${{ inputs.force || false }}
        run: |
          refresh_rc=0
          .lease-controller/scripts/run_with_dev_environment_lease.sh \
            bash -c '
              force_arg=()
              [[ "${FORCE_REFRESH}" == "true" ]] && force_arg=(--force)
              ./scripts/deploy_nonprod_vm.sh --refresh-only --non-blocking "${force_arg[@]}" --connector-id tw-taifex-futures-options-chip --allowed-hosts openapi.taifex.com.tw,www.taifex.com.tw --dataset taifex_ssf_contracts --output "${REFRESH_OUTPUT_PATH}" || exit 0
            ' || refresh_rc=$?
          python3 - "${REFRESH_OUTPUT_PATH}" "${refresh_rc}" <<'PY'
          import json, pathlib, sys
          outcome_path, rc = pathlib.Path(sys.argv[1]), int(sys.argv[2])
          payload = {}
          if outcome_path.is_file():
              try:
                  parsed = json.loads(outcome_path.read_text(encoding="utf-8"))
                  payload.update(parsed if isinstance(parsed, dict) else {})
              except Exception:
                  pass
          status = str(payload.get("status") or ("failed" if rc != 0 else "completed"))
          reason = str(payload.get("reason") or ("refreshed" if status == "completed" else f"exit_{rc}"))
          log_text = str(payload.get("log") or "")
          payload.update({"connector_id": "tw-taifex-futures-options-chip", "dataset": "taifex_ssf_contracts", "log": log_text, "reason": reason, "status": status})
          outcome_path.write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
          if log_text:
              print(log_text)
          print(f"TAIFEX contract refresh outcome recorded: status={status} reason={reason}")
          PY

      - name: Execute bounded FinMind broker branch refresh
        # Broker data publishes 18:00 Taipei (10:00 UTC): never run on the 07:00/08:00 UTC crons.
        if: ${{ github.event.schedule != '0 7 * * 1-5' && github.event.schedule != '0 8 * * 1-5' }}
        id: finmind_refresh
        continue-on-error: true
        env:
          PANTHEON_DEPLOY_WORKTREE_ROOT: ${{ vars.DEV_DEPLOY_WORKTREE_ROOT }}
          TARGET_ENV: dev
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.ld }}/state.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.ld }}/heartbeat.pid
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-identity.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-failure.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.ld }}/heartbeat.log
          PANTHEON_EXTERNAL_EGRESS_ALLOWED_HOSTS: api.finmindtrade.com,storage.googleapis.com
          SOURCE_INGEST_BOUNDED_CONNECTOR_ID: tw-finmind-broker-daily-report
          SOURCE_INGEST_BOUNDED_DATASET: tw_broker_top
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
          REFRESH_OUTPUT_PATH: ${{ runner.temp }}/finmind-broker-refresh-outcome.json
          FORCE_REFRESH: ${{ inputs.force || false }}
        run: |
          refresh_rc=0
          if [[ -z "${FINMIND_API_TOKEN}" ]]; then
            printf '%s\n' '{"connector_id":"tw-finmind-broker-daily-report","dataset":"tw_broker_top","log":"","reason":"missing_credential","status":"skipped"}' > "${REFRESH_OUTPUT_PATH}"
            echo "FinMind broker refresh skipped: missing_credential"
            exit 0
          fi
          echo "FINMIND_API_TOKEN present (length ${#FINMIND_API_TOKEN})"
          .lease-controller/scripts/run_with_dev_environment_lease.sh \
            bash -c '
              force_arg=()
              [[ "${FORCE_REFRESH}" == "true" ]] && force_arg=(--force)
              ./scripts/deploy_nonprod_vm.sh --refresh-only --non-blocking "${force_arg[@]}" --connector-id tw-finmind-broker-daily-report --allowed-hosts api.finmindtrade.com,storage.googleapis.com --dataset tw_broker_top --output "${REFRESH_OUTPUT_PATH}" || exit 0
            ' || refresh_rc=$?
          echo "FinMind broker refresh rc=${refresh_rc}"

      - name: Execute bounded Taiwan market refresh
        if: ${{ github.event.schedule != '30 10 * * 1-5' && github.event.schedule != '30 12 * * 1-5' }}
        id: refresh
        env:
          PANTHEON_DEPLOY_WORKTREE_ROOT: ${{ vars.DEV_DEPLOY_WORKTREE_ROOT }}
          TARGET_ENV: dev
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.ld }}/state.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.ld }}/heartbeat.pid
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-identity.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-failure.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.ld }}/heartbeat.log
          PANTHEON_EXTERNAL_EGRESS_ALLOWED_HOSTS: openapi.twse.com.tw,www.tpex.org.tw
          SOURCE_INGEST_BOUNDED_CONNECTOR_ID: tw-twse-tpex-official-market
          SOURCE_INGEST_BOUNDED_DATASET: tw_price_daily
          PANTHEON_COLLECTOR_HOST: ${{ vars.PANTHEON_COLLECTOR_HOST }}
          PANTHEON_COLLECTOR_BUNDLE_TOKEN: ${{ secrets.PANTHEON_COLLECTOR_BUNDLE_TOKEN }}
          REFRESH_OUTPUT_PATH: ${{ runner.temp }}/tw-refresh-outcome.json
          FORCE_REFRESH: ${{ inputs.force || false }}
        run: |
          force_arg=()
          [[ "${FORCE_REFRESH}" == "true" ]] && force_arg=(--force)
          .lease-controller/scripts/run_with_dev_environment_lease.sh \
            ./scripts/deploy_nonprod_vm.sh --refresh-only "${force_arg[@]}" --output "${REFRESH_OUTPUT_PATH}"

      - name: Execute bounded Taiwan chip refresh
        if: ${{ github.event.schedule != '30 10 * * 1-5' && github.event.schedule != '30 12 * * 1-5' }}
        id: chip_refresh
        # Measured 9.1-9.5 min per profile in run 44273374890 (recreate + 51-67s lease wait +
        # two bounded one-shots + restore): 6 x 15 min budget; each profile is also bounded
        # at 15 min so a timeout stops at a profile boundary instead of mid-recreate.
        timeout-minutes: 90
        env:
          SOURCE_INGEST_MAX_RECORDS: 500
          SOURCE_INGEST_BOUNDED_RUN_TIMEOUT_SECONDS: 300
          PANTHEON_DEPLOY_WORKTREE_ROOT: ${{ vars.DEV_DEPLOY_WORKTREE_ROOT }}
          TARGET_ENV: dev
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.ld }}/state.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.ld }}/heartbeat.pid
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-identity.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-failure.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.ld }}/heartbeat.log
          PANTHEON_COLLECTOR_HOST: ${{ vars.PANTHEON_COLLECTOR_HOST }}
          PANTHEON_COLLECTOR_BUNDLE_TOKEN: ${{ secrets.PANTHEON_COLLECTOR_BUNDLE_TOKEN }}
          FORCE_REFRESH: ${{ inputs.force || false }}
        run: |
          .lease-controller/scripts/run_with_dev_environment_lease.sh \
            bash -c '
              force_arg=()
              [[ "${FORCE_REFRESH}" == "true" ]] && force_arg=(--force)
              failed=0
              while read -r connector dataset hosts; do
                timeout --kill-after=60 900 ./scripts/deploy_nonprod_vm.sh --refresh-only "${force_arg[@]}" \
                  --connector-id "${connector}" --dataset "${dataset}" --allowed-hosts "${hosts}" \
                  --output "${RUNNER_TEMP}/${connector}-refresh-outcome.json" </dev/null || failed=1
              done <<PROFILES
          tw-official-twse-margin-balances tw_margin_short_balance openapi.twse.com.tw,www.tpex.org.tw
          tw-official-tpex-margin-balances tw_margin_short_balance openapi.twse.com.tw,www.tpex.org.tw
          tw-official-tpex-institutional-flow tw_institutional_flow openapi.twse.com.tw,www.tpex.org.tw
          tw-taifex-institutional-positions taifex_futures_chip openapi.taifex.com.tw,www.taifex.com.tw
          tw-taifex-put-call taifex_options_chip openapi.taifex.com.tw,www.taifex.com.tw
          tw-taifex-tx-daily taifex_tx_daily openapi.taifex.com.tw,www.taifex.com.tw
          PROFILES
              exit "${failed}"
            '

      - name: Execute bounded FinMind fundamentals refresh
        # FinMind publishes after the close (18:00 Taipei = 10:00 UTC): never run on the 07:00/08:00 UTC crons.
        if: ${{ github.event.schedule != '0 7 * * 1-5' && github.event.schedule != '0 8 * * 1-5' }}
        id: finmind_fundamentals_refresh
        continue-on-error: true
        timeout-minutes: 15
        env:
          SOURCE_INGEST_MAX_RECORDS: 500
          SOURCE_INGEST_BOUNDED_RUN_TIMEOUT_SECONDS: 300
          PANTHEON_DEPLOY_WORKTREE_ROOT: ${{ vars.DEV_DEPLOY_WORKTREE_ROOT }}
          TARGET_ENV: dev
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.ld }}/state.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.ld }}/heartbeat.pid
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-identity.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-failure.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.ld }}/heartbeat.log
          PANTHEON_COLLECTOR_HOST: ${{ vars.PANTHEON_COLLECTOR_HOST }}
          PANTHEON_COLLECTOR_BUNDLE_TOKEN: ${{ secrets.PANTHEON_COLLECTOR_BUNDLE_TOKEN }}
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
          FORCE_REFRESH: ${{ inputs.force || false }}
        run: |
          force_arg=()
          [[ "${FORCE_REFRESH}" == "true" ]] && force_arg=(--force)
          failed=0
          while read -r connector dataset hosts; do
            if [[ -z "${FINMIND_API_TOKEN}" ]]; then
              printf '{"connector_id":"%s","dataset":"%s","log":"","reason":"missing_credential","status":"skipped"}\n' "${connector}" "${dataset}" > "${RUNNER_TEMP}/${connector}-refresh-outcome.json"
              echo "FinMind fundamentals refresh skipped: missing_credential (${connector})"
              continue
            fi
            .lease-controller/scripts/run_with_dev_environment_lease.sh \
              ./scripts/deploy_nonprod_vm.sh --refresh-only "${force_arg[@]}" \
              --connector-id "${connector}" --dataset "${dataset}" --allowed-hosts "${hosts}" \
              --output "${RUNNER_TEMP}/${connector}-refresh-outcome.json" </dev/null || failed=1
          done <<'PROFILES'
          tw-finmind-monthly-revenue tw_monthly_revenue api.finmindtrade.com
          tw-finmind-quarterly-statements tw_financial_statement api.finmindtrade.com
          tw-finmind-valuation tw_valuation_bwibbu api.finmindtrade.com
          PROFILES
          exit "${failed}"

      - name: Verify and restore steady source-ingest posture
        # Runs after failure, timeout and cancellation of any refresh step. The result
        # is the acceptance probe: it is merged into the outcome artifact.
        if: ${{ always() && steps.lease.outcome == 'success' }}
        id: steady_check
        timeout-minutes: 10
        env:
          PANTHEON_DEPLOY_WORKTREE_ROOT: ${{ vars.DEV_DEPLOY_WORKTREE_ROOT }}
          TARGET_ENV: dev
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.ld }}/state.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.ld }}/heartbeat.pid
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-identity.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-failure.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.ld }}/heartbeat.log
          PANTHEON_COLLECTOR_HOST: ${{ vars.PANTHEON_COLLECTOR_HOST }}
          PANTHEON_COLLECTOR_BUNDLE_TOKEN: ${{ secrets.PANTHEON_COLLECTOR_BUNDLE_TOKEN }}
          STEADY_CHECK_OUTPUT_PATH: ${{ runner.temp }}/steady-restore-check.json
          REFRESH_OUTCOME_PATH: ${{ runner.temp }}/tw-refresh-outcome.json
        shell: /bin/bash --noprofile --norc {0}
        run: |
          check_rc=0
          .lease-controller/scripts/run_with_dev_environment_lease.sh \
            ./scripts/deploy_nonprod_vm.sh --refresh-only --steady-check \
              --output "${STEADY_CHECK_OUTPUT_PATH}" </dev/null || check_rc=$?
          python3 - "${STEADY_CHECK_OUTPUT_PATH}" "${REFRESH_OUTCOME_PATH}" "${check_rc}" <<'PY'
          import json, pathlib, sys
          check_path, outcome_path, rc = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), int(sys.argv[3])
          check = {}
          if check_path.is_file():
              try:
                  parsed = json.loads(check_path.read_text(encoding="utf-8"))
                  check = parsed if isinstance(parsed, dict) else {}
              except Exception:
                  check = {}
          if not check:
              check = {"mode": "collector_steady_pull", "reason": f"steady_check_transport_exit_{rc}", "status": "failed"}
          outcome = {}
          if outcome_path.is_file():
              try:
                  parsed = json.loads(outcome_path.read_text(encoding="utf-8"))
                  outcome = parsed if isinstance(parsed, dict) else {}
              except Exception:
                  outcome = {}
          outcome["steady_restore_check"] = {"reason": str(check.get("reason") or ""), "status": str(check.get("status") or "failed")}
          outcome_path.write_text(json.dumps(outcome, sort_keys=True) + "\n", encoding="utf-8")
          status, reason = outcome["steady_restore_check"]["status"], outcome["steady_restore_check"]["reason"]
          print(f"steady restore check: status={status} reason={reason or 'none'}")
          if status != "healthy":
              print(f"::error::steady_restore_check_{status}: {reason or 'unknown'}")
              sys.exit(1)
          PY

      - name: Upload refresh outcome artifact
        if: ${{ always() && steps.lease.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: tw-refresh-outcome
          path: |
            ${{ runner.temp }}/tw-refresh-outcome.json
            ${{ runner.temp }}/steady-restore-check.json
            ${{ runner.temp }}/taifex-ssf-refresh-outcome.json
            ${{ runner.temp }}/finmind-broker-refresh-outcome.json
            ${{ runner.temp }}/tw-official-twse-margin-balances-refresh-outcome.json
            ${{ runner.temp }}/tw-official-tpex-margin-balances-refresh-outcome.json
            ${{ runner.temp }}/tw-official-tpex-institutional-flow-refresh-outcome.json
            ${{ runner.temp }}/tw-taifex-institutional-positions-refresh-outcome.json
            ${{ runner.temp }}/tw-taifex-put-call-refresh-outcome.json
            ${{ runner.temp }}/tw-taifex-tx-daily-refresh-outcome.json
            ${{ runner.temp }}/tw-finmind-monthly-revenue-refresh-outcome.json
            ${{ runner.temp }}/tw-finmind-quarterly-statements-refresh-outcome.json
            ${{ runner.temp }}/tw-finmind-valuation-refresh-outcome.json

      - name: Stop heartbeat and release lease
        if: ${{ always() && steps.lease.outcome == 'success' }}
        env:
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          LD: ${{ steps.lease.outputs.ld }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          TAIFEX_REFRESH_OUTCOME: ${{ steps.taifex_refresh.outcome }}
          CHIP_REFRESH_OUTCOME: ${{ steps.chip_refresh.outcome }}
          STEADY_CHECK_OUTCOME: ${{ steps.steady_check.outcome }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          heartbeat_pid="$(tr -d '[:space:]' < "${LD}/heartbeat.pid")" || exit 0
          [[ "${heartbeat_pid}" =~ ^[1-9][0-9]*$ ]] || exit 0
          kill -TERM "${heartbeat_pid}" 2>/dev/null || true
          for _ in $(seq 1 40); do
            kill -0 "${heartbeat_pid}" 2>/dev/null || break
            sleep 0.25
          done
          [[ "${REFRESH_OUTCOME}" =~ ^(success|skipped)$ && "${TAIFEX_REFRESH_OUTCOME}" =~ ^(success|skipped)$ && "${CHIP_REFRESH_OUTCOME}" =~ ^(success|skipped)$ && "${STEADY_CHECK_OUTCOME}" == success && ! -e "${LD}/heartbeat-failure.json" ]] || exit 0
          [[ -s "${LD}/heartbeat-stop.json" ]] || { echo "No graceful heartbeat stop; refusing release." >&2; exit 75; }
          python3 "${CONTROLLER}/scripts/dev_environment_lease.py" release \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --state-file "${LD}/state.json"

      - name: Summarize refresh outcomes and fail on any failed step
        # Reads only local step outcomes and the uploaded outcome files; no SSH, no hosted change.
        if: ${{ always() && steps.lease.outcome == 'success' }}
        env:
          OUTCOMES_DIR: ${{ runner.temp }}
          TAIFEX_REFRESH_OUTCOME: ${{ steps.taifex_refresh.outcome }}
          FINMIND_REFRESH_OUTCOME: ${{ steps.finmind_refresh.outcome }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          CHIP_REFRESH_OUTCOME: ${{ steps.chip_refresh.outcome }}
          FUNDAMENTALS_REFRESH_OUTCOME: ${{ steps.finmind_fundamentals_refresh.outcome }}
          STEADY_CHECK_OUTCOME: ${{ steps.steady_check.outcome }}
        run: |
          python3 scripts/tw_refresh_outcome_summary.py \
            --outcomes-dir "${OUTCOMES_DIR}" --summary-file "${GITHUB_STEP_SUMMARY}" \
            --step "taifex_refresh=${TAIFEX_REFRESH_OUTCOME}" \
            --step "finmind_refresh=${FINMIND_REFRESH_OUTCOME}" \
            --step "refresh=${REFRESH_OUTCOME}" \
            --step "chip_refresh=${CHIP_REFRESH_OUTCOME}" \
            --step "finmind_fundamentals_refresh=${FUNDAMENTALS_REFRESH_OUTCOME}" \
            --step "steady_check=${STEADY_CHECK_OUTCOME}"

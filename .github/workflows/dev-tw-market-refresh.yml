name: Dev Taiwan Market Daily Refresh

on:
  schedule:
    - cron: '0 7 * * 1-5'
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force refresh even outside market session or if already fresh'
        required: false
        default: false
        type: boolean

jobs:
  refresh:
    name: Taiwan Market Daily Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    env:
      CONTROLLER: ${{ github.workspace }}/.lease-controller
      DEV_DEPLOY_SSH_HOST: ${{ vars.DEV_DEPLOY_SSH_HOST }}
      DEV_DEPLOY_SSH_USER: ${{ vars.NONPROD_REMOTE_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ajoe734/pantheon
          ref: 3fd9536ca9f5e0cfb275429a05fefa36bc7ec870
          path: .lease-controller
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned direct SSH transport
        env:
          DEV_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEV_DEPLOY_SSH_PRIVATE_KEY }}
          DEV_DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEV_DEPLOY_SSH_KNOWN_HOSTS }}
        run: scripts/dev_vm_ssh.sh prepare "${RUNNER_TEMP}/pantheon-dev-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null
      - name: Acquire shared dev environment lease
        id: lease
        env:
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$(git -C "${CONTROLLER}" rev-parse HEAD)" == "3fd9536ca9f5e0cfb275429a05fefa36bc7ec870" ]]
          printf '%s  %s\n' \
            89c6c20d88a70bbe96290852fc93f10d38c5448ebfdb79e9f9a547b8ef15c2c4 "${CONTROLLER}/scripts/dev_environment_lease.py" \
            6c82021b93621f16776d5d67a9e20cb9d690f7ebfa257ebf8c329f7d158fb2c2 "${CONTROLLER}/scripts/run_with_dev_environment_lease.sh" \
            | sha256sum --check --strict
          lease_dir="$(mktemp -d "${RUNNER_TEMP}/pantheon-dev-lease-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          python3 "${CONTROLLER}/scripts/dev_environment_lease.py" acquire \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --mode deployment \
            --owner "pantheon:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --ttl-seconds 300 \
            --wait-seconds 0 \
            --poll-seconds 5 \
            --state-file "${lease_dir}/state.json" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "ld=${lease_dir}" >> "${GITHUB_OUTPUT}"

      - name: Start identity-bound lease heartbeat
        id: heartbeat
        env:
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          LD: ${{ steps.lease.outputs.ld }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          exec {token_fd}<<<"${PANTHEON_ENVIRONMENT_LEASE_TOKEN}"
          env -i \
            PATH="${PATH}" HOME="${HOME}" LANG=C.UTF-8 \
            PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 PYTHONSTARTUP= PYTHONINSPECT= \
            python3 "${CONTROLLER}/scripts/dev_environment_lease.py" heartbeat-loop \
              --repository ajoe734/execute-plans \
              --branch environment-coordination \
              --path .pantheon/environment-leases/pantheon-dev-environment.json \
              --resource pantheon-dev-environment \
              --state-file "${LD}/state.json" \
              --ttl-seconds 300 \
              --interval-seconds 60 \
              --failure-json-out "${LD}/heartbeat-failure.json" \
              --shutdown-json-out "${LD}/heartbeat-stop.json" \
              --identity-json-out "${LD}/heartbeat-identity.json" \
              --token-stdin \
              <&"${token_fd}" >"${LD}/heartbeat.log" 2>&1 &
          heartbeat_pid=$!
          disown "${heartbeat_pid}" 2>/dev/null || true
          exec {token_fd}<&-
          printf '%s\n' "${heartbeat_pid}" > "${LD}/heartbeat.pid"
          for _ in $(seq 1 100); do
            [[ -s "${LD}/heartbeat-identity.json" ]] && break
            kill -0 "${heartbeat_pid}" 2>/dev/null || { cat "${LD}/heartbeat.log" >&2; exit 75; }
            sleep 0.1
          done
          python3 "${CONTROLLER}/scripts/dev_environment_lease.py" verify-heartbeat-identity \
            --identity-file "${LD}/heartbeat-identity.json" \
            --pid "${heartbeat_pid}" \
            --expected-cli "${CONTROLLER}/scripts/dev_environment_lease.py" \
            --state-file "${LD}/state.json" >/dev/null
          python3 "${CONTROLLER}/scripts/dev_environment_lease.py" verify \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --state-file "${LD}/state.json" \
            --max-heartbeat-age-seconds 120 \
            --initial-visibility-wait-seconds 15 \
            --initial-visibility-poll-seconds 1 >/dev/null

      - name: Execute bounded Taiwan market refresh
        id: refresh
        env:
          PANTHEON_DEPLOY_WORKTREE_ROOT: ${{ vars.DEV_DEPLOY_WORKTREE_ROOT }}
          TARGET_ENV: dev
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.ld }}/state.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.ld }}/heartbeat.pid
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-identity.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-failure.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.ld }}/heartbeat.log
          PANTHEON_EXTERNAL_EGRESS_ALLOWED_HOSTS: openapi.twse.com.tw,www.twse.com.tw,www.tpex.org.tw
          SOURCE_INGEST_BOUNDED_CONNECTOR_ID: tw-twse-tpex-official-market
          SOURCE_INGEST_BOUNDED_DATASET: tw_price_daily
          REFRESH_OUTPUT_PATH: ${{ runner.temp }}/tw-refresh-outcome.json
          FORCE_REFRESH: ${{ inputs.force || false }}
        run: |
          force_arg=()
          [[ "${FORCE_REFRESH}" == "true" ]] && force_arg=(--force)
          .lease-controller/scripts/run_with_dev_environment_lease.sh \
            ./scripts/deploy_nonprod_vm.sh --refresh-only "${force_arg[@]}" --output "${REFRESH_OUTPUT_PATH}"

      - name: Execute bounded TAIFEX contract refresh
        id: taifex_refresh
        continue-on-error: true
        env:
          PANTHEON_DEPLOY_WORKTREE_ROOT: ${{ vars.DEV_DEPLOY_WORKTREE_ROOT }}
          TARGET_ENV: dev
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          PANTHEON_DEV_ENVIRONMENT_LEASE_STATE_FILE: ${{ steps.lease.outputs.ld }}/state.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_PID_FILE: ${{ steps.lease.outputs.ld }}/heartbeat.pid
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_IDENTITY_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-identity.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_FAILURE_FILE: ${{ steps.lease.outputs.ld }}/heartbeat-failure.json
          PANTHEON_DEV_ENVIRONMENT_LEASE_HEARTBEAT_LOG: ${{ steps.lease.outputs.ld }}/heartbeat.log
          PANTHEON_EXTERNAL_EGRESS_ALLOWED_HOSTS: openapi.taifex.com.tw,www.taifex.com.tw
          SOURCE_INGEST_BOUNDED_CONNECTOR_ID: tw-taifex-futures-options-chip
          SOURCE_INGEST_BOUNDED_DATASET: taifex_ssf_contracts
          REFRESH_OUTPUT_PATH: ${{ runner.temp }}/taifex-ssf-refresh-outcome.json
          FORCE_REFRESH: ${{ inputs.force || false }}
        run: |
          force_arg=()
          [[ "${FORCE_REFRESH}" == "true" ]] && force_arg=(--force)
          refresh_rc=0
          .lease-controller/scripts/run_with_dev_environment_lease.sh \
            ./scripts/deploy_nonprod_vm.sh --refresh-only --non-blocking "${force_arg[@]}" --connector-id tw-taifex-futures-options-chip --allowed-hosts openapi.taifex.com.tw,www.taifex.com.tw --dataset taifex_ssf_contracts --output "${REFRESH_OUTPUT_PATH}" || refresh_rc=$?
          python3 - "${REFRESH_OUTPUT_PATH}" "${refresh_rc}" <<'PY'
          import json
          import pathlib
          import sys

          outcome_path = pathlib.Path(sys.argv[1])
          rc = int(sys.argv[2])
          payload = {}
          if outcome_path.is_file():
              try:
                  parsed = json.loads(outcome_path.read_text(encoding="utf-8"))
                  if isinstance(parsed, dict):
                      payload.update(parsed)
              except Exception:
                  pass
          status = str(payload.get("status") or ("failed" if rc != 0 else "completed"))
          reason = str(payload.get("reason") or ("refreshed" if status == "completed" else f"exit_{rc}"))
          log_text = str(payload.get("log") or "")
          payload.update(
              {
                  "connector_id": "tw-taifex-futures-options-chip",
                  "dataset": "taifex_ssf_contracts",
                  "log": log_text,
                  "reason": reason,
                  "status": status,
              }
          )
          outcome_path.write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
          print(f"TAIFEX contract refresh outcome recorded: status={status} reason={reason}")
          PY

      - name: Upload refresh outcome artifact
        if: ${{ always() && steps.refresh.outcome != 'cancelled' }}
        uses: actions/upload-artifact@v4
        with:
          name: tw-refresh-outcome
          path: |
            ${{ runner.temp }}/tw-refresh-outcome.json
            ${{ runner.temp }}/taifex-ssf-refresh-outcome.json

      - name: Stop heartbeat and release lease
        if: ${{ always() && steps.lease.outcome == 'success' }}
        env:
          PANTHEON_ENVIRONMENT_LEASE_TOKEN: ${{ secrets.COORDINATION_REPO_TOKEN }}
          LD: ${{ steps.lease.outputs.ld }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          TAIFEX_REFRESH_OUTCOME: ${{ steps.taifex_refresh.outcome }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          heartbeat_pid="$(tr -d '[:space:]' < "${LD}/heartbeat.pid")" || exit 0
          [[ "${heartbeat_pid}" =~ ^[1-9][0-9]*$ ]] || exit 0
          kill -TERM "${heartbeat_pid}" 2>/dev/null || true
          for _ in $(seq 1 40); do
            kill -0 "${heartbeat_pid}" 2>/dev/null || break
            sleep 0.25
          done
          [[ "${REFRESH_OUTCOME}" == "success" && "${TAIFEX_REFRESH_OUTCOME}" == "success" && ! -e "${LD}/heartbeat-failure.json" ]] || exit 0
          [[ -s "${LD}/heartbeat-stop.json" ]] || { echo "No graceful heartbeat stop; refusing release." >&2; exit 75; }
          python3 "${CONTROLLER}/scripts/dev_environment_lease.py" release \
            --repository ajoe734/execute-plans \
            --branch environment-coordination \
            --path .pantheon/environment-leases/pantheon-dev-environment.json \
            --resource pantheon-dev-environment \
            --state-file "${LD}/state.json"
